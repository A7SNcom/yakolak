<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="yakolak-version" content="developer-d1">
<title>Yakolak Developer D1</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f4f1;--card:#fff;--ink:#20201e;--muted:#77736c;--line:#d9d6cf;--accent:#20201e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:28px}
button{font:inherit}
.dev-shell{max-width:1440px;margin:auto}
.dev-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
.dev-brand{display:flex;flex-direction:column;gap:8px}
.dev-badge{width:max-content;padding:7px 11px;border:1px solid var(--ink);border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.14em;direction:ltr}
h1{margin:0;font-size:clamp(30px,4vw,54px);line-height:1}
.dev-sub{margin:0;color:var(--muted);font-size:14px;font-weight:650}
.dev-count{padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.64);font-weight:850;white-space:nowrap}
.dev-tabs{position:sticky;top:12px;z-index:30;display:flex;gap:8px;width:max-content;max-width:100%;overflow:auto;padding:7px;margin-bottom:22px;border:1px solid rgba(32,32,30,.1);border-radius:17px;background:rgba(244,244,241,.88);backdrop-filter:blur(14px)}
.dev-tab{border:0;border-radius:11px;background:transparent;color:var(--muted);padding:10px 15px;font-weight:850;cursor:pointer;white-space:nowrap}
.dev-tab.active{background:var(--ink);color:#fff}
.scene-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.scene-card{position:relative;min-width:0;border:1px solid var(--line);border-radius:24px;background:var(--card);overflow:hidden;box-shadow:0 14px 40px rgba(42,39,33,.07);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.scene-card:hover{transform:translateY(-3px);border-color:#b9b5ad;box-shadow:0 20px 54px rgba(42,39,33,.11)}
.scene-preview{position:relative;aspect-ratio:16/10;background:#ecebe6;overflow:hidden}
.scene-preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#fff}
.scene-preview::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -50px 70px rgba(0,0,0,.05);pointer-events:none}
.scene-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:17px}
.scene-copy{min-width:0}
.scene-type{display:inline-flex;margin-bottom:8px;padding:5px 8px;border-radius:999px;background:#efeee9;color:#69655e;font-size:11px;font-weight:900}
.scene-title{margin:0 0 5px;font-size:19px;line-height:1.2}
.scene-desc{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
.scene-open{flex:0 0 auto;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--ink);font-size:20px;font-weight:900;cursor:pointer}
.scene-card[hidden]{display:none}
.dev-stage{position:fixed;inset:0;z-index:1000;background:#fff;display:none}
.dev-stage.open{display:block}
.dev-stage iframe{width:100%;height:100%;border:0;background:#fff}
.dev-back{position:absolute;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));z-index:20;display:flex;align-items:center;gap:9px;border:1px solid rgba(32,32,30,.2);border-radius:999px;background:rgba(255,255,255,.9);color:#20201e;padding:11px 15px;font-weight:900;cursor:pointer;box-shadow:0 12px 32px rgba(0,0,0,.14);backdrop-filter:blur(12px)}
.dev-stage-title{position:absolute;top:max(18px,env(safe-area-inset-top));left:max(18px,env(safe-area-inset-left));z-index:20;padding:10px 13px;border-radius:13px;background:rgba(32,32,30,.82);color:#fff;font-size:12px;font-weight:900;backdrop-filter:blur(12px)}
.empty-state{grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--muted);font-weight:800}
@media(max-width:1050px){.scene-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:680px){body{padding:18px}.dev-head{align-items:flex-start;flex-direction:column}.scene-grid{grid-template-columns:1fr}.dev-tabs{top:8px;width:100%}.dev-count{display:none}.scene-card{border-radius:20px}.dev-stage-title{display:none}}
</style>
</head>
<body>
<main class="dev-shell">
  <header class="dev-head">
    <div class="dev-brand">
      <span class="dev-badge">D1 · DEVELOPMENT</span>
      <h1>نسخة المطور</h1>
      <p class="dev-sub">معرض مستقل لمراجعة المشاهد وتشغيل كل مشهد بمعزل عن نسخة العميل.</p>
    </div>
    <div id="sceneCount" class="dev-count">0 مشاهد</div>
  </header>
  <nav id="sceneTabs" class="dev-tabs" aria-label="فلترة المشاهد"></nav>
  <section id="sceneGrid" class="scene-grid" aria-live="polite"></section>
</main>
<section id="devStage" class="dev-stage" aria-hidden="true">
  <button id="devBack" class="dev-back" type="button"><span>↩</span><span>العودة للمعرض</span></button>
  <div id="devStageTitle" class="dev-stage-title">المشهد</div>
  <iframe id="devStageFrame" title="مشهد المطور" allow="fullscreen"></iframe>
</section>
<script type="module" src="./src/developer-d1.js?v=D1"></script>
</body>
</html>
