<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>ياكلك</title>
  <link rel="stylesheet" href="./src/developer-president.css?v=cards-v1">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="ياكلك">ياكلك</a>
    <nav id="filters" class="filters" aria-label="تصفية المحتوى">
      <button class="active" type="button" data-filter="all">الكل</button>
      <button type="button" data-filter="scene">المشاهد</button>
      <button type="button" data-filter="journey">الرحلات</button>
      <button type="button" data-filter="element">العناصر</button>
      <button type="button" data-filter="task">المهام</button>
    </nav>
  </header>

  <main id="contentGrid" class="card-grid" aria-live="polite"></main>

  <dialog id="contentModal" class="content-modal" aria-labelledby="modalTitle">
    <article class="modal-card">
      <header class="modal-header">
        <div>
          <span id="modalKind" class="kind"></span>
          <h1 id="modalTitle"></h1>
        </div>
        <button id="modalClose" class="close-button" type="button" aria-label="إغلاق">×</button>
      </header>

      <section id="mediaSection" class="media-section" aria-label="المعاينة">
        <div id="mediaViewport" class="media-viewport"></div>
        <button id="mediaNext" class="media-arrow next" type="button" aria-label="التالي">‹</button>
        <button id="mediaPrevious" class="media-arrow previous" type="button" aria-label="السابق">›</button>
      </section>

      <div class="modal-body">
        <p id="modalDescription" class="description"></p>
        <p id="modalRelation" class="relation" hidden></p>
        <section id="comments" class="comments" aria-label="التعليقات"></section>
        <form id="commentForm" class="comment-form">
          <label class="sr-only" for="commentInput">اكتب تعليقك</label>
          <textarea id="commentInput" rows="1" maxlength="12000" placeholder="اكتب تعليقك" required></textarea>
          <button type="submit">إرسال</button>
        </form>
      </div>
    </article>
  </dialog>

  <script type="module" src="./src/developer-president.js?v=cards-v1"></script>
</body>
</html>
