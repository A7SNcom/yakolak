<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yakolak Clean</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:white;font-family:system-ui,sans-serif;touch-action:none}#view{position:fixed;inset:0}#hint{position:fixed;top:12px;right:12px;z-index:5;background:#000b;padding:8px 12px;border-radius:999px;font-size:12px;direction:ltr}#settingsBtn{position:fixed;top:10px;left:10px;z-index:20;width:58px;height:58px;border:0;border-radius:20px;background:#000c;color:white;font-size:26px}#menu{position:fixed;inset:auto 10px 10px 10px;z-index:40;background:#070707f0;border:1px solid #292929;border-radius:24px;padding:14px;display:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:52px;border:1px solid #333;border-radius:18px;background:#151515;color:white;font-size:15px}.choice.primary{background:#26352b}#panel{position:fixed;left:10px;right:10px;bottom:10px;z-index:30;background:#070707e8;border:1px solid #292929;border-radius:24px;padding:12px;display:none;direction:rtl;backdrop-filter:blur(14px)}#panel.show{display:block}.row{display:grid;grid-template-columns:52px 1fr 52px 90px;gap:8px;align-items:center}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}.title{font-weight:800;font-size:14px}.meta{font-size:12px;color:#bbb;direction:ltr}.btn{height:46px;border:0;border-radius:15px;background:#252525;color:white;font-size:14px}.round{height:48px;border:0;border-radius:16px;background:#242424;color:white;font-size:24px}.num{height:48px;border:1px solid #333;border-radius:16px;background:#101010;color:white;text-align:center;font-size:18px;direction:ltr}input[type=range]{width:100%;height:44px;accent-color:#89a790}.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}textarea{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}@media(min-width:760px){#panel{width:560px;right:auto;left:16px}#menu{width:420px;right:auto;left:16px}}
</style>
</head>
<body>
<div id="view"></div>
<div id="hint">loading clean...</div>
<button id="settingsBtn">⚙</button>
<div id="menu"></div>
<div id="panel">
  <div class="top"><div><div class="title" id="calTitle"></div><div class="meta" id="calMeta"></div></div><button class="btn" id="changeBtn">تغيير</button></div>
  <div class="row"><button class="round" id="minusBtn">−</button><input id="calRange" type="range"><button class="round" id="plusBtn">+</button><input class="num" id="calNum" type="number"></div>
  <div class="grid"><button class="btn" id="saveBtn">حفظ</button><button class="btn" id="resetBtn">Reset</button><button class="btn" id="copyBtn">Copy</button><button class="btn" id="hideBtn">إخفاء</button></div>
</div>
<textarea id="out"></textarea>
<script type="module" src="./app-clean-v026.js?v=027"></script>
</body>
</html>
