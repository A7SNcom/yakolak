<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <meta name="color-scheme" content="dark">
  <title>YAKOLAK — Three.js Preview</title>
  <link rel="stylesheet" href="./styles/app.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="app" class="app-shell" aria-labelledby="app-title">
    <canvas id="scene" class="scene" aria-label="Three.js preview scene"></canvas>

    <section class="overlay" aria-live="polite">
      <div class="eyebrow">THREEJS REBUILD</div>
      <h1 id="app-title">YAKOLAK</h1>
      <p id="boot-status" class="status">Booting static Three.js shell…</p>
    </section>

    <aside id="build-marker" class="build-marker" aria-label="Development build marker">
      DEV / resolving SHA…
    </aside>

    <section id="unsupported-webgl" class="unsupported" hidden role="alert">
      <strong>WebGL 2 is unavailable.</strong>
      <span>This preview needs a browser and device with WebGL 2 enabled. Update the browser, enable hardware acceleration, or try another supported device.</span>
    </section>
  </main>

  <noscript>
    <div class="noscript">JavaScript is required to run the Three.js preview.</div>
  </noscript>

  <script type="module" src="./app/boot/boot.js"></script>
</body>
</html>
