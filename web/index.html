<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efede8">
  <meta name="description" content="ياكلك 2.2 — Godot + GDScript">
  <title>ياكلك 2.2</title>
  <link rel="preload" href="index.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="index.pck" as="fetch" crossorigin>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#171717;background:#efede8}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efede8}
    #stage{position:fixed;inset:0;background:#efede8}
    #game{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;visibility:hidden;transition:opacity .3s ease;background:#efede8}
    body[data-state="ready"] #game{opacity:1;visibility:visible}
    #loader{position:absolute;inset:0;display:grid;place-items:center;padding:22px;transition:opacity .25s ease}
    body[data-state="ready"] #loader{opacity:0;pointer-events:none}
    .card{width:min(92vw,520px);padding:34px 28px;text-align:center;background:#faf8f2;border:1px solid #ded8cd;border-radius:28px;box-shadow:0 24px 70px #0002}
    .star{font-size:74px;line-height:1;color:#d6a936;animation:bounce 1s ease-in-out infinite}
    h1{margin:12px 0 6px;font-size:34px}p{margin:0;color:#625c53;line-height:1.8;font-size:17px}
    .track{height:11px;margin:24px 0 12px;background:#ded9cf;border-radius:99px;overflow:hidden}
    .bar{height:100%;width:4%;background:#171717;border-radius:99px;transition:width .22s ease}
    #detail{min-height:28px;font-size:15px;color:#71695f}
    #retry{display:none;width:100%;margin-top:18px;padding:13px 18px;border:0;border-radius:14px;background:#171717;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    body[data-state="error"] .bar{width:100%!important;background:#b42318}
    body[data-state="error"] #retry{display:block}
    @keyframes bounce{50%{transform:translateY(-10px) rotate(10deg)}}
    @media (prefers-reduced-motion:reduce){.star{animation:none}}
  </style>
</head>
<body data-state="loading">
  <main id="stage">
    <iframe id="game" title="لعبة ياكلك 2.2" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
    <section id="loader" aria-live="polite">
      <div class="card">
        <div class="star">★</div>
        <h1>ياكلك 2.2</h1>
        <p id="message">جاري تنزيل ملفات اللعبة…</p>
        <div class="track" aria-hidden="true"><div id="bar" class="bar"></div></div>
        <div id="detail">0%</div>
        <button id="retry" type="button">إعادة المحاولة</button>
      </div>
    </section>
  </main>
  <script>
    (() => {
      const body = document.body;
      const frame = document.getElementById('game');
      const message = document.getElementById('message');
      const detail = document.getElementById('detail');
      const bar = document.getElementById('bar');
      const retry = document.getElementById('retry');
      let finished = false;

      const fail = (text) => {
        if (finished) return;
        finished = true;
        body.dataset.state = 'error';
        message.textContent = 'تعذر تشغيل اللعبة';
        detail.textContent = text || 'أعد المحاولة وتأكد أن المتصفح محدث.';
      };

      const watchdog = setTimeout(() => fail('انتهت مهلة التشغيل. اضغط إعادة المحاولة.'), 120000);

      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow || !event.data) return;
        if (event.data.type === 'yakolak-progress') {
          const current = Number(event.data.current || 0);
          const total = Number(event.data.total || 0);
          if (current > 0 && total > 0) {
            const percent = Math.max(1, Math.min(99, Math.round((current / total) * 100)));
            bar.style.width = percent + '%';
            detail.textContent = percent + '%';
            message.textContent = percent < 75 ? 'جاري تنزيل ملفات اللعبة…' : 'جاري تشغيل محرك Godot…';
          }
        } else if (event.data.type === 'yakolak-ready') {
          finished = true;
          clearTimeout(watchdog);
          bar.style.width = '100%';
          detail.textContent = 'جاهز';
          body.dataset.state = 'ready';
          body.dataset.version = event.data.version || '2.2.0';
          frame.focus();
        } else if (event.data.type === 'yakolak-error') {
          clearTimeout(watchdog);
          fail(event.data.message);
        }
      });

      frame.addEventListener('error', () => fail('تعذر فتح ملفات اللعبة من الخادم.'));
      retry.addEventListener('click', () => location.reload());
      frame.src = 'game.html?v=2.2.0&cache=' + Date.now();
    })();
  </script>
</body>
</html>
