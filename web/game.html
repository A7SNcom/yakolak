<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#efede8">
  <title>ياكلك 2.2</title>
  <style>
    html,body,#canvas{margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;background:#efede8}
    #canvas{display:block;touch-action:none}#canvas:focus{outline:none}
  </style>
</head>
<body>
  <canvas id="canvas">متصفحك لا يدعم تشغيل اللعبة.</canvas>
  <script src="index.js"></script>
  <script>
    (() => {
      const config = {
        args: [],
        canvasResizePolicy: 2,
        emscriptenPoolSize: 8,
        ensureCrossOriginIsolationHeaders: true,
        executable: 'index',
        experimentalVK: false,
        fileSizes: { 'index.pck': 9955488, 'index.wasm': 39513091 },
        focusCanvas: true,
        gdextensionLibs: [],
        godotPoolSize: 4
      };
      const send = (payload) => window.parent.postMessage(payload, '*');
      const fail = (error) => {
        console.error(error);
        const message = error instanceof Error ? error.message : String(error || 'خطأ غير معروف');
        send({ type: 'yakolak-error', message });
      };
      window.addEventListener('error', event => fail(event.error || event.message));
      window.addEventListener('unhandledrejection', event => fail(event.reason));

      const missing = Engine.getMissingFeatures({ threads: false });
      if (missing.length) {
        fail('المتصفح يفتقد: ' + missing.join('، '));
        return;
      }

      const engine = new Engine(config);
      engine.startGame({
        onProgress(current, total) {
          send({ type: 'yakolak-progress', current, total });
        }
      }).then(() => {
        document.body.dataset.yakolakReady = 'true';
        send({ type: 'yakolak-ready', version: '2.2.0' });
      }).catch(fail);
    })();
  </script>
</body>
</html>
