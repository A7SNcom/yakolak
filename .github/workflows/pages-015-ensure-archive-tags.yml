name: PAGES-015 Ensure Locked Archive Tags

on:
  push:
    branches:
      - main
    paths:
      - '.github/PAGES015_ARCHIVE_TAG_TRIGGER'
      - '.github/workflows/pages-015-ensure-archive-tags.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-015-ensure-archive-tags
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Ensure exact locked archive tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          ensure_tag() {
            local role="$1" tag="$2" target="$3" remote
            git cat-file -e "${target}^{commit}"
            remote="$(git ls-remote --refs origin "refs/tags/${tag}" | awk 'NR==1{print $1}')"
            if [ -z "$remote" ]; then
              git push origin "${target}:refs/tags/${tag}"
              remote="$(git ls-remote --refs origin "refs/tags/${tag}" | awk 'NR==1{print $1}')"
            fi
            test "$remote" = "$target" || {
              echo "${role} archive tag target mismatch: expected ${target}, got ${remote:-missing}" >&2
              exit 1
            }
            printf '%s=%s\n' "$role" "$remote" >> "$GITHUB_OUTPUT"
          }

          ensure_tag active \
            pages-archive-2026-08-18-geeb3b8e1-t4e4e5dec \
            4e4e5dec72ee71a06940c6db561dde8d24abd2d0
          ensure_tag previous \
            pages-archive-2026-08-18-geeb3b8e1-t5cc89e05 \
            5cc89e05653b6461ed6a41332f374eaadb360945

      - name: Record non-qualification tag receipt
        env:
          ACTIVE_TAG_SHA: ${{ steps.tags.outputs.active }}
          PREVIOUS_TAG_SHA: ${{ steps.tags.outputs.previous }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          mkdir -p RELEASE_QUALIFICATION
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg active "$ACTIVE_TAG_SHA" \
            --arg previous "$PREVIOUS_TAG_SHA" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              gate: "PAGES-015",
              event: "locked_archive_tags_verified",
              tags: {
                active: {
                  tag: "pages-archive-2026-08-18-geeb3b8e1-t4e4e5dec",
                  targetSha: $active
                },
                previous: {
                  tag: "pages-archive-2026-08-18-geeb3b8e1-t5cc89e05",
                  targetSha: $previous
                }
              },
              workflowRunId: ($runId|tonumber),
              recordedAt: $recordedAt,
              qualificationEvidence: false
            }
          ' > RELEASE_QUALIFICATION/PAGES015_ARCHIVE_TAGS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/PAGES015_ARCHIVE_TAGS.json
          if ! git diff --cached --quiet; then
            git commit -m 'PAGES-015 record locked archive tag targets'
            git push origin HEAD:threejs-rebuild
          fi
