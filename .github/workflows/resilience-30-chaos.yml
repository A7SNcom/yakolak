name: RESILIENCE-30 deterministic 4-client chaos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resilience-30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaos-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YAKOLAK_CHAOS_SEED: resilience-30-main-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Validate RESILIENCE-30 harness syntax
        run: |
          node --check tests/resilience_30_chaos_gate.spec.js
          node --check tests/resilience_30_chaos_api.test.mjs

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-

      - name: Build current main web payload
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: |
          rm -rf .godot/exported
          bash scripts/vercel-fast-build.sh

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run seeded 4-client UI chaos gate
        run: |
          mkdir -p artifacts/resilience-30
          node tests/web_test_server.mjs >artifacts/resilience-30/web-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/resilience_30_chaos_gate.spec.js --workers=1 --reporter=github

      - name: Upload deterministic failure bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: resilience-30-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/resilience-30/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Stress canonical production API
        env:
          YAKOLAK_PROBE_BASE: https://yakolak.vercel.app
        run: |
          for attempt in {1..18}; do
            if node tests/resilience_30_chaos_api.test.mjs; then exit 0; fi
            echo "RESILIENCE-30 production retry $attempt/18"
            sleep 10
          done
          exit 1

      - name: Upload production failure bundle
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: resilience-30-production-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/resilience-30/**
          if-no-files-found: warn
          retention-days: 14
