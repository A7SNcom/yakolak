name: FASTPLAY-003 Final Public Acceptance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/fastplay-003-final-acceptance.yml'

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-public
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve latest web milestone
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git log -1 --format='%H' -- web)"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mark pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=pending \
            -f context='FASTPLAY-003/final-public' \
            -f description='Authoritative public first-playable acceptance running'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('scripts/verify-fastplay003-live.mjs').read_text()

          anchor = "import fs from 'node:fs';"
          if anchor not in s: raise SystemExit('missing fs import')
          s = s.replace(anchor, anchor + "\nimport { execFileSync } from 'node:child_process';", 1)

          a = s.index('async function waitForExactCandidate() {')
          b = s.index('\nfunction attachPageErrorCapture', a)
          wait = r'''function candidateContainsMilestone(candidateSha) {
            if (!/^[0-9a-f]{40}$/.test(candidateSha)) return false;
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', expectedCandidateSha, candidateSha], { stdio: 'ignore' });
              return true;
            } catch { return false; }
          }

          async function waitForExactCandidate() {
            let last = null;
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              try {
                const manifest = await fetchJsonNoCache(manifestUrl);
                last = manifest;
                const liveCandidateSha = String(manifest?.threejsCandidateSha || '').trim().toLowerCase();
                if (candidateContainsMilestone(liveCandidateSha)) return { attempt, manifest, liveCandidateSha };
              } catch (error) { last = { error: error?.message || String(error) }; }
              await delay(5_000);
            }
            const error = new Error(`public generation does not contain ${expectedCandidateSha}`);
            error.lastObservation = last;
            throw error;
          }
          '''
          s = s[:a] + wait + s[b:]

          old = "const browser = await chromium.launch({ headless: true });"
          new = "const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });"
          if old not in s: raise SystemExit('missing chromium launch')
          s = s.replace(old, new, 1)

          a = s.index('async function allowRealTimeout(page) {')
          b = s.index('\nasync function verifyWebglRecovery', a)
          timeout = r'''async function allowRealTimeout(page) {
            const handle = await page.waitForFunction(async () => {
              const state = await window.__YAKOLAK_THREEJS_SHELL__.getCanonicalState();
              const seat = state.seats.find(candidate => candidate.seatId === state.activeSeatId);
              const nowMs = Date.now();
              const remainingMs = state.deadlineAtMs === null ? null : state.deadlineAtMs - nowMs;
              if (seat?.type !== 'human' || !Number.isSafeInteger(state.deadlineAtMs) || remainingMs < 15000 || remainingMs > 19500) return false;
              return { state, remainingMs, startedAt: performance.now() };
            }, null, { timeout: 20000, polling: 25 });
            const observation = await handle.jsonValue();
            await handle.dispose();
            const before = observation.state;
            const seat = before.seats.find(candidate => candidate.seatId === before.activeSeatId);
            assert.equal(seat?.type, 'human');
            const minimumElapsedMs = Math.max(14500, observation.remainingMs - 350);

            await page.waitForTimeout(500);
            const early = await getState(page);
            assert.equal(early.revision, before.revision, 'turn advanced before human deadline');
            assert.equal(early.activeSeatId, before.activeSeatId, 'seat changed before human deadline');

            await page.waitForTimeout(Math.max(0, minimumElapsedMs - 500));
            await page.waitForFunction(async revision => {
              const state = await window.__YAKOLAK_THREEJS_SHELL__.getCanonicalState();
              return state.revision > revision;
            }, before.revision, { timeout: 5000, polling: 25 });

            const after = await getState(page);
            const elapsedMs = await page.evaluate(startedAt => performance.now() - startedAt, observation.startedAt);
            assert.ok(elapsedMs >= minimumElapsedMs, `timeout advanced too early after ${elapsedMs}ms`);
            const direct = after.skips?.some(skip => skip.seatId === seat.seatId && skip.reason === 'timeout');
            const followed = after.revision >= before.revision + 2 && after.lastMove?.seatId !== seat.seatId;
            assert.ok(direct || followed, 'timeout evidence missing');
            return { seatId: seat.seatId, deadlineAtMs: before.deadlineAtMs, observedRevision: after.revision, elapsedMs, direct, followed };
          }
          '''
          s = s[:a] + timeout + s[b:]

          old_flow = r'''    const timeout = await allowRealTimeout(page);
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const gestureBook = { tap: 0, drag: 0 };
              const firstMove = await chooseHumanMove(page);
              assert.ok(firstMove, 'no legal tap move after timeout');
              const tap = await tapMove(page, firstMove);
              gestureBook.tap += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const secondMove = await chooseHumanMove(page);
              assert.ok(secondMove, 'no legal drag move after tap');
              const drag = await dragMove(page, secondMove, { pointerType: 'mouse' });
              gestureBook.drag += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });'''
          new_flow = r'''    const gestureBook = { tap: 0, drag: 0 };
              const firstMove = await chooseHumanMove(page);
              assert.ok(firstMove, 'no legal opening tap move');
              const tap = await tapMove(page, firstMove);
              gestureBook.tap += 1;

              const timeout = await allowRealTimeout(page);
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const secondMove = await chooseHumanMove(page);
              assert.ok(secondMove, 'no legal drag move after timeout');
              const drag = await dragMove(page, secondMove, { pointerType: 'mouse' });
              gestureBook.drag += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });'''
          if old_flow not in s: raise SystemExit('desktop flow changed')
          s = s.replace(old_flow, new_flow, 1)

          old_output = "    candidateSha: expectedCandidateSha,"
          if old_output not in s: raise SystemExit('candidate output changed')
          s = s.replace(old_output, "    candidateSha: live.liveCandidateSha,\n    milestoneSha: expectedCandidateSha,", 1)
          Path('fastplay-003-final.mjs').write_text(s)
          PY
          node --check fastplay-003-final.mjs

      - name: Run public acceptance
        id: run
        continue-on-error: true
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        run: node fastplay-003-final.mjs 2>&1 | tee fastplay-003-final.log

      - name: Record authoritative PASS
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.candidate.outputs.sha }}
          PUBLIC_URL: https://a7sncom.github.io/yakolak/threejs/
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          public_url="$(jq -r '.publicUrl' fastplay-003-acceptance.json)"
          result="$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)"

          test "$result" = 'PASS'
          test -n "$generation"
          test "$public_url" = "$PUBLIC_URL"
          git merge-base --is-ancestor "$MILESTONE" "$candidate"

          freeze_branch='first-playable-experimental'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${freeze_branch}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${freeze_branch}" \
              -f sha="$candidate" >/dev/null
          elif [ "$existing" != "$candidate" ]; then
            echo "freeze branch already points to ${existing}; refusing to move it to ${candidate}" >&2
            exit 1
          fi

          title='FIRST_PLAYABLE_EXPERIMENTAL=PASS'
          body_file="$(mktemp)"
          cat > "$body_file" <<BODY
          FIRST_PLAYABLE_EXPERIMENTAL=PASS

          milestone_sha: ${MILESTONE}
          candidate_sha: ${candidate}
          deployment_generation: ${generation}
          public_url: ${public_url}
          freeze_branch: ${freeze_branch}
          workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verified the actual public human-facing page on desktop and mobile portrait with explicit 2-player Human+Computer setup, tap and drag moves, one real 18-second human timeout, round completion and scoring, next-round reset, full match completion, rematch, return to setup, refresh recovery, WebGL context loss/restore, and no fatal/page errors.
          BODY

          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "FIRST_PLAYABLE_EXPERIMENTAL=PASS") | .number' | head -n 1)"
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$title" --body-file "$body_file" >/dev/null
          else
            gh issue edit "$existing_issue" --body-file "$body_file" >/dev/null
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE}" \
            -f state=success -f context='FASTPLAY-003/final-public' \
            -f description="FIRST_PLAYABLE_EXPERIMENTAL=PASS live=${candidate:0:8}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" \
            -f state=success -f context='FASTPLAY-003/public-pass' \
            -f description='Public first-playable acceptance passed and frozen'

      - name: Publish failure evidence
        if: steps.run.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE}" \
            -f state=failure -f context='FASTPLAY-003/final-public' \
            -f description='Authoritative public first-playable acceptance failed'

          title="FASTPLAY-003 authoritative blocker ${MILESTONE}"
          body_file="$(mktemp)"
          {
            echo 'FASTPLAY-003 authoritative final public acceptance failed.'
            echo
            echo "milestone_sha: ${MILESTONE}"
            echo "public_url: https://a7sncom.github.io/yakolak/threejs/"
            echo "workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -n 180 fastplay-003-final.log 2>/dev/null || true
            echo '```'
          } > "$body_file"
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$title" --body-file "$body_file" >/dev/null
          else
            gh issue edit "$existing_issue" --body-file "$body_file" >/dev/null
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-final-${{ steps.candidate.outputs.sha }}
          path: |
            fastplay-003-acceptance.json
            fastplay-003-final.log
          if-no-files-found: warn
          retention-days: 90

      - name: Fail job after evidence
        if: steps.run.outcome != 'success'
        run: exit 1
