name: PAGES-005 authenticated deploy dispatcher

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'backend/cloudflare/DEPLOY_REQUEST'
      - '.github/workflows/pages-005-deploy-dispatcher.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pages-005-deploy-dispatcher
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Dispatch the credential-gated PAGES-005 deployment workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"ref":"threejs-rebuild"}'
          code="$(curl --silent --show-error \
            --output /tmp/pages005-dispatch-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-005-cloudflare-backend.yml/dispatches" \
            --data "$body")"
          if [ "$code" != '204' ]; then
            echo "PAGES-005 workflow dispatch failed (HTTP ${code})." >&2
            cat /tmp/pages005-dispatch-response.json >&2 || true
            exit 1
          fi
          echo 'PAGES-005 authenticated deployment workflow dispatched.'

      - name: Record non-qualification dispatch receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git checkout -B threejs-rebuild origin/threejs-rebuild
          mkdir -p backend/cloudflare
          jq -n \
            --arg workflow 'pages-005-cloudflare-backend.yml' \
            --arg ref 'threejs-rebuild' \
            --arg requestSha "$GITHUB_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 1,
              event: "pages005_workflow_dispatched",
              workflow: $workflow,
              ref: $ref,
              requestSha: $requestSha,
              dispatcherWorkflowRunId: ($workflowRunId|tonumber),
              recordedAt: $recordedAt,
              qualificationEvidence: false
            }' > backend/cloudflare/LAST_DEPLOY_DISPATCH.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cloudflare/LAST_DEPLOY_DISPATCH.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'backend/cloudflare/LAST_DEPLOY_DISPATCH.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'PAGES-005 record authenticated deploy dispatch'
          git push origin HEAD:threejs-rebuild
