name: PAGES-011 Final Decision Guard Probe

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - .github/workflows/pages-011-live-probe.yml

permissions:
  contents: read

concurrency:
  group: pages-011-final-decision-guard-probe
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PAGES-011 durable decision and source guard
        run: node --test tests/pages_service_worker_decision.test.mjs
