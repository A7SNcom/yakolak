name: UX-TURN-32 turn-to-interact latency

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-turn-32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Correct measurement-only harness boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ux_turn_32_latency.spec.js')
          s = p.read_text()
          old = "requests.find(row => Number(row.version) === Number(commit.version) && row.requestAt >= commit.commitAt)"
          new = "requests.find(row => Number(row.version) === Number(commit.version) && row.responseAt >= commit.commitAt)"
          assert old in s
          s = s.replace(old, new)
          old = "    hitTestAcceptMs: Math.max(0, selectedAt - input.inputDispatchAt),\n    totalMs: Math.max(0, selectedAt - commit.commitAt),"
          new = "    hitTestAcceptMs: Math.max(0, selectedAt - input.inputDispatchAt),\n    turnToInteractMs: Math.max(0, gameplayReadyAt - commit.commitAt) + Math.max(0, selectedAt - input.inputDispatchAt),\n    totalMs: Math.max(0, selectedAt - commit.commitAt),"
          assert old in s
          s = s.replace(old, new)
          old = "groups.push({ viewport: viewport.name, players: playerCount, total: stats(rows, 'totalMs'), ready: stats(rows, 'readyAfterCommitMs'), pollWait: stats(rows, 'pollWaitMs'), network: stats(rows, 'networkMs'), camera: stats(rows, 'cameraGateMs'), hitTest: stats(rows, 'hitTestAcceptMs') });"
          new = "groups.push({ viewport: viewport.name, players: playerCount, turnToInteract: stats(rows, 'turnToInteractMs'), rawProbe: stats(rows, 'totalMs'), ready: stats(rows, 'readyAfterCommitMs'), pollWait: stats(rows, 'pollWaitMs'), network: stats(rows, 'networkMs'), hydration: stats(rows, 'snapshotHydrationMs'), uiUpdate: stats(rows, 'uiUpdateMs'), camera: stats(rows, 'cameraGateMs'), hitTest: stats(rows, 'hitTestAcceptMs') });"
          assert old in s
          s = s.replace(old, new)
          old = "const slowest = [...all].sort((a, b) => b.totalMs - a.totalMs).slice(0, 8);"
          new = "const slowest = [...all].sort((a, b) => b.turnToInteractMs - a.turnToInteractMs).slice(0, 8);"
          assert old in s
          s = s.replace(old, new)
          old = "      totalMs: 'authoritative commit -> first actual large-piece pointer accepted as piece-selected',"
          new = "      turnToInteractMs: 'authoritative commit -> gameplay_ready plus measured pointer-to-piece-selected hit-test acceptance; excludes test-observer coordinate wait',\n      totalMs: 'raw probe wall-clock authoritative commit -> first actual large-piece pointer accepted as piece-selected; includes test-observer coordinate wait',"
          assert old in s
          s = s.replace(old, new)
          old = "    definitions: {"
          new = "    samples: all,\n    definitions: {"
          assert old in s
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Validate diagnostic syntax
        run: node --check tests/ux_turn_32_latency.spec.js

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-

      - name: Build latest main web payload
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: |
          rm -rf .godot/exported
          bash scripts/vercel-fast-build.sh

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start latest-main web server
        run: |
          mkdir -p artifacts/ux-turn-32
          node tests/web_test_server.mjs >artifacts/ux-turn-32/web-test-server.log 2>&1 &
          echo $! > artifacts/ux-turn-32/server.pid
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1

      - name: Measure latest main controlled authority
        env:
          YAKOLAK_TURN32_BASE: http://127.0.0.1:8000
          YAKOLAK_TURN32_LABEL: main-controlled
          YAKOLAK_TURN32_SAMPLES: "20"
        run: npx playwright test tests/ux_turn_32_latency.spec.js --workers=1 --reporter=github

      - name: Measure starting Production client bundle and live API RTT
        env:
          YAKOLAK_TURN32_BASE: https://yakolak-9y4vronvt-ahmdkcoms-projects.vercel.app
          YAKOLAK_TURN32_LABEL: production-start-controlled
          YAKOLAK_TURN32_SAMPLES: "20"
        run: npx playwright test tests/ux_turn_32_latency.spec.js --workers=1 --reporter=github

      - name: Upload UX-TURN-32 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ux-turn-32/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
