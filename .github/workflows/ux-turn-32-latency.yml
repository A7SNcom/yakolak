name: UX-TURN-32 turn-to-interact latency

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-turn-32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Correct measurement-only harness boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ux_turn_32_latency.spec.js')
          s = p.read_text()
          replacements = [
            (
              "requests.find(row => Number(row.version) === Number(commit.version) && row.requestAt >= commit.commitAt)",
              "requests.find(row => Number(row.version) === Number(commit.version) && row.responseAt >= commit.commitAt)",
            ),
            (
              "  const count = Number(harness.seatMoveCounts[seat] || 0);\n  const size = count % 2 === 0 ? 'small' : 'medium';",
              "  const size = ['small', 'medium', 'large'][Number(room.moveNumber || 0) % 3];",
            ),
            (
              "await client.page.evaluate(() => { window.__turn32Timeline = []; window.__turn32Net = []; window.__turn32Last = ''; });",
              "await client.page.evaluate(() => { window.__turn32Timeline = []; window.__turn32Net = []; window.__turn32Last = ''; const d = document.body.dataset; for (const k of ['yakolakTestPiece','yakolakTestPieceX','yakolakTestPieceY','yakolakTestLargeX','yakolakTestLargeY','yakolakTestMediumX','yakolakTestMediumY','yakolakTestSmallX','yakolakTestSmallY']) delete d[k]; });",
            ),
            (
              "return d.yakolakGameplay === 'ready' && Number.isFinite(Number(d.yakolakTestLargeX)) && Number.isFinite(Number(d.yakolakTestLargeY));",
              "return d.yakolakGameplay === 'ready' && Number.isFinite(Number(d.yakolakTestPieceX)) && Number.isFinite(Number(d.yakolakTestPieceY));",
            ),
            (
              "return client.page.evaluate(() => ({ x: Number(document.body.dataset.yakolakTestLargeX), y: Number(document.body.dataset.yakolakTestLargeY), at: Date.now() }));",
              "return client.page.evaluate(() => ({ x: Number(document.body.dataset.yakolakTestPieceX), y: Number(document.body.dataset.yakolakTestPieceY), at: Date.now() }));",
            ),
            (
              "await client.page.waitForFunction(() => document.body.dataset.yakolakGameplay === 'piece-selected' && document.body.dataset.yakolakSelectedSize === 'large', null, { timeout: 3000 });",
              "await client.page.waitForFunction(() => document.body.dataset.yakolakGameplay === 'piece-selected' && Boolean(document.body.dataset.yakolakSelectedSize), null, { timeout: 3000 });",
            ),
            (
              "const selectedAt = firstTime(timeline, row => row.gameplay === 'piece-selected' && row.selectedSize === 'large') || input.acceptedAt;",
              "const selectedAt = firstTime(timeline, row => row.gameplay === 'piece-selected' && Boolean(row.selectedSize)) || input.acceptedAt;",
            ),
            (
              "  const responseAt = responseSeen?.responseAt || delivered.responseAt;",
              "  const responseAt = delivered.responseAt;",
            ),
            (
              "async function runNormalMatrix(browser, viewport, playerCount, code) {\n  const harness = makeHarness(playerCount, code);\n  const clients = [];\n  try {\n    for (let i = 0; i < playerCount; i += 1) clients.push(await createClient(browser, harness, `p${i + 1}`, viewport));\n    const rows = [];\n    for (let i = 0; i < SAMPLE_COUNT; i += 1) rows.push(await measureOne(harness, clients));\n    return rows;\n  } finally { await closeClients(clients); }\n}",
              "async function runNormalMatrix(browser, viewport, playerCount, code) {\n  const rows = [];\n  while (rows.length < SAMPLE_COUNT) {\n    const harness = makeHarness(playerCount, code);\n    const clients = [];\n    try {\n      for (let i = 0; i < playerCount; i += 1) clients.push(await createClient(browser, harness, `p${i + 1}`, viewport));\n      const batch = Math.min(8, SAMPLE_COUNT - rows.length);\n      for (let i = 0; i < batch; i += 1) rows.push(await measureOne(harness, clients));\n    } finally { await closeClients(clients); }\n  }\n  return rows;\n}",
            ),
            (
              "    hitTestAcceptMs: Math.max(0, selectedAt - input.inputDispatchAt),\n    totalMs: Math.max(0, selectedAt - commit.commitAt),",
              "    hitTestAcceptMs: Math.max(0, selectedAt - input.inputDispatchAt),\n    turnToInteractMs: Math.max(0, gameplayReadyAt - commit.commitAt) + Math.max(0, selectedAt - input.inputDispatchAt),\n    totalMs: Math.max(0, selectedAt - commit.commitAt),",
            ),
            (
              "groups.push({ viewport: viewport.name, players: playerCount, total: stats(rows, 'totalMs'), ready: stats(rows, 'readyAfterCommitMs'), pollWait: stats(rows, 'pollWaitMs'), network: stats(rows, 'networkMs'), camera: stats(rows, 'cameraGateMs'), hitTest: stats(rows, 'hitTestAcceptMs') });",
              "groups.push({ viewport: viewport.name, players: playerCount, turnToInteract: stats(rows, 'turnToInteractMs'), rawProbe: stats(rows, 'totalMs'), ready: stats(rows, 'readyAfterCommitMs'), pollWait: stats(rows, 'pollWaitMs'), network: stats(rows, 'networkMs'), hydration: stats(rows, 'snapshotHydrationMs'), uiUpdate: stats(rows, 'uiUpdateMs'), camera: stats(rows, 'cameraGateMs'), hitTest: stats(rows, 'hitTestAcceptMs') });",
            ),
            (
              "const slowest = [...all].sort((a, b) => b.totalMs - a.totalMs).slice(0, 8);",
              "const slowest = [...all].sort((a, b) => b.turnToInteractMs - a.turnToInteractMs).slice(0, 8);",
            ),
            (
              "      totalMs: 'authoritative commit -> first actual large-piece pointer accepted as piece-selected',",
              "      turnToInteractMs: 'authoritative commit -> gameplay_ready plus measured pointer-to-piece-selected hit-test acceptance; excludes test-observer coordinate wait',\n      totalMs: 'raw probe wall-clock authoritative commit -> first actual legal-piece pointer accepted as piece-selected; includes test-observer coordinate wait',",
            ),
            (
              "    definitions: {",
              "    samples: all,\n    definitions: {",
            ),
          ]
          for old, new in replacements:
            assert old in s, old
            s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Validate diagnostic syntax
        run: node --check tests/ux_turn_32_latency.spec.js

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-

      - name: Build latest main web payload
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: |
          rm -rf .godot/exported
          bash scripts/vercel-fast-build.sh

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start latest-main web server
        run: |
          mkdir -p artifacts/ux-turn-32
          node tests/web_test_server.mjs >artifacts/ux-turn-32/web-test-server.log 2>&1 &
          echo $! > artifacts/ux-turn-32/server.pid
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1

      - name: Measure latest main controlled authority
        env:
          YAKOLAK_TURN32_BASE: http://127.0.0.1:8000
          YAKOLAK_TURN32_LABEL: main-controlled
          YAKOLAK_TURN32_SAMPLES: "20"
        run: npx playwright test tests/ux_turn_32_latency.spec.js --workers=1 --reporter=github

      - name: Measure starting Production client bundle and live API RTT
        env:
          YAKOLAK_TURN32_BASE: https://yakolak-9y4vronvt-ahmdkcoms-projects.vercel.app
          YAKOLAK_TURN32_LABEL: production-start-controlled
          YAKOLAK_TURN32_SAMPLES: "20"
        run: npx playwright test tests/ux_turn_32_latency.spec.js --workers=1 --reporter=github

      - name: Upload UX-TURN-32 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-32-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ux-turn-32/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
