name: THREEJS-018 board and lid verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'scripts/analyze-threejs-board-lid.mjs'
      - 'scripts/verify-threejs-board-lid.mjs'
      - 'scripts/verify-threejs-board-lid-runtime-contract.mjs'
      - 'scripts/convert-threejs-assets.mjs'
      - 'scripts/lib/asset-conversion-pipeline.mjs'
      - 'scripts/lib/board-lid-semantic-glb.mjs'
      - 'web/app/assets/asset-manifest.js'
      - 'web/app/scene/board-and-lid.js'
      - 'web/assets/models/board-and-lid.glb'
      - 'web/assets/models/board-and-lid-layout.json'
      - 'web/assets/models/conversion-state.json'
      - 'tests/threejs_board_and_lid_contract.test.mjs'
      - '.github/workflows/threejs-018-board-lid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Inspect canonical board and lid geometry
        run: node scripts/analyze-threejs-board-lid.mjs
      - name: Verify committed deterministic board and lid GLB
        run: npm run assets:check -- --only=model.board-and-lid
      - name: Verify semantic geometry and authoritative layout
        run: node scripts/verify-threejs-board-lid.mjs
      - name: Verify runtime wiring and resource sharing contract
        run: node scripts/verify-threejs-board-lid-runtime-contract.mjs
      - name: Run THREEJS-018 contract test
        run: node --test tests/threejs_board_and_lid_contract.test.mjs
