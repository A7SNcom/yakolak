name: THREEJS-018 board and lid verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'scripts/analyze-threejs-board-lid.mjs'
      - 'scripts/verify-threejs-board-lid.mjs'
      - 'scripts/convert-threejs-assets.mjs'
      - 'scripts/lib/asset-conversion-pipeline.mjs'
      - 'scripts/lib/board-lid-semantic-glb.mjs'
      - 'web/assets/models/board-and-lid.glb'
      - 'web/assets/models/conversion-state.json'
      - 'tests/threejs_board_and_lid_contract.test.mjs'
      - '.github/workflows/threejs-018-board-lid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Inspect canonical board and lid geometry
        run: node scripts/analyze-threejs-board-lid.mjs
      - name: Generate semantic board and lid GLB
        run: npm run assets:convert -- --only=model.board-and-lid
      - name: Verify semantic geometry and authoritative layout
        run: node scripts/verify-threejs-board-lid.mjs
      - name: Run THREEJS-018 contract test
        run: node --test tests/threejs_board_and_lid_contract.test.mjs
      - name: Commit deterministic runtime asset
        shell: bash
        run: |
          if git diff --quiet -- web/assets/models/board-and-lid.glb web/assets/models/conversion-state.json; then
            echo 'Semantic runtime asset already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/assets/models/board-and-lid.glb web/assets/models/conversion-state.json
          git commit -m 'THREEJS-018 commit semantic board lid runtime asset'
          git pull --rebase origin threejs-rebuild
          git push origin HEAD:threejs-rebuild
