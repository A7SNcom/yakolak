name: FASTPLAY-003 Final Public Acceptance v10

on:
  push:
    branches: [threejs-rebuild]
    paths: ['.github/workflows/fastplay-003-final-v10.yml']

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-v10
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - id: candidate
        shell: bash
        run: echo "sha=$(git log -1 --format='%H' -- web)" >> "$GITHUB_OUTPUT"

      - name: Mark pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" -f state=pending -f context='FASTPLAY-003/final-public' -f description='v10 round-boundary WebGL acceptance running' -f target_url="$run_url"

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/fastplay-003-final-v6.yml').read_text()
          a = workflow.index('      - name: Build verifier\n')
          b = workflow.index('      - name: Exercise full public first playable\n', a)
          block = workflow[a:b]
          r = block.index('        run: |\n') + len('        run: |\n')
          Path('/tmp/build-v6.sh').write_text(textwrap.dedent(block[r:]))
          PY
          bash /tmp/build-v6.sh

          python - <<'PY'
          from pathlib import Path
          path = Path('fastplay-003-final-v3.mjs')
          source = path.read_text()

          helper = r'''async function waitForRevisionOrRoundEnd(page, beforeRevision, { timeoutMs = 3_000, pollingMs = 25 } = {}) {
            const startedAt = Date.now();
            let lastState = null;
            while (Date.now() - startedAt < timeoutMs) {
              lastState = await getState(page);
              if (lastState.revision > beforeRevision || lastState.roundEndRevision !== null || lastState.matchComplete) {
                return lastState;
              }
              await page.waitForTimeout(pollingMs);
            }
            const error = new Error(`canonical state did not advance after revision ${beforeRevision}`);
            error.lastState = lastState;
            throw error;
          }

          async function waitForPhysicalInputReady(page, seatId) {
            const startedAt = Date.now();
            let lastObservation = null;
            while (Date.now() - startedAt < 5_000) {
              lastObservation = await page.evaluate(async seatId => {
                const shell = window.__YAKOLAK_THREEJS_SHELL__;
                const state = await shell.getCanonicalState();
                const presentation = shell.getPresentationSnapshot();
                const ready = state.activeSeatId === seatId
                  && !presentation?.movePresentationLock
                  && (!presentation?.drag?.phase || presentation.drag.phase === 'idle')
                  && (!presentation?.tap?.phase || presentation.tap.phase === 'idle');
                return { state, ready };
              }, seatId);
              if (lastObservation.state.roundEndRevision !== null || lastObservation.state.matchComplete || lastObservation.ready) {
                return lastObservation.state;
              }
              await page.waitForTimeout(25);
            }
            throw new Error(`physical input did not become ready for ${seatId}: ${JSON.stringify(lastObservation)}`);
          }

          '''

          tap_sig = 'async function tapMove(page, move) {'
          drag_sig = "async function dragMove(page, move, { pointerType = 'mouse' } = {}) {"
          if tap_sig not in source or drag_sig not in source:
              raise SystemExit('physical move signatures missing')

          tap_start = source.index(tap_sig)
          source = source[:tap_start] + helper + source[tap_start:]

          tap_start = source.index(tap_sig)
          tap_insert = tap_start + len(tap_sig)
          tap_prefix = r'''
            const readiness = await waitForPhysicalInputReady(page, move.seatId);
            if (readiness.roundEndRevision !== null || readiness.matchComplete) {
              return { gesture: 'tap', move, ended: true, revision: readiness.revision };
            }'''
          source = source[:tap_insert] + tap_prefix + source[tap_insert:]

          drag_start = source.index(drag_sig)
          drag_insert = drag_start + len(drag_sig)
          drag_prefix = r'''
            const readiness = await waitForPhysicalInputReady(page, move.seatId);
            if (readiness.roundEndRevision !== null || readiness.matchComplete) {
              return { gesture: 'drag', move, ended: true, revision: readiness.revision, pointerType };
            }'''
          source = source[:drag_insert] + drag_prefix + source[drag_insert:]

          a = source.index('async function finishRound(page, humanSeatId, gestureBook) {')
          b = source.index('\nasync function finishMatch', a)
          finish_round = r'''async function finishRound(page, humanSeatId, gestureBook) {
            for (let step = 0; step < 80; step += 1) {
              const state = await getState(page);
              if (state.roundEndRevision !== null || state.matchComplete) return state;

              if (state.activeSeatId === humanSeatId) {
                const move = await chooseHumanMove(page);
                if (!move) {
                  await waitForRevisionOrRoundEnd(page, state.revision, { timeoutMs: 23_000, pollingMs: 50 });
                  continue;
                }

                let physicalResult;
                const forceDrag = gestureBook.drag === 0;
                const forceTap = gestureBook.tap === 0;
                if (forceTap) {
                  physicalResult = await tapMove(page, move);
                  if (!physicalResult?.ended) gestureBook.tap += 1;
                } else if (forceDrag) {
                  physicalResult = await dragMove(page, move, { pointerType: 'mouse' });
                  if (!physicalResult?.ended) gestureBook.drag += 1;
                } else if ((gestureBook.tap + gestureBook.drag) % 2 === 0) {
                  physicalResult = await tapMove(page, move);
                  if (!physicalResult?.ended) gestureBook.tap += 1;
                } else {
                  physicalResult = await dragMove(page, move, { pointerType: 'mouse' });
                  if (!physicalResult?.ended) gestureBook.drag += 1;
                }
                continue;
              }

              const beforeRevision = state.revision;
              try {
                await waitForRevisionOrRoundEnd(page, beforeRevision, { timeoutMs: 3_000, pollingMs: 25 });
              } catch (error) {
                const diagnostic = await page.evaluate(async () => {
                  const shell = window.__YAKOLAK_THREEJS_SHELL__;
                  const canonical = await shell.getCanonicalState();
                  const presentation = shell.getPresentationSnapshot();
                  return {
                    canonical,
                    computerSeat: canonical.seats.find(candidate => candidate.seatId === canonical.activeSeatId) || null,
                    movePresentationLock: presentation?.movePresentationLock || null,
                    motion: presentation?.motion || null,
                    acceptedTravel: presentation?.acceptedTravel || null,
                    graphics: shell.getGraphicsContextSnapshot(),
                    resources: shell.getResourceRegistrySnapshot(),
                  };
                });
                throw new Error(`computer handoff stalled after revision ${beforeRevision}: ${JSON.stringify(diagnostic)}`, { cause: error });
              }
            }
            const finalState = await getState(page);
            throw new Error(`round did not finish within deterministic safety bound: ${JSON.stringify(finalState)}`);
          }
          '''
          source = source[:a] + finish_round + source[b:]

          a = source.index('async function verifyWebglRecovery(page) {')
          b = source.index('\nasync function finishRound', a)
          webgl = r'''async function verifyWebglRecovery(page) {
            const before = await getState(page);
            assert.ok(before.roundEndRevision !== null || before.matchComplete, 'WebGL recovery must run at a stable round boundary');
            assert.equal(before.deadlineAtMs, null, 'round boundary must not retain an active deadline');
            const initialGraphics = await page.evaluate(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot());
            assert.equal(initialGraphics.state, 'ready');
            const supported = await page.evaluate(() => {
              const canvas = window.__YAKOLAK_THREEJS_SHELL__.canvas;
              const gl = canvas.getContext('webgl2');
              const ext = gl?.getExtension('WEBGL_lose_context');
              if (!ext) return false;
              window.__FASTPLAY003_WEBGL_LOSE_CONTEXT__ = ext;
              ext.loseContext();
              return true;
            });
            assert.equal(supported, true, 'WEBGL_lose_context is required to verify real WebGL recovery');
            await page.waitForFunction(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot().state === 'lost', null, { timeout: 5_000 });
            await page.evaluate(() => window.__FASTPLAY003_WEBGL_LOSE_CONTEXT__.restoreContext());
            await page.waitForFunction(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot().state === 'ready', null, { timeout: 10_000 });
            const after = await getState(page);
            const graphics = await page.evaluate(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot());
            assert.equal(after.revision, before.revision, 'WebGL recovery mutated canonical revision at round boundary');
            assert.deepEqual(after.board, before.board, 'WebGL recovery mutated board at round boundary');
            assert.deepEqual(after.scores, before.scores, 'WebGL recovery mutated scores at round boundary');
            assert.equal(after.roundEndRevision, before.roundEndRevision, 'WebGL recovery changed round boundary');
            assert.ok(graphics.restoreCount >= initialGraphics.restoreCount + 1);
            console.log(JSON.stringify({
              stage: 'webgl-recovery-pass',
              revision: after.revision,
              round: after.round,
              roundEndRevision: after.roundEndRevision,
              restoreCountBefore: initialGraphics.restoreCount,
              restoreCountAfter: graphics.restoreCount,
            }));
            return { before: initialGraphics, after: graphics };
          }
          '''
          source = source[:a] + webgl + source[b:]

          run_desktop = source.index('async function runDesktop(browser) {')
          webgl_call = source.index('    const webgl = await verifyWebglRecovery(page);', run_desktop)
          source = source[:webgl_call] + "    const webglBoundary = await finishRound(page, humanSeatId, gestureBook);\n    assert.ok(webglBoundary.roundEndRevision !== null || webglBoundary.matchComplete, 'first round did not reach WebGL boundary');\n" + source[webgl_call:]

          path.write_text(source)
          PY

          node --check fastplay-003-final-v3.mjs
          test "$(grep -Fc 'const readiness = await waitForPhysicalInputReady(page, move.seatId);' fastplay-003-final-v3.mjs)" -eq 2
          grep -Fq "waitForRevisionOrRoundEnd" fastplay-003-final-v3.mjs
          ! grep -Fq "page.waitForFunction(async revision" fastplay-003-final-v3.mjs
          grep -Fq "WebGL recovery must run at a stable round boundary" fastplay-003-final-v3.mjs
          grep -Fq "first round did not reach WebGL boundary" fastplay-003-final-v3.mjs
          grep -Fq "computer handoff stalled after revision" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'real-timeout-pass'" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'webgl-recovery-pass'" fastplay-003-final-v3.mjs

      - name: Exercise full public first playable
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 12m node fastplay-003-final-v3.mjs 2>&1 | tee fastplay-003-final-v10.log

      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          test "$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)" = PASS
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/final-public' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/first-playable' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" -f state=success -f context='FASTPLAY-003/public-pass' -f description="PASS generation ${generation}" -f target_url="$run_url"

      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-v10-${{ steps.candidate.outputs.sha }}
          path: fastplay-003-acceptance.json
          retention-days: 90

      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=failure -f context='FASTPLAY-003/final-public' -f description='v10 acceptance failed' -f target_url="$run_url"
          title="FASTPLAY-003 final-v10 blocker ${MILESTONE_SHA}"
          body="$(mktemp)"
          {
            echo 'FASTPLAY-003 final-v10 failed.'
            echo
            echo "workflow_run: ${run_url}"
            echo '```text'
            tail -n 220 fastplay-003-final-v10.log 2>/dev/null || echo '(verifier log unavailable)'
            echo '```'
          } > "$body"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body-file "$body" >/dev/null
          else
            gh issue edit "$existing" --body-file "$body" >/dev/null
          fi
