name: THREEJS-011 Vendor Contract

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - web/index.html
      - web/app/**
      - web/vendor/three/**
      - THIRD_PARTY_NOTICES.md
      - tests/threejs_vendor_contract.test.mjs
      - .github/workflows/threejs-010-vendor-r185.yml
      - .github/workflows/threejs-011-vendor-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
      - name: Verify immutable local vendor graph
        run: node tests/threejs_vendor_contract.test.mjs
