name: Verify v112 multiplayer and restart

on:
  push:
    branches:
      - "112"
    paths:
      - index.html
      - app.js
      - version.json
      - src/app-game-v112.js
      - scripts/verify-v112-multiplayer-restart.mjs
      - .github/workflows/verify-v112-multiplayer-restart.yml
  pull_request:
    paths:
      - index.html
      - app.js
      - version.json
      - src/app-game-v112.js
      - scripts/verify-v112-multiplayer-restart.mjs
      - .github/workflows/verify-v112-multiplayer-restart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiplayer-restart:
    name: ${{ matrix.profile }} multiplayer and restart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
    steps:
      - name: Check out v112
        uses: actions/checkout@v4
        with:
          ref: "112"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install visual-test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2 three@0.165.0
          npx playwright install --with-deps chromium
      - name: Prepare deterministic visual-test page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          text = text.replace('https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js', './node_modules/three/build/three.module.js')
          text = text.replace('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/', './node_modules/three/examples/jsm/')
          guard = """<script id="yakolakCiTurnGuard">
          setInterval(()=>{
            const state=globalThis.__yakolakGame?.state;
            if(!state?.started||state.winner||!state.players?.length)return;
            const current=state.players[state.turnIndex%state.players.length];
            if(current===state.humanColor)state.turnDeadline=Date.now()+120000;
          },100);
          </script>"""
          text = text.replace('</body>', guard + '\n</body>')
          path.write_text(text)

          test_path = Path('scripts/verify-v112-multiplayer-restart.mjs')
          test_text = test_path.read_text()
          test_text = test_text.replace('}, before, { timeout: 30_000 });', '}, before, { timeout: 90_000 });')
          test_path.write_text(test_text)
          PY
      - name: Start local game server
        run: |
          python3 -m http.server 8765 > /tmp/yakolak-v112-http-${{ matrix.profile }}.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/version.json && exit 0
            sleep 1
          done
          cat /tmp/yakolak-v112-http-${{ matrix.profile }}.log
          exit 1
      - name: Run multiplayer and restart verification
        env:
          YAKOLAK_PROFILE: ${{ matrix.profile }}
        run: |
          set +e
          node scripts/verify-v112-multiplayer-restart.mjs > /tmp/yakolak-v112-${{ matrix.profile }}.log 2>&1
          status=$?
          cat /tmp/yakolak-v112-${{ matrix.profile }}.log
          exit $status
      - name: Upload multiplayer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v112-multiplayer-${{ matrix.profile }}
          path: |
            docs/screenshots/v112/${{ matrix.profile }}-3-players-after-cycle.png
            docs/screenshots/v112/${{ matrix.profile }}-4-players-after-cycle.png
            docs/screenshots/v112/${{ matrix.profile }}-after-win-restart.png
            /tmp/v112-multiplayer-${{ matrix.profile }}-results.json
            /tmp/yakolak-v112-${{ matrix.profile }}.log
            /tmp/yakolak-v112-http-${{ matrix.profile }}.log
          retention-days: 3
          if-no-files-found: warn
