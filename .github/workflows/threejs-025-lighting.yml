name: THREEJS-025 minimal lighting verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'web/app/scene/lighting-rig.js'
      - 'web/app/scene/preview-scene.js'
      - 'web/app/boot/boot.js'
      - 'web/app/materials/canonical-materials.js'
      - 'YAKOLAK_PORTABLE_KIT/assets/reference/approved-contract.json'
      - 'docs/threejs-baseline/**'
      - 'scripts/verify-threejs-lighting.mjs'
      - 'scripts/verify-threejs-lighting-browser.mjs'
      - 'scripts/verify-threejs-shell.sh'
      - 'tests/threejs_lighting_contract.test.mjs'
      - '.github/workflows/threejs-025-lighting.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify lighting provenance and minimality
        run: node scripts/verify-threejs-lighting.mjs

      - name: Run THREEJS-025 contract test
        run: node --test tests/threejs_lighting_contract.test.mjs

      - name: Run shared shell gate
        run: bash scripts/verify-threejs-shell.sh

      - name: Install browser verifier only
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare verified runtime assets
        run: node scripts/prepare-threejs-runtime-assets.mjs

      - name: Expose frozen baseline screenshots to local verifier
        run: |
          rm -f web/__baseline
          ln -s ../docs/threejs-baseline/screenshots web/__baseline

      - name: Serve static web source
        shell: bash
        run: |
          python3 -m http.server 4173 --directory web > /tmp/threejs-025-http.log 2>&1 &
          echo $! > /tmp/threejs-025-http.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/threejs-025-http.log
          exit 1

      - name: Verify baseline-tuned lighting and mobile cost in Chromium
        run: node scripts/verify-threejs-lighting-browser.mjs
