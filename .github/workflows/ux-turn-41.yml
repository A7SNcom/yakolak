name: UX-TURN-41 mobile portrait turn clarity gate

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/gameplay_turn_transition_stale_safe.gd'
      - 'tests/ux_turn_41_mobile_portrait.spec.js'
      - '.github/workflows/ux-turn-41.yml'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-turn-41-${{ contains(github.event.head_commit.message || '', '[web-ready]') && 'production' || 'source' }}
  cancel-in-progress: true

jobs:
  source-mobile-portrait:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          test "$(git hash-object assets/fonts/thmanyahsans-Regular.otf)" = "ca891297805da60b4b4e6d3a6f02cd7c0f2f33b7"
          test "$(git hash-object assets/fonts/thmanyahsans-Light.otf)" = "aebd416113380e9e96bbe9bfbc5c4a008b2f7b67"
          test "$(git hash-object assets/fonts/thmanyahsans-Medium.otf)" = "87fdec346be83a9dcc9eed5ea8aa04cc5a87faef"
          test "$(git hash-object assets/fonts/thmanyahsans-Bold.otf)" = "349937a73e14f681a3d4cb95e966aa7cec35bcc3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate UX-TURN-41 source
        run: |
          node --check tests/ux_turn_41_mobile_portrait.spec.js
          grep -q "func _layout_quick_menu" scripts/gameplay_turn_transition_stale_safe.gd
          grep -q "48px-min" scripts/gameplay_turn_transition_stale_safe.gd
          grep -q "overlay-only-no-projection-change" scripts/gameplay_turn_transition_stale_safe.gd

      - name: Install build dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: ux-turn-41-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            ux-turn-41-godot-4.7.1-
            yakolak-godot-4.7.1-

      - name: Build latest main Web artifact
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run P1-P4 and reconnect portrait matrix
        env:
          YAKOLAK_UX_TURN_41_LABEL: source
        run: |
          set -o pipefail
          node tests/web_test_server.mjs >/tmp/yakolak-ux-turn-41.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/ux_turn_41_mobile_portrait.spec.js --workers=1 --reporter=github 2>&1 | tee /tmp/yakolak-ux-turn-41-playwright.log

      - name: Upload UX-TURN-41 source screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-41-source-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ux-turn-41/*.png
            /tmp/yakolak-ux-turn-41.log
            /tmp/yakolak-ux-turn-41-playwright.log

  production-mobile-portrait:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message || '', '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for canonical Production to serve this tested Web artifact
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum web/index.pck | awk '{print $1}')"
          for attempt in $(seq 1 24); do
            if curl -L --fail --silent --show-error -o /tmp/yakolak-production.pck "https://yakolak.vercel.app/index.pck?ux-turn-41=${GITHUB_SHA}-${attempt}"; then
              ACTUAL="$(sha256sum /tmp/yakolak-production.pck | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Canonical Production matches tested web/index.pck."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 24 ]; then sleep 5; fi
          done
          echo "::error::Canonical Production never matched this web-ready artifact."
          exit 1

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Re-run P1-P4 and reconnect on canonical Production
        env:
          YAKOLAK_UX_TURN_41_BASE_URL: https://yakolak.vercel.app
          YAKOLAK_UX_TURN_41_LABEL: production
        run: |
          set -o pipefail
          npx playwright test tests/ux_turn_41_mobile_portrait.spec.js --workers=1 --reporter=github 2>&1 | tee /tmp/yakolak-ux-turn-41-production.log

      - name: Upload UX-TURN-41 Production screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-41-production-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ux-turn-41/*.png
            /tmp/yakolak-ux-turn-41-production.log
