name: Recover Vercel v092

on:
  push:
    branches:
      - agent/recover-vercel-v092
    paths:
      - .github/workflows/recover-vercel-v092.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-vercel-v092
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/recover-vercel-v092
          fetch-depth: 0

      - name: Download exact production files
        shell: bash
        run: |
          set -euo pipefail
          base='https://yakolak.vercel.app'
          mkdir -p src assets/models assets/fonts docs/recovery

          fetch() {
            local remote="$1"
            local local_path="$2"
            echo "Recovering ${remote} -> ${local_path}"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "${base}/${remote}?recovery=92" -o "${local_path}"
            test -s "${local_path}"
          }

          fetch 'index.html' 'index.html'
          fetch 'app.js' 'app.js'
          fetch 'version.json' 'version.json'
          fetch 'src/app-game-v085.js' 'src/app-game-v085.js'
          fetch 'assets/models/table.svg' 'assets/models/table.svg'
          fetch 'assets/models/9.stl' 'assets/models/9.stl'
          fetch 'assets/models/3.stl' 'assets/models/3.stl'
          fetch 'assets/models/l.stl' 'assets/models/l.stl'
          fetch 'assets/models/m.stl' 'assets/models/m.stl'
          fetch 'assets/models/s.stl' 'assets/models/s.stl'
          fetch 'assets/models/p.stl' 'assets/models/p.stl'
          fetch 'assets/models/Mars%20Angled%20Stump%20Side%20Table%2030x30x45_Albedo.png' 'assets/models/Mars Angled Stump Side Table 30x30x45_Albedo.png'
          fetch 'assets/models/Mars%20Angled%20Stump%20Side%20Table%2030x30x45_Normal.png' 'assets/models/Mars Angled Stump Side Table 30x30x45_Normal.png'
          fetch 'assets/models/Mars%20Angled%20Stump%20Side%20Table%2030x30x45_Roughness.png' 'assets/models/Mars Angled Stump Side Table 30x30x45_Roughness.png'
          fetch 'assets/fonts/expo-arabic-medium.ttf' 'assets/fonts/expo-arabic-medium.ttf'

      - name: Validate recovered production
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const BUILD='92'" index.html
          grep -Fq "const BUILD='92'" app.js
          grep -Fq "app-game-v085.js" app.js
          grep -Fq "const BUILD='92'" src/app-game-v085.js
          grep -Fq '"build": 92' version.json
          grep -Fq 'table.svg' src/app-game-v085.js
          grep -Fq 'p.stl' <(printf '%s\n' "$(grep -o "load('p'" src/app-game-v085.js | head -n 1)")
          test "$(wc -c < src/app-game-v085.js)" -gt 50000
          test "$(wc -c < assets/fonts/expo-arabic-medium.ttf)" -gt 10000
          test "$(wc -c < assets/models/p.stl)" -gt 1000

      - name: Write recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Vercel v092 recovery manifest'
            echo
            echo '- Production source: https://yakolak.vercel.app'
            echo '- Deployment: dpl_3uSu9BkMcig1CM3TX2UDmrHGMJCY'
            echo '- Production metadata commit: a21d412642f077e7e8b25c1a04875ab0027e2656 with dirty local files'
            echo '- Recovered branch: agent/recover-vercel-v092'
            echo "- Recovered at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo '## SHA-256 checksums'
            echo
            echo '```text'
            sha256sum \
              index.html app.js version.json src/app-game-v085.js \
              assets/models/table.svg assets/models/9.stl assets/models/3.stl \
              assets/models/l.stl assets/models/m.stl assets/models/s.stl \
              assets/models/p.stl assets/fonts/expo-arabic-medium.ttf \
              assets/models/'Mars Angled Stump Side Table 30x30x45_Albedo.png' \
              assets/models/'Mars Angled Stump Side Table 30x30x45_Normal.png' \
              assets/models/'Mars Angled Stump Side Table 30x30x45_Roughness.png'
            echo '```'
          } > docs/recovery/VERCEL_V092_RECOVERY.md

      - name: Commit recovered files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js version.json src/app-game-v085.js \
            assets/models assets/fonts docs/recovery/VERCEL_V092_RECOVERY.md
          if git diff --cached --quiet; then
            echo 'Recovery branch is already synchronized.'
            exit 0
          fi
          git commit -m 'Recover exact Vercel v092 production files'
          git push origin HEAD:agent/recover-vercel-v092
