name: Patch v093 screenshot animation behavior

on:
  push:
    branches:
      - feature/v093-visual-mobile
    paths:
      - .github/workflows/patch-v093-animation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v093-visual-mobile
          fetch-depth: 0

      - name: Keep game animations active during screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/verify-v093.mjs')
          s=p.read_text()
          old="await page.screenshot({ path, timeout: 120_000, animations: 'disabled' });"
          new="await page.screenshot({ path, timeout: 120_000 });"
          if s.count(old)!=1:
              raise SystemExit(f'expected one screenshot helper, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          node --check tests/e2e/verify-v093.mjs

      - name: Commit animation-safe screenshots
        run: |
          rm -f .github/workflows/patch-v093-animation.yml
          git config user.name "yakolak-agent"
          git config user.email "ahmad.bn.kamal@gmail.com"
          git add -A
          git commit -m "Keep tutorial animation active during v093 screenshots"
          git push origin HEAD:feature/v093-visual-mobile
