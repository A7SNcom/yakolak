name: THREEJS-024 canonical material verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'YAKOLAK_PORTABLE_KIT/assets/reference/approved-contract.json'
      - 'web/app/data/runtime-data.js'
      - 'web/app/materials/**'
      - 'web/app/boot/boot.js'
      - 'web/app/scene/player-bases.js'
      - 'web/app/scene/table-and-score.js'
      - 'web/app/scene/lighting-rig.js'
      - 'scripts/verify-threejs-materials.mjs'
      - 'scripts/verify-threejs-materials-browser.mjs'
      - 'scripts/verify-threejs-lighting.mjs'
      - 'scripts/verify-threejs-shell.sh'
      - 'tests/threejs_materials_contract.test.mjs'
      - 'tests/threejs_asset_runtime_copies_contract.test.mjs'
      - 'tests/threejs_lighting_contract.test.mjs'
      - '.github/workflows/threejs-024-materials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify canonical material provenance and accessibility
        run: node scripts/verify-threejs-materials.mjs
      - name: Run THREEJS-024 contract test
        run: node --test tests/threejs_materials_contract.test.mjs
      - name: Run shared shell gate
        run: bash scripts/verify-threejs-shell.sh
      - name: Install browser verifier only
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare verified runtime assets
        run: node scripts/prepare-threejs-runtime-assets.mjs
      - name: Serve static web source
        shell: bash
        run: |
          python3 -m http.server 4173 --directory web > /tmp/threejs-024-http.log 2>&1 &
          echo $! > /tmp/threejs-024-http.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/threejs-024-http.log
          exit 1
      - name: Verify canonical materials in Chromium
        run: node scripts/verify-threejs-materials-browser.mjs
