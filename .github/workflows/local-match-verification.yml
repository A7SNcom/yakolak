name: YAKOLAK Local Match Verification

on:
  push:
    branches:
      - agent/yakolak-3.0-local-match
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: yakolak-local-match-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-mobile-and-desktop:
    name: Full match on mobile and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and run all gameplay verification
        run: bash scripts/vercel-build.sh

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-local-match-evidence
          if-no-files-found: warn
          path: |
            web/intro-mobile-motion.png
            web/intro-mobile-final.png
            web/intro-desktop-motion.png
            web/gameplay-mobile-selected.png
            web/gameplay-mobile-placed.png
            web/local-match-round-win.png
            web/local-match-desktop-round-win.png
            test-results/
