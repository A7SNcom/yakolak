name: YAKOLAK mobile touch quality

on:
  push:
    branches:
      - main
    paths:
      - scripts/gameplay_touch_targets.gd
      - scenes/intro.tscn
      - tests/mobile_touch_targets_smoke.spec.js
      - .github/workflows/mobile-touch-quality.yml
  workflow_dispatch:

concurrency:
  group: yakolak-mobile-touch-quality
  cancel-in-progress: true

jobs:
  touch-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install production build dependencies
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-
      - name: Build latest web version online
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: |
          rm -rf .godot/exported
          bash scripts/vercel-fast-build.sh
      - name: Install focused browser runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure mobile touch quality before and after
        run: |
          python3 -m http.server 8000 --directory web >/tmp/yakolak-touch-quality.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi; sleep 0.25; done
          npx playwright test tests/mobile_touch_targets_smoke.spec.js --workers=1 --reporter=github
