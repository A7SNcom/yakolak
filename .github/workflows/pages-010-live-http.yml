name: PAGES-010 Live Pages HTTP Probe

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - .github/workflows/pages-010-live-http.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Three.js candidate
        uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          fetch-depth: 1

      - name: Verify real deployed file types, cache, imports, refresh, and 404
        shell: bash
        env:
          BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          last_header() {
            local file="$1" name="$2"
            awk -v key="$name" 'BEGIN{IGNORECASE=1} index(tolower($0),tolower(key) ":")==1 {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); v=$0} END{print v}' "$file"
          }

          probe() {
            local name="$1" rel="$2"
            local url="${BASE_URL}${rel}"
            local gh="$tmp/${name}.get.h" hh="$tmp/${name}.head.h" body="$tmp/${name}.body"
            local gs hs ct cc et lm ar len sha
            gs="$(curl --silent --show-error --location --dump-header "$gh" --output "$body" --write-out '%{http_code}' "$url")"
            hs="$(curl --silent --show-error --location --head --dump-header "$hh" --output /dev/null --write-out '%{http_code}' "$url")"
            ct="$(last_header "$gh" content-type)"
            cc="$(last_header "$gh" cache-control)"
            et="$(last_header "$gh" etag)"
            lm="$(last_header "$gh" last-modified)"
            ar="$(last_header "$gh" accept-ranges)"
            len="$(last_header "$gh" content-length)"
            sha="$(sha256sum "$body" | awk '{print $1}')"
            printf 'PAGES010_RESULT|%s|GET=%s|HEAD=%s|CT=%s|CC=%s|ETAG=%s|LM=%s|AR=%s|LEN=%s|SHA256=%s|URL=%s\n' \
              "$name" "$gs" "$hs" "$ct" "$cc" "$et" "$lm" "$ar" "$len" "$sha" "$url"
            test "$gs" = 200
            test "$hs" = 200
          }

          probe index ''
          probe module 'app/boot/boot.js'
          probe css 'styles/app.css'
          probe runtime_config 'runtime-config.json'
          probe glb 'assets/models/board-and-lid.glb?v=9a7e3410f641735e08a2944efa366cca2a66ee99'
          probe svg_logo 'runtime-assets/logos/YAKOLAK.svg?v=ee3703615cd42c4979a0001f1261014f108c6956'
          probe png 'runtime-assets/table/albedo.png?v=4a0a43903e308d1443eb4ae735e22ceb908af0c6'
          probe manifest_json 'runtime-assets/layout/world-layout.json?v=03c7b0be0ade8360897a681127aab8caf1bc2248'
          probe manifest_csv 'runtime-assets/layout/intro-scatter.csv?v=429265cd6a5c5474bdfa75c811963c743a057bd8'
          probe manifest_md 'runtime-assets/room/ROOM.md?v=408382524358e1347427c8e5b956a682b9ac5d63'
          probe manifest_svg 'runtime-assets/table/table.svg?v=1591a82d2f3498f25a566f650b4f2d7f9787b1e9'

          # Source-of-truth audit: there is no packaged font or audio request today.
          if grep -RniE '@font-face|url\([^)]*\.(woff2?|ttf|otf)([?#][^)]*)?' web --include='*.css' --include='*.html' --include='*.js'; then
            echo 'PAGES010_FONT_ASSETS|present'
          else
            echo 'PAGES010_FONT_ASSETS|none|CSS uses named/system fallbacks only; no font file is requested'
          fi
          if grep -niE '\.(mp3|ogg|oga|wav|m4a|aac|opus)([?#"'"'']|$)' web/app/assets/asset-manifest.js; then
            echo 'PAGES010_AUDIO_ASSETS|present'
          else
            echo 'PAGES010_AUDIO_ASSETS|none|runtime manifest references no audio file format'
          fi

          # Verify every static/dynamic local module specifier resolves in source, then GET the same deployed URLs.
          node <<'NODE' > "$tmp/imports.txt"
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('web');
          const files = [];
          const walk = (dir) => {
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) walk(p);
              else if (e.isFile() && p.endsWith('.js') && p.includes(`${path.sep}app${path.sep}`)) files.push(p);
            }
          };
          walk(path.join(root, 'app'));
          const specs = new Set();
          const rx = /(?:import|export)\s+(?:[^'";]*?\s+from\s*)?['"]([^'"]+)['"]|import\s*\(\s*['"]([^'"]+)['"]\s*\)/g;
          for (const f of files) {
            const text = fs.readFileSync(f, 'utf8');
            let m;
            while ((m = rx.exec(text))) {
              const s = m[1] || m[2];
              let target;
              if (s.startsWith('.')) target = path.resolve(path.dirname(f), s);
              else if (s === 'three') target = path.join(root, 'vendor/three/r185/three.module.js');
              else if (s.startsWith('three/addons/')) target = path.join(root, 'vendor/three/r185/addons', s.slice('three/addons/'.length));
              else continue;
              if (!fs.existsSync(target) || !fs.statSync(target).isFile()) {
                console.error(`BROKEN_IMPORT ${path.relative(root,f)} -> ${s} -> ${path.relative(root,target)}`);
                process.exitCode = 1;
              }
              specs.add(path.relative(root, target).split(path.sep).join('/'));
            }
          }
          for (const s of [...specs].sort()) console.log(s);
          NODE

          import_count=0
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${BASE_URL}${rel}")"
            test "$code" = 200
            import_count=$((import_count + 1))
          done < "$tmp/imports.txt"
          echo "PAGES010_IMPORTS|resolved_and_deployed=${import_count}"

          # Query refresh: exact same resource bytes under a harmless query string.
          curl -fsSL "${BASE_URL}app/boot/boot.js" -o "$tmp/plain.js"
          curl -fsSL "${BASE_URL}app/boot/boot.js?pages010=a896ac4f903fd066ecbee2af8f7962433332fb9e" -o "$tmp/query.js"
          cmp "$tmp/plain.js" "$tmp/query.js"
          echo "PAGES010_QUERY_REFRESH|status=200|bytes=identical"

          # URL fragments are client-side only and are not sent in HTTP requests; curl must receive identical bytes.
          curl -fsSL "${BASE_URL}app/boot/boot.js#pages010" -o "$tmp/hash.js"
          cmp "$tmp/plain.js" "$tmp/hash.js"
          echo "PAGES010_HASH_REFRESH|status=200|bytes=identical|fragment_not_server_visible"

          # Record conditional behavior using observed validators from the representative module.
          curl -fsSL -D "$tmp/module.h" "${BASE_URL}app/boot/boot.js" -o /dev/null
          etag="$(last_header "$tmp/module.h" etag)"
          lm="$(last_header "$tmp/module.h" last-modified)"
          if [ -n "$etag" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "${BASE_URL}app/boot/boot.js")"
            echo "PAGES010_REVALIDATE_ETAG|status=${code}|etag=${etag}"
          else
            echo 'PAGES010_REVALIDATE_ETAG|validator=absent'
          fi
          if [ -n "$lm" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "If-Modified-Since: $lm" "${BASE_URL}app/boot/boot.js")"
            echo "PAGES010_REVALIDATE_LM|status=${code}|last_modified=${lm}"
          else
            echo 'PAGES010_REVALIDATE_LM|validator=absent'
          fi

          # No SPA rewrite contract: a missing path must stay missing.
          missing="${BASE_URL}__pages010_missing_552c3244__.js"
          miss_get="$(curl -sS -L -o "$tmp/missing.body" -D "$tmp/missing.h" -w '%{http_code}' "$missing")"
          miss_head="$(curl -sS -L -I -o /dev/null -D "$tmp/missing-head.h" -w '%{http_code}' "$missing")"
          echo "PAGES010_404|GET=${miss_get}|HEAD=${miss_head}|CT=$(last_header "$tmp/missing.h" content-type)|URL=${missing}"
          test "$miss_get" = 404
          test "$miss_head" = 404

          # The real loader performs ordinary full GET fetches and sets no Range header. Do not synthesize a Range matrix.
          if grep -nE 'Range|range:' web/app/assets/asset-manager.js web/app/assets/glb-components.js; then
            echo 'Unexpected Range-specific loader code found.' >&2
            exit 1
          fi
          grep -Fq "fetchImpl(asset.runtime.url, { signal, credentials: 'same-origin', cache: 'default' })" web/app/assets/asset-manager.js
          echo 'PAGES010_RANGE|requested_by_runtime=no|probe=not_issued|full_GET_only=yes'
