name: Verify v093 visual and mobile experience
# Fast complete verification: load, tutorial, player move, bot reply, win, desktop and mobile.

on:
  push:
    branches:
      - feature/v093-visual-mobile
    paths:
      - tests/e2e/verify-v093-speed.mjs
      - .github/workflows/verify-v093.yml
  pull_request:
    branches:
      - main
    paths:
      - src/app-game-v085.js
      - config/calibration-v093.js
      - api/calibration.js
      - index.html
      - app.js
      - version.json
      - tests/e2e/verify-v093-speed.mjs
      - .github/workflows/verify-v093.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: http://127.0.0.1:4173
      ARTIFACT_DIR: artifacts/v093-speed
    steps:
      - name: Checkout v093 branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify build and gameplay invariants
        run: |
          node --check src/app-game-v085.js
          node --check api/calibration.js
          node --check config/calibration-v093.js
          node --check tests/e2e/verify-v093-speed.mjs
          node - <<'NODE'
          const fs=require('fs');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(version.build!==93) throw new Error('build is not 93');
          const game=fs.readFileSync('src/app-game-v085.js','utf8');
          for(const invariant of [
            'const D=48,R3=135',
            'const DEFAULT_TURN_SECONDS=18',
            "const SIZE_TYPES=['s','m','l']",
            'const WIN_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]',
            'const REDUCED_MOTION=',
            'commitMove(move.piece,move.zone,!REDUCED_MOTION);'
          ]) if(!game.includes(invariant)) throw new Error(`changed or missing invariant: ${invariant}`);
          NODE
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yakolak-v093-server.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:4173/version.json >/dev/null && exit 0; sleep 1; done
          cat /tmp/yakolak-v093-server.log
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run fast complete desktop and mobile test
        run: node tests/e2e/verify-v093-speed.mjs
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-v093-speed-e2e
          path: artifacts/v093-speed
          if-no-files-found: error
          retention-days: 7
