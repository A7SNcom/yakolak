name: YAKOLAK Composite Pages

on:
  # Human/direct [flash-ready] pushes can deploy immediately. Ordinary source
  # pushes are skipped here and first flow through YAKOLAK Flash Publish.
  push:
    branches:
      - main
  # GITHUB_TOKEN pushes do not recursively trigger push workflows, so completed
  # producer workflows are the reliable bridge for both Godot and Three.js.
  workflow_run:
    workflows:
      - YAKOLAK Flash Publish
      - YAKOLAK Pages Three.js Signal
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yakolak-pages-composite
  cancel-in-progress: false

jobs:
  compose:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[flash-ready]')) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           ((github.event.workflow_run.name == 'YAKOLAK Flash Publish' && github.event.workflow_run.head_branch == 'main') ||
            (github.event.workflow_run.name == 'YAKOLAK Pages Three.js Signal' && github.event.workflow_run.head_branch == 'threejs-rebuild'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      root_ready: ${{ steps.root.outputs.ready }}
      root_sha: ${{ steps.root.outputs.sha }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Checkout main history only
        uses: actions/checkout@v4
        with:
          ref: main
          path: root-history
          fetch-depth: 0

      - name: Resolve exact successful Godot flash artifact
        id: root
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIRECT_SHA: ${{ github.sha }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha=''

          if [ "${EVENT_NAME}" = 'workflow_run' ] && [ "${RUN_NAME}" = 'YAKOLAK Flash Publish' ]; then
            source_short="${RUN_SHA:0:8}"
            sha="$(git -C root-history log \
              --grep="^\[flash-ready\] publish ${source_short}$" \
              --format='%H' -n 1)"
            if [ -z "${sha}" ]; then
              echo "Flash workflow completed without a matching [flash-ready] commit for ${RUN_SHA}; no deploy."
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "${EVENT_NAME}" = 'push' ]; then
            subject="$(git -C root-history log -1 --format='%s' "${DIRECT_SHA}")"
            if [[ "${subject}" != \[flash-ready\]* ]]; then
              echo 'Ordinary main source push; Pages waits for Flash Publish.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="${DIRECT_SHA}"
          else
            sha="$(git -C root-history log --grep='^\[flash-ready\]' --format='%H' -n 1)"
            if [ -z "${sha}" ]; then
              echo 'No [flash-ready] commit exists yet; publishing remains a no-op.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          subject="$(git -C root-history log -1 --format='%s' "${sha}")"
          echo "Using Godot root ${sha}: ${subject}"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Godot flash-ready tree
        if: steps.root.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.root.outputs.sha }}
          path: godot-ready
          fetch-depth: 1

      - name: Resolve Three.js candidate ref
        if: steps.root.outputs.ready == 'true'
        id: candidate-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = 'workflow_run' ] && [ "${RUN_NAME}" = 'YAKOLAK Pages Three.js Signal' ]; then
            echo "ref=${RUN_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo 'ref=threejs-rebuild' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Three.js candidate tree
        if: steps.root.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate-ref.outputs.ref }}
          path: threejs-source
          fetch-depth: 1

      - name: Record candidate SHA
        if: steps.root.outputs.ready == 'true'
        id: candidate
        shell: bash
        run: echo "sha=$(git -C threejs-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source ownership
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s godot-ready/web/index.html
          test -s threejs-source/web/index.html

          if grep -Fq 'THREEJS REBUILD' godot-ready/web/index.html; then
            echo 'Refusing to publish: flash-ready Godot root looks like the Three.js candidate.' >&2
            exit 1
          fi
          if ! grep -Fq 'THREEJS REBUILD' threejs-source/web/index.html; then
            echo 'Refusing to publish: Three.js candidate entry is missing its rebuild marker.' >&2
            exit 1
          fi

      - name: Compose one static Pages tree
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-site
          mkdir -p pages-site
          rsync -a godot-ready/web/ pages-site/
          mkdir -p pages-site/threejs
          rsync -a threejs-source/web/ pages-site/threejs/
          touch pages-site/.nojekyll

          cmp godot-ready/web/index.html pages-site/index.html
          cmp threejs-source/web/index.html pages-site/threejs/index.html
          diff -qr --exclude=threejs --exclude=.nojekyll godot-ready/web pages-site
          diff -qr threejs-source/web pages-site/threejs

      - name: Write secret-free public Three.js runtime config
        if: steps.root.outputs.ready == 'true'
        shell: bash
        env:
          FRONTEND_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          raw_origin=''
          origin_state='absent'
          if [ -s threejs-source/backend/cloudflare/API_ORIGIN.txt ]; then
            raw_origin="$(tr -d '\r\n' < threejs-source/backend/cloudflare/API_ORIGIN.txt)"
            origin_state='configured'
          fi

          RAW_API_ORIGIN="${raw_origin}" API_ORIGIN_STATE="${origin_state}" node <<'NODE'
          const fs = require('node:fs');

          const raw = String(process.env.RAW_API_ORIGIN || '').trim();
          let apiOrigin = null;
          let apiOriginState = process.env.API_ORIGIN_STATE === 'configured' ? 'configured' : 'absent';

          if (raw) {
            let url = null;
            try { url = new URL(raw); } catch {}
            const valid = url
              && url.protocol === 'https:'
              && !url.username
              && !url.password
              && url.pathname === '/'
              && !url.search
              && !url.hash
              && !/(^|\.)vercel\.app$/i.test(url.hostname);
            if (valid) apiOrigin = url.origin;
            else apiOriginState = 'invalid';
          }

          const config = {
            frontendSha: process.env.FRONTEND_SHA,
            protocolVersion: '1',
            apiOrigin,
            environment: 'production',
            branch: 'threejs-rebuild',
            apiOriginState,
          };
          fs.writeFileSync('pages-site/threejs/runtime-config.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

          cat pages-site/threejs/runtime-config.json

      - name: Verify artifact structure and secrecy
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-site/index.html
          test -s pages-site/threejs/index.html
          test -s pages-site/threejs/runtime-config.json
          test ! -e pages-site/.git
          test ! -e pages-site/.github

          if find pages-site -type l -print -quit | grep -q .; then
            echo 'Refusing to publish symbolic links.' >&2
            exit 1
          fi
          if find pages-site -type f -links +1 -print -quit | grep -q .; then
            echo 'Refusing to publish hard-linked files.' >&2
            exit 1
          fi

          leaked_paths="$(find pages-site -type f \
            \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \
               -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa*' -o -name 'id_ed25519*' \) -print)"
          if [ -n "${leaked_paths}" ]; then
            echo 'Refusing to publish secret-shaped files:' >&2
            printf '%s\n' "${leaked_paths}" >&2
            exit 1
          fi

          if grep -RIlE --exclude='*.pck' --exclude='*.wasm' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
            'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' pages-site \
            | grep -q .; then
            echo 'Refusing to publish content matching private-key/token signatures.' >&2
            exit 1
          fi

      - name: Enforce PAGES-009 public artifact contract
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: bash threejs-source/scripts/pages-public-artifact-scan.sh pages-site

      - name: Enforce Pages delivery and repository size guardrails
        if: steps.root.outputs.ready == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash root-history/scripts/pages-size-guard.sh pages-site

      - name: Configure GitHub Pages
        if: steps.root.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload one Pages artifact
        if: steps.root.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    if: needs.compose.outputs.root_ready == 'true'
    needs: compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy composite artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: HTTP smoke root, Three.js, and public runtime config
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FRONTEND_SHA: ${{ needs.compose.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          for attempt in $(seq 1 12); do
            root="$(curl --fail --silent --show-error --location "${base}" || true)"
            three="$(curl --fail --silent --show-error --location "${base}threejs/" || true)"
            config="$(curl --fail --silent --show-error --location "${base}threejs/runtime-config.json" || true)"
            if [ -n "${root}" ] && [ -n "${three}" ] && [ -n "${config}" ] \
               && ! grep -Fq 'THREEJS REBUILD' <<<"${root}" \
               && grep -Fq 'THREEJS REBUILD' <<<"${three}" \
               && FRONTEND_SHA="${FRONTEND_SHA}" CONFIG_JSON="${config}" node -e \
                  'const c=JSON.parse(process.env.CONFIG_JSON); if(c.frontendSha!==process.env.FRONTEND_SHA||c.protocolVersion!=="1"||!["configured","absent","invalid"].includes(c.apiOriginState)) process.exit(1)'; then
              echo "HTTP smoke passed: ${base}, ${base}threejs/, and runtime-config.json"
              exit 0
            fi
            sleep 5
          done
          echo 'HTTP smoke failed after deployment.' >&2
          exit 1
