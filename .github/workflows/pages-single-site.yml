name: YAKOLAK Pages Single Site Migration

on:
  push:
    branches:
      - main
      - threejs-rebuild
  workflow_dispatch:

# Migration invariant:
# - Pages root is assembled ONLY from main:web/ (known-good Godot artifact).
# - /threejs/ is assembled ONLY from threejs-rebuild:web/.
# - A threejs-rebuild push can refresh /threejs/ but can never source or replace root.
# - Final cutover is a separate future change that intentionally changes the root source.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yakolak-pages-single-site
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_build_type: ${{ steps.pages_mode.outputs.build_type }}
    steps:
      - name: Checkout known-good Godot root source
        uses: actions/checkout@v4
        with:
          ref: main
          path: godot-source
          fetch-depth: 1

      - name: Checkout Three.js candidate source
        uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          path: threejs-source
          fetch-depth: 1

      - name: Validate migration sources
        shell: bash
        run: |
          set -euo pipefail
          test -s godot-source/web/index.html
          test -s threejs-source/web/index.html

          if grep -Fq 'THREEJS REBUILD' godot-source/web/index.html; then
            echo 'Refusing to publish: main/web root looks like the Three.js candidate.' >&2
            exit 1
          fi

          if ! grep -Fq 'THREEJS REBUILD' threejs-source/web/index.html; then
            echo 'Refusing to publish: threejs-rebuild/web is not the expected Three.js candidate.' >&2
            exit 1
          fi

      - name: Assemble exactly one Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-site
          mkdir -p pages-site

          # Root ownership is permanently pinned to main/web during migration.
          rsync -a godot-source/web/ pages-site/

          # Candidate ownership is isolated to one subpath only.
          mkdir -p pages-site/threejs
          rsync -a threejs-source/web/ pages-site/threejs/
          touch pages-site/.nojekyll

          # Prove assembly cannot mutate root or leak the candidate outside /threejs/.
          cmp godot-source/web/index.html pages-site/index.html
          cmp threejs-source/web/index.html pages-site/threejs/index.html
          diff -qr --exclude=threejs --exclude=.nojekyll godot-source/web pages-site
          diff -qr threejs-source/web pages-site/threejs

      - name: Detect current GitHub Pages publishing mode
        id: pages_mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build_type="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            | jq -r '.build_type // "unknown"')"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages build_type=${build_type}"

      - name: Configure Pages deployment
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload the single Pages artifact
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

      - name: Preserve legacy live root until Pages is switched to Actions
        if: steps.pages_mode.outputs.build_type != 'workflow'
        shell: bash
        run: |
          echo 'Pages is still using legacy branch publishing.'
          echo 'Assembly passed, but deployment is intentionally skipped so the live root cannot be replaced accidentally.'

  deploy:
    needs: assemble
    if: needs.assemble.outputs.pages_build_type == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the single assembled Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
