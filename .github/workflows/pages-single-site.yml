name: YAKOLAK Composite Pages

on:
  # Human/direct [flash-ready] pushes can deploy immediately. Ordinary source
  # pushes are skipped here and first flow through YAKOLAK Flash Publish.
  push:
    branches:
      - main
  # GITHUB_TOKEN pushes do not recursively trigger push workflows, so completed
  # producer workflows are the reliable bridge for both Godot and Three.js.
  workflow_run:
    workflows:
      - YAKOLAK Flash Publish
      - YAKOLAK Pages Three.js Signal
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yakolak-pages-composite
  cancel-in-progress: false

env:
  PAGES_PROTOCOL_VERSION: "1"

jobs:
  compose:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[flash-ready]')) ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           ((github.event.workflow_run.name == 'YAKOLAK Flash Publish' && github.event.workflow_run.head_branch == 'main') ||
            (github.event.workflow_run.name == 'YAKOLAK Pages Three.js Signal' && github.event.workflow_run.head_branch == 'threejs-rebuild'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      root_ready: ${{ steps.root.outputs.ready }}
      root_sha: ${{ steps.root.outputs.sha }}
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      deployment_generation: ${{ steps.generation.outputs.deployment_generation }}
      public_runtime_protocol_sha256: ${{ steps.generation.outputs.public_runtime_protocol_sha256 }}
      content_identity_sha256: ${{ steps.generation.outputs.content_identity_sha256 }}
      protocol_version: ${{ steps.generation.outputs.protocol_version }}
    steps:
      - name: Checkout main history only
        uses: actions/checkout@v4
        with:
          ref: main
          path: root-history
          fetch-depth: 0

      - name: Resolve exact successful Godot flash artifact
        id: root
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIRECT_SHA: ${{ github.sha }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha=''

          if [ "${EVENT_NAME}" = 'workflow_run' ] && [ "${RUN_NAME}" = 'YAKOLAK Flash Publish' ]; then
            source_short="${RUN_SHA:0:8}"
            sha="$(git -C root-history log \
              --grep="^\[flash-ready\] publish ${source_short}$" \
              --format='%H' -n 1)"
            if [ -z "${sha}" ]; then
              echo "Flash workflow completed without a matching [flash-ready] commit for ${RUN_SHA}; no deploy."
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif [ "${EVENT_NAME}" = 'push' ]; then
            subject="$(git -C root-history log -1 --format='%s' "${DIRECT_SHA}")"
            if [[ "${subject}" != \[flash-ready\]* ]]; then
              echo 'Ordinary main source push; Pages waits for Flash Publish.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sha="${DIRECT_SHA}"
          else
            sha="$(git -C root-history log --grep='^\[flash-ready\]' --format='%H' -n 1)"
            if [ -z "${sha}" ]; then
              echo 'No [flash-ready] commit exists yet; publishing remains a no-op.'
              echo 'ready=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          subject="$(git -C root-history log -1 --format='%s' "${sha}")"
          echo "Using Godot root ${sha}: ${subject}"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Godot flash-ready tree
        if: steps.root.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.root.outputs.sha }}
          path: godot-ready
          fetch-depth: 1

      - name: Resolve Three.js candidate ref
        if: steps.root.outputs.ready == 'true'
        id: candidate-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = 'workflow_run' ] && [ "${RUN_NAME}" = 'YAKOLAK Pages Three.js Signal' ]; then
            echo "ref=${RUN_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo 'ref=threejs-rebuild' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Three.js candidate tree
        if: steps.root.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate-ref.outputs.ref }}
          path: threejs-source
          fetch-depth: 1

      - name: Record candidate SHA
        if: steps.root.outputs.ready == 'true'
        id: candidate
        shell: bash
        run: echo "sha=$(git -C threejs-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate source ownership
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s godot-ready/web/index.html
          test -s threejs-source/web/index.html

          if grep -Fq 'THREEJS REBUILD' godot-ready/web/index.html; then
            echo 'Refusing to publish: flash-ready Godot root looks like the Three.js candidate.' >&2
            exit 1
          fi
          if ! grep -Fq 'THREEJS REBUILD' threejs-source/web/index.html; then
            echo 'Refusing to publish: Three.js candidate entry is missing its rebuild marker.' >&2
            exit 1
          fi

      - name: Compose one static Pages tree
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-site
          mkdir -p pages-site
          rsync -a godot-ready/web/ pages-site/
          mkdir -p pages-site/threejs
          rsync -a threejs-source/web/ pages-site/threejs/
          touch pages-site/.nojekyll

          cmp godot-ready/web/index.html pages-site/index.html
          cmp threejs-source/web/index.html pages-site/threejs/index.html
          diff -qr --exclude=threejs --exclude=.nojekyll godot-ready/web pages-site
          diff -qr threejs-source/web pages-site/threejs

      - name: Write secret-free public Three.js runtime config
        if: steps.root.outputs.ready == 'true'
        shell: bash
        env:
          FRONTEND_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          raw_origin=''
          origin_state='absent'
          if [ -s threejs-source/backend/cloudflare/API_ORIGIN.txt ]; then
            raw_origin="$(tr -d '\r\n' < threejs-source/backend/cloudflare/API_ORIGIN.txt)"
            origin_state='configured'
          fi

          RAW_API_ORIGIN="${raw_origin}" API_ORIGIN_STATE="${origin_state}" node <<'NODE'
          const fs = require('node:fs');

          const raw = String(process.env.RAW_API_ORIGIN || '').trim();
          let apiOrigin = null;
          let apiOriginState = process.env.API_ORIGIN_STATE === 'configured' ? 'configured' : 'absent';

          if (raw) {
            let url = null;
            try { url = new URL(raw); } catch {}
            const valid = url
              && url.protocol === 'https:'
              && !url.username
              && !url.password
              && url.pathname === '/'
              && !url.search
              && !url.hash
              && !/(^|\.)vercel\.app$/i.test(url.hostname);
            if (valid) apiOrigin = url.origin;
            else apiOriginState = 'invalid';
          }

          const config = {
            frontendSha: process.env.FRONTEND_SHA,
            protocolVersion: process.env.PAGES_PROTOCOL_VERSION,
            apiOrigin,
            environment: 'production',
            branch: 'threejs-rebuild',
            apiOriginState,
          };
          fs.writeFileSync('pages-site/threejs/runtime-config.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

          cat pages-site/threejs/runtime-config.json

      - name: Define generation and publish deployment manifest
        if: steps.root.outputs.ready == 'true'
        id: generation
        shell: bash
        env:
          GODOT_ROOT_SHA: ${{ steps.root.outputs.sha }}
          THREEJS_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail

          runtime_hash="$(sha256sum pages-site/threejs/runtime-config.json | awk '{print $1}')"
          protocol_version="$(jq -r '.protocolVersion' pages-site/threejs/runtime-config.json)"
          test "${protocol_version}" = "${PAGES_PROTOCOL_VERSION}"

          manifest_tmp="$(mktemp)"
          (
            cd pages-site
            find . -type f ! -name 'deployment-manifest.json' -printf '%P\n' \
              | LC_ALL=C sort \
              | while IFS= read -r rel; do
                  digest="$(sha256sum "${rel}" | awk '{print $1}')"
                  printf '%s  %s\n' "${digest}" "${rel}"
                done
          ) > "${manifest_tmp}"
          content_identity="$(sha256sum "${manifest_tmp}" | awk '{print $1}')"

          generation_digest="$(
            printf 'pages-deployment-generation-v1\n%s\n%s\n%s\n' \
              "${GODOT_ROOT_SHA}" "${THREEJS_CANDIDATE_SHA}" "${runtime_hash}" \
              | sha256sum | awk '{print $1}'
          )"
          deployment_generation="sha256:${generation_digest}"

          jq -n \
            --arg generation "${deployment_generation}" \
            --arg godotRootSha "${GODOT_ROOT_SHA}" \
            --arg threejsCandidateSha "${THREEJS_CANDIDATE_SHA}" \
            --arg runtimeHash "${runtime_hash}" \
            --arg protocolVersion "${protocol_version}" \
            --arg contentIdentity "${content_identity}" \
            '{
              schemaVersion: 1,
              generationSchema: "pages-deployment-generation-v1",
              deploymentGeneration: $generation,
              godotRootSha: $godotRootSha,
              threejsCandidateSha: $threejsCandidateSha,
              publicRuntimeProtocol: {
                sha256: $runtimeHash,
                protocolVersion: $protocolVersion
              },
              contentIdentity: {
                algorithm: "sha256-canonical-file-manifest-v1",
                sha256: $contentIdentity,
                excludes: ["deployment-manifest.json"]
              }
            }' > pages-site/deployment-manifest.json

          jq -e \
            --arg generation "${deployment_generation}" \
            --arg root "${GODOT_ROOT_SHA}" \
            --arg candidate "${THREEJS_CANDIDATE_SHA}" \
            --arg runtime "${runtime_hash}" \
            --arg content "${content_identity}" \
            '.schemaVersion == 1 and
             .generationSchema == "pages-deployment-generation-v1" and
             .deploymentGeneration == $generation and
             .godotRootSha == $root and
             .threejsCandidateSha == $candidate and
             .publicRuntimeProtocol.sha256 == $runtime and
             .contentIdentity.sha256 == $content' \
            pages-site/deployment-manifest.json >/dev/null

          echo "deployment_generation=${deployment_generation}" >> "$GITHUB_OUTPUT"
          echo "public_runtime_protocol_sha256=${runtime_hash}" >> "$GITHUB_OUTPUT"
          echo "content_identity_sha256=${content_identity}" >> "$GITHUB_OUTPUT"
          echo "protocol_version=${protocol_version}" >> "$GITHUB_OUTPUT"
          cat pages-site/deployment-manifest.json

      - name: Verify artifact structure and secrecy
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s pages-site/index.html
          test -s pages-site/threejs/index.html
          test -s pages-site/threejs/runtime-config.json
          test -s pages-site/deployment-manifest.json
          test ! -e pages-site/.git
          test ! -e pages-site/.github

          if find pages-site -type l -print -quit | grep -q .; then
            echo 'Refusing to publish symbolic links.' >&2
            exit 1
          fi
          if find pages-site -type f -links +1 -print -quit | grep -q .; then
            echo 'Refusing to publish hard-linked files.' >&2
            exit 1
          fi

          leaked_paths="$(find pages-site -type f \
            \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \
               -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa*' -o -name 'id_ed25519*' \) -print)"
          if [ -n "${leaked_paths}" ]; then
            echo 'Refusing to publish secret-shaped files:' >&2
            printf '%s\n' "${leaked_paths}" >&2
            exit 1
          fi

          if grep -RIlE --exclude='*.pck' --exclude='*.wasm' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' \
            'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' pages-site \
            | grep -q .; then
            echo 'Refusing to publish content matching private-key/token signatures.' >&2
            exit 1
          fi

      - name: Enforce PAGES-009 public artifact contract
        if: steps.root.outputs.ready == 'true'
        shell: bash
        run: bash threejs-source/scripts/pages-public-artifact-scan.sh pages-site

      - name: Enforce Pages delivery and repository size guardrails
        if: steps.root.outputs.ready == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash root-history/scripts/pages-size-guard.sh pages-site

      - name: Configure GitHub Pages
        if: steps.root.outputs.ready == 'true'
        uses: actions/configure-pages@v5

      - name: Upload one Pages artifact
        if: steps.root.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    if: needs.compose.outputs.root_ready == 'true'
    needs: compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository for immediate supersession guard
        uses: actions/checkout@v4
        with:
          ref: main
          path: supersession-repo
          fetch-depth: 0

      - name: Re-resolve desired generation immediately before deploy
        id: desired
        shell: bash
        env:
          EXPECTED_GENERATION: ${{ needs.compose.outputs.deployment_generation }}
        run: |
          set -euo pipefail

          git -C supersession-repo fetch --quiet --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/threejs-rebuild:refs/remotes/origin/threejs-rebuild'

          desired_root="$(
            git -C supersession-repo log refs/remotes/origin/main \
              --grep='^\[flash-ready\]' --format='%H' -n 1
          )"
          desired_candidate="$(git -C supersession-repo rev-parse refs/remotes/origin/threejs-rebuild)"
          test -n "${desired_root}"
          test -n "${desired_candidate}"

          raw_origin=''
          origin_state='absent'
          if git -C supersession-repo cat-file -e "${desired_candidate}:backend/cloudflare/API_ORIGIN.txt" 2>/dev/null; then
            raw_origin="$(git -C supersession-repo show "${desired_candidate}:backend/cloudflare/API_ORIGIN.txt" | tr -d '\r\n')"
            if [ -n "${raw_origin}" ]; then
              origin_state='configured'
            fi
          fi

          FRONTEND_SHA="${desired_candidate}" RAW_API_ORIGIN="${raw_origin}" API_ORIGIN_STATE="${origin_state}" \
            node <<'NODE'
          const fs = require('node:fs');

          const raw = String(process.env.RAW_API_ORIGIN || '').trim();
          let apiOrigin = null;
          let apiOriginState = process.env.API_ORIGIN_STATE === 'configured' ? 'configured' : 'absent';

          if (raw) {
            let url = null;
            try { url = new URL(raw); } catch {}
            const valid = url
              && url.protocol === 'https:'
              && !url.username
              && !url.password
              && url.pathname === '/'
              && !url.search
              && !url.hash
              && !/(^|\.)vercel\.app$/i.test(url.hostname);
            if (valid) apiOrigin = url.origin;
            else apiOriginState = 'invalid';
          }

          const config = {
            frontendSha: process.env.FRONTEND_SHA,
            protocolVersion: process.env.PAGES_PROTOCOL_VERSION,
            apiOrigin,
            environment: 'production',
            branch: 'threejs-rebuild',
            apiOriginState,
          };
          fs.writeFileSync('/tmp/desired-runtime-config.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

          runtime_hash="$(sha256sum /tmp/desired-runtime-config.json | awk '{print $1}')"
          desired_digest="$(
            printf 'pages-deployment-generation-v1\n%s\n%s\n%s\n' \
              "${desired_root}" "${desired_candidate}" "${runtime_hash}" \
              | sha256sum | awk '{print $1}'
          )"
          desired_generation="sha256:${desired_digest}"

          echo "desired_root_sha=${desired_root}" >> "$GITHUB_OUTPUT"
          echo "desired_candidate_sha=${desired_candidate}" >> "$GITHUB_OUTPUT"
          echo "desired_runtime_hash=${runtime_hash}" >> "$GITHUB_OUTPUT"
          echo "desired_generation=${desired_generation}" >> "$GITHUB_OUTPUT"

          if [ "${desired_generation}" != "${EXPECTED_GENERATION}" ]; then
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo "::notice title=PAGES-014 SUPERSEDED::Composed ${EXPECTED_GENERATION}; desired is now ${desired_generation}. Stale artifact will not be deployed."
            exit 0
          fi

          echo 'deploy=true' >> "$GITHUB_OUTPUT"
          echo "Generation is still desired immediately before deploy: ${desired_generation}"

      - name: Finish superseded run without deployment
        if: steps.desired.outputs.deploy != 'true'
        shell: bash
        run: |
          echo "PAGES-014 result: SUPERSEDED"
          echo "No deploy-pages call was made; a newer desired input exists."

      - name: Deploy composite artifact
        if: steps.desired.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Poll successful GitHub Pages deployment status
        if: steps.desired.outputs.deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BUILD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            status="$(
              gh api \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${GITHUB_REPOSITORY}/pages/deployments/${PAGES_BUILD_VERSION}" \
                --jq '.status' 2>/dev/null || true
            )"

            case "${status}" in
              succeed)
                echo "Pages deployment reports succeed for build version ${PAGES_BUILD_VERSION}."
                exit 0
                ;;
              deployment_failed|deployment_perms_error|deployment_content_failed|deployment_cancelled|deployment_lost)
                echo "Pages deployment reached terminal failure status: ${status}" >&2
                exit 1
                ;;
              *)
                echo "Pages deployment not ready yet (attempt ${attempt}, status=${status:-not-found}); waiting."
                sleep 5
                ;;
            esac
          done

          echo 'Pages deployment never reached succeed state within the readiness window.' >&2
          exit 1

      - name: Poll live manifest with cache revalidation and prove generation
        if: steps.desired.outputs.deploy == 'true'
        id: live
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_GENERATION: ${{ needs.compose.outputs.deployment_generation }}
          EXPECTED_ROOT_SHA: ${{ needs.compose.outputs.root_sha }}
          EXPECTED_CANDIDATE_SHA: ${{ needs.compose.outputs.candidate_sha }}
          EXPECTED_RUNTIME_HASH: ${{ needs.compose.outputs.public_runtime_protocol_sha256 }}
          EXPECTED_CONTENT_IDENTITY: ${{ needs.compose.outputs.content_identity_sha256 }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          final_observation=''

          for attempt in $(seq 1 36); do
            url="${base}deployment-manifest.json?generation=${EXPECTED_GENERATION#sha256:}&run=${GITHUB_RUN_ID}&attempt=${attempt}"
            code="$(
              curl --silent --show-error --location \
                --header 'Cache-Control: no-cache, max-age=0' \
                --header 'Pragma: no-cache' \
                --output live-deployment-manifest.json \
                --write-out '%{http_code}' \
                "${url}" || true
            )"

            if [ "${code}" = '200' ] && jq -e . live-deployment-manifest.json >/dev/null 2>&1; then
              observed="$(jq -r '.deploymentGeneration // ""' live-deployment-manifest.json)"
              final_observation="${observed}"
              if jq -e \
                --arg generation "${EXPECTED_GENERATION}" \
                --arg root "${EXPECTED_ROOT_SHA}" \
                --arg candidate "${EXPECTED_CANDIDATE_SHA}" \
                --arg runtime "${EXPECTED_RUNTIME_HASH}" \
                --arg content "${EXPECTED_CONTENT_IDENTITY}" \
                '.schemaVersion == 1 and
                 .generationSchema == "pages-deployment-generation-v1" and
                 .deploymentGeneration == $generation and
                 .godotRootSha == $root and
                 .threejsCandidateSha == $candidate and
                 .publicRuntimeProtocol.sha256 == $runtime and
                 .contentIdentity.sha256 == $content' \
                live-deployment-manifest.json >/dev/null; then
                live_manifest_sha="$(sha256sum live-deployment-manifest.json | awk '{print $1}')"
                echo "live_manifest_sha256=${live_manifest_sha}" >> "$GITHUB_OUTPUT"
                echo "Live generation verified: ${EXPECTED_GENERATION}"
                exit 0
              fi
              echo "Public site is reachable but still serves generation ${observed:-unknown}; waiting for requested generation."
            else
              echo "Public manifest not ready yet (attempt ${attempt}, HTTP ${code:-000}); waiting."
            fi
            sleep 5
          done

          echo "Final live manifest mismatch after readiness window; expected ${EXPECTED_GENERATION}, observed ${final_observation:-unavailable}." >&2
          if [ -s live-deployment-manifest.json ]; then
            cat live-deployment-manifest.json >&2 || true
          fi
          exit 1

      - name: HTTP smoke root, Three.js, and exact public runtime config
        if: steps.desired.outputs.deploy == 'true'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          FRONTEND_SHA: ${{ needs.compose.outputs.candidate_sha }}
          EXPECTED_RUNTIME_HASH: ${{ needs.compose.outputs.public_runtime_protocol_sha256 }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}/"
          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, max-age=0' \
            --header 'Pragma: no-cache' \
            "${base}?verify=${cache_bust}" > root.html
          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, max-age=0' \
            --header 'Pragma: no-cache' \
            "${base}threejs/?verify=${cache_bust}" > three.html
          curl --fail --silent --show-error --location \
            --header 'Cache-Control: no-cache, max-age=0' \
            --header 'Pragma: no-cache' \
            "${base}threejs/runtime-config.json?verify=${cache_bust}" > runtime-config.json

          test -s root.html
          test -s three.html
          test -s runtime-config.json
          ! grep -Fq 'THREEJS REBUILD' root.html
          grep -Fq 'THREEJS REBUILD' three.html

          actual_runtime_hash="$(sha256sum runtime-config.json | awk '{print $1}')"
          test "${actual_runtime_hash}" = "${EXPECTED_RUNTIME_HASH}"

          FRONTEND_SHA="${FRONTEND_SHA}" CONFIG_JSON="$(cat runtime-config.json)" node -e \
            'const c=JSON.parse(process.env.CONFIG_JSON); if(c.frontendSha!==process.env.FRONTEND_SHA||c.protocolVersion!==process.env.PAGES_PROTOCOL_VERSION||!["configured","absent","invalid"].includes(c.apiOriginState)) process.exit(1)'

          echo "HTTP smoke passed with exact runtime hash ${EXPECTED_RUNTIME_HASH}."
