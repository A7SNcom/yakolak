name: YAKOLAK Pages Single Site Migration

on:
  # Legacy Pages currently builds from main. After every such build, re-publish the
  # guarded single artifact so the root is exactly main/web and /threejs is isolated.
  page_build:
  # A Three.js push runs the signal workflow on threejs-rebuild; workflow_run then
  # executes this publisher from the default/main context, satisfying Pages' source-branch rule.
  workflow_run:
    workflows:
      - YAKOLAK Pages Three.js Signal
    types:
      - completed
    branches:
      - threejs-rebuild
  workflow_dispatch:

# Migration invariant:
# - Pages root is assembled ONLY from main:web/ (known-good Godot artifact).
# - /threejs/ is assembled ONLY from threejs-rebuild:web/.
# - A threejs-rebuild push can refresh /threejs/ but can never source or replace root.
# - Final cutover is a separate future change that intentionally changes the root source.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yakolak-pages-single-site
  cancel-in-progress: true

jobs:
  assemble:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for an in-flight legacy Pages build
        if: github.event_name == 'page_build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_URL: ${{ github.event.build.url }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_URL}" ]; then
            echo 'page_build event did not include a build URL.' >&2
            exit 1
          fi

          for attempt in $(seq 1 90); do
            status="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${BUILD_URL}" | jq -r '.status // "unknown"')"

            case "${status}" in
              built)
                echo 'Legacy Pages build settled successfully.'
                break
                ;;
              errored)
                echo 'Legacy Pages build failed; refusing to hide that failure with a migration deploy.' >&2
                exit 1
                ;;
              *)
                if [ "${attempt}" -eq 90 ]; then
                  echo "Timed out waiting for legacy Pages build; last status=${status}." >&2
                  exit 1
                fi
                sleep 2
                ;;
            esac
          done

      - name: Checkout known-good Godot root source
        uses: actions/checkout@v4
        with:
          ref: main
          path: godot-source
          fetch-depth: 1

      - name: Checkout Three.js candidate source
        uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          path: threejs-source
          fetch-depth: 1

      - name: Validate migration sources
        shell: bash
        run: |
          set -euo pipefail
          test -s godot-source/web/index.html
          test -s threejs-source/web/index.html

          if grep -Fq 'THREEJS REBUILD' godot-source/web/index.html; then
            echo 'Refusing to publish: main/web root looks like the Three.js candidate.' >&2
            exit 1
          fi

          if ! grep -Fq 'THREEJS REBUILD' threejs-source/web/index.html; then
            echo 'Refusing to publish: threejs-rebuild/web is not the expected Three.js candidate.' >&2
            exit 1
          fi

      - name: Assemble exactly one Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages-site
          mkdir -p pages-site

          # Root ownership is pinned to main/web for the whole migration.
          rsync -a godot-source/web/ pages-site/

          # Three.js can only occupy its migration subpath.
          mkdir -p pages-site/threejs
          rsync -a threejs-source/web/ pages-site/threejs/
          touch pages-site/.nojekyll

          # Prove the candidate cannot mutate or replace anything in the root artifact.
          cmp godot-source/web/index.html pages-site/index.html
          cmp threejs-source/web/index.html pages-site/threejs/index.html
          diff -qr --exclude=threejs --exclude=.nojekyll godot-source/web pages-site
          diff -qr threejs-source/web pages-site/threejs

      - name: Upload the single Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the single assembled Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
