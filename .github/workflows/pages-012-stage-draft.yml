name: PAGES-012 Stage Exact-Byte Release Draft

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - ".github/workflows/pages-012-stage-draft.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-012-stage-draft
  cancel-in-progress: false

env:
  RELEASE_TAG: pages-archive-2026-08-17-gfbc0d15-t6b125c04
  RELEASE_TARGET_SHA: 6b125c04938330e1d6de4621e60a9f9e7757b556
  GODOT_ROOT_SHA: fbc0d15c574a40c4a9f31c96d42c2f03b424bb39
  THREEJS_CANDIDATE_SHA: 6b125c04938330e1d6de4621e60a9f9e7757b556
  SOURCE_PAGES_RUN_ID: "32030598002"
  SOURCE_PAGES_ARTIFACT_ID: "9288731607"
  PREPARED_ARTIFACT_ID: "9291854729"
  EXPECTED_COMPOSITE_SHA256: 799befc38e6dd6a86851bb62337093a1c1c863da68015d08b94f8235677efa9a

jobs:
  stage-and-publish-when-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recover and verify exact prepared release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-assets downloaded-draft prepared.zip
          mkdir -p release-assets downloaded-draft

          curl --fail --location --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT_ID}/zip" \
            --output prepared.zip
          unzip -q prepared.zip -d release-assets

          test -s release-assets/pages-composite.tar
          test -s release-assets/godot-root.tar
          test -s release-assets/threejs-candidate.tar
          test -s release-assets/ARCHIVE_SHA256SUMS
          test -s release-assets/IMMUTABLE_FACTS.json

          actual="$(sha256sum release-assets/pages-composite.tar | awk '{print $1}')"
          test "${actual}" = "${EXPECTED_COMPOSITE_SHA256}"
          (
            cd release-assets
            sha256sum -c ARCHIVE_SHA256SUMS
          )

          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${RELEASE_TARGET_SHA}" \
            --arg godot "${GODOT_ROOT_SHA}" \
            --arg three "${THREEJS_CANDIDATE_SHA}" \
            --arg digest "${EXPECTED_COMPOSITE_SHA256}" \
            '.releaseTag == $tag and
             .releaseTargetSha == $target and
             .source.godotRootSha == $godot and
             .source.threejsCandidateSha == $three and
             .archives["pages-composite.tar"].sha256 == $digest and
             .mutationPolicy == "immutable-release-bytes-never-change"' \
            release-assets/IMMUTABLE_FACTS.json >/dev/null

      - name: Create or validate draft and attach exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          release_id="$(jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' releases.json | head -n1)"

          if [ -z "${release_id}" ]; then
            cat > release-notes.md <<EOF
          Exact-byte YAKOLAK Pages archive from successful Pages run ${SOURCE_PAGES_RUN_ID}.

          Godot root source SHA: ${GODOT_ROOT_SHA}
          Three.js candidate source SHA: ${THREEJS_CANDIDATE_SHA}
          Exact deployed Pages artifact ID: ${SOURCE_PAGES_ARTIFACT_ID}
          Exact composite SHA-256: ${EXPECTED_COMPOSITE_SHA256}

          This release is intentionally staged as a draft first. It must not be published until repository release immutability is independently verified enabled. Deployment-generation and backend-compatibility evidence live only in the additive RELEASE_QUALIFICATION ledger.
          EOF

            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${RELEASE_TARGET_SHA}" \
              --title "YAKOLAK exact-byte Pages archive ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --latest=false \
              --draft

            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
            release_id="$(jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' releases.json | head -n1)"
            test -n "${release_id}"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release.json
          jq -e --arg tag "${RELEASE_TAG}" --arg target "${RELEASE_TARGET_SHA}" \
            '.tag_name == $tag and .draft == true and .immutable == false and .target_commitish == $target' \
            release.json >/dev/null || {
              echo "Existing release is not the expected mutable draft; refusing mutation." >&2
              cat release.json >&2
              exit 1
            }

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > assets.json
          for local_asset in release-assets/*; do
            name="$(basename "${local_asset}")"
            existing_id="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' assets.json | head -n1)"
            if [ -z "${existing_id}" ]; then
              gh release upload "${RELEASE_TAG}" "${local_asset}" --repo "${GITHUB_REPOSITORY}"
              gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > assets.json
            fi
          done

          for local_asset in release-assets/*; do
            name="$(basename "${local_asset}")"
            asset_id="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' assets.json | head -n1)"
            test -n "${asset_id}"
            curl --fail --location --retry 3 --retry-all-errors \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --output "downloaded-draft/${name}"
            cmp "${local_asset}" "downloaded-draft/${name}"
          done

          (
            cd downloaded-draft
            sha256sum -c ARCHIVE_SHA256SUMS
          )
          echo "Exact-byte draft staged and verified. Nothing has been published yet."

      - name: Record additive exact-draft staging evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(jq -r '.id' release.json)"
          composite_sha="$(sha256sum downloaded-draft/pages-composite.tar | awk '{print $1}')"
          test "${composite_sha}" = "${EXPECTED_COMPOSITE_SHA256}"

          record="$(jq -cn \
            --arg releaseTag "${RELEASE_TAG}" \
            --argjson releaseId "${release_id}" \
            --arg assetSha256 "${composite_sha}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,event:"draft_staged",releaseTag:$releaseTag,releaseId:$releaseId,assetName:"pages-composite.tar",assetSha256:$assetSha256,draft:true,published:false,exactDraftBytesVerified:true,workflowRunId:($workflowRunId|tonumber),recordedAt:$recordedAt}')"

          rm -rf ledger-repo
          git clone --quiet --branch threejs-rebuild "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ledger-repo
          git -C ledger-repo config user.name "github-actions[bot]"
          git -C ledger-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git -C ledger-repo fetch --quiet origin threejs-rebuild
            git -C ledger-repo reset --hard origin/threejs-rebuild >/dev/null
            if grep -Fq "\"event\":\"draft_staged\"" ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl \
              && grep -Fq "\"releaseTag\":\"${RELEASE_TAG}\"" ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl \
              && grep -Fq "\"assetSha256\":\"${composite_sha}\"" ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl; then
              echo "Exact draft staging evidence already recorded."
              exit 0
            fi
            printf '%s\n' "${record}" >> ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-repo add RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-repo commit -m "PAGES-012 record exact draft staging"
            if git -C ledger-repo push --quiet origin HEAD:threejs-rebuild; then
              echo "Exact draft staging evidence recorded."
              exit 0
            fi
          done
          echo "Could not record exact draft staging evidence." >&2
          exit 1

      - name: Verify release immutability is enabled before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/immutable-releases"
          token="${ADMIN_TOKEN:-${GH_TOKEN}}"

          check() {
            curl --silent --show-error \
              --output immutable-releases.json \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${api}"
          }

          code="$(check)"
          if [ "${code}" = "404" ] && [ -n "${ADMIN_TOKEN}" ]; then
            put_code="$(curl --silent --show-error \
              --output enable-immutable-releases.json \
              --write-out '%{http_code}' \
              --request PUT \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${api}")"
            test "${put_code}" = "204" || {
              echo "Failed to enable release immutability (HTTP ${put_code}); draft remains unpublished." >&2
              cat enable-immutable-releases.json >&2 || true
              exit 1
            }
            code="$(check)"
          fi

          if [ "${code}" != "200" ]; then
            echo "Cannot prove release immutability (HTTP ${code}); exact-byte draft remains unpublished." >&2
            echo "PAGES_RELEASE_ADMIN_TOKEN requires repository Administration read/write." >&2
            cat immutable-releases.json >&2 || true
            exit 1
          fi
          jq -e '.enabled == true' immutable-releases.json >/dev/null || {
            echo "Release immutability is disabled; draft remains unpublished." >&2
            exit 1
          }

      - name: Publish the already-verified draft exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          release_id="$(jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' releases.json | head -n1)"
          test -n "${release_id}"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release.json

          if jq -e '.immutable == true and .draft == false' release.json >/dev/null; then
            echo "Release is already immutable; no mutation performed."
            exit 0
          fi
          jq -e '.draft == true and .immutable == false' release.json >/dev/null
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Verify immutable release attestation and every exact asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 12); do
            immutable="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isImmutable --jq '.isImmutable' 2>/dev/null || true)"
            if [ "${immutable}" = "true" ] && gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}"; then
              verified=true
              break
            fi
            sleep 5
          done
          test "${verified}" = "true"

          rm -rf immutable-download
          mkdir immutable-download
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir immutable-download
          for local_asset in release-assets/*; do
            name="$(basename "${local_asset}")"
            cmp "${local_asset}" "immutable-download/${name}"
            gh release verify-asset "${RELEASE_TAG}" "${local_asset}" --repo "${GITHUB_REPOSITORY}"
            gh release verify-asset "${RELEASE_TAG}" "immutable-download/${name}" --repo "${GITHUB_REPOSITORY}"
          done
          (
            cd immutable-download
            sha256sum -c ARCHIVE_SHA256SUMS
          )

      - name: Prove immutable non-production restore and append archive qualification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf restore-proof
          mkdir -p restore-proof/site
          tar -xf immutable-download/pages-composite.tar -C restore-proof/site

          expected_content="$(jq -r '.archives["pages-composite.tar"].contentManifestSha256' immutable-download/IMMUTABLE_FACTS.json)"
          actual_content="$(cd restore-proof/site && find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r rel; do digest="$(sha256sum "${rel}" | awk '{print $1}')"; printf '%s  %s\n' "${digest}" "${rel}"; done | sha256sum | awk '{print $1}')"
          test "${actual_content}" = "${expected_content}"

          python3 -m http.server 8088 --directory restore-proof/site >/tmp/pages012-draft-http.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8088/ >/tmp/root.html \
              && curl --fail --silent http://127.0.0.1:8088/threejs/ >/tmp/three.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/root.html
          test -s /tmp/three.html
          ! grep -Fq 'THREEJS REBUILD' /tmp/root.html
          grep -Fq 'THREEJS REBUILD' /tmp/three.html

          composite_sha="$(sha256sum immutable-download/pages-composite.tar | awk '{print $1}')"
          record="$(jq -cn \
            --arg releaseTag "${RELEASE_TAG}" \
            --arg assetSha256 "${composite_sha}" \
            --arg contentManifestSha256 "${expected_content}" \
            --arg godotRootSha "${GODOT_ROOT_SHA}" \
            --arg threejsCandidateSha "${THREEJS_CANDIDATE_SHA}" \
            --arg sourcePagesRunId "${SOURCE_PAGES_RUN_ID}" \
            --arg sourcePagesArtifactId "${SOURCE_PAGES_ARTIFACT_ID}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,event:"archive_verified",releaseTag:$releaseTag,assetName:"pages-composite.tar",assetSha256:$assetSha256,contentManifestSha256:$contentManifestSha256,godotRootSha:$godotRootSha,threejsCandidateSha:$threejsCandidateSha,sourcePagesRunId:($sourcePagesRunId|tonumber),sourcePagesArtifactId:($sourcePagesArtifactId|tonumber),immutable:true,releaseAttestationVerified:true,archiveSha256Verified:true,nonProductionRestoreVerified:true,workflowRunId:($workflowRunId|tonumber),recordedAt:$recordedAt}')"

          rm -rf ledger-repo
          git clone --quiet --branch threejs-rebuild "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ledger-repo
          git -C ledger-repo config user.name "github-actions[bot]"
          git -C ledger-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4; do
            git -C ledger-repo fetch --quiet origin threejs-rebuild
            git -C ledger-repo reset --hard origin/threejs-rebuild >/dev/null
            if grep -Fq "\"releaseTag\":\"${RELEASE_TAG}\"" ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl \
              && grep -Fq "\"assetSha256\":\"${composite_sha}\"" ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl \
              && grep -Fq "\"event\":\"archive_verified\"" ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl; then
              echo "Qualification archive evidence already recorded."
              exit 0
            fi
            printf '%s\n' "${record}" >> ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-repo add RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-repo commit -m "PAGES-012 record immutable archive qualification"
            if git -C ledger-repo push --quiet origin HEAD:threejs-rebuild; then
              exit 0
            fi
          done
          exit 1
