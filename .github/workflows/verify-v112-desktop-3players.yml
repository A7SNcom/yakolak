name: Verify v112 desktop three players

on:
  push:
    branches:
      - "112"
    paths:
      - .github/workflows/verify-v112-desktop-3players.yml
  pull_request:
    paths:
      - .github/workflows/verify-v112-desktop-3players.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-three-players:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out v112
        uses: actions/checkout@v4
        with:
          ref: "112"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install visual-test runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2 three@0.165.0
          npx playwright install --with-deps chromium
      - name: Prepare deterministic visual-test page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          text = text.replace('https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js', './node_modules/three/build/three.module.js')
          text = text.replace('https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/', './node_modules/three/examples/jsm/')
          guard = """<script id="yakolakCiTurnGuard">
          setInterval(()=>{
            const state=globalThis.__yakolakGame?.state;
            if(!state?.started||state.winner||!state.players?.length)return;
            const current=state.players[state.turnIndex%state.players.length];
            if(current===state.humanColor)state.turnDeadline=Date.now()+120000;
          },100);
          </script>"""
          text = text.replace('</body>', guard + '\n</body>')
          path.write_text(text)
          PY
      - name: Start local game server
        run: |
          python3 -m http.server 8765 > /tmp/yakolak-v112-desktop-3players-http.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8765/version.json && exit 0
            sleep 1
          done
          cat /tmp/yakolak-v112-desktop-3players-http.log
          exit 1
      - name: Verify desktop three-player cycle
        env:
          YAKOLAK_PROFILE: desktop
          YAKOLAK_SCENARIO: 3players
        run: |
          set +e
          node scripts/verify-v112-multiplayer-restart.mjs > /tmp/yakolak-v112-desktop-3players.log 2>&1
          status=$?
          cat /tmp/yakolak-v112-desktop-3players.log
          exit $status
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v112-desktop-3players-final
          path: |
            docs/screenshots/v112/desktop-3-players-after-cycle.png
            /tmp/v112-desktop-3players-results.json
            /tmp/yakolak-v112-desktop-3players.log
            /tmp/yakolak-v112-desktop-3players-http.log
          retention-days: 3
          if-no-files-found: warn
