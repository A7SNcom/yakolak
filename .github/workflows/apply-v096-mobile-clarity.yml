name: Apply v096 mobile clarity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v096-mobile-clarity.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Raise mobile render clarity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          game = Path('src/app-game-v085.js')
          s = game.read_text()
          old = "const performancePixelRatio=()=>PERFORMANCE_MODE?(innerWidth<=900?.78:.9):Math.min(Math.max(devicePixelRatio||1,1),1.25);"
          new = "const performancePixelRatio=()=>PERFORMANCE_MODE?(innerWidth<=900?Math.min(Math.max(devicePixelRatio||1,1),1.1):.9):Math.min(Math.max(devicePixelRatio||1,1),1.25);"
          if old not in s:
              raise SystemExit('pixel ratio anchor missing')
          s = s.replace(old, new, 1).replace("const BUILD='95';", "const BUILD='96';", 1)
          game.write_text(s)

          app = Path('app.js')
          a = app.read_text().replace('v095 PERFORMANCE MODE', 'v096 MOBILE CLARITY').replace("const BUILD='95';", "const BUILD='96';")
          app.write_text(a)

          index = Path('index.html')
          x = index.read_text().replace('v095-performance-mode', 'v096-mobile-clarity').replace("const BUILD='95';", "const BUILD='96';")
          index.write_text(x)

          version = Path('version.json')
          v = json.loads(version.read_text())
          v.update({
              'version': 'v096-mobile-clarity',
              'build': 96,
              'updated_at': '2026-07-23',
              'note': 'Raises mobile render resolution from 0.78 to an adaptive maximum of 1.1 while preserving the low-overhead lighting and event-driven rendering optimizations.'
          })
          version.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/apply-v096-mobile-clarity.yml').unlink()
          PY
          node --check src/app-game-v085.js
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Improve v096 mobile render clarity"
          git push origin HEAD:main
