name: THREEJS-019 player base verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'YAKOLAK_PORTABLE_KIT/assets/models/player-base.stl'
      - 'YAKOLAK_PORTABLE_KIT/assets/layout/world-layout.json'
      - 'scripts/analyze-threejs-player-base.mjs'
      - 'scripts/verify-threejs-player-bases.mjs'
      - 'web/app/assets/asset-manifest.js'
      - 'web/app/assets/glb-components.js'
      - 'web/app/scene/player-bases.js'
      - 'web/assets/models/player-base.glb'
      - 'web/assets/models/player-base-layout.json'
      - 'web/assets/models/conversion-state.json'
      - 'tests/threejs_player_bases_contract.test.mjs'
      - '.github/workflows/threejs-019-player-base.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze canonical player base geometry
        run: node scripts/analyze-threejs-player-base.mjs
      - name: Verify player base transform ownership and bounds
        run: node scripts/verify-threejs-player-bases.mjs
      - name: Run THREEJS-019 contract test
        run: node --test tests/threejs_player_bases_contract.test.mjs
