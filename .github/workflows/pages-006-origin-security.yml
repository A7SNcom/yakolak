name: PAGES-006 origin and storage security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Pages origin/storage security contract
        run: node --test tests/pages_origin_storage_security.test.mjs
