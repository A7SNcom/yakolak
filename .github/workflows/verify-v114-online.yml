name: Verify v114 online and mobile foundation

on:
  push:
    branches:
      - v114-online-mobile-foundation
  pull_request:
    branches:
      - main

jobs:
  contracts-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
