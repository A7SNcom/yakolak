name: THREEJS-010 Vendor Three.js r185

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - .github/workflows/threejs-010-vendor-r185.yml

permissions:
  contents: write

concurrency:
  group: threejs-010-vendor-r185
  cancel-in-progress: false

jobs:
  vendor:
    if: github.repository == 'A7SNcom/yakolak'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Fetch and verify pinned Three.js r185
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p web/vendor/three/r185
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/mrdoob/three.js/r185/build/three.module.js \
            -o web/vendor/three/r185/three.module.js
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/mrdoob/three.js/r185/build/three.core.js \
            -o web/vendor/three/r185/three.core.js

          test "$(git hash-object web/vendor/three/r185/three.module.js)" = "ad13abf7d128bee607a7672646ca543327e258d3"
          test "$(git hash-object web/vendor/three/r185/three.core.js)" = "0bb9262cd029f411933d077fd44197a51ec5e8e9"

      - name: Commit vendored runtime once
        shell: bash
        run: |
          set -euo pipefail
          git add web/vendor/three/r185/three.module.js web/vendor/three/r185/three.core.js
          if git diff --cached --quiet; then
            echo "Three.js r185 already vendored"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "THREEJS-010 vendor Three.js r185"
          git pull --rebase origin threejs-rebuild
          git push origin HEAD:threejs-rebuild
