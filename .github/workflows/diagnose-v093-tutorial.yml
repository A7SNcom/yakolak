name: Clean temporary v093 diagnostics

on:
  push:
    branches: [feature/v093-visual-mobile]
    paths:
      - tests/e2e/diagnose-v093-tutorial.mjs
      - .github/workflows/diagnose-v093-tutorial.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v093-visual-mobile
          fetch-depth: 0
      - name: Remove temporary diagnostics in one commit
        run: |
          rm -f \
            .github/workflows/diagnose-v093-tutorial.yml \
            .github/workflows/patch-v093-reduced-motion.yml \
            .github/workflows/patch-v093-tutorial-test.yml \
            .github/workflows/verify-v093-speed.yml \
            tests/e2e/diagnose-v093-tutorial.mjs \
            tests/e2e/verify-v093.mjs
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "chore: remove temporary diagnostics and test artifacts"
          git push origin HEAD:feature/v093-visual-mobile
