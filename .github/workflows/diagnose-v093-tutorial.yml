name: Diagnose v093 tutorial sequence
# Measures tutorial transitions after the v093 rendering performance fix.

on:
  push:
    branches:
      - feature/v093-visual-mobile
    paths:
      - tests/e2e/diagnose-v093-tutorial.mjs
      - .github/workflows/diagnose-v093-tutorial.yml
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/diagnose-v093-tutorial.mjs
      - .github/workflows/diagnose-v093-tutorial.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutorial-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: http://127.0.0.1:4173
      ARTIFACT_DIR: artifacts/tutorial-diagnostic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/yakolak-v093-diagnostic.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/version.json >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Trace tutorial transitions
        run: node tests/e2e/diagnose-v093-tutorial.mjs
      - name: Upload tutorial trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-v093-tutorial-diagnostic
          path: artifacts/tutorial-diagnostic
          if-no-files-found: error
          retention-days: 7
