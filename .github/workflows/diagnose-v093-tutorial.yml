name: Diagnose v093 tutorial sequence

on:
  push:
    branches: [feature/v093-visual-mobile]
    paths:
      - .github/workflows/diagnose-v093-tutorial.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tutorial-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v093-visual-mobile
          fetch-depth: 0
      - name: Apply immediate player placement in reduced motion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-game-v085.js')
          s=p.read_text()
          old='const ok=commitMove(piece,zone.id,true);'
          new='const ok=commitMove(piece,zone.id,!REDUCED_MOTION);'
          if new not in s:
              if old not in s:
                  raise SystemExit('player placement anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check src/app-game-v085.js
          if ! git diff --quiet; then
            git config user.name yakolak-agent
            git config user.email ahmad.bn.kamal@gmail.com
            git add src/app-game-v085.js
            git commit -m "Make reduced-motion player placement immediate"
            git push origin HEAD:feature/v093-visual-mobile
          fi
