name: Verify v119 online visual evidence

on:
  pull_request:
    paths:
      - 'src/online-last-move-v119.js'
      - 'scripts/verify-v119-online-visual.mjs'
      - '.github/workflows/verify-v119-online-visual.yml'
  workflow_dispatch:

jobs:
  desktop-mobile-online:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_URL: 'https://yakolak-1b26yf9hp-ahmdkcoms-projects.vercel.app/?_vercel_share=EhtKPlf27eFXEDAzLVdlkKdVZjoxV8lq'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run real two-client online visual playtest
        run: node scripts/verify-v119-online-visual.mjs

      - name: Upload v119 online visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v119-online-visual-evidence
          path: artifacts/v119-online-visual
          if-no-files-found: warn
