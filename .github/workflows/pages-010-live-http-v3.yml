name: PAGES-010 Stable Live Pages Probe

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - .github/workflows/pages-010-live-http-v3.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          fetch-depth: 1
      - name: Probe deployed artifact
        shell: bash
        env:
          BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          header() {
            local file="$1" name="$2"
            awk -v key="$name" 'BEGIN{IGNORECASE=1} index(tolower($0),tolower(key) ":")==1 {sub(/\r$/,""); sub(/^[^:]+:[[:space:]]*/,""); v=$0} END{print v}' "$file"
          }

          ready=false
          for attempt in $(seq 1 12); do
            ic="$(curl -sS -L -o "$tmp/i" -w '%{http_code}' "$BASE_URL")"
            rc="$(curl -sS -L -o "$tmp/r" -w '%{http_code}' "${BASE_URL}runtime-config.json")"
            if [ "$ic" = 200 ] && [ "$rc" = 200 ] && grep -Fq 'THREEJS REBUILD' "$tmp/i"; then
              ready=true
              echo "PAGES010_READY|attempt=${attempt}|index=${ic}|runtime_config=${rc}"
              break
            fi
            echo "PAGES010_NOT_READY|attempt=${attempt}|index=${ic}|runtime_config=${rc}"
            sleep 5
          done
          test "$ready" = true

          probe() {
            local name="$1" rel="$2"
            local url="${BASE_URL}${rel}"
            local gh="$tmp/${name}.gh" hh="$tmp/${name}.hh" body="$tmp/${name}.body"
            local gs hs
            gs="$(curl -sS -L -D "$gh" -o "$body" -w '%{http_code}' "$url")"
            hs="$(curl -sS -L -I -D "$hh" -o /dev/null -w '%{http_code}' "$url")"
            printf 'PAGES010_RESULT|%s|GET=%s|HEAD=%s|CT=%s|CC=%s|ETAG=%s|LM=%s|AR=%s|GET_LEN=%s|HEAD_LEN=%s|SHA256=%s|URL=%s\n' \
              "$name" "$gs" "$hs" "$(header "$gh" content-type)" "$(header "$gh" cache-control)" \
              "$(header "$gh" etag)" "$(header "$gh" last-modified)" "$(header "$gh" accept-ranges)" \
              "$(wc -c < "$body" | tr -d ' ')" "$(header "$hh" content-length)" "$(sha256sum "$body" | awk '{print $1}')" "$url"
            test "$gs" = 200
            test "$hs" = 200
          }

          probe index ''
          probe module 'app/boot/boot.js'
          probe css 'styles/app.css'
          probe runtime_config 'runtime-config.json'
          probe glb_board 'assets/models/board-and-lid.glb?v=9a7e3410f641735e08a2944efa366cca2a66ee99'
          probe glb_player_base 'assets/models/player-base.glb?v=63550f0eeb7aa9c004f251fb4238d751dfd4d06c'
          probe glb_piece_small 'assets/models/piece-small.glb?v=17b911dad8ac9175fd1d29e1308db1e17d7c164b'
          probe glb_piece_medium 'assets/models/piece-medium.glb?v=9fa8ace253919968bbba40c3c3fd2f79629f1960'
          probe glb_piece_large 'assets/models/piece-large.glb?v=cbbcf94ce009240b6fe40274783317d8512be5c2'
          probe glb_score_marker 'assets/models/score-marker.glb?v=f5385f033a9ade6b195abed58bdba97aeaadb247'
          probe svg_logo 'runtime-assets/logos/YAKOLAK.svg?v=ee3703615cd42c4979a0001f1261014f108c6956'
          probe svg_table 'runtime-assets/table/table.svg?v=1591a82d2f3498f25a566f650b4f2d7f9787b1e9'
          probe png 'runtime-assets/table/albedo.png?v=4a0a43903e308d1443eb4ae735e22ceb908af0c6'
          probe json 'runtime-assets/layout/world-layout.json?v=03c7b0be0ade8360897a681127aab8caf1bc2248'
          probe csv 'runtime-assets/layout/intro-scatter.csv?v=429265cd6a5c5474bdfa75c811963c743a057bd8'
          probe markdown 'runtime-assets/room/ROOM.md?v=408382524358e1347427c8e5b956a682b9ac5d63'

          if grep -RniE '@font-face|url\([^)]*\.(woff2?|ttf|otf)([?#][^)]*)?' web --include='*.css' --include='*.html' --include='*.js'; then
            echo 'PAGES010_FONT_ASSETS|present'
            exit 1
          else
            echo 'PAGES010_FONT_ASSETS|none|no_font_file_requested'
          fi
          if grep -niE '\.(mp3|ogg|oga|wav|m4a|aac|opus)([?#"'"'']|$)' web/app/assets/asset-manifest.js; then
            echo 'PAGES010_AUDIO_ASSETS|present'
            exit 1
          else
            echo 'PAGES010_AUDIO_ASSETS|none|runtime_manifest_has_no_audio_format'
          fi

          node <<'NODE' > "$tmp/imports"
          const fs=require('node:fs'), path=require('node:path');
          const root=path.resolve('web'), files=[];
          (function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);if(e.isDirectory())walk(p);else if(e.isFile()&&p.endsWith('.js')&&p.includes(`${path.sep}app${path.sep}`))files.push(p)}})(path.join(root,'app'));
          const out=new Set();
          const rx=/(?:import|export)\s+(?:[^'";]*?\s+from\s*)?['"]([^'"]+)['"]|import\s*\(\s*['"]([^'"]+)['"]\s*\)/g;
          for(const f of files){const text=fs.readFileSync(f,'utf8');let m;while((m=rx.exec(text))){const s=m[1]||m[2];let t;if(s.startsWith('.'))t=path.resolve(path.dirname(f),s);else if(s==='three')t=path.join(root,'vendor/three/r185/three.module.js');else if(s.startsWith('three/addons/'))t=path.join(root,'vendor/three/r185/addons',s.slice(13));else continue;if(!fs.existsSync(t)||!fs.statSync(t).isFile()){console.error(`BROKEN_IMPORT ${path.relative(root,f)} -> ${s}`);process.exit(1)}out.add(path.relative(root,t).split(path.sep).join('/'))}}
          for(const p of [...out].sort())console.log(p);
          NODE
          count=0
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            code="$(curl -sS -L -o /dev/null -w '%{http_code}' "${BASE_URL}${rel}")"
            test "$code" = 200
            count=$((count+1))
          done < "$tmp/imports"
          echo "PAGES010_IMPORTS|resolved_source_and_deployed=${count}"

          curl -fsSL "${BASE_URL}app/boot/boot.js" -o "$tmp/plain"
          curl -fsSL "${BASE_URL}app/boot/boot.js?pages010=refresh" -o "$tmp/query"
          cmp "$tmp/plain" "$tmp/query"
          echo 'PAGES010_QUERY_REFRESH|GET=200|bytes=identical'
          curl -fsSL "${BASE_URL}app/boot/boot.js#pages010-refresh" -o "$tmp/hash"
          cmp "$tmp/plain" "$tmp/hash"
          echo 'PAGES010_HASH_REFRESH|GET=200|bytes=identical|fragment_not_sent_to_server'

          curl -fsSL -D "$tmp/modh" "${BASE_URL}app/boot/boot.js" -o /dev/null
          et="$(header "$tmp/modh" etag)"
          lm="$(header "$tmp/modh" last-modified)"
          if [ -n "$et" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "If-None-Match: $et" "${BASE_URL}app/boot/boot.js")"
            echo "PAGES010_REVALIDATE_ETAG|status=${code}|etag=${et}"
          else
            echo 'PAGES010_REVALIDATE_ETAG|validator=absent'
          fi
          if [ -n "$lm" ]; then
            code="$(curl -sS -o /dev/null -w '%{http_code}' -H "If-Modified-Since: $lm" "${BASE_URL}app/boot/boot.js")"
            echo "PAGES010_REVALIDATE_LM|status=${code}|last_modified=${lm}"
          else
            echo 'PAGES010_REVALIDATE_LM|validator=absent'
          fi

          missing="${BASE_URL}__pages010_missing_552c3244__.js"
          mg="$(curl -sS -L -D "$tmp/mgh" -o "$tmp/mgb" -w '%{http_code}' "$missing")"
          mh="$(curl -sS -L -I -D "$tmp/mhh" -o /dev/null -w '%{http_code}' "$missing")"
          echo "PAGES010_404|GET=${mg}|HEAD=${mh}|CT=$(header "$tmp/mgh" content-type)|CC=$(header "$tmp/mgh" cache-control)|ETAG=$(header "$tmp/mgh" etag)|LM=$(header "$tmp/mgh" last-modified)"
          test "$mg" = 404
          test "$mh" = 404

          if grep -nE 'Range|range:' web/app/assets/asset-manager.js web/app/assets/glb-components.js; then
            echo 'PAGES010_RANGE|unexpected_loader_range_code=yes'
            exit 1
          fi
          grep -Fq "fetchImpl(asset.runtime.url, { signal, credentials: 'same-origin', cache: 'default' })" web/app/assets/asset-manager.js
          echo 'PAGES010_RANGE|requested_by_runtime=no|probe=not_issued|loader=full_GET'
