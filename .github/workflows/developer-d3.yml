name: Verify Developer D3 UX

on:
  push:
    branches:
      - agent/developer-d2-workbench
  pull_request:
    paths:
      - developer.html
      - src/developer-d3.css
      - src/developer-d3.js
      - src/developer-d2-registry.js
      - api/developer-d1.js
      - api/developer-d1-workspace.js
      - api/developer-d1-comparisons.js
      - scripts/verify-developer-d3.mjs
      - scripts/visual-developer-d3.mjs
      - docs/design/developer-d3-ux-evidence.md
      - .github/workflows/developer-d3.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check D3 syntax and structure
        run: |
          node --check src/developer-d3.js
          node --check src/developer-d2-registry.js
          node --check api/developer-d1.js
          node --check api/developer-d1-workspace.js
          node --check api/developer-d1-comparisons.js
          node scripts/verify-developer-d3.mjs
      - name: Install Chromium quietly
        run: |
          npm install --no-save --silent playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start Developer D3 locally
        run: |
          python3 -m http.server 4173 > /tmp/developer-d3-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/developer.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/developer-d3-server.log
          exit 1
      - name: Run functional UX evidence suite
        run: node scripts/visual-developer-d3.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-d3-ux-evidence
          path: artifacts/developer-d3
          if-no-files-found: warn
