name: Visual Build 126 Clean Entry

on:
  push:
    branches:
      - agent/v126-clean-entry-journey
  pull_request:
    paths:
      - app.js
      - index.html
      - src/entry-v126.js
      - scripts/visual-v126.mjs
      - .github/workflows/visual-v126-clean-entry.yml

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V126_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser quietly
        run: |
          npm install --no-save --silent playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start checked-out Build 126
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/v126-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/version.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v126-server.log
          exit 1
      - name: Run desktop and mobile visual verification
        run: node scripts/visual-v126.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v126-desktop-mobile-visuals
          path: artifacts/v126-visual
          if-no-files-found: warn
