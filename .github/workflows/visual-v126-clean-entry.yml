name: Visual Build 126 Clean Entry

on:
  push:
    branches:
      - agent/v126-clean-entry-journey
  pull_request:
    paths:
      - app.js
      - index.html
      - src/entry-v126.js
      - scripts/visual-v126.mjs
      - .github/workflows/visual-v126-clean-entry.yml

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V126_URL: https://yakolak-git-agent-v126-clean-entry-journey-ahmdkcoms-projects.vercel.app/?_vercel_share=Xp7Wlz935qgP52xvdskQOgJrrLSFStf2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser quietly
        run: |
          npm install --no-save --silent playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run focused visual diagnosis
        run: node scripts/visual-v126.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v126-desktop-mobile-visuals
          path: artifacts/v126-visual
          if-no-files-found: warn
