          wf=Path('.github/workflows/verify-v093.yml');w=wf.read_text().replace('Verify v093','Verify v094').replace('v093-speed','v094-speed').replace("version.build!==93","version.build!==94").replace("build is not 93","build is not 94");wf.write_text(w)
          Path('.github/workflows/apply-v094-tutorial.yml').unlink()
