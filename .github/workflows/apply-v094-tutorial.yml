name: Apply v094 interactive tutorial

on:
  push:
    branches: [feature/v093-visual-mobile]
    paths:
      - .github/workflows/apply-v094-tutorial.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v093-visual-mobile
          fetch-depth: 0
      - name: Build comprehensive lightweight tutorial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          game=Path('src/app-game-v085.js')
          s=game.read_text()

          dialog=r'''let tutorialSkipped=false;
function ensureTutorialDialog(){
  if(document.getElementById('yakolakTutorialDialog'))return;
  if(!document.getElementById('yakolakTutorialStyle')){
    const style=el('style');style.id='yakolakTutorialStyle';style.textContent=`
      #yakolakTutorialDialog{position:fixed;inset:0;z-index:12050;display:none;align-items:flex-end;justify-content:center;padding:18px;pointer-events:none;background:linear-gradient(180deg,transparent 35%,rgba(5,10,18,.42))}
      #yakolakTutorialDialog.open{display:flex;pointer-events:auto}
      #yakolakTutorialDialog .yt-box{width:min(680px,100%);max-height:min(78vh,720px);overflow:auto;background:rgba(13,20,30,.96);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.38);backdrop-filter:blur(16px);direction:rtl}
      .yt-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}.yt-step{font-size:13px;color:#a9c7ff;background:#17243a;padding:6px 10px;border-radius:999px}.yt-title{font-size:clamp(20px,4vw,28px);font-weight:800;margin:0}.yt-text{font-size:clamp(16px,3vw,20px);line-height:1.8;color:#edf4ff;white-space:pre-line}.yt-tip{margin-top:12px;padding:12px 14px;border-radius:14px;background:#102d28;color:#c9fff1;line-height:1.7;font-size:15px}.yt-progress{height:5px;background:#273244;border-radius:99px;overflow:hidden;margin:14px 0}.yt-progress>i{display:block;height:100%;background:linear-gradient(90deg,#4cc9a4,#75a7ff);transition:width .25s}.yt-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.yt-actions button{border:0;border-radius:13px;padding:11px 17px;font:inherit;font-weight:750;cursor:pointer}.yt-ok{background:#fff;color:#101722;flex:1}.yt-repeat{background:#26364e;color:#fff}.yt-skip{background:transparent;color:#bdc9d9;border:1px solid #3a4759!important}.yt-kbd{display:inline-block;padding:2px 7px;border-radius:7px;background:#273244;color:#fff;font-size:.9em}
      @media(max-width:640px){#yakolakTutorialDialog{padding:10px;align-items:flex-end}.yt-box{border-radius:20px!important;padding:16px!important}.yt-actions button{min-height:46px}.yt-skip{order:3;width:100%}}
    `;document.head.append(style);
  }
  const dlg=el('div');dlg.id='yakolakTutorialDialog';
  const box=el('section','yt-box');
  const head=el('div','yt-head');head.append(el('h2','yt-title','تعلّم ياكلك'),el('span','yt-step','1 / 10'));box.append(head);
  box.append(el('div','yt-progress'));box.querySelector('.yt-progress').append(el('i'));
  box.append(el('div','yt-text',''));
  box.append(el('div','yt-tip',''));
  const actions=el('div','yt-actions');actions.append(el('button','yt-ok','التالي'),el('button','yt-repeat','شاهد المثال مرة أخرى'),el('button','yt-skip','تخطي والعب الآن'));box.append(actions);
  dlg.append(box);document.body.append(dlg);
}
function tutorialPrompt(step){
  ensureTutorialDialog();
  const dlg=document.getElementById('yakolakTutorialDialog');
  const title=dlg.querySelector('.yt-title'),count=dlg.querySelector('.yt-step'),msg=dlg.querySelector('.yt-text'),tip=dlg.querySelector('.yt-tip'),bar=dlg.querySelector('.yt-progress i'),ok=dlg.querySelector('.yt-ok'),repeat=dlg.querySelector('.yt-repeat'),skip=dlg.querySelector('.yt-skip');
  title.textContent=step.title||'تعلّم ياكلك';count.textContent=`${step.index} / ${step.total}`;msg.textContent=step.text||'';tip.textContent=step.tip||'';tip.hidden=!step.tip;bar.style.width=`${Math.round(step.index/step.total*100)}%`;ok.textContent=step.primary||'التالي';repeat.hidden=!step.repeat;
  dlg.classList.add('open');
  return new Promise(resolve=>{
    const cleanup=answer=>{ok.onclick=repeat.onclick=skip.onclick=null;dlg.classList.remove('open');resolve(answer)};
    ok.onclick=()=>cleanup('ok');repeat.onclick=()=>cleanup('repeat');skip.onclick=()=>cleanup('skip');
  });
}
async function tutorialCheckpoint(step,replay=null){
  while(true){
    const answer=await tutorialPrompt({...step,repeat:!!replay});
    if(answer==='skip'){tutorialSkipped=true;return false}
    if(answer==='ok')return true;
    if(replay)await replay();
  }
}'''

