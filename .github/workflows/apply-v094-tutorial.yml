    caption(skipped?'بدأت التجربة مباشرة — افتح طقمك واختر حجراً.':'أنت جاهز! افتح طقمك، اختر الحجم، ثم اضغط خانة متاحة.');
    gameState.tutorial=false;render();
  };
  const basic=[
    {index:1,total,title:'أهلًا بك في ياكلك 👋',text:'هدفك بسيط: كوّن نمط فوز قبل خصومك.\nستتعلم اللعبة خطوة بخطوة، ويمكنك التخطي والبدء فورًا في أي لحظة.',tip:'لا تحتاج حفظ كل شيء الآن؛ اللعبة ستوضح القطع والخانات المتاحة أثناء دورك.'},
    {index:2,total,title:'كيف تسير الجولة؟',text:`تلعبون بالتناوب. لونك هو ${colorName(color)}، وسيظهر دورك بوضوح. لديك 18 ثانية لكل حركة؛ إن انتهى الوقت ينتقل الدور تلقائيًا.`,tip:'راقب شريط الدور والمؤقت، وخذ قرارك مبكرًا.'},
    {index:3,total,title:'طقمك فيه 3 أحجام',text:'كل طقم يحتوي حجراً صغيرًا ووسطًا وكبيرًا. اضغط أي حجر من لونك لفتح الطقم، ثم اختر الحجم الذي تريده.',tip:'الحجم ليس أقوى أو أضعف؛ كل حجم يفتح طريقة فوز مختلفة.'},
    {index:4,total,title:'الخانات وكيف تضع الحجر',text:'بعد اختيار الحجر ستضيء الخانات الممكنة. اضغط خانة متاحة لوضعه.\nالخانة الواحدة تستطيع حمل صغير ووسط وكبير معًا، لكن لا تستطيع حمل حجرين من نفس الحجم.',tip:'إن لم تقبل الخانة حجرك، اختر خانة أخرى أو حجمًا مختلفًا.'},
    {index:5,total,title:'خطتك ودفاعك',text:'في كل دور اسأل نفسك سؤالين: هل أستطيع إكمال فوز؟ وهل يجب أن أمنع خصمي؟\nراقب آخر حجارة الخصوم، خصوصًا عندما يصبح لديهم حجران من نمط واحد.',tip:'المركز والزوايا تدخل في خطوط أكثر، لكنها ليست دائمًا أفضل حركة.'}
  ];
  for(const step of basic)if(!await tutorialCheckpoint(step)){await finish(true);return}
  const demos=[
    {index:6,total,title:'الفوز الأول: نفس الحجم على خط',text:'ضع 3 حجارة من لونك وبالحجم نفسه في صف أو عمود أو قطر.',tip:'مثال: ثلاثة أحجار كبيرة على خط واحد.',run:()=>playTutorialDemo([{color,zone:0,size:'l'},{color:o1,zone:0,size:'s'},{color,zone:1,size:'l'},{color:o2,zone:1,size:'m'},{color:o1,zone:2,size:'s'},{color,zone:2,size:'l'}],[{zone:0,size:'l'},{zone:1,size:'l'},{zone:2,size:'l'}],`${colorName(color)} يبني خطًا من الأحجار الكبيرة.`,`اكتمل خط الأحجار الكبيرة.`)},
    {index:7,total,title:'الفوز الثاني: خط متدرّج',text:'كوّن خطًا من صغير ووسط وكبير من لونك، بأي ترتيب.',tip:'يمكن أن يكون الخط أفقيًا أو عموديًا أو قطريًا.',run:()=>playTutorialDemo([{color,zone:6,size:'s'},{color:o1,zone:6,size:'l'},{color,zone:4,size:'m'},{color:o2,zone:4,size:'s'},{color:o1,zone:2,size:'m'},{color,zone:2,size:'l'}],[{zone:6,size:'s'},{zone:4,size:'m'},{zone:2,size:'l'}],`صغير ثم وسط ثم كبير على قطر واحد.`,`اكتمل الخط المتدرج.`)},
    {index:8,total,title:'الفوز الثالث: الثلاثة في خانة واحدة',text:'اجمع الصغير والوسط والكبير من لونك داخل الخانة نفسها.',tip:'هذه الخطة قوية لكنها واضحة للخصوم؛ حاول تمويه نيتك.',run:()=>playTutorialDemo([{color,zone:4,size:'s'},{color:o1,zone:3,size:'l'},{color,zone:4,size:'m'},{color:o2,zone:5,size:'s'},{color:o1,zone:1,size:'l'},{color,zone:4,size:'l'}],[{zone:4,size:'s'},{zone:4,size:'m'},{zone:4,size:'l'}],`يجمع ${colorName(color)} الأحجام الثلاثة في المركز.`,`اكتملت الأحجام الثلاثة في خانة واحدة.`)}
  ];
  for(const demo of demos){
    if(!REDUCED_MOTION)await demo.run();
    if(!await tutorialCheckpoint({...demo,primary:'فهمت، التالي'},REDUCED_MOTION?null:demo.run)){await finish(true);return}
  }
  const ending=[
    {index:9,total,title:'ماذا يحدث عند الخطأ؟',text:'لا يمكنك اللعب خارج دورك، أو استخدام حجر موضوع، أو وضع حجم فوق نفس الحجم في الخانة. اللعبة تمنع الحركة غير القانونية وتبقي دورك.',tip:'إذا لم يحدث شيء بعد الضغط، راقب الرسالة أسفل الشاشة والخانات المضيئة.'},
    {index:10,total,title:'جاهز لأول جولة 🎯',text:'افتح طقمك، اختر الحجم، ثم اختر الخانة. راقب فرص الفوز الثلاث، وامنع الخصم عند الحاجة.\nالتجربة أفضل معلّم — ابدأ الآن!',tip:'يمكنك إعادة التعليم لاحقًا من زر إعادة اللعبة.',primary:'ابدأ اللعب'}
  ];
