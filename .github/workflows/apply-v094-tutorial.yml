          test=Path('tests/e2e/verify-v093-speed.mjs')
          t=test.read_text()
          t=t.replace("const outDir=process.env.ARTIFACT_DIR||'artifacts/v093-speed';","const outDir=process.env.ARTIFACT_DIR||'artifacts/v094-speed';")
          t,n=re.subn(r"async function completeTutorial\(page,name\)\{.*?\n\}",'''async function completeTutorial(page,name){
  await page.waitForFunction(()=>globalThis.__yakolakGame.state.tutorial,null,{timeout:30000,polling:100});
  const started=Date.now(),seen=new Set();let skipAvailable=false;
  while(Date.now()-started<90000){
    const state=await page.evaluate(()=>({tutorial:globalThis.__yakolakGame.state.tutorial,open:Boolean(document.querySelector('#yakolakTutorialDialog.open .yt-ok')),text:document.querySelector('#yakolakTutorialDialog.open .yt-text')?.textContent||'',skip:Boolean(document.querySelector('#yakolakTutorialDialog.open .yt-skip'))}));
    if(!state.tutorial)break;
    if(state.skip)skipAvailable=true;
    if(state.open&&state.text&&!seen.has(state.text)){
      seen.add(state.text);await page.evaluate(()=>document.querySelector('#yakolakTutorialDialog.open .yt-ok')?.click());await page.waitForTimeout(120);
    }else await page.waitForTimeout(80);
  }
  const tutorialMs=Date.now()-started;
  assert(!await page.evaluate(()=>globalThis.__yakolakGame.state.tutorial),`${name}: tutorial did not finish`);
  assert(seen.size===10,`${name}: tutorial steps ${seen.size} ${JSON.stringify([...seen])}`);
  assert(skipAvailable,`${name}: skip button missing`);
  assert(tutorialMs<90000,`${name}: tutorial too slow ${tutorialMs}ms`);
  return{tutorialMs,prompts:seen.size,promptTexts:[...seen],skipAvailable};
}''',t,count=1,flags=re.S)
          if n!=1: raise SystemExit('test tutorial helper not replaced')
          test.write_text(t)

