  await finish(false);
}'''
          s,n=re.subn(r"async function runTutorial\(\)\{.*?\n\}\nfunction emptyBoard\(\)",run+'\nfunction emptyBoard()',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('runTutorial block not replaced')
          s=s.replace("const BUILD='93';","const BUILD='94';",1)
