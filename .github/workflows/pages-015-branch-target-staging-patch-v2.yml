name: PAGES-015 Observable Branch-Target Staging Patch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-015-branch-target-staging-patch-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Record patch run before mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg headSha "$GITHUB_SHA" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              gate: "PAGES-015",
              event: "branch_target_staging_patch_started",
              workflowRunId: ($runId|tonumber),
              triggerHeadSha: $headSha,
              qualificationEvidence: false,
              recordedAt: $recordedAt
            }
          ' > RELEASE_QUALIFICATION/PAGES015_BRANCH_TARGET_PATCH_RUN.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/PAGES015_BRANCH_TARGET_PATCH_RUN.json
          git commit -m 'PAGES-015 record branch-target staging patch run'
          git push origin HEAD:threejs-rebuild
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild

      - name: Patch helper and add regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/pages015-archive-window-entry-v2.sh')
          s = p.read_text()

          anchor = '[[ "$DEPLOYMENT_GENERATION" =~ $GENERATION ]]\n'
          if anchor not in s:
              raise SystemExit('generation validation anchor not found')
          s = s.replace(anchor, anchor + r'''

          # A mutable draft for the locked previous frontend may target one dedicated branch
          # because github.token cannot target the raw workflow-bearing candidate SHA. This
          # branch is never trusted by name: it must resolve to the exact locked candidate SHA.
          release_target_ref="${RELEASE_TARGET_REF:-}"
          if [ -z "$release_target_ref" ] && [ "${ROLE:-}" = previous ]; then
            candidate_branch="pages015-release-target-previous-${THREEJS_CANDIDATE_SHA:0:8}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${candidate_branch}" >/dev/null 2>&1; then
              release_target_ref="$candidate_branch"
            fi
          fi
          release_target="$THREEJS_CANDIDATE_SHA"
          if [ -n "$release_target_ref" ]; then
            test "${ROLE:-}" = previous || { echo 'branch release target is allowed only for previous frontend staging' >&2; exit 1; }
            [[ "$release_target_ref" =~ ^pages015-release-target-previous-[a-f0-9]{8}$ ]] || { echo 'invalid PAGES-015 release target branch name' >&2; exit 1; }
            target_ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${release_target_ref}" --jq '.object.sha')"
            test "$target_ref_sha" = "$THREEJS_CANDIDATE_SHA" || { echo 'release target branch does not resolve to the locked candidate SHA' >&2; exit 1; }
            release_target="$release_target_ref"
          fi
          ''', 1)

          old = '--target "$THREEJS_CANDIDATE_SHA"'
          if s.count(old) != 1:
              raise SystemExit(f'expected one raw release target, found {s.count(old)}')
          s = s.replace(old, '--target "$release_target"', 1)

          old = 'test "$(jq -r \' .target_commitish\' "$work/release.json")" = "$THREEJS_CANDIDATE_SHA"\n'
          if old not in s:
              old = 'test "$(jq -r \'.target_commitish\' "$work/release.json")" = "$THREEJS_CANDIDATE_SHA"\n'
          if old not in s:
              raise SystemExit('target_commitish anchor not found')
          s = s.replace(old, r'''release_target_commitish="$(jq -r '.target_commitish' "$work/release.json")"
          test "$release_target_commitish" = "$release_target" || { echo "release target mismatch: expected ${release_target}, got ${release_target_commitish}" >&2; exit 1; }
          if [ -n "$release_target_ref" ]; then
            target_ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${release_target_ref}" --jq '.object.sha')"
            test "$target_ref_sha" = "$THREEJS_CANDIDATE_SHA" || { echo 'release target branch moved after draft creation' >&2; exit 1; }
          fi
          ''', 1)

          anchor = "  immutable_api=\"https://api.github.com/repos/${GITHUB_REPOSITORY}/immutable-releases\"\n"
          if anchor not in s:
              raise SystemExit('immutable API anchor not found')
          s = s.replace(anchor, r'''  if [ -n "$release_target_ref" ]; then
            target_ref_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${release_target_ref}" --jq '.object.sha')"
            test "$target_ref_sha" = "$THREEJS_CANDIDATE_SHA" || { echo 'release target branch moved before immutable publication' >&2; exit 1; }
          fi
          ''' + anchor, 1)

          anchor = "test \"$ok\" = true || { echo 'published release did not verify as immutable/attested' >&2; exit 1; }\n"
          if anchor not in s:
              raise SystemExit('immutable verification anchor not found')
          s = s.replace(anchor, anchor + r'''

          tag_ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          tag_object_type="$(jq -r '.object.type' <<<"$tag_ref_json")"
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          case "$tag_object_type" in
            commit) published_tag_commit_sha="$tag_object_sha" ;;
            tag)
              annotated_tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}")"
              test "$(jq -r '.object.type' <<<"$annotated_tag_json")" = commit
              published_tag_commit_sha="$(jq -r '.object.sha' <<<"$annotated_tag_json")"
              ;;
            *) echo "unsupported release tag object type: ${tag_object_type}" >&2; exit 1 ;;
          esac
          test "$published_tag_commit_sha" = "$THREEJS_CANDIDATE_SHA" || { echo 'published immutable release tag does not resolve to locked candidate SHA' >&2; exit 1; }
          ''', 1)

          p.write_text(s)

          Path('tests/pages015_release_target_staging_contract.test.mjs').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFileSync } from "node:fs";\n\nconst helper = readFileSync(new URL("../scripts/pages015-archive-window-entry-v2.sh", import.meta.url), "utf8");\n\ntest("previous branch target stays exact-SHA bound", () => {\n  assert.match(helper, /pages015-release-target-previous-\\$\\{THREEJS_CANDIDATE_SHA:0:8\\}/);\n  assert.match(helper, /release target branch does not resolve to the locked candidate SHA/);\n  assert.match(helper, /release target branch moved before immutable publication/);\n});\n\ntest("published tag is proven against locked candidate", () => {\n  assert.match(helper, /published immutable release tag does not resolve to locked candidate SHA/);\n});\n\ntest("admin gate remains before publication", () => {\n  const gate = helper.indexOf("PAGES_RELEASE_ADMIN_TOKEN is required before publishing the exact draft");\n  const publish = helper.indexOf("gh release edit \\\"$RELEASE_TAG\\\" --repo \\\"$GITHUB_REPOSITORY\\\" --draft=false");\n  assert.ok(gate >= 0 && publish > gate);\n});\n''')
          PY

          bash -n scripts/pages015-archive-window-entry-v2.sh
          node --test tests/pages015_release_target_staging_contract.test.mjs

      - name: Commit tested helper patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pages015-archive-window-entry-v2.sh tests/pages015_release_target_staging_contract.test.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m 'PAGES-015 stage previous draft through exact-SHA branch target'
          git push origin HEAD:threejs-rebuild

