name: PAGES-015 online compatibility qualification

on:
  workflow_dispatch:
    inputs:
      active_release_tag:
        description: Immutable active frontend release tag
        required: true
        type: string
      active_asset_sha256:
        description: SHA-256 of active pages-composite.tar
        required: true
        type: string
      previous_release_tag:
        description: Immutable previous frontend rollback release tag
        required: true
        type: string
      previous_asset_sha256:
        description: SHA-256 of previous pages-composite.tar
        required: true
        type: string
      active_worker_version:
        description: Active Cloudflare Worker version ID in the current deployment
        required: true
        type: string
      previous_worker_version:
        description: Previous Cloudflare Worker version ID retained in the current deployment
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pages-release-qualification-ledger
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    environment: cloudflare-backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Start from latest qualification ledger
        run: |
          set -euo pipefail
          git pull --ff-only origin threejs-rebuild

      - name: Verify local PAGES-015 contracts
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          node --test tests/pages_backend_runtime_contract.test.mjs tests/pages_online_compatibility_contract.test.mjs
          npx --yes wrangler@4 deploy --dry-run --config backend/cloudflare/wrangler.jsonc --outdir .tmp/pages015-worker

      - name: Require PAGES-005 locked live API_ORIGIN
        id: origin
        run: |
          set -euo pipefail
          test -s backend/cloudflare/API_ORIGIN.txt || {
            echo 'PAGES-005 has not locked backend/cloudflare/API_ORIGIN.txt; live PAGES-015 qualification is forbidden.' >&2
            exit 1
          }
          api_origin="$(tr -d '\r\n' < backend/cloudflare/API_ORIGIN.txt)"
          case "${api_origin}" in
            https://*.vercel.app*) echo 'Vercel API_ORIGIN is forbidden' >&2; exit 1 ;;
            https://*) ;;
            *) echo "invalid locked API_ORIGIN: ${api_origin}" >&2; exit 1 ;;
          esac
          if [[ "${api_origin#https://}" == */* ]]; then
            echo 'API_ORIGIN must be an origin with no path' >&2
            exit 1
          fi
          echo "api_origin=${api_origin}" >> "$GITHUB_OUTPUT"

      - name: Prove active + previous Worker health and live Turso round trips
        env:
          API_ORIGIN: ${{ steps.origin.outputs.api_origin }}
          ACTIVE_WORKER_VERSION: ${{ inputs.active_worker_version }}
          PREVIOUS_WORKER_VERSION: ${{ inputs.previous_worker_version }}
          PAGES015_EVIDENCE_PATH: pages015-live-evidence.json
        run: node scripts/probe-pages015-live-compatibility.mjs

      - name: Prove browser CORS from the real GitHub Pages origin
        env:
          PAGES015_API_ORIGIN: ${{ steps.origin.outputs.api_origin }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test tests/pages015-browser-cors.spec.js --workers=1

      - name: Append compatibility qualification for both frontend rollback keys
        env:
          ACTIVE_RELEASE_TAG: ${{ inputs.active_release_tag }}
          ACTIVE_ASSET_SHA256: ${{ inputs.active_asset_sha256 }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
          PREVIOUS_ASSET_SHA256: ${{ inputs.previous_asset_sha256 }}
          PAGES015_EVIDENCE_PATH: pages015-live-evidence.json
          PAGES015_BROWSER_CORS_VERIFIED: 'true'
        run: |
          set -euo pipefail
          node scripts/append-pages015-qualification.mjs
          node scripts/verify-release-qualification.mjs "${ACTIVE_RELEASE_TAG}" "${ACTIVE_ASSET_SHA256}"
          node scripts/verify-release-qualification.mjs "${PREVIOUS_RELEASE_TAG}" "${PREVIOUS_ASSET_SHA256}"

      - name: Commit additive ledger events only
        env:
          ACTIVE_RELEASE_TAG: ${{ inputs.active_release_tag }}
          PREVIOUS_RELEASE_TAG: ${{ inputs.previous_release_tag }}
        run: |
          set -euo pipefail
          rm -f pages015-live-evidence.json
          git status --short
          if git diff --quiet -- RELEASE_QUALIFICATION/ledger.jsonl; then
            echo 'Qualification events already exist; immutable releases remain untouched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/ledger.jsonl
          git diff --cached --name-only | grep -qx 'RELEASE_QUALIFICATION/ledger.jsonl'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "PAGES-015 qualify online rollback window: ${ACTIVE_RELEASE_TAG} + ${PREVIOUS_RELEASE_TAG}"
          git push origin HEAD:threejs-rebuild
