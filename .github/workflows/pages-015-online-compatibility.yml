name: PAGES-015 online compatibility qualification

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-release-qualification-ledger
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: cloudflare-backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Refresh ledger and resolve the locked frontend window
        id: frontend
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin threejs-rebuild
          window='RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json'
          ledger='RELEASE_QUALIFICATION/ledger.jsonl'
          test -s "$window"
          test -s "$ledger"

          jq -e '
            .schemaVersion == 1 and
            .rules.thisFileDoesNotConferEligibility == true and
            .rules.bothRequireSuccessfulPages014LiveEvidence == true and
            .rules.bothRequireExactArchivedCompatibilityDescriptorDigest == true and
            (.frontends | length) == 2 and
            ([.frontends[].role] | sort) == ["active", "previous"] and
            (.frontends[0].releaseTag != .frontends[1].releaseTag or .frontends[0].assetSha256 != .frontends[1].assetSha256) and
            all(.frontends[];
              .assetName == "pages-composite.tar" and
              (.releaseTag | type == "string" and length > 0) and
              (.assetSha256 | test("^[a-f0-9]{64}$")) and
              (.onlineCompatibilityDescriptorSha256 | test("^[a-f0-9]{64}$")) and
              (.deploymentGeneration | test("^sha256:[a-f0-9]{64}$")) and
              (.publicRuntimeProtocolSha256 | test("^[a-f0-9]{64}$")) and
              (.contentIdentitySha256 | test("^[a-f0-9]{64}$")) and
              .pages014LiveEvidence.verified == true and
              (.pages014LiveEvidence.liveManifestSha256 | test("^[a-f0-9]{64}$"))
            )
          ' "$window" >/dev/null

          read_window() {
            local role="$1" field="$2"
            jq -r --arg role "$role" --arg field "$field" '.frontends[] | select(.role == $role) | .[$field]' "$window"
          }
          read_live() {
            local role="$1" field="$2"
            jq -r --arg role "$role" --arg field "$field" '.frontends[] | select(.role == $role) | .pages014LiveEvidence[$field]' "$window"
          }

          active_tag="$(read_window active releaseTag)"
          active_digest="$(read_window active assetSha256)"
          active_descriptor="$(read_window active onlineCompatibilityDescriptorSha256)"
          active_generation="$(read_window active deploymentGeneration)"
          active_live_manifest="$(read_live active liveManifestSha256)"
          previous_tag="$(read_window previous releaseTag)"
          previous_digest="$(read_window previous assetSha256)"
          previous_descriptor="$(read_window previous onlineCompatibilityDescriptorSha256)"
          previous_generation="$(read_window previous deploymentGeneration)"
          previous_live_manifest="$(read_live previous liveManifestSha256)"

          echo "active_tag=$active_tag" >> "$GITHUB_OUTPUT"
          echo "active_digest=$active_digest" >> "$GITHUB_OUTPUT"
          echo "active_descriptor=$active_descriptor" >> "$GITHUB_OUTPUT"
          echo "active_generation=$active_generation" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "previous_digest=$previous_digest" >> "$GITHUB_OUTPUT"
          echo "previous_descriptor=$previous_descriptor" >> "$GITHUB_OUTPUT"
          echo "previous_generation=$previous_generation" >> "$GITHUB_OUTPUT"

          if node scripts/verify-release-qualification.mjs "$active_tag" "$active_digest" >/dev/null 2>&1 && \
             node scripts/verify-release-qualification.mjs "$previous_tag" "$previous_digest" >/dev/null 2>&1 && \
             node scripts/verify-pages015-current-lock-qualification.mjs >/dev/null 2>&1; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Both frontend keys already have complete PAGES-015 qualification for the current Worker rollback lock.'
            exit 0
          fi
          echo 'already=false' >> "$GITHUB_OUTPUT"

          check_frontend_prerequisites() {
            local tag="$1" digest="$2" descriptor="$3" generation="$4" live_manifest="$5"
            jq -s -e \
              --arg tag "$tag" --arg digest "$digest" --arg descriptor "$descriptor" \
              --arg generation "$generation" --arg liveManifest "$live_manifest" '
              (any(.[];
                .event == "archive_verified" and
                .releaseTag == $tag and
                .assetSha256 == $digest and
                .immutable == true and
                .releaseAttestationVerified == true and
                .archiveSha256Verified == true and
                .nonProductionRestoreVerified == true and
                .onlineCompatibilityDescriptorSha256 == $descriptor
              )) and
              (any(.[];
                .event == "deployment_generation_verified" and
                .releaseTag == $tag and
                .assetSha256 == $digest and
                .deploymentGeneration == $generation and
                .liveManifestSha256 == $liveManifest and
                .pages014LiveEvidenceVerified == true and
                .archiveMatchVerified == true and
                .verified == true
              ))
            ' "$ledger" >/dev/null
          }

          if check_frontend_prerequisites "$active_tag" "$active_digest" "$active_descriptor" "$active_generation" "$active_live_manifest" && \
             check_frontend_prerequisites "$previous_tag" "$previous_digest" "$previous_descriptor" "$previous_generation" "$previous_live_manifest"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=PAGES-015 waiting for frontend archive qualification::Both exact immutable frontend keys require exact descriptor-bound archive_verified plus matching PAGES-014 deployment_generation_verified.'
          fi

      - name: Require proven PAGES-005 live Worker rollback window
        id: pages005
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s backend/cloudflare/API_ORIGIN.txt ] || [ ! -s backend/cloudflare/WORKER_ROLLBACK_WINDOW.json ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=PAGES-015 waiting for PAGES-005::No proven API_ORIGIN + active/previous Worker window exists yet.'
            exit 0
          fi

          api_origin="$(tr -d '\r\n' < backend/cloudflare/API_ORIGIN.txt)"
          case "$api_origin" in
            https://*.vercel.app*) echo 'Vercel API_ORIGIN is forbidden' >&2; exit 1 ;;
            https://*) ;;
            *) echo "invalid locked API_ORIGIN: $api_origin" >&2; exit 1 ;;
          esac
          [[ "${api_origin#https://}" != */* ]] || { echo 'API_ORIGIN must be a bare HTTPS origin' >&2; exit 1; }

          jq -e --arg apiOrigin "$api_origin" '
            .schemaVersion == 1 and
            .gate == "PAGES-005" and
            .provider == "cloudflare-workers" and
            .workerName == "yakolak-room-api" and
            .apiOrigin == $apiOrigin and
            (.activeWorkerVersionId | type == "string" and length > 0) and
            (.previousWorkerVersionId | type == "string" and length > 0) and
            .activeWorkerVersionId != .previousWorkerVersionId and
            .protocolIdentity == "yakolak-online-room@1" and
            .capabilityIdentity == "yakolak-online-room-capabilities-v1" and
            (.capabilities | sort) == ["health.compatibility.v1","room-probe.read.v1","room-probe.write.v1"] and
            .tursoSchemaId == "yakolak-pages005-room-probe" and
            .tursoSchemaVersion == 1 and
            .traffic.activePercent == 100 and
            .traffic.previousPercent == 0 and
            .versionOverrideProof == true and
            .browserCorsVerified == true and
            .liveTursoRoundTripVerified == true and
            (.finalEvidenceSha256 | test("^[a-f0-9]{64}$")) and
            .migrationPolicy == "expand-contract-forward-only" and
            .tursoDataRollbackRequired == false
          ' backend/cloudflare/WORKER_ROLLBACK_WINDOW.json >/dev/null

          echo "api_origin=$api_origin" >> "$GITHUB_OUTPUT"
          echo "active_worker_version=$(jq -r '.activeWorkerVersionId' backend/cloudflare/WORKER_ROLLBACK_WINDOW.json)" >> "$GITHUB_OUTPUT"
          echo "previous_worker_version=$(jq -r '.previousWorkerVersionId' backend/cloudflare/WORKER_ROLLBACK_WINDOW.json)" >> "$GITHUB_OUTPUT"
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Finish cleanly while prerequisites remain incomplete
        if: steps.frontend.outputs.already == 'true' || steps.frontend.outputs.ready != 'true' || steps.pages005.outputs.ready != 'true'
        run: |
          if [ "${{ steps.frontend.outputs.already }}" = 'true' ]; then
            echo 'PAGES-015 is already completely qualified for the current Worker rollback lock.'
          else
            echo 'PAGES-015 remains intentionally unqualified; no backend_compatibility_verified event is written.'
          fi

      - name: Verify local PAGES-015 contracts
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true' && steps.pages005.outputs.ready == 'true'
        run: |
          set -euo pipefail
          npm install --ignore-scripts
          node --check scripts/append-pages015-qualification.mjs
          node --check scripts/verify-pages015-frontend-window.mjs
          node --check scripts/verify-pages015-current-lock-qualification.mjs
          node --check scripts/verify-release-qualification.mjs
          node --test tests/pages_backend_runtime_contract.test.mjs tests/pages_online_compatibility_contract.test.mjs tests/pages015_current_lock_qualification_contract.test.mjs tests/pages015_release_verifier_window_contract.test.mjs
          npx --yes wrangler@4 deploy --dry-run --config backend/cloudflare/wrangler.jsonc --outdir .tmp/pages015-worker

      - name: Re-prove active + previous Worker health and live Turso round trips
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true' && steps.pages005.outputs.ready == 'true'
        env:
          API_ORIGIN: ${{ steps.pages005.outputs.api_origin }}
          ACTIVE_WORKER_VERSION: ${{ steps.pages005.outputs.active_worker_version }}
          PREVIOUS_WORKER_VERSION: ${{ steps.pages005.outputs.previous_worker_version }}
          PAGES015_EVIDENCE_PATH: pages015-live-evidence.json
        run: node scripts/probe-pages015-live-compatibility.mjs

      - name: Re-download and verify both immutable frontend archives
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true' && steps.pages005.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN || github.token }}
          ACTIVE_RELEASE_TAG: ${{ steps.frontend.outputs.active_tag }}
          ACTIVE_ASSET_SHA256: ${{ steps.frontend.outputs.active_digest }}
          ACTIVE_DESCRIPTOR_SHA256: ${{ steps.frontend.outputs.active_descriptor }}
          PREVIOUS_RELEASE_TAG: ${{ steps.frontend.outputs.previous_tag }}
          PREVIOUS_ASSET_SHA256: ${{ steps.frontend.outputs.previous_digest }}
          PREVIOUS_DESCRIPTOR_SHA256: ${{ steps.frontend.outputs.previous_descriptor }}
          PAGES015_EVIDENCE_PATH: pages015-live-evidence.json
        run: |
          set -euo pipefail
          rm -rf .tmp/pages015-frontends
          mkdir -p .tmp/pages015-frontends/{active,previous}/{download,extract}

          gh release view "$ACTIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable' | grep -qx true
          gh release view "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq '.isImmutable' | grep -qx true
          gh release verify "$ACTIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release verify "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

          gh release download "$ACTIVE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern pages-composite.tar --dir .tmp/pages015-frontends/active/download
          gh release download "$PREVIOUS_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern pages-composite.tar --dir .tmp/pages015-frontends/previous/download

          active_tar=.tmp/pages015-frontends/active/download/pages-composite.tar
          previous_tar=.tmp/pages015-frontends/previous/download/pages-composite.tar
          test "$(sha256sum "$active_tar" | awk '{print $1}')" = "$ACTIVE_ASSET_SHA256"
          test "$(sha256sum "$previous_tar" | awk '{print $1}')" = "$PREVIOUS_ASSET_SHA256"
          gh release verify-asset "$ACTIVE_RELEASE_TAG" "$active_tar" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release verify-asset "$PREVIOUS_RELEASE_TAG" "$previous_tar" --repo "$GITHUB_REPOSITORY" >/dev/null

          tar -xf "$active_tar" -C .tmp/pages015-frontends/active/extract
          tar -xf "$previous_tar" -C .tmp/pages015-frontends/previous/extract
          active_descriptor="$(find .tmp/pages015-frontends/active/extract -type f -path '*/threejs/online-compatibility.json' -print -quit)"
          previous_descriptor="$(find .tmp/pages015-frontends/previous/extract -type f -path '*/threejs/online-compatibility.json' -print -quit)"
          test -n "$active_descriptor" && test -s "$active_descriptor"
          test -n "$previous_descriptor" && test -s "$previous_descriptor"
          test "$(sha256sum "$active_descriptor" | awk '{print $1}')" = "$ACTIVE_DESCRIPTOR_SHA256"
          test "$(sha256sum "$previous_descriptor" | awk '{print $1}')" = "$PREVIOUS_DESCRIPTOR_SHA256"
          node scripts/verify-pages015-frontend-window.mjs "$active_descriptor" "$previous_descriptor"

      - name: Prove browser CORS from the real GitHub Pages origin
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true' && steps.pages005.outputs.ready == 'true'
        env:
          PAGES015_API_ORIGIN: ${{ steps.pages005.outputs.api_origin }}
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npx playwright test tests/pages015-browser-cors.spec.js --workers=1

      - name: Append compatibility qualification for both frontend rollback keys
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true' && steps.pages005.outputs.ready == 'true'
        env:
          ACTIVE_RELEASE_TAG: ${{ steps.frontend.outputs.active_tag }}
          ACTIVE_ASSET_SHA256: ${{ steps.frontend.outputs.active_digest }}
          PREVIOUS_RELEASE_TAG: ${{ steps.frontend.outputs.previous_tag }}
          PREVIOUS_ASSET_SHA256: ${{ steps.frontend.outputs.previous_digest }}
          PAGES015_EVIDENCE_PATH: pages015-live-evidence.json
          PAGES015_BROWSER_CORS_VERIFIED: 'true'
        run: |
          set -euo pipefail
          node scripts/append-pages015-qualification.mjs
          node scripts/verify-release-qualification.mjs "$ACTIVE_RELEASE_TAG" "$ACTIVE_ASSET_SHA256"
          node scripts/verify-release-qualification.mjs "$PREVIOUS_RELEASE_TAG" "$PREVIOUS_ASSET_SHA256"
          node scripts/verify-pages015-current-lock-qualification.mjs

      - name: Commit additive ledger events only
        if: steps.frontend.outputs.already != 'true' && steps.frontend.outputs.ready == 'true' && steps.pages005.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -f pages015-live-evidence.json
          if git diff --quiet -- RELEASE_QUALIFICATION/ledger.jsonl; then
            echo 'Equivalent backend qualification already exists for the current Worker rollback lock.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/ledger.jsonl
          git diff --cached --name-only | grep -qx 'RELEASE_QUALIFICATION/ledger.jsonl'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'PAGES-015 qualify active+previous frontend/Worker window'
          git push origin HEAD:threejs-rebuild
