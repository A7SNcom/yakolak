name: PAGES-015 qualification orchestrator

on:
  push:
    branches:
      - main
    paths:
      - '.github/PAGES005_CREDENTIAL_TRIGGER'
      - '.github/workflows/pages-015-qualification-orchestrator.yml'
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  FORCE_COLOR: '0'

concurrency:
  group: pages-release-qualification-ledger
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-backend
    env:
      WORKFLOW_GH_TOKEN: ${{ github.token }}
      PAGES_RELEASE_ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate PAGES-015 orchestrator contracts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/pages015-record-explicit-orchestrator-probe.sh
          bash -n scripts/pages015-release-admin-preflight.sh
          bash -n scripts/pages015-orchestrate-qualification.sh
          bash -n scripts/pages015-archive-window-entry-v2.sh
          bash -n scripts/pages015-install-source-recovery-gh-shim.sh
          bash -n scripts/pages015-resolve-exact-pages-source.sh
          bash -n scripts/pages015-recover-expired-source.sh
          bash -n scripts/pages005-bootstrap-live.sh
          bash -n scripts/pages015-finalize-live-window.sh
          node --check scripts/append-pages015-qualification.mjs
          node --check scripts/verify-pages015-frontend-window.mjs
          node --check scripts/verify-pages015-current-lock-qualification.mjs
          node --check scripts/verify-release-qualification.mjs
          node --test tests/pages015_archive_facts_contract.test.mjs
          node --test tests/pages015_archive_admin_preflight_contract.test.mjs
          node --test tests/pages015_release_target_staging_contract.test.mjs
          node --test tests/pages015_release_admin_preflight_contract.test.mjs
          node --test tests/pages015_current_lock_qualification_contract.test.mjs
          node --test tests/pages015_release_verifier_window_contract.test.mjs
          node --test tests/pages015_single_resume_path_contract.test.mjs
          node --test tests/pages005_worker_lock_identity_contract.test.mjs
          git fetch --quiet origin main
          git show origin/main:.github/workflows/pages-015-qualification-orchestrator.yml \
            | grep -A2 '^concurrency:' \
            | grep -q 'group: pages-release-qualification-ledger'
          git show origin/main:.github/workflows/pages-014-post-deploy-qualification.yml \
            | grep -A2 '^concurrency:' \
            | grep -q 'group: pages-release-qualification-ledger'
          git show origin/main:.github/workflows/pages-014-post-deploy-qualification.yml \
            | grep -q 'deployment_generation_verified'
          for workflow in \
            .github/workflows/pages-005-backend-bootstrap.yml \
            .github/workflows/pages-015-window-archives.yml \
            .github/workflows/pages-015-qualify-online-window.yml; do
            workflow_text="$(git show "origin/main:${workflow}")"
            on_block="$(printf '%s\n' "$workflow_text" | sed -n '/^on:/,/^permissions:/p')"
            printf '%s\n' "$on_block" | grep -q 'workflow_dispatch:'
            if printf '%s\n' "$on_block" | grep -Eq '^[[:space:]]+(push|workflow_run|schedule):'; then
              echo "${workflow} must remain manual-only" >&2
              exit 1
            fi
            printf '%s\n' "$workflow_text" \
              | grep -A2 '^concurrency:' \
              | grep -q 'group: pages-release-qualification-ledger'
          done

          main_qualifier="$(git show origin/main:.github/workflows/pages-015-qualify-online-window.yml)"
          printf '%s\n' "$main_qualifier" | grep -q '.protocolIdentity == "yakolak-online-room@1"'
          printf '%s\n' "$main_qualifier" | grep -q '.capabilityIdentity == "yakolak-online-room-capabilities-v1"'
          printf '%s\n' "$main_qualifier" | grep -q '.tursoSchemaId == "yakolak-pages005-room-probe"'
          printf '%s\n' "$main_qualifier" | grep -q '.tursoSchemaVersion == 1'
          printf '%s\n' "$main_qualifier" | grep -q 'finalEvidenceSha256'
          current_lock_calls="$(printf '%s\n' "$main_qualifier" | grep -c 'node scripts/verify-pages015-current-lock-qualification.mjs' || true)"
          test "$current_lock_calls" -ge 2
          append_line="$(printf '%s\n' "$main_qualifier" | grep -n 'node scripts/append-pages015-qualification.mjs' | tail -1 | cut -d: -f1)"
          last_current_lock_line="$(printf '%s\n' "$main_qualifier" | grep -n 'node scripts/verify-pages015-current-lock-qualification.mjs' | tail -1 | cut -d: -f1)"
          commit_line="$(printf '%s\n' "$main_qualifier" | grep -n "git commit -m 'PAGES-015 qualify active+previous frontend/Worker window'" | tail -1 | cut -d: -f1)"
          test -n "$append_line" && test -n "$last_current_lock_line" && test -n "$commit_line"
          test "$last_current_lock_line" -gt "$append_line"
          test "$commit_line" -gt "$last_current_lock_line"

          retired_archive_workflow="$(git show origin/main:.github/workflows/pages-015-window-archives.yml)"
          printf '%s\n' "$retired_archive_workflow" | grep -q 'legacy archive fallback retired'
          if printf '%s\n' "$retired_archive_workflow" | grep -Eq 'contents:[[:space:]]*write|PAGES_RELEASE_ADMIN_TOKEN|pages015-archive-source\.sh|gh release|git push'; then
            echo '.github/workflows/pages-015-window-archives.yml must remain a read-only retired placeholder' >&2
            exit 1
          fi
          retired_archive_helper="$(git show origin/main:scripts/pages015-archive-source.sh)"
          printf '%s\n' "$retired_archive_helper" | grep -q 'legacy main archive helper is retired'
          printf '%s\n' "$retired_archive_helper" | grep -q '^exit 64$'
          if printf '%s\n' "$retired_archive_helper" | grep -Eq 'gh release|append_ledger_event|git push|curl .*immutable-releases'; then
            echo 'scripts/pages015-archive-source.sh must remain non-mutating and retired' >&2
            exit 1
          fi

          rollback_workflow="$(cat .github/workflows/pages-012-rollback.yml)"
          printf '%s\n' "$rollback_workflow" \
            | grep -A2 '^concurrency:' \
            | grep -q 'group: pages-release-qualification-ledger'
          printf '%s\n' "$rollback_workflow" | grep -q 'ONLINE_FRONTEND_WINDOW.json'
          rollback_current_lock_calls="$(printf '%s\n' "$rollback_workflow" | grep -c 'verify-pages015-current-lock-qualification.mjs' || true)"
          test "$rollback_current_lock_calls" -ge 2
          pre_upload_gate_line="$(printf '%s\n' "$rollback_workflow" | grep -n 'Require current PAGES-015 compatibility before public rollback upload' | cut -d: -f1)"
          upload_line="$(printf '%s\n' "$rollback_workflow" | grep -n 'uses: actions/upload-pages-artifact@v4' | cut -d: -f1)"
          final_gate_line="$(printf '%s\n' "$rollback_workflow" | grep -n 'Fail closed if the compatibility window changed before deploy' | cut -d: -f1)"
          deploy_line="$(printf '%s\n' "$rollback_workflow" | grep -n 'uses: actions/deploy-pages@v4' | cut -d: -f1)"
          test -n "$pre_upload_gate_line" && test -n "$upload_line" && test -n "$final_gate_line" && test -n "$deploy_line"
          test "$upload_line" -gt "$pre_upload_gate_line"
          test "$deploy_line" -gt "$final_gate_line"
          rollback_deploy_block="$(printf '%s\n' "$rollback_workflow" | sed -n '/^  deploy:/,$p')"
          printf '%s\n' "$rollback_deploy_block" \
            | grep -A2 '^[[:space:]]*concurrency:' \
            | grep -q 'group: yakolak-pages-composite'
          printf '%s\n' "$rollback_workflow" | grep -q "if: steps.mode.outputs.deploy != 'true'"

      - name: Record fresh explicit credential probe receipt
        if: github.event_name != 'schedule'
        shell: bash
        run: bash scripts/pages015-record-explicit-orchestrator-probe.sh

      - name: Preflight release-admin capability when configured
        if: env.PAGES_RELEASE_ADMIN_TOKEN != ''
        shell: bash
        run: bash scripts/pages015-release-admin-preflight.sh

      - name: Install exact-source recovery bridge
        if: env.PAGES_RELEASE_ADMIN_TOKEN != ''
        run: bash scripts/pages015-install-source-recovery-gh-shim.sh

      - name: Qualify what external credentials currently permit
        shell: bash
        run: bash scripts/pages015-orchestrate-qualification.sh
