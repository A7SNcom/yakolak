name: FASTPLAY-003 Final Public Acceptance v8

on:
  push:
    branches: [threejs-rebuild]
    paths: ['.github/workflows/fastplay-003-final-v8.yml']

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-v8
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: candidate
        shell: bash
        run: echo "sha=$(git log -1 --format='%H' -- web)" >> "$GITHUB_OUTPUT"
      - name: Mark pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" -f state=pending -f context='FASTPLAY-003/final-public' -f description='v8 input-ready public acceptance running' -f target_url="$run_url"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/fastplay-003-final-v6.yml').read_text()
          a=w.index('      - name: Build verifier\n')
          b=w.index('      - name: Exercise full public first playable\n',a)
          block=w[a:b]
          r=block.index('        run: |\n')+len('        run: |\n')
          Path('/tmp/build-v6.sh').write_text(textwrap.dedent(block[r:]))
          PY
          bash /tmp/build-v6.sh
          python - <<'PY'
          from pathlib import Path
          p=Path('fastplay-003-final-v3.mjs')
          s=p.read_text()
          anchor='async function tapMove(page, move) {'
          helper=r'''async function waitForPhysicalInputReady(page, seatId) {
            const handle = await page.waitForFunction(async seatId => {
              const shell = window.__YAKOLAK_THREEJS_SHELL__;
              const state = await shell.getCanonicalState();
              const presentation = shell.getPresentationSnapshot();
              if (state.roundEndRevision !== null || state.matchComplete) return { ended: true };
              if (state.activeSeatId !== seatId) return false;
              if (presentation?.movePresentationLock) return false;
              if (presentation?.drag?.phase && presentation.drag.phase !== 'idle') return false;
              if (presentation?.tap?.phase && presentation.tap.phase !== 'idle') return false;
              return { ended: false, revision: state.revision, activeSeatId: state.activeSeatId };
            }, seatId, { timeout: 5_000, polling: 25 });
            const ready = await handle.jsonValue();
            await handle.dispose();
            assert.equal(ready?.ended, false, 'round ended before physical input became ready');
            return ready;
          }

          '''
          if anchor not in s: raise SystemExit('tapMove signature missing')
          s=s.replace(anchor,helper+anchor,1)
          s=s.replace("async function tapMove(page, move) {\n            const before = await getState(page);", "async function tapMove(page, move) {\n            await waitForPhysicalInputReady(page, move.seatId);\n            const before = await getState(page);",1)
          s=s.replace("async function dragMove(page, move, { pointerType = 'mouse' } = {}) {\n            const before = await getState(page);", "async function dragMove(page, move, { pointerType = 'mouse' } = {}) {\n            await waitForPhysicalInputReady(page, move.seatId);\n            const before = await getState(page);",1)
          p.write_text(s)
          PY
          node --check fastplay-003-final-v3.mjs
          grep -Fq 'waitForPhysicalInputReady(page, move.seatId)' fastplay-003-final-v3.mjs
      - name: Exercise full public first playable
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 12m node fastplay-003-final-v3.mjs 2>&1 | tee fastplay-003-final-v8.log
      - name: Mark success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          test "$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)" = PASS
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/final-public' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/first-playable' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" -f state=success -f context='FASTPLAY-003/public-pass' -f description="PASS generation ${generation}" -f target_url="$run_url"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-v8-${{ steps.candidate.outputs.sha }}
          path: fastplay-003-acceptance.json
          retention-days: 90
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=failure -f context='FASTPLAY-003/final-public' -f description='v8 acceptance failed' -f target_url="$run_url"
          { echo 'FASTPLAY-003 final-v8 failed.'; echo; echo "workflow_run: ${run_url}"; echo '```text'; tail -n 220 fastplay-003-final-v8.log 2>/dev/null || true; echo '```'; } > /tmp/body
          gh issue create --title "FASTPLAY-003 final-v8 blocker ${MILESTONE_SHA}" --body-file /tmp/body >/dev/null
