name: FASTPLAY-003 Public First Playable Acceptance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'web/**'
      - 'scripts/verify-fastplay003-live.mjs'
      - '.github/workflows/fastplay-003-first-playable.yml'
      - '.github/workflows/pages-threejs-signal.yml'

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-first-playable
  cancel-in-progress: true

jobs:
  public-first-playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mark exact candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-003/first-playable' \
            -f description='Public first-playable acceptance running on exact candidate'

      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare GPU-less browser and monotonic timeout probe
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-fastplay003-live.mjs')
          text = path.read_text()
          replacements = [
              (
                  "const browser = await chromium.launch({ headless: true });",
                  "const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });",
              ),
              (
                  "  const startedAt = Date.now();",
                  "  const startedAt = await page.evaluate(() => performance.now());",
              ),
              (
                  "  const elapsedMs = Date.now() - startedAt;",
                  "  const elapsedMs = await page.evaluate(startedAt => performance.now() - startedAt, startedAt);",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'FASTPLAY-003 probe signature changed: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Syntax-check acceptance probe
        run: node --check scripts/verify-fastplay003-live.mjs

      - name: Install browser verifier
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install matching Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Capture exact public boot diagnostics
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        shell: bash
        run: |
          node --input-type=module <<'NODE' 2>&1 | tee fastplay-003-boot.log
          import { chromium } from 'playwright';
          const expected = process.env.EXPECTED_SHA.toLowerCase();
          const base = new URL(process.env.BASE_URL);
          const manifestUrl = new URL('../deployment-manifest.json', base);
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let manifest = null;
          for (let i = 0; i < 96; i += 1) {
            try {
              const url = new URL(manifestUrl);
              url.searchParams.set('fastplay003-boot', `${Date.now()}-${i}`);
              const response = await fetch(url, { headers: { 'Cache-Control': 'no-cache, max-age=0', Pragma: 'no-cache' } });
              manifest = response.ok ? await response.json() : { http: response.status };
              if (String(manifest?.threejsCandidateSha || '').toLowerCase() === expected) break;
            } catch (error) {
              manifest = { error: error?.message || String(error) };
            }
            await sleep(5_000);
          }
          if (String(manifest?.threejsCandidateSha || '').toLowerCase() !== expected) {
            console.log(JSON.stringify({ stage: 'manifest-not-exact', expected, manifest }, null, 2));
            process.exit(0);
          }

          const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          const consoleMessages = [];
          const pageErrors = [];
          const requestFailures = [];
          const httpFailures = [];
          page.on('console', message => {
            if (['warning', 'error'].includes(message.type())) consoleMessages.push(`${message.type()}: ${message.text()}`);
          });
          page.on('pageerror', error => pageErrors.push(error?.stack || error?.message || String(error)));
          page.on('requestfailed', request => requestFailures.push(`${request.method()} ${request.url()} :: ${request.failure()?.errorText || 'failed'}`));
          page.on('response', response => {
            if (response.status() >= 400) httpFailures.push(`${response.status()} ${response.url()}`);
          });
          const target = new URL(base);
          target.searchParams.set('fastplay003-bootdiag', Date.now());
          await page.goto(target.href, { waitUntil: 'domcontentloaded', timeout: 60_000 });
          await page.waitForTimeout(15_000);
          const diagnostic = await page.evaluate(() => {
            const root = document.documentElement;
            const loading = window.__YAKOLAK_ASSET_LOADING__;
            const safeProgress = group => {
              try { return loading?.getProgress?.(group) || null; } catch (error) { return { error: error?.message || String(error) }; }
            };
            return {
              bootState: root.dataset.bootState || null,
              runtime: root.dataset.runtime || null,
              requiredAssets: root.dataset.requiredAssets || null,
              bootCriticalState: root.dataset.assetBootCritical || null,
              sceneCriticalState: root.dataset.assetSceneCritical || null,
              graphicsState: root.dataset.graphicsState || null,
              statusText: document.querySelector('#boot-status')?.textContent || null,
              assetErrorVisible: Boolean(document.querySelector('#asset-load-error:not([hidden])')),
              assetErrorMessage: document.querySelector('#asset-load-error-message')?.textContent || null,
              unsupportedVisible: Boolean(document.querySelector('#unsupported-webgl:not([hidden])')),
              recoveryVisible: Boolean(document.querySelector('#graphics-recovery:not([hidden])')),
              shellExposed: Boolean(window.__YAKOLAK_THREEJS_SHELL__),
              loadingDiagnosticsExposed: Boolean(loading),
              bootProgress: safeProgress('boot-critical'),
              sceneProgress: safeProgress('scene-critical'),
              overallProgress: safeProgress(null),
            };
          });
          console.log(JSON.stringify({
            stage: 'public-boot-diagnostic',
            expected,
            deploymentGeneration: manifest.deploymentGeneration,
            diagnostic,
            consoleMessages: consoleMessages.slice(-30),
            pageErrors: pageErrors.slice(-20),
            requestFailures: requestFailures.slice(-30),
            httpFailures: httpFailures.slice(-30),
          }, null, 2));
          await context.close();
          await browser.close();
          NODE

      - name: Exercise exact public first playable
        id: acceptance
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: |
          set +e
          node scripts/verify-fastplay003-live.mjs 2>&1 | tee fastplay-003-run.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Publish exact blocker diagnostic
        if: steps.acceptance.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          title="FASTPLAY-003 blocker ${GITHUB_SHA}"
          body_file="$(mktemp)"
          {
            echo "FASTPLAY-003 failed on the exact public candidate."
            echo
            echo "candidate_sha: ${GITHUB_SHA}"
            echo "public_url: https://a7sncom.github.io/yakolak/threejs/"
            echo "workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '### Public boot diagnostic'
            echo '```text'
            tail -n 140 fastplay-003-boot.log
            echo '```'
            echo
            echo '### Acceptance failure'
            echo '```text'
            tail -n 80 fastplay-003-run.log
            echo '```'
          } > "${body_file}"
          gh issue create --title "${title}" --body-file "${body_file}" >/dev/null
          exit 1

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-${{ github.sha }}
          path: fastplay-003-acceptance.json
          if-no-files-found: error
          retention-days: 90

      - name: Freeze first green candidate and record PASS
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          public_url="$(jq -r '.publicUrl' fastplay-003-acceptance.json)"
          result="$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)"
          test "${candidate}" = "${GITHUB_SHA}"
          test "${result}" = 'PASS'
          test -n "${generation}"
          test "${public_url}" = 'https://a7sncom.github.io/yakolak/threejs/'

          freeze_branch='first-playable-experimental'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${freeze_branch}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "${existing}" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${freeze_branch}" \
              -f sha="${candidate}" >/dev/null
            echo "Frozen ${candidate} at ${freeze_branch}."
          elif [ "${existing}" != "${candidate}" ]; then
            echo "Freeze branch already points to ${existing}; refusing to move it to ${candidate}." >&2
            exit 1
          fi

          title='FIRST_PLAYABLE_EXPERIMENTAL=PASS'
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "FIRST_PLAYABLE_EXPERIMENTAL=PASS") | .number' \
            | head -n 1)"
          body_file="$(mktemp)"
          cat > "${body_file}" <<BODY
          FIRST_PLAYABLE_EXPERIMENTAL=PASS

          candidate_sha: ${candidate}
          deployment_generation: ${generation}
          public_url: ${public_url}
          freeze_branch: ${freeze_branch}
          workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Acceptance covered the actual public human-facing page on desktop and mobile portrait, explicit 2-player Human+Computer setup, tap and drag moves, one real 18-second timeout, round completion and score, next-round reset, full match completion, rematch, return-to-setup, refresh recovery, WebGL context loss/restore, and no fatal/page errors.
          BODY

          if [ -z "${existing_issue}" ]; then
            gh issue create --title "${title}" --body-file "${body_file}" >/dev/null
          else
            existing_body="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${existing_issue}" --jq '.body')"
            if ! grep -Fq "candidate_sha: ${candidate}" <<<"${existing_body}" || ! grep -Fq "deployment_generation: ${generation}" <<<"${existing_body}"; then
              echo "Existing PASS record #${existing_issue} does not match frozen candidate/generation." >&2
              exit 1
            fi
          fi

      - name: Mark first playable accepted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='FASTPLAY-003/first-playable' \
            -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS; exact public candidate frozen'

      - name: Mark first playable rejected
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-003/first-playable' \
            -f description='Public first-playable acceptance failed; deferred work remains blocked'