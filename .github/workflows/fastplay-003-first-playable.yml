name: FASTPLAY-003 Public First Playable Acceptance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'web/**'
      - 'scripts/verify-fastplay003-live.mjs'
      - '.github/workflows/fastplay-003-first-playable.yml'
      - '.github/workflows/pages-threejs-signal.yml'

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-first-playable
  cancel-in-progress: true

jobs:
  public-first-playable:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout acceptance source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve web milestone
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-003/first-playable' \
            -f description='Public first-playable acceptance running on web milestone'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare acceptance probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('scripts/verify-fastplay003-live.mjs').read_text()

          import_anchor = "import fs from 'node:fs';"
          if import_anchor not in source:
              raise SystemExit('FASTPLAY-003 fs import signature changed')
          source = source.replace(
              import_anchor,
              import_anchor + "\nimport { execFileSync } from 'node:child_process';",
              1,
          )

          wait_start = source.index('async function waitForExactCandidate() {')
          wait_end = source.index('\nfunction attachPageErrorCapture', wait_start)
          wait_function = r'''function candidateContainsMilestone(candidateSha) {
            if (!/^[0-9a-f]{40}$/.test(candidateSha)) return false;
            try {
              execFileSync('git', ['cat-file', '-e', `${candidateSha}^{commit}`], { stdio: 'ignore' });
            } catch {
              try {
                execFileSync('git', ['fetch', '--quiet', 'origin', candidateSha], { stdio: 'ignore' });
              } catch {
                return false;
              }
            }
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', expectedCandidateSha, candidateSha], { stdio: 'ignore' });
              return true;
            } catch {
              return false;
            }
          }

          async function waitForExactCandidate() {
            let last = null;
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              try {
                const manifest = await fetchJsonNoCache(manifestUrl);
                last = manifest;
                const liveCandidateSha = String(manifest?.threejsCandidateSha || '').trim().toLowerCase();
                if (candidateContainsMilestone(liveCandidateSha)) {
                  return { attempt, manifest, liveCandidateSha };
                }
              } catch (error) {
                last = { error: error?.message || String(error) };
              }
              await delay(5_000);
            }
            const error = new Error(`FASTPLAY-003 public generation does not contain milestone ${expectedCandidateSha}`);
            error.lastObservation = last;
            throw error;
          }
          '''
          source = source[:wait_start] + wait_function + source[wait_end:]

          launch_old = "const browser = await chromium.launch({ headless: true });"
          launch_new = "const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });"
          if launch_old not in source:
              raise SystemExit('FASTPLAY-003 Chromium launch signature changed')
          source = source.replace(launch_old, launch_new, 1)

          timeout_start = source.index('async function allowRealTimeout(page) {')
          timeout_end = source.index('\nasync function verifyWebglRecovery', timeout_start)
          timeout_function = r'''async function allowRealTimeout(page) {
            const startHandle = await page.waitForFunction(async () => {
              const state = await window.__YAKOLAK_THREEJS_SHELL__.getCanonicalState();
              const seat = state.seats.find(candidate => candidate.seatId === state.activeSeatId);
              const nowMs = Date.now();
              const remainingMs = state.deadlineAtMs === null ? null : state.deadlineAtMs - nowMs;
              if (
                seat?.type !== 'human'
                || !Number.isSafeInteger(state.deadlineAtMs)
                || remainingMs <= 0
                || remainingMs > 18_000
              ) return false;
              return {
                state,
                nowMs,
                remainingMs,
                startedAt: performance.now(),
              };
            }, null, { timeout: 20_000, polling: 25 });
            const observation = await startHandle.jsonValue();
            await startHandle.dispose();

            const before = observation.state;
            const seat = before.seats.find(candidate => candidate.seatId === before.activeSeatId);
            assert.equal(seat?.type, 'human', 'real timeout must begin on the human seat');
            assert.ok(Number.isSafeInteger(before.deadlineAtMs), 'human deadline missing');
            assert.ok(observation.remainingMs > 0 && observation.remainingMs <= 18_000, 'human deadline must be live');
            const timeoutSkipCountBefore = (before.skips || [])
              .filter(skip => skip.seatId === seat.seatId && skip.reason === 'timeout').length;
            console.log(JSON.stringify({
              stage: 'real-timeout-start',
              seatId: seat.seatId,
              revision: before.revision,
              deadlineAtMs: before.deadlineAtMs,
              turnDurationMs: 18_000,
              remainingMs: observation.remainingMs,
              timeoutSkipCountBefore,
            }));

            await page.waitForTimeout(500);
            const early = await getState(page);
            assert.equal(early.revision, before.revision, 'authority advanced before human timeout window');
            assert.equal(early.activeSeatId, before.activeSeatId, 'active seat changed before human timeout window');

            const minimumElapsedMs = Math.max(0, observation.remainingMs - 350);
            await page.waitForTimeout(Math.max(0, minimumElapsedMs - 500));
            const transitionHandle = await page.waitForFunction(async ({ revision, seatId, deadlineAtMs }) => {
              const state = await window.__YAKOLAK_THREEJS_SHELL__.getCanonicalState();
              if (state.revision <= revision) return false;
              return {
                revision: state.revision,
                activeSeatId: state.activeSeatId,
                deadlineAtMs: state.deadlineAtMs,
                lastMove: state.lastMove,
                timeoutSkips: (state.skips || []).filter(skip => skip.seatId === seatId && skip.reason === 'timeout').length,
                originalDeadlineAtMs: deadlineAtMs,
                observedAtMs: Date.now(),
              };
            }, {
              revision: before.revision,
              seatId: seat.seatId,
              deadlineAtMs: before.deadlineAtMs,
            }, { timeout: 5_000, polling: 25 });
            const transition = await transitionHandle.jsonValue();
            await transitionHandle.dispose();

            const elapsedMs = await page.evaluate(startedAt => performance.now() - startedAt, observation.startedAt);
            assert.ok(elapsedMs >= minimumElapsedMs, `timeout advanced too early after ${elapsedMs}ms`);
            assert.ok(transition.observedAtMs >= before.deadlineAtMs - 100, 'authority advanced materially before timeout deadline');
            assert.ok(transition.revision > before.revision, 'timeout did not advance authority revision');
            assert.notEqual(transition.deadlineAtMs, before.deadlineAtMs, 'timeout did not leave the expired deadline');

            const directTimeoutEvidence = transition.timeoutSkips > timeoutSkipCountBefore;
            const computerFollowupEvidence = transition.revision >= before.revision + 2
              && transition.lastMove?.seatId !== seat.seatId;
            assert.ok(directTimeoutEvidence || computerFollowupEvidence, 'authoritative timeout evidence missing');

            return {
              seatId: seat.seatId,
              deadlineAtMs: before.deadlineAtMs,
              turnDurationMs: 18_000,
              observedRevision: transition.revision,
              observedActiveSeatId: transition.activeSeatId,
              observedDeadlineAtMs: transition.deadlineAtMs,
              timeoutSkipCountBefore,
              timeoutSkipCountAfter: transition.timeoutSkips,
              elapsedMs,
              directTimeoutEvidence,
              computerFollowupEvidence,
            };
          }
          '''
          source = source[:timeout_start] + timeout_function + source[timeout_end:]

          old_flow = r'''    const timeout = await allowRealTimeout(page);
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const gestureBook = { tap: 0, drag: 0 };
              const firstMove = await chooseHumanMove(page);
              assert.ok(firstMove, 'no legal tap move after timeout');
              const tap = await tapMove(page, firstMove);
              gestureBook.tap += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const secondMove = await chooseHumanMove(page);
              assert.ok(secondMove, 'no legal drag move after tap');
              const drag = await dragMove(page, secondMove, { pointerType: 'mouse' });
              gestureBook.drag += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });'''
          new_flow = r'''    const gestureBook = { tap: 0, drag: 0 };
              const firstMove = await chooseHumanMove(page);
              assert.ok(firstMove, 'no legal opening tap move');
              const tap = await tapMove(page, firstMove);
              gestureBook.tap += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const timeout = await allowRealTimeout(page);
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });

              const secondMove = await chooseHumanMove(page);
              assert.ok(secondMove, 'no legal drag move after real timeout');
              const drag = await dragMove(page, secondMove, { pointerType: 'mouse' });
              gestureBook.drag += 1;
              await waitForHumanOrRoundEnd(page, humanSeatId, { timeout: 15_000 });'''
          if old_flow not in source:
              raise SystemExit('FASTPLAY-003 desktop flow signature changed')
          source = source.replace(old_flow, new_flow, 1)

          output_old = "    candidateSha: expectedCandidateSha,"
          output_new = "    candidateSha: live.liveCandidateSha,\n    milestoneSha: expectedCandidateSha,"
          if output_old not in source:
              raise SystemExit('FASTPLAY-003 artifact candidate signature changed')
          source = source.replace(output_old, output_new, 1)

          Path('fastplay-003-run.mjs').write_text(source)
          PY
          node --check fastplay-003-run.mjs

      - name: Install browser verifier
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install matching Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Exercise public first playable
        id: acceptance
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: |
          set +e
          node fastplay-003-run.mjs 2>&1 | tee fastplay-003-run.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Publish blocker diagnostic
        if: steps.acceptance.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="FASTPLAY-003 blocker ${CANDIDATE_SHA}"
          body_file="$(mktemp)"
          {
            echo "FASTPLAY-003 failed on the public generation containing the web milestone."
            echo
            echo "milestone_sha: ${CANDIDATE_SHA}"
            echo "workflow_sha: ${GITHUB_SHA}"
            echo "public_url: https://a7sncom.github.io/yakolak/threejs/"
            echo "workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```text'
            tail -n 180 fastplay-003-run.log
            echo '```'
          } > "${body_file}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.pull_request == null and .title == "'"${title}"'") | .number' | head -n 1)"
          if [ -z "${existing}" ]; then
            gh issue create --title "${title}" --body-file "${body_file}" >/dev/null
          else
            gh issue edit "${existing}" --body-file "${body_file}" >/dev/null
          fi

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-${{ steps.candidate.outputs.sha }}
          path: |
            fastplay-003-acceptance.json
            fastplay-003-run.log
          if-no-files-found: warn
          retention-days: 90

      - name: Freeze first green candidate and record PASS
        if: steps.acceptance.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          public_url="$(jq -r '.publicUrl' fastplay-003-acceptance.json)"
          result="$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)"
          git cat-file -e "${candidate}^{commit}" 2>/dev/null || git fetch --quiet origin "${candidate}"
          git merge-base --is-ancestor "${MILESTONE_SHA}" "${candidate}"
          test "${result}" = 'PASS'
          test -n "${generation}"
          test "${public_url}" = 'https://a7sncom.github.io/yakolak/threejs/'

          freeze_branch='first-playable-experimental'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${freeze_branch}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "${existing}" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${freeze_branch}" \
              -f sha="${candidate}" >/dev/null
          elif [ "${existing}" != "${candidate}" ]; then
            echo "Freeze branch already points to ${existing}; refusing to move it to ${candidate}." >&2
            exit 1
          fi

          title='FIRST_PLAYABLE_EXPERIMENTAL=PASS'
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "FIRST_PLAYABLE_EXPERIMENTAL=PASS") | .number' | head -n 1)"
          body_file="$(mktemp)"
          cat > "${body_file}" <<BODY
          FIRST_PLAYABLE_EXPERIMENTAL=PASS

          milestone_sha: ${MILESTONE_SHA}
          candidate_sha: ${candidate}
          deployment_generation: ${generation}
          public_url: ${public_url}
          freeze_branch: ${freeze_branch}
          workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Acceptance covered the actual public human-facing page on desktop and mobile portrait, explicit 2-player Human+Computer setup, tap and drag moves, one real 18-second human timeout, round completion and score, next-round reset, full match completion, rematch, return-to-setup, refresh recovery, WebGL context loss/restore, and no fatal/page errors.
          BODY

          if [ -z "${existing_issue}" ]; then
            gh issue create --title "${title}" --body-file "${body_file}" >/dev/null
          else
            gh issue edit "${existing_issue}" --body-file "${body_file}" --state open >/dev/null
          fi

      - name: Mark first playable accepted
        if: steps.acceptance.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-003/first-playable' \
            -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS; public candidate frozen'
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" \
            -f state=success \
            -f context='FASTPLAY-003/public-pass' \
            -f description='Public first-playable acceptance passed'

      - name: Mark first playable rejected
        if: steps.acceptance.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-003/first-playable' \
            -f description='Public first-playable acceptance failed; deferred work remains blocked'
          exit 1
