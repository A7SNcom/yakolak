name: UX-TURN-40 stale-safe turn presentation

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/gameplay_turn_transition_stale_safe.gd'
      - 'tests/ux_turn_40_transition_stale_safe.spec.js'
      - 'tests/ux_turn_40_same_owner_revision.spec.js'
      - '.github/workflows/ux-turn-40.yml'
      - 'scripts/gameplay_authoritative_turn_state.gd'
      - 'scripts/turn_light_crossfade.gd'
      - 'scenes/intro.tscn'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-turn-40-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stale-safe-presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          test "$(git hash-object assets/fonts/thmanyahsans-Regular.otf)" = "ca891297805da60b4b4e6d3a6f02cd7c0f2f33b7"
          test "$(git hash-object assets/fonts/thmanyahsans-Light.otf)" = "aebd416113380e9e96bbe9bfbc5c4a008b2f7b67"
          test "$(git hash-object assets/fonts/thmanyahsans-Medium.otf)" = "87fdec346be83a9dcc9eed5ea8aa04cc5a87faef"
          test "$(git hash-object assets/fonts/thmanyahsans-Bold.otf)" = "349937a73e14f681a3d4cb95e966aa7cec35bcc3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate regression source
        run: |
          node --check tests/ux_turn_40_transition_stale_safe.spec.js
          node --check tests/ux_turn_40_same_owner_revision.spec.js
          grep -q "turn_presentation_target_revision" scripts/gameplay_turn_transition_stale_safe.gd
          grep -q "retarget-adopted" scripts/gameplay_turn_transition_stale_safe.gd

      - name: Install build dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: ux-turn-40-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            ux-turn-40-godot-4.7.1-
            yakolak-godot-4.7.1-

      - name: Build latest main Web artifact
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run UX-TURN-40 regressions
        run: |
          set -o pipefail
          node tests/web_test_server.mjs >/tmp/yakolak-ux-turn-40.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/ux_turn_40_same_owner_revision.spec.js tests/ux_turn_40_transition_stale_safe.spec.js --workers=1 --reporter=github 2>&1 | tee /tmp/yakolak-ux-turn-40-playwright.log

      - name: Upload failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-40-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results/**/*
            /tmp/yakolak-ux-turn-40.log
            /tmp/yakolak-ux-turn-40-playwright.log
