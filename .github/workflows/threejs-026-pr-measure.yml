name: YAKOLAK THREEJS-026 PR Measurement Relay

on:
  pull_request:
    branches:
      - threejs-rebuild
    paths:
      - 'THREEJS026_PR_TRIGGER'

permissions:
  contents: read

env:
  THREEJS026_EXPECTED_CANDIDATE: 2803601aa6a79fea40b464c23867b82addaee776

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout measurement tooling
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve exact grounding Pages generation
        id: live
        shell: bash
        env:
          MANIFEST_URL: https://a7sncom.github.io/yakolak/deployment-manifest.json
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${MANIFEST_URL}?threejs026post=${nonce}" \
              -o /tmp/deployment-manifest.json; then
              candidate="$(jq -r '.threejsCandidateSha // empty' /tmp/deployment-manifest.json)"
              generation="$(jq -r '.deploymentGeneration // empty' /tmp/deployment-manifest.json)"
              if [ "${candidate}" = "${THREEJS026_EXPECTED_CANDIDATE}" ] && [ -n "${generation}" ]; then
                echo "candidate_sha=${candidate}" >> "$GITHUB_OUTPUT"
                echo "generation=${generation}" >> "$GITHUB_OUTPUT"
                git fetch --quiet --depth=1 origin "${candidate}"
                git checkout "${candidate}" -- web YAKOLAK_PORTABLE_KIT/assets
                cat /tmp/deployment-manifest.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Exact grounding candidate ${THREEJS026_EXPECTED_CANDIDATE} never became the live Pages generation." >&2
          cat /tmp/deployment-manifest.json 2>/dev/null || true
          exit 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run contact and THREEJS-025 lighting contracts
        run: |
          node --test tests/threejs_lighting_contract.test.mjs tests/threejs_contact_grounding_contract.test.mjs
          node scripts/verify-threejs-lighting.mjs

      - name: Install browser verifier only
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Patch lifecycle probe to direct dispose and cold recreate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/measure-threejs-performance.mjs')
          text = path.read_text()
          start_marker = "  const lifecycleRecreate = await page.evaluate(async () => {"
          end_marker = "  const png = await decodedPngBytes();"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''  const disposedLifecycle = await page.evaluate(() => {
            const shell = window.__YAKOLAK_THREEJS_SHELL__;
            if (!shell) throw new Error('Ready shell disappeared before dispose/recreate measurement');
            const before = shell.getResourceRegistrySnapshot();
            const graphicsBefore = shell.getGraphicsContextSnapshot();
            shell.dispose();
            const afterDispose = shell.getResourceRegistrySnapshot();
            return { before, afterDispose, graphicsBefore };
          });

          await page.reload({ waitUntil: 'domcontentloaded', timeout: 120_000 });
          await page.waitForFunction(() => {
            const state = document.documentElement.dataset.bootState;
            return ['ready', 'asset-load-failed', 'failed', 'unsupported-webgl'].includes(state);
          }, null, { timeout: 120_000 });
          const recreateBootState = await page.evaluate(() => document.documentElement.dataset.bootState);
          if (recreateBootState !== 'ready') throw new Error(`Dispose/recreate cold reload did not reach ready: ${recreateBootState}`);
          await page.waitForFunction(() => {
            const shell = window.__YAKOLAK_THREEJS_SHELL__;
            const marks = shell?.getStartupMarks?.();
            return Boolean(marks?.firstVisibleFrame && marks?.firstInteractive);
          }, null, { timeout: 30_000 });

          const recreated = await page.evaluate(async () => {
            const shell = window.__YAKOLAK_THREEJS_SHELL__;
            const manifestUrl = new URL('../deployment-manifest.json', location.href);
            manifestUrl.searchParams.set('threejs026_recreate', `${Date.now()}-${Math.random()}`);
            const response = await fetch(manifestUrl, { cache: 'no-store', headers: { 'cache-control': 'no-cache' } });
            const manifest = response.ok ? await response.json() : null;
            return {
              after: shell.getResourceRegistrySnapshot(),
              graphicsAfter: shell.getGraphicsContextSnapshot(),
              liveSha: manifest?.threejsCandidateSha || null,
            };
          });
          if (expectedThreejsSha && recreated.liveSha !== expectedThreejsSha) {
            throw new Error(`Pages generation changed during dispose/recreate: expected ${expectedThreejsSha}, got ${recreated.liveSha || 'none'}`);
          }

          const gpuFrameAfterRecreate = await rendererInfoSnapshot(cdp);
          const recreateDelta = lifecycleDelta(disposedLifecycle.before, recreated.after);
          const disposeResidual = Object.freeze({
            total: Number(disposedLifecycle.afterDispose?.total || 0),
            gpuObjects: Number(disposedLifecycle.afterDispose?.gpuObjects || 0),
            geometries: resourceCount(disposedLifecycle.afterDispose, 'geometry'),
            materials: resourceCount(disposedLifecycle.afterDispose, 'material'),
            textures: resourceCount(disposedLifecycle.afterDispose, 'texture'),
            renderTargets: resourceCount(disposedLifecycle.afterDispose, 'render-target'),
            shadowMaps: resourceCount(disposedLifecycle.afterDispose, 'shadow-map'),
            shaderVariants: Number(disposedLifecycle.afterDispose?.shaderVariants || 0),
            materialVariants: Number(disposedLifecycle.afterDispose?.materialVariants || 0),
          });
          const lifecycleRecreate = Object.freeze({
            supported: true,
            before: disposedLifecycle.before,
            afterDispose: disposedLifecycle.afterDispose,
            after: recreated.after,
            graphicsBefore: disposedLifecycle.graphicsBefore,
            graphicsAfter: recreated.graphicsAfter,
            disposeResidual,
            reason: null,
          });
          const lifecycleOk = Object.values(disposeResidual).every((value) => value === 0)
            && zeroLifecycleDelta(recreateDelta)
            && JSON.stringify(lifecycleRecreate.before?.byKind || {}) === JSON.stringify(lifecycleRecreate.after?.byKind || {})
            && JSON.stringify(lifecycleRecreate.before?.byOwnership || {}) === JSON.stringify(lifecycleRecreate.after?.byOwnership || {})
            && (lifecycleRecreate.afterDispose?.disposalErrors?.length || 0) === (lifecycleRecreate.before?.disposalErrors?.length || 0)
            && (lifecycleRecreate.after?.disposalErrors?.length || 0) === 0
            && gpuFrameAfterRecreate.geometries === gpuFrame.geometries
            && gpuFrameAfterRecreate.textures === gpuFrame.textures
            && gpuFrameAfterRecreate.programs === gpuFrame.programs;

          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "      before: lifecycleRecreate.before,\n      after: lifecycleRecreate.after,\n",
              "      before: lifecycleRecreate.before,\n      afterDispose: lifecycleRecreate.afterDispose,\n      disposeResidual: lifecycleRecreate.disposeResidual,\n      after: lifecycleRecreate.after,\n",
          )
          path.write_text(text)
          PY
          node --check scripts/measure-threejs-performance.mjs

      - name: Measure exact live grounding candidate
        shell: bash
        env:
          SHELL_URL: https://a7sncom.github.io/yakolak/threejs/
          EXPECTED_THREEJS_SHA: ${{ steps.live.outputs.candidate_sha }}
        run: |
          set -o pipefail
          node scripts/measure-threejs-performance.mjs 2>&1 | tee /tmp/threejs026-performance.log

      - name: Capture mobile grounding visual and runtime contract
        shell: bash
        env:
          SHELL_URL: https://a7sncom.github.io/yakolak/threejs/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true, args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader'] });
          try {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, reducedMotion: 'reduce' });
            const page = await context.newPage();
            await page.goto(process.env.SHELL_URL, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => document.documentElement.dataset.bootState === 'ready', null, { timeout: 120000 });
            await page.waitForFunction(() => Boolean(window.__YAKOLAK_THREEJS_SHELL__?.getStartupMarks?.().firstVisibleFrame), null, { timeout: 30000 });
            const snapshot = await page.evaluate(() => ({
              presentation: window.__YAKOLAK_THREEJS_SHELL__.getPresentationSnapshot(),
              lighting: window.__YAKOLAK_THREEJS_SHELL__.getLightingSnapshot(),
            }));
            await writeFile('/tmp/threejs026-grounding-snapshot.json', JSON.stringify(snapshot, null, 2));
            await page.screenshot({ path: '/tmp/threejs026-grounding-390x844.png', fullPage: true });
            console.log('THREEJS026_GROUNDING_VISUAL', JSON.stringify(snapshot));
            await context.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload measurement and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs026-post-grounding-${{ github.run_id }}
          path: |
            /tmp/threejs026-performance.log
            /tmp/threejs026-grounding-snapshot.json
            /tmp/threejs026-grounding-390x844.png
          if-no-files-found: warn
