name: Apply v095 performance mode

on:
  push:
    branches: [feature/v095-performance-baseline]
    paths:
      - .github/workflows/apply-v095-performance-mode.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v095-performance-baseline
          fetch-depth: 0

      - name: Apply isolated performance profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path=Path('src/app-game-v085.js')
          s=path.read_text(encoding='utf-8-sig')

          def once(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              s=s.replace(old,new,1)

          once("const BUILD='92';","const BUILD='95';",'game build')
          once(
              "const log=(...a)=>console.info('[Yakolak]',...a);",
              "const log=(...a)=>console.info('[Yakolak]',...a);\nconst PERF_PARAMS=new URLSearchParams(location.search);\nconst PERFORMANCE_MODE=!PERF_PARAMS.has('quality-full');\nconst performancePixelRatio=()=>PERFORMANCE_MODE?(innerWidth<=900?.78:.9):Math.min(Math.max(devicePixelRatio||1,1),1.25);\nglobalThis.__yakolakPerformance={enabled:PERFORMANCE_MODE,get pixelRatio(){return renderer?.getPixelRatio?.()||performancePixelRatio()}};",
              'performance constants'
          )
          once(
              "renderer.setPixelRatio(Math.min(Math.max(devicePixelRatio||1,1),1.25));",
              "renderer.setPixelRatio(performancePixelRatio());",
              'initial pixel ratio'
          )
          once(
              "renderer.setPixelRatio(Math.min(Math.max(+calibration.scene.pixelRatio||1,1),2));",
              "renderer.setPixelRatio(PERFORMANCE_MODE?performancePixelRatio():Math.min(Math.max(+calibration.scene.pixelRatio||1,1),2));",
              'calibration pixel ratio'
          )
          once(
              "  dragLightHandles=[];\n  calibration.lights.forEach((cfg,i)=>{",
              "  dragLightHandles=[];\n  if(PERFORMANCE_MODE){\n    lightRig.add(new THREE.HemisphereLight(0xffffff,0x5f6972,.82));\n    const key=new THREE.DirectionalLight(0xfff7e8,1.05);\n    key.position.set(-520,760,480);\n    key.target.position.set(0,0,0);\n    lightRig.add(key,key.target);\n    return;\n  }\n  calibration.lights.forEach((cfg,i)=>{",
              'lightweight lighting'
          )
          once(
              "function startSetupSpin(){\n  if(setupSpinRaf)return;\n  const step=()=>{",
              "function startSetupSpin(){\n  if(PERFORMANCE_MODE){\n    setupSpinGroups.forEach((g,i)=>{g.rotation.y=(i%4)*.14});\n    render();\n    return;\n  }\n  if(setupSpinRaf)return;\n  const step=()=>{",
              'disable idle setup animation'
          )
          once(
              "  mat.normalMap=cfg.texture?tableMaps.normal||null:null;\n  mat.roughnessMap=cfg.texture?tableMaps.roughness||null:null;",
              "  mat.normalMap=cfg.texture&&!PERFORMANCE_MODE?tableMaps.normal||null:null;\n  mat.roughnessMap=cfg.texture&&!PERFORMANCE_MODE?tableMaps.roughness||null:null;",
              'light table maps'
          )
          once(
              "function prepTableTex(t,isColor=false){if(isColor)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.wrapS=t.wrapT=THREE.RepeatWrapping;t.needsUpdate=true;return t}",
              "function prepTableTex(t,isColor=false){if(isColor)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(renderer.capabilities.getMaxAnisotropy(),PERFORMANCE_MODE?2:8);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.needsUpdate=true;return t}",
              'texture anisotropy'
          )

          path.write_text(s,encoding='utf-8')

          app=Path('app.js')
          a=app.read_text(encoding='utf-8-sig')
          a=a.replace("APP.JS v092 CALIBRATION TUTORIAL FIXES LOADED","APP.JS v095 PERFORMANCE MODE LOADED",1)
          a=a.replace("const BUILD='92';","const BUILD='95';",1)
          app.write_text(a,encoding='utf-8')

          index=Path('index.html')
          x=index.read_text(encoding='utf-8-sig')
          x=x.replace('v092-calibration-tutorial-fixes','v095-performance-mode',1)
          x=x.replace("const BUILD='92';","const BUILD='95';",1)
          index.write_text(x,encoding='utf-8')

          version=Path('version.json')
          v=json.loads(version.read_text(encoding='utf-8-sig'))
          v.update({
            'version':'v095-performance-mode',
            'build':95,
            'updated_at':'2026-07-23',
            'note':'Performance baseline: stops continuous setup rendering, uses a lightweight two-light rig, lowers render resolution, and disables costly table maps by default. Add ?quality-full to compare the original quality path.'
          })
          version.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          Path('.github/workflows/apply-v095-performance-mode.yml').unlink()
          PY

          node --check src/app-game-v085.js
          node --check app.js
          node - <<'NODE'
          const fs=require('fs');
          const game=fs.readFileSync('src/app-game-v085.js','utf8');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          for(const check of [
            "const BUILD='95'",
            'const PERFORMANCE_MODE=',
            'new THREE.HemisphereLight',
            'new THREE.DirectionalLight',
            'if(PERFORMANCE_MODE){',
            "const D=48,R3=135"
          ]) if(!game.includes(check)) throw new Error(`missing ${check}`);
          if(version.build!==95) throw new Error('version build is not 95');
          NODE

          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Apply v095 low-overhead rendering profile"
          git push origin HEAD:feature/v095-performance-baseline
