name: Verify v130 continuity

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'src/app-game-v130.js'
      - 'scripts/verify-v130-continuity.mjs'
      - '.github/workflows/verify-v130-continuity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approved-room-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: |
          python3 -m http.server 4173 > /tmp/yakolak-v130-server.log 2>&1 &
          echo $! > /tmp/yakolak-v130-server.pid
          for attempt in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 0.5
          done
          cat /tmp/yakolak-v130-server.log
          exit 1
      - name: Verify desktop and mobile continuity
        run: node scripts/verify-v130-continuity.mjs
      - name: Upload continuity screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v130-approved-room-continuity
          path: artifacts/v130-continuity/*.png
          if-no-files-found: warn
          retention-days: 14
