name: Verify v121 piece normals

on:
  pull_request:
    paths:
      - 'src/piece-normals-v121.js'
      - 'scripts/verify-v121-piece-normals-browser.mjs'
      - 'scripts/verify-v121-piece-normals.mjs'
      - 'app.js'
      - 'index.html'
      - 'version.json'
      - 'package.json'
      - '.github/workflows/verify-v121-piece-normals.yml'
  workflow_dispatch:

jobs:
  browser-piece-normals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start v121 static client
        run: |
          python3 -m http.server 4175 --bind 127.0.0.1 > /tmp/v121-server.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4175/version.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v121-server.log
          exit 1

      - name: Verify mobile normals and unchanged render cost
        env:
          APP_URL: 'http://127.0.0.1:4175'
        run: node scripts/verify-v121-piece-normals-browser.mjs

      - name: Upload v121 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v121-piece-normals
          path: artifacts/v121-piece-normals
          if-no-files-found: warn
