name: UX-SELECT-46 tap-to-selection latency

on:
  push:
    branches: [main]
    paths:
      - 'tests/ux_select_46_tap_latency.spec.js'
      - '.github/workflows/ux-select-46.yml'
      - 'scripts/gameplay.gd'
      - 'scripts/gameplay_selected_state.gd'
      - 'scripts/gameplay_authoritative_turn_state.gd'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-select-46-${{ contains(github.event.head_commit.message || '', '[web-ready]') && 'production' || 'source' }}
  cancel-in-progress: true

jobs:
  latency:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: ux-select-46-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            ux-select-45-godot-4.7.1-
            yakolak-godot-4.7.1-
      - name: Build latest main Web artifact
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: '1'
        run: bash scripts/vercel-fast-build.sh
      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Measure latest main
        env:
          YAKOLAK_UX_SELECT_46_LABEL: main-baseline
        run: |
          set -o pipefail
          node tests/web_test_server.mjs >/tmp/ux-select-46-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi; sleep 0.25; done
          npx playwright test tests/ux_select_46_tap_latency.spec.js --workers=1 --reporter=line 2>&1 | tee /tmp/ux-select-46-main.log
      - name: Measure canonical Production baseline
        env:
          YAKOLAK_UX_SELECT_46_BASE_URL: https://yakolak.vercel.app
          YAKOLAK_UX_SELECT_46_LABEL: production-baseline
        run: |
          set -o pipefail
          npx playwright test tests/ux_select_46_tap_latency.spec.js --workers=1 --reporter=line 2>&1 | tee /tmp/ux-select-46-production.log
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-46-baseline-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ux-select-46-*/
            /tmp/ux-select-46-*.log
