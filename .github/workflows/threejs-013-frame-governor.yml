name: THREEJS-013 Frame Governor Contract

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - web/app/camera/frame-governor.js
      - web/app/scene/renderer.js
      - web/app/scene/preview-scene.js
      - web/app/boot/boot.js
      - tests/threejs_frame_governor_contract.test.mjs
      - tests/threejs_renderer_owner_contract.test.mjs
      - .github/workflows/threejs-013-frame-governor.yml

permissions:
  contents: read

concurrency:
  group: threejs-013-frame-governor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify renderer owner contract
        run: node tests/threejs_renderer_owner_contract.test.mjs

      - name: Verify frame governor contract
        run: node tests/threejs_frame_governor_contract.test.mjs
