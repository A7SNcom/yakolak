name: CUSTOM-18 custom setup regression matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/custom-18.yml
      - scripts/session_setup.gd
      - scripts/session_setup_redesign.gd
      - scripts/session_setup_flow.gd
      - scripts/session_setup_state_inventory.gd
      - scripts/session_setup_arabic.gd
      - scripts/vercel-fast-build.sh
      - api/rooms.js
      - tests/custom_setup_regression_matrix_headless.gd
      - tests/custom_setup_mobile.spec.js
      - tests/custom_setup_online_probe.mjs

concurrency:
  group: yakolak-custom-18
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify focused test syntax
        run: |
          node --check tests/custom_setup_mobile.spec.js
          node --check tests/custom_setup_online_probe.mjs

      - name: Install room dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          test "$(git hash-object assets/fonts/thmanyahsans-Regular.otf)" = "ca891297805da60b4b4e6d3a6f02cd7c0f2f33b7"
          test "$(git hash-object assets/fonts/thmanyahsans-Light.otf)" = "aebd416113380e9e96bbe9bfbc5c4a008b2f7b67"
          test "$(git hash-object assets/fonts/thmanyahsans-Medium.otf)" = "87fdec346be83a9dcc9eed5ea8aa04cc5a87faef"
          test "$(git hash-object assets/fonts/thmanyahsans-Bold.otf)" = "349937a73e14f681a3d4cb95e966aa7cec35bcc3"

      - name: Build current main and existing gates
        run: bash scripts/vercel-fast-build.sh

      - name: Run exhaustive Custom setup headless matrix
        run: |
          GODOT_BIN="$(find "$HOME/.cache/yakolak-tools/godot-4.7.1" -maxdepth 1 -type f -name 'Godot_*' -perm -u+x | head -n 1)"
          test -n "$GODOT_BIN"
          timeout 2m "$GODOT_BIN" --headless --path . --script res://tests/custom_setup_regression_matrix_headless.gd

      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Custom controls on mobile portrait
        run: |
          node tests/web_test_server.mjs >/tmp/yakolak-custom-18-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi; sleep 0.25; done
          npx playwright test tests/custom_setup_mobile.spec.js --workers=1 --reporter=github

      - name: Verify real online canonical ownership path
        env:
          YAKOLAK_PROBE_BASE: https://yakolak.vercel.app
        run: |
          for attempt in {1..6}; do
            if node tests/custom_setup_online_probe.mjs; then exit 0; fi
            echo "CUSTOM-18 production room probe retry $attempt/6"
            sleep 10
          done
          exit 1
