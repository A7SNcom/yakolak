name: YAKOLAK Three.js Optional Checks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Check suite to run
        required: true
        default: fast
        type: choice
        options:
          - fast
          - browser
          - backend
          - full
          - live-local
      expected_candidate_sha:
        description: Exact 40-hex Three.js candidate SHA already proven live by PAGES-014; required only for live-local
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: yakolak-threejs-optional-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  fast:
    if: inputs.suite == 'fast' || inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run consolidated static and contract checks
        run: |
          bash scripts/verify-threejs-shell.sh
          node --test tests/threejs_vendor_contract.test.mjs
          npm run test:threejs:gameplay
          node --test tests/pages_origin_storage_security.test.mjs
          node --test tests/pages_public_runtime_config.test.mjs
          node --test tests/pages_service_worker_decision.test.mjs
          node --test tests/pages_deployment_generation.test.mjs
          node --test tests/threejs061_live_acceptance_contract.test.mjs

  backend:
    if: inputs.suite == 'backend' || inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend contract dependencies
        run: npm install --ignore-scripts
      - name: Run PAGES-005 and THREEJS-062/063/064/065 backend contracts
        run: |
          node --test tests/pages_backend_runtime_contract.test.mjs
          node --test tests/threejs062_authoritative_api_shell.test.mjs
          node --test tests/threejs062_authority_contract_extensions.test.mjs
          node --test tests/threejs063_turso_authority_contract.test.mjs
          node --test tests/threejs064_authoritative_lobby_configuration.test.mjs
          node --test tests/threejs064_worker_route_contract.test.mjs
          node --test tests/threejs065_invitation_namespace.test.mjs
          node --test tests/threejs065_worker_invitation_route.test.mjs
      - name: Compile Worker without deployment
        run: npx --yes wrangler@4 deploy --dry-run --config backend/cloudflare/wrangler.jsonc

  browser:
    if: inputs.suite == 'browser' || inputs.suite == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verifier only
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install matching Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Prepare verified runtime assets
        run: node scripts/prepare-threejs-runtime-assets.mjs
      - name: Expose frozen baseline screenshots
        run: |
          rm -f web/__baseline
          ln -s ../docs/threejs-baseline/screenshots web/__baseline
      - name: Serve static web source
        shell: bash
        run: |
          python3 -m http.server 4173 --directory web > /tmp/threejs-optional-http.log 2>&1 &
          echo $! > /tmp/threejs-optional-http.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/threejs-optional-http.log
          exit 1
      - name: Run consolidated browser checks
        run: |
          node scripts/verify-threejs-browser.mjs
          node scripts/verify-threejs-context-recovery.mjs
          node scripts/verify-threejs-table-score-browser.mjs
          node scripts/verify-threejs-interaction-layer-browser.mjs
          node scripts/verify-threejs-room-browser.mjs
          node scripts/verify-threejs-runtime-data-browser.mjs
          node scripts/verify-threejs-materials-browser.mjs
          node scripts/verify-threejs-lighting-browser.mjs
          node scripts/verify-threejs-tap-feedback-browser.mjs
          node scripts/verify-threejs-selected-piece-matrix-browser.mjs

  live-local:
    if: inputs.suite == 'live-local'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout acceptance harness
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate explicit live candidate input
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "live-local requires expected_candidate_sha as one exact 40-hex Three.js candidate SHA" >&2
            exit 1
          fi
      - name: Run source contract before live acceptance
        run: node --test tests/threejs061_live_acceptance_contract.test.mjs
      - name: Install live browser verifier only
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install matching Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Run exact-generation GitHub Pages local slice acceptance
        env:
          THREEJS061_EXPECTED_CANDIDATE_SHA: ${{ inputs.expected_candidate_sha }}
          THREEJS061_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          THREEJS061_EVIDENCE_PATH: threejs061-live-local-evidence.json
        run: node scripts/verify-threejs061-live-local.mjs
      - name: Upload THREEJS-061 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs061-live-local-evidence
          path: threejs061-live-local-evidence.json
          if-no-files-found: error
          retention-days: 30
