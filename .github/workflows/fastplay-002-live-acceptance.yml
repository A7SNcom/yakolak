name: FASTPLAY-002 Live Match Acceptance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'web/**'
      - 'scripts/verify-fastplay002-live.mjs'
      - 'scripts/verify-fastplay002-stage.mjs'
      - 'tests/fastplay002_local_match_config.test.mjs'
      - '.github/workflows/fastplay-002-live-acceptance.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: fastplay-002-live-match
  cancel-in-progress: true

jobs:
  live-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout milestone verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact last published web candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-002/live-match' \
            -f description='Waiting for exact public full local match acceptance'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify local setup contract
        id: unit
        run: node --test tests/fastplay002_local_match_config.test.mjs

      - name: Mark setup contract success
        if: steps.unit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/unit-config' \
            -f description='2/3/4 canonical local setup contract passed'

      - name: Install browser verifier
        id: playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install matching Chromium
        id: chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Mark browser ready
        if: steps.playwright.outcome == 'success' && steps.chromium.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/browser-ready' \
            -f description='Playwright Chromium verifier ready'

      - name: Diagnose setup to live scene
        id: diag_setup
        continue-on-error: true
        env:
          FASTPLAY002_DIAG_STAGE: setup-start
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: node scripts/verify-fastplay002-stage.mjs

      - name: Record setup diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          OUTCOME: ${{ steps.diag_setup.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context='FASTPLAY-002/diag-setup-start' \
            -f description="Public setup/start diagnostic: ${OUTCOME}"

      - name: Diagnose visible piece selection
        id: diag_selection
        continue-on-error: true
        env:
          FASTPLAY002_DIAG_STAGE: selection
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: node scripts/verify-fastplay002-stage.mjs

      - name: Record selection diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          OUTCOME: ${{ steps.diag_selection.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context='FASTPLAY-002/diag-selection' \
            -f description="Public visible-piece selection diagnostic: ${OUTCOME}"

      - name: Diagnose first authoritative move
        id: diag_commit
        continue-on-error: true
        env:
          FASTPLAY002_DIAG_STAGE: commit
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: node scripts/verify-fastplay002-stage.mjs

      - name: Record first move diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          OUTCOME: ${{ steps.diag_commit.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context='FASTPLAY-002/diag-first-move' \
            -f description="Public first authoritative move diagnostic: ${OUTCOME}"

      - name: Finish a full human local match on exact public Pages candidate
        id: live
        env:
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: node scripts/verify-fastplay002-live.mjs

      - name: Mark live acceptance success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/live-match' \
            -f description='Full human local match passed on exact public Pages candidate'

      - name: Mark unit failure stage
        if: failure() && steps.unit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-002/failure-unit' \
            -f description='Local setup contract failed'

      - name: Mark browser install failure stage
        if: failure() && (steps.playwright.outcome == 'failure' || steps.chromium.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-002/failure-browser-install' \
            -f description='Browser verifier installation failed'

      - name: Mark public match failure stage
        if: failure() && steps.live.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-002/failure-live-match' \
            -f description='Public exact-candidate full match verifier failed'

      - name: Mark live acceptance failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-002/live-match' \
            -f description='FASTPLAY-002 public full-match acceptance failed'
