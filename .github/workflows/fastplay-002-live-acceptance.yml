name: FASTPLAY-002 Live Match Acceptance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'web/**'
      - 'scripts/verify-fastplay002-live.mjs'
      - 'scripts/verify-fastplay002-stage.mjs'
      - 'tests/fastplay002_local_match_config.test.mjs'
      - '.github/workflows/fastplay-002-live-acceptance.yml'

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: fastplay-002-live-match
  cancel-in-progress: true

jobs:
  live-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout milestone verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact last published web candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-002/live-match' \
            -f description='Public full local match acceptance running'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify local setup contract
        id: unit
        run: node --test tests/fastplay002_local_match_config.test.mjs

      - name: Mark setup contract success
        if: steps.unit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/unit-config' \
            -f description='2/3/4 canonical local setup contract passed'

      - name: Install browser verifier
        id: playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install matching Chromium
        id: chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Mark browser ready
        if: steps.playwright.outcome == 'success' && steps.chromium.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/browser-ready' \
            -f description='Playwright Chromium verifier ready'

      - name: Diagnose setup to live scene
        id: diag_setup
        continue-on-error: true
        env:
          FASTPLAY002_DIAG_STAGE: setup-start
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        shell: bash
        run: node scripts/verify-fastplay002-stage.mjs 2>&1 | tee fastplay-002-setup.log

      - name: Record setup diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          OUTCOME: ${{ steps.diag_setup.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context='FASTPLAY-002/diag-setup-start' \
            -f description="Public setup/start diagnostic: ${OUTCOME}"

      - name: Diagnose visible piece selection
        id: diag_selection
        continue-on-error: true
        env:
          FASTPLAY002_DIAG_STAGE: selection
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        shell: bash
        run: node scripts/verify-fastplay002-stage.mjs 2>&1 | tee fastplay-002-selection.log

      - name: Record selection diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          OUTCOME: ${{ steps.diag_selection.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context='FASTPLAY-002/diag-selection' \
            -f description="Public visible-piece selection diagnostic: ${OUTCOME}"

      - name: Diagnose first authoritative move
        id: diag_commit
        continue-on-error: true
        env:
          FASTPLAY002_DIAG_STAGE: commit
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        shell: bash
        run: node scripts/verify-fastplay002-stage.mjs 2>&1 | tee fastplay-002-first-move.log

      - name: Record first move diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          OUTCOME: ${{ steps.diag_commit.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="$state" \
            -f context='FASTPLAY-002/diag-first-move' \
            -f description="Public first authoritative move diagnostic: ${OUTCOME}"

      - name: Finish a full human local match on public Pages generation
        id: live
        continue-on-error: true
        env:
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        shell: bash
        run: node scripts/verify-fastplay002-live.mjs 2>&1 | tee fastplay-002-live.log

      - name: Publish exact blocker diagnostic
        if: steps.live.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          SETUP_OUTCOME: ${{ steps.diag_setup.outcome }}
          SELECTION_OUTCOME: ${{ steps.diag_selection.outcome }}
          MOVE_OUTCOME: ${{ steps.diag_commit.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title="FASTPLAY-002 blocker ${CANDIDATE_SHA}"
          body="$(mktemp)"
          {
            echo 'FASTPLAY-002 public acceptance failed.'
            echo
            echo "milestone_sha: ${CANDIDATE_SHA}"
            echo "setup_stage: ${SETUP_OUTCOME}"
            echo "selection_stage: ${SELECTION_OUTCOME}"
            echo "first_move_stage: ${MOVE_OUTCOME}"
            echo "full_match_stage: ${LIVE_OUTCOME}"
            echo "workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for item in setup selection first-move live; do
              file="fastplay-002-${item}.log"
              echo
              echo "### ${item}"
              echo '```text'
              if [ -s "$file" ]; then tail -n 100 "$file"; else echo '(no log)'; fi
              echo '```'
            done
          } > "$body"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file "$body" >/dev/null
          else
            gh issue create --title "$title" --body-file "$body" >/dev/null
          fi
          exit 1

      - name: Mark live acceptance success
        if: steps.live.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/live-match' \
            -f description='Full human local match passed on public Pages generation'

      - name: Mark live acceptance failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-002/live-match' \
            -f description='FASTPLAY-002 public full-match acceptance failed'
