name: FASTPLAY-002 Live Match Acceptance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'scripts/verify-fastplay002-live.mjs'
      - 'tests/fastplay002_local_match_config.test.mjs'
      - '.github/workflows/fastplay-002-live-acceptance.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: fastplay-002-live-match
  cancel-in-progress: true

jobs:
  live-match:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout milestone verifier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve exact last published web candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark candidate pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-002/live-match' \
            -f description='Waiting for exact public full local match acceptance'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify local setup contract
        run: node --test tests/fastplay002_local_match_config.test.mjs

      - name: Install browser verifier
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install matching Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Finish a full human local match on exact public Pages candidate
        env:
          FASTPLAY002_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY002_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
        run: node scripts/verify-fastplay002-live.mjs

      - name: Mark live acceptance success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-002/live-match' \
            -f description='Full human local match passed on exact public Pages candidate'

      - name: Mark live acceptance failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-002/live-match' \
            -f description='FASTPLAY-002 public full-match acceptance failed'
