name: UX-TURN-32 isolated next-player latency

on:
  push:
    branches:
      - main
    paths:
      - tests/ux_turn_32_single_client_patch.py
      - .github/workflows/ux-turn-32-single-client-latency.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-turn-32-single-client-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  PROD_SHA: b1e1fd57000e3a0e4383eddd4e07941f65992c83
  PROD_URL: https://yakolak.vercel.app

jobs:
  matrix:
    name: ${{ matrix.source }}-${{ matrix.viewport }}-${{ matrix.players }}p-single
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        source: [main, production]
        viewport: [mobile-portrait, desktop]
        players: [2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-
      - name: Pin source and preserve diagnostics
        run: |
          mkdir -p /tmp/ux-turn-32 artifacts/ux-turn-32
          cp tests/ux_turn_32_latency.spec.js /tmp/ux-turn-32/spec.js
          cp tests/ux_turn_32_webdriver_probe_patch.py /tmp/ux-turn-32/probe.py
          cp tests/ux_turn_32_console_patch.py /tmp/ux-turn-32/console.py
          cp tests/ux_turn_32_single_client_patch.py /tmp/ux-turn-32/single.py
          cp tests/ux_turn_32_shard_patch.py /tmp/ux-turn-32/shard.py
          if [ "${{ matrix.source }}" = "production" ]; then
            git reset --hard "$PROD_SHA"
            mkdir -p tests
            cp /tmp/ux-turn-32/spec.js tests/ux_turn_32_latency.spec.js
            cp /tmp/ux-turn-32/probe.py tests/ux_turn_32_webdriver_probe_patch.py
            cp /tmp/ux-turn-32/console.py tests/ux_turn_32_console_patch.py
            cp /tmp/ux-turn-32/single.py tests/ux_turn_32_single_client_patch.py
            cp /tmp/ux-turn-32/shard.py tests/ux_turn_32_shard_patch.py
          fi
          git rev-parse HEAD > artifacts/ux-turn-32/source-sha.txt
      - name: Apply isolated diagnostic instrumentation
        run: |
          python tests/ux_turn_32_webdriver_probe_patch.py
          python tests/ux_turn_32_console_patch.py
          python tests/ux_turn_32_single_client_patch.py
          python tests/ux_turn_32_shard_patch.py
          node --check tests/ux_turn_32_latency.spec.js
      - name: Build real web bundle
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: |
          rm -rf .godot/exported
          bash scripts/vercel-fast-build.sh
      - name: Start real web server
        run: |
          node tests/web_test_server.mjs >artifacts/ux-turn-32/web-server.log 2>&1 &
          echo $! > artifacts/ux-turn-32/server.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Measure isolated exact shard
        env:
          YAKOLAK_TURN32_BASE: http://127.0.0.1:8000
          YAKOLAK_TURN32_LIVE_BASE: ${{ matrix.source == 'production' && env.PROD_URL || '' }}
          YAKOLAK_TURN32_LIVE_RTT: ${{ matrix.source == 'production' && matrix.viewport == 'desktop' && matrix.players == 2 && '1' || '0' }}
          YAKOLAK_TURN32_LABEL: isolated-${{ matrix.source }}-${{ matrix.viewport }}-${{ matrix.players }}p
          YAKOLAK_TURN32_VIEWPORT: ${{ matrix.viewport }}
          YAKOLAK_TURN32_PLAYERS: ${{ matrix.players }}
          YAKOLAK_TURN32_SAMPLES: "20"
        run: |
          set +e
          npx playwright test tests/ux_turn_32_latency.spec.js --workers=1 --reporter=github 2>&1 | tee artifacts/ux-turn-32/playwright.log
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > artifacts/ux-turn-32/exit-code.txt
          exit "$code"
      - name: Stop server
        if: ${{ always() }}
        run: |
          if [ -f artifacts/ux-turn-32/server.pid ]; then kill "$(cat artifacts/ux-turn-32/server.pid)" || true; fi
      - name: Upload isolated shard evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-32-isolated-${{ matrix.source }}-${{ matrix.viewport }}-${{ matrix.players }}p-${{ github.run_id }}
          path: |
            artifacts/ux-turn-32/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14

  special:
    name: ${{ matrix.source }}-${{ matrix.special }}-single
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - source: main
            special: slow
            viewport: mobile-portrait
          - source: main
            special: reconnect
            viewport: desktop
          - source: production
            special: slow
            viewport: mobile-portrait
          - source: production
            special: reconnect
            viewport: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-
      - name: Pin source and preserve diagnostics
        run: |
          mkdir -p /tmp/ux-turn-32 artifacts/ux-turn-32
          cp tests/ux_turn_32_latency.spec.js /tmp/ux-turn-32/spec.js
          cp tests/ux_turn_32_webdriver_probe_patch.py /tmp/ux-turn-32/probe.py
          cp tests/ux_turn_32_console_patch.py /tmp/ux-turn-32/console.py
          cp tests/ux_turn_32_single_client_patch.py /tmp/ux-turn-32/single.py
          cp tests/ux_turn_32_shard_patch.py /tmp/ux-turn-32/shard.py
          if [ "${{ matrix.source }}" = "production" ]; then
            git reset --hard "$PROD_SHA"
            mkdir -p tests
            cp /tmp/ux-turn-32/spec.js tests/ux_turn_32_latency.spec.js
            cp /tmp/ux-turn-32/probe.py tests/ux_turn_32_webdriver_probe_patch.py
            cp /tmp/ux-turn-32/console.py tests/ux_turn_32_console_patch.py
            cp /tmp/ux-turn-32/single.py tests/ux_turn_32_single_client_patch.py
            cp /tmp/ux-turn-32/shard.py tests/ux_turn_32_shard_patch.py
          fi
          git rev-parse HEAD > artifacts/ux-turn-32/source-sha.txt
      - name: Apply isolated diagnostic instrumentation
        run: |
          python tests/ux_turn_32_webdriver_probe_patch.py
          python tests/ux_turn_32_console_patch.py
          python tests/ux_turn_32_single_client_patch.py
          python tests/ux_turn_32_shard_patch.py
          node --check tests/ux_turn_32_latency.spec.js
      - name: Build real web bundle
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: |
          rm -rf .godot/exported
          bash scripts/vercel-fast-build.sh
      - name: Start real web server
        run: |
          node tests/web_test_server.mjs >artifacts/ux-turn-32/web-server.log 2>&1 &
          echo $! > artifacts/ux-turn-32/server.pid
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          exit 1
      - name: Measure isolated P3 to P4 special
        env:
          YAKOLAK_TURN32_BASE: http://127.0.0.1:8000
          YAKOLAK_TURN32_LABEL: isolated-${{ matrix.source }}-${{ matrix.special }}
          YAKOLAK_TURN32_VIEWPORT: ${{ matrix.viewport }}
          YAKOLAK_TURN32_PLAYERS: "4"
          YAKOLAK_TURN32_SPECIAL: ${{ matrix.special }}
          YAKOLAK_TURN32_SAMPLES: "20"
        run: |
          set +e
          npx playwright test tests/ux_turn_32_latency.spec.js --workers=1 --reporter=github 2>&1 | tee artifacts/ux-turn-32/playwright.log
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$code" > artifacts/ux-turn-32/exit-code.txt
          exit "$code"
      - name: Stop server
        if: ${{ always() }}
        run: |
          if [ -f artifacts/ux-turn-32/server.pid ]; then kill "$(cat artifacts/ux-turn-32/server.pid)" || true; fi
      - name: Upload isolated special evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-32-isolated-${{ matrix.source }}-${{ matrix.special }}-${{ github.run_id }}
          path: |
            artifacts/ux-turn-32/**
            test-results/**
          if-no-files-found: warn
          retention-days: 14
