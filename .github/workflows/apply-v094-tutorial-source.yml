name: Apply v094 tutorial source switch

on:
  push:
    branches: [feature/v094-interactive-onboarding]
    paths:
      - tests/e2e/.v094-patch-trigger
      - tests/e2e/verify-v094-onboarding.mjs
      - .github/workflows/apply-v094-tutorial-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v094-interactive-onboarding
          fetch-depth: 0
      - name: Disable legacy tutorial only for v094
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-game-v085.js')
          s=p.read_text()
          old='''  showAllReadinessBasesForTutorial();
  await runTutorial();
  await resetTutorialPieces(true);'''
          new='''  if(!globalThis.__yakolakV094){
    showAllReadinessBasesForTutorial();
    await runTutorial();
    await resetTutorialPieces(true);
  }'''
          if new not in s:
              if old not in s: raise SystemExit('tutorial source anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check src/app-game-v085.js
          rm -f .github/workflows/apply-v094-tutorial-source.yml tests/e2e/.v094-patch-trigger
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Use v094 onboarding instead of legacy tutorial"
          git push origin HEAD:feature/v094-interactive-onboarding
