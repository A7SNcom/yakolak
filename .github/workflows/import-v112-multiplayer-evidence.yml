name: Import v112 multiplayer evidence

on:
  push:
    branches:
      - "112"
    paths:
      - .github/workflows/import-v112-multiplayer-evidence.yml

permissions:
  actions: read
  contents: write

jobs:
  import-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out v112
        uses: actions/checkout@v4
        with:
          ref: "112"
      - name: Download verified matrix artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 30022731792 -n v112-multiplayer-desktop --dir /tmp/v112-desktop
          gh run download 30022731792 -n v112-multiplayer-mobile --dir /tmp/v112-mobile
      - name: Import screenshots and results
        run: |
          mkdir -p docs/screenshots/v112
          desktop_dir=$(find /tmp/v112-desktop -type f -name 'desktop-3-players-after-cycle.png' -printf '%h\n' | head -n 1)
          mobile_dir=$(find /tmp/v112-mobile -type f -name 'mobile-3-players-after-cycle.png' -printf '%h\n' | head -n 1)
          test -n "$desktop_dir"
          test -n "$mobile_dir"
          cp -f "$desktop_dir"/desktop-3-players-after-cycle.png docs/screenshots/v112/
          cp -f "$desktop_dir"/desktop-4-players-after-cycle.png docs/screenshots/v112/
          cp -f "$desktop_dir"/desktop-after-win-restart.png docs/screenshots/v112/
          cp -f "$mobile_dir"/mobile-3-players-after-cycle.png docs/screenshots/v112/
          cp -f "$mobile_dir"/mobile-4-players-after-cycle.png docs/screenshots/v112/
          cp -f "$mobile_dir"/mobile-after-win-restart.png docs/screenshots/v112/
          cp -f "$(find /tmp/v112-desktop -type f -name 'v112-multiplayer-desktop-results.json' | head -n 1)" docs/screenshots/v112/multiplayer-desktop-results.json
          cp -f "$(find /tmp/v112-mobile -type f -name 'v112-multiplayer-mobile-results.json' | head -n 1)" docs/screenshots/v112/multiplayer-mobile-results.json
          cat > docs/screenshots/v112/MULTIPLAYER-RESTART.md <<'EOF'
          # v112 Multiplayer and Restart Verification

          GitHub Actions run `30022731792` passed on desktop and mobile.

          - Three-player cycle: human and two bots moved, then control returned to the human.
          - Four-player cycle: human and three bots moved, then control returned to the human.
          - Post-win restart: round advanced to 2, winner score advanced to 1, and board, highlights, placed pieces, winner, lock, and last-move state were cleared.
          - Full reload: returned to clean color setup, preserved onboarding completion, and started a fresh four-player match at round 1 with zero scores.
          - Desktop viewport: 1440×900.
          - Mobile viewport: 390×844 at DPR 2.
          - Browser application errors: none.

          ![Desktop three players](desktop-3-players-after-cycle.png)

          ![Desktop four players](desktop-4-players-after-cycle.png)

          ![Desktop after restart](desktop-after-win-restart.png)

          ![Mobile three players](mobile-3-players-after-cycle.png)

          ![Mobile four players](mobile-4-players-after-cycle.png)

          ![Mobile after restart](mobile-after-win-restart.png)
          EOF
          sed -i 's/^          //' docs/screenshots/v112/MULTIPLAYER-RESTART.md
      - name: Commit evidence and remove importer
        run: |
          rm .github/workflows/import-v112-multiplayer-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v112 .github/workflows/import-v112-multiplayer-evidence.yml
          git commit -m "Attach v112 multiplayer and restart evidence"
          git push origin HEAD:112
