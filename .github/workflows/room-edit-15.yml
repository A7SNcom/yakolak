name: ROOM-EDIT-15 convergence gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: room-edit-15-main
  cancel-in-progress: true

jobs:
  room-edit-convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Run deterministic multi-client room edit contract
        run: |
          node --check tests/room_edit_convergence.test.mjs
          node tests/room_edit_convergence.test.mjs
      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-
      - name: Drop stale compiled scene cache
        run: rm -rf .godot/exported
      - name: Build web
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh
      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate mobile portrait room editor
        run: |
          node tests/web_test_server.mjs >/tmp/yakolak-room-edit-15.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi; sleep 0.25; done
          npx playwright test tests/room_edit_mobile.spec.js --workers=1 --reporter=github
