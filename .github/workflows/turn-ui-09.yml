name: UX-TURN-36 turn indicator state consistency gate

on:
  push:
    branches:
      - main
    paths:
      - 'tests/ux_turn_36_state_consistency.spec.js'
      - '.github/workflows/turn-ui-09.yml'
      - 'scripts/turn_clarity_hud.gd'
      - 'scripts/gameplay_authoritative_turn_state.gd'
      - 'scripts/gameplay_explicit_handoff.gd'
      - 'scripts/gameplay_state_inventory.gd'
      - 'scripts/gameplay_session_ui.gd'
      - 'scripts/gameplay_session.gd'
      - 'scripts/gameplay.gd'
      - 'scripts/online_session.gd'
      - 'scripts/browser_verification_bridge.gd'
      - 'scripts/session_setup.gd'
      - 'scripts/session_setup_flow.gd'
      - 'export_presets.cfg'
      - 'scenes/intro.tscn'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-turn-36-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accepted-room-state-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          test "$(git hash-object assets/fonts/thmanyahsans-Regular.otf)" = "ca891297805da60b4b4e6d3a6f02cd7c0f2f33b7"
          test "$(git hash-object assets/fonts/thmanyahsans-Light.otf)" = "aebd416113380e9e96bbe9bfbc5c4a008b2f7b67"
          test "$(git hash-object assets/fonts/thmanyahsans-Medium.otf)" = "87fdec346be83a9dcc9eed5ea8aa04cc5a87faef"
          test "$(git hash-object assets/fonts/thmanyahsans-Bold.otf)" = "349937a73e14f681a3d4cb95e966aa7cec35bcc3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install small server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: ux-turn-36-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            ux-turn-36-godot-4.7.1-
            turn-ui-09-godot-4.7.1-
            yakolak-godot-4.7.1-

      - name: Normalize UX-TURN-36 harness semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ux_turn_36_state_consistency.spec.js')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'UX-TURN-36 normalization anchor missing: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              "import { test, expect } from '@playwright/test';",
              "import { test, expect } from '@playwright/test';\nimport { mkdirSync, writeFileSync } from 'node:fs';\nimport { join } from 'node:path';",
              'evidence imports',
          )
          replace_once(
              "    await page.waitForTimeout(240);\n    const observed = await browserSnapshot(page);",
              "    await expect.poll(async () => {\n      const rendered = await browserSnapshot(page);\n      return [...rendered.domTurnText, ...rendered.godotTurnText].map(row => row.text);\n    }, { timeout: 8000, message: `${label}: rendered turn surfaces must converge` })\n      .toEqual(expected.kind === 'hidden' ? [] : [expected.text]);\n    const observed = await browserSnapshot(page);",
              'rendered surface convergence',
          )
          replace_once(
              "      expect(observed.input.ownerDirection, `${label}: no input owner may survive without authority`).toBe('');\n",
              "",
              'no-authority gameplay cursor false-positive',
          )
          replace_once(
              "        return hudVisible || sample.hudText !== '' || (sample.hudPlayer !== '' && hudPlayer !== 0) || sample.inputOwnerDirection !== '';",
              "        return hudVisible || sample.hudText !== '' || (sample.hudPlayer !== '' && hudPlayer !== 0);",
              'frame no-authority gameplay cursor false-positive',
          )
          s = s.replace("input authority must match displayed owner", "gameplay owner must match displayed owner")
          s = s.replace("input authority must match authoritative direction", "gameplay owner must match authoritative direction")
          replace_once(
              "        const intentionalMockHttpError = message.type() === 'error' &&\n          text.includes('Failed to load resource: the server responded with a status of') &&\n          (text.includes('409') || text.includes('503'));",
              "        const intentionalMockHttpError = message.type() === 'error' &&\n          (text.includes('409') || text.includes('503'));",
              'intentional mock HTTP console filtering',
          )
          replace_once(
              "      test.setTimeout(120000);",
              "      test.setTimeout(180000);",
              'matrix timeout',
          )
          replace_once(
              "        expect(consoleErrors, `browser errors: ${JSON.stringify(consoleErrors)}`).toEqual([]);\n",
              "",
              'scope gate to turn-consistency failures',
          )

          start = s.index('async function attachFailureEvidence(')
          end = s.index('\nasync function checkpoint(', start)
          replacement = r'''async function attachFailureEvidence(page, testInfo, label, state, error) {
            const safe = `${testInfo.title}-${label}`.replace(/[^a-z0-9._-]+/gi, '-').slice(0, 140);
            const dir = join(process.cwd(), 'artifacts', 'ux-turn-36');
            mkdirSync(dir, { recursive: true });
            const screenshotPath = join(dir, `${safe}.png`);
            const statePath = join(dir, `${safe}.authoritative-state.json`);
            const base = {
              checkpoint: label,
              acceptedAuthoritativeRoom: state.accepted,
              acceptedReason: state.acceptedReason,
              acceptedHistory: state.acceptedHistory,
              serverRoom: state.server,
              failure: String(error?.stack || error),
            };
            writeFileSync(statePath, JSON.stringify(base, null, 2));
            const browser = await browserSnapshot(page).catch(snapshotError => ({ snapshotError: String(snapshotError) }));
            const frames = await page.evaluate(() => window.__yakolakTurn36Samples || []).catch(() => []);
            writeFileSync(statePath, JSON.stringify({ ...base, browser, frames }, null, 2));
            await page.screenshot({ path: screenshotPath, fullPage: true }).catch(() => null);
          }
          '''
          s = s[:start] + replacement + s[end:]

          reconnect_old = "\n".join([
              "        state.accepted = null;",
              "        state.acceptedReason = 'reconnect-awaiting-first-snapshot';",
              "        state.reconnectGate = deferred();",
              "        await page.goto(`http://127.0.0.1:8000/?yakolakTestFast=1&room=${state.server.code}`, { waitUntil: 'domcontentloaded' });",
              "        await page.waitForFunction(",
              "          () => document.body.dataset.yakolakIntroHandoffEvent === 'consumed',",
              "          null,",
              "          { timeout: 20000 }",
              "        );",
              "        await installFrameSampler(page);",
              "        await checkpoint(page, testInfo, 'reconnect-unhydrated', state, playerCount);",
              "        state.reconnectGate.resolve();",
              "        await expect.poll(() => Number(state.accepted?.version ?? -1), { timeout: 20000 })",
              "          .toBe(Number(state.server.version));",
              "        await checkpoint(page, testInfo, 'reconnect-hydrated', state, playerCount);",
          ])
          reconnect_new = "\n".join([
              "        state.accepted = null;",
              "        state.acceptedReason = 'reconnect-awaiting-first-snapshot';",
              "        await page.goto(`http://127.0.0.1:8000/?yakolakTestFast=1&room=${state.server.code}`, { waitUntil: 'domcontentloaded' });",
              "        await installFrameSampler(page);",
              "        await page.waitForFunction(",
              "          () => document.body.dataset.yakolakIntroHandoffEvent === 'consumed',",
              "          null,",
              "          { timeout: 30000 }",
              "        );",
              "        await expect.poll(() => Number(state.accepted?.version ?? -1), { timeout: 30000 })",
              "          .toBe(Number(state.server.version));",
              "        await checkpoint(page, testInfo, 'reconnect-hydrated', state, playerCount);",
          ])
          replace_once(reconnect_old, reconnect_new, 'fresh reconnect hydration')

          p.write_text(s)
          PY

      - name: Validate normalized state-consistency source
        run: |
          node --check tests/ux_turn_36_state_consistency.spec.js
          grep -q "rendered turn surfaces must converge" tests/ux_turn_36_state_consistency.spec.js
          grep -q "artifacts.*ux-turn-36" tests/ux_turn_36_state_consistency.spec.js
          grep -q "writeFileSync(statePath" tests/ux_turn_36_state_consistency.spec.js
          grep -q "reconnect-hydrated" tests/ux_turn_36_state_consistency.spec.js
          ! grep -q "reconnect-unhydrated" tests/ux_turn_36_state_consistency.spec.js
          ! grep -q "expect(consoleErrors" tests/ux_turn_36_state_consistency.spec.js

      - name: Build latest main Web artifact
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh

      - name: Install Chromium runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run deterministic 2/3/4-player accepted-room turn gate
        run: |
          set -o pipefail
          node tests/web_test_server.mjs >/tmp/yakolak-ux-turn-36.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/ux_turn_36_state_consistency.spec.js --workers=1 --reporter=github 2>&1 | tee /tmp/yakolak-ux-turn-36-playwright.log

      - name: Upload failure screenshot and authoritative room state
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-turn-36-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ux-turn-36/**/*.png
            artifacts/ux-turn-36/**/*.json
            /tmp/yakolak-ux-turn-36.log
            /tmp/yakolak-ux-turn-36-playwright.log
