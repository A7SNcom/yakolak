name: Verify v112 tutorial

on:
  push:
    branches:
      - "112"
  pull_request:
    paths:
      - index.html
      - app.js
      - version.json
      - package.json
      - src/app-game-v112.js
      - scripts/verify-tutorial-v112.mjs
      - .github/workflows/verify-tutorial-v112.yml

permissions:
  contents: read

jobs:
  tutorial-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify v112 tutorial contract
        run: npm test
