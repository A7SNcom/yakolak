name: PAGES-011 Final Artifact Verify

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/pages-011-final-artifact-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact published Godot root
        uses: actions/checkout@v4
        with:
          ref: fbc0d15c574a40c4a9f31c96d42c2f03b424bb39
          path: godot-ready
          fetch-depth: 1

      - name: Checkout exact PAGES-011 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: threejs-source
          fetch-depth: 1

      - name: Compose the real migration artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pages-site
          rsync -a godot-ready/web/ pages-site/
          mkdir -p pages-site/threejs
          rsync -a threejs-source/web/ pages-site/threejs/
          touch pages-site/.nojekyll
          FRONTEND_SHA='${{ github.sha }}' node <<'NODE'
          const fs = require('node:fs');
          const config = {
            frontendSha: process.env.FRONTEND_SHA,
            protocolVersion: '1',
            apiOrigin: null,
            environment: 'production',
            branch: 'threejs-rebuild',
            apiOriginState: 'absent',
          };
          fs.writeFileSync('pages-site/threejs/runtime-config.json', `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Verify durable PAGES-011 regression test
        working-directory: threejs-source
        run: node --test tests/pages_service_worker_decision.test.mjs

      - name: Prove real composite guard and narrow Godot exception
        shell: bash
        run: |
          set -euo pipefail
          scanner='threejs-source/scripts/pages-public-artifact-scan.sh'
          bash -n "${scanner}"

          # The exact real Godot + Three.js composite must pass: Godot's generic helper
          # is inert because its delivered GODOT_CONFIG has no active serviceWorker.
          bash "${scanner}" pages-site

          cp pages-site/index.html "${RUNNER_TEMP}/root-index.html"
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'pages-site/index.html';
          let html = fs.readFileSync(file, 'utf8');
          html = html.replace(
            /const\s+GODOT_CONFIG\s*=\s*(\{[^\n]*\})\s*;/,
            (_, json) => {
              const config = JSON.parse(json);
              config.serviceWorker = 'godot-worker.js';
              return `const GODOT_CONFIG = ${JSON.stringify(config)};`;
            },
          );
          fs.writeFileSync(file, html);
          NODE
          if bash "${scanner}" pages-site; then
            echo 'Expected truthy GODOT_CONFIG.serviceWorker to fail closed.' >&2
            exit 1
          fi
          cp "${RUNNER_TEMP}/root-index.html" pages-site/index.html

          printf 'navigator.serviceWorker.register("./unexpected-worker.js");\n' > pages-site/unexpected-register.js
          if bash "${scanner}" pages-site; then
            echo 'Expected additional Service Worker registration to fail closed.' >&2
            exit 1
          fi
          rm pages-site/unexpected-register.js

          printf 'self.addEventListener("fetch", () => {});\n' > pages-site/service-worker.js
          if bash "${scanner}" pages-site; then
            echo 'Expected packaged Service Worker file to fail closed.' >&2
            exit 1
          fi

          echo 'PAGES_011_REAL_COMPOSITE_GUARD=PASS'
