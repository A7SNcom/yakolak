name: Repair Governed V36 Applicator

on:
  push:
    branches:
      - agent/yakolak-3.0-star-to-table-preintro

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yakolak-3.0-star-to-table-preintro
      - name: Repair exact insertion marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-governed-closed-box-v36.yml')
          text = path.read_text(encoding='utf-8')
          old_marker = """              '''  const err=(actual,target)=>Math.max(
            Math.abs(actual.left-target.x),Math.abs(actual.top-target.y),
            Math.abs(actual.width-target.w),Math.abs(actual.height-target.h)
          );

            const match=(clone,handoffShadow,first,shadowFirst)=>{''',"""
          new_marker = """              '''  const match=(clone,handoffShadow,first,shadowFirst)=>{''',"""
          old_prefix = """              '''  const err=(actual,target)=>Math.max(
            Math.abs(actual.left-target.x),Math.abs(actual.top-target.y),
            Math.abs(actual.width-target.w),Math.abs(actual.height-target.h)
          );
            const M=state=>{"""
          new_prefix = """              '''  const M=state=>{"""
          if text.count(old_marker) != 1 or text.count(old_prefix) != 1:
              raise SystemExit('expected applicator markers not found')
          text = text.replace(old_marker, new_marker, 1).replace(old_prefix, new_prefix, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          Path('.github/workflows/repair-governed-v36.yml').unlink()
          PY
          git config user.name "YAKOLAK Motion Loop"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "إصلاح تطبيق تحسينات المشهد [repair-v36-workflow]"
          git push origin HEAD:agent/yakolak-3.0-star-to-table-preintro
