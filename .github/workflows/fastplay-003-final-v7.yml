name: FASTPLAY-003 Final Public Acceptance v7

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'web/**'
      - '.github/workflows/fastplay-003-final-v7.yml'

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-v7
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve web milestone
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark final acceptance pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-003/final-public' \
            -f description='v7 authoritative public acceptance running' \
            -f target_url="$run_url"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build verified public runner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          w=Path('.github/workflows/fastplay-003-final-v6.yml').read_text()
          a=w.index('      - name: Build verifier\n')
          b=w.index('      - name: Exercise full public first playable\n',a)
          block=w[a:b]
          r=block.index('        run: |\n')+len('        run: |\n')
          Path('/tmp/build-v6.sh').write_text(textwrap.dedent(block[r:]))
          PY
          bash /tmp/build-v6.sh
          node --check fastplay-003-final-v3.mjs
          grep -Fq "stage: 'real-timeout-pass'" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'webgl-recovery-pass'" fastplay-003-final-v3.mjs
          grep -Fq "round did not finish within deterministic safety bound:" fastplay-003-final-v3.mjs

      - name: Exercise full public first playable
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 12m node fastplay-003-final-v3.mjs 2>&1 | tee fastplay-003-final-v7.log

      - name: Freeze accepted public generation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          result="$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)"
          public_url="$(jq -r '.publicUrl' fastplay-003-acceptance.json)"
          test "$result" = PASS
          test -n "$generation"
          test "$public_url" = 'https://a7sncom.github.io/yakolak/threejs/'
          git cat-file -e "${candidate}^{commit}" 2>/dev/null || git fetch --quiet origin "$candidate"
          git merge-base --is-ancestor "$MILESTONE_SHA" "$candidate"

          freeze_branch='first-playable-experimental'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${freeze_branch}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/heads/${freeze_branch}" -f sha="$candidate" >/dev/null
          elif [ "$existing" != "$candidate" ]; then
            echo "freeze branch already points to ${existing}; refusing to move it" >&2
            exit 1
          fi

          title='FIRST_PLAYABLE_EXPERIMENTAL=PASS'
          body="$(mktemp)"
          cat > "$body" <<BODY
          FIRST_PLAYABLE_EXPERIMENTAL=PASS

          milestone_sha: ${MILESTONE_SHA}
          candidate_sha: ${candidate}
          deployment_generation: ${generation}
          public_url: ${public_url}
          freeze_branch: ${freeze_branch}
          workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verified on the actual public page: desktop + mobile portrait Human/Computer setup, real pointer tap and drag, authoritative 18-second timeout, WebGL loss/restore without authority mutation, round scoring, next round, full match, rematch, return to setup, refresh recovery and no fatal/page errors.
          BODY
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq '.[] | select(.pull_request == null and .title == "FIRST_PLAYABLE_EXPERIMENTAL=PASS") | .number' | head -n 1)"
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$title" --body-file "$body" >/dev/null
          else
            gh issue edit "$existing_issue" --body-file "$body" --state open >/dev/null
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/final-public' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS; public candidate frozen' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/first-playable' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" -f state=success -f context='FASTPLAY-003/public-pass' -f description='Public first-playable acceptance passed' -f target_url="$run_url"

      - name: Publish failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=failure -f context='FASTPLAY-003/final-public' -f description='v7 public acceptance failed' -f target_url="$run_url"
          title="FASTPLAY-003 final-v7 blocker ${MILESTONE_SHA}"
          body="$(mktemp)"
          {
            echo 'FASTPLAY-003 final-v7 public acceptance failed.'
            echo
            echo "milestone_sha: ${MILESTONE_SHA}"
            echo "workflow_run: ${run_url}"
            echo
            echo '```text'
            tail -n 220 fastplay-003-final-v7.log 2>/dev/null || echo '(verifier log unavailable)'
            echo '```'
          } > "$body"
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$title" --body-file "$body" >/dev/null
          else
            gh issue edit "$existing_issue" --body-file "$body" >/dev/null
          fi
