name: PAGES-015 Harden Draft Readback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-015-harden-draft-readback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Harden release and asset readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          helper = Path('scripts/pages015-archive-window-entry-v2.sh')
          s = helper.read_text()

          old = '''  gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$work/releases.json"
            release_id="$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' "$work/releases.json" | head -n1)"
          fi
          test -n "$release_id"
          '''
          new = '''  release_id=""
            for attempt in $(seq 1 12); do
              gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$work/releases.json"
              release_id="$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' "$work/releases.json" | head -n1)"
              [ -n "$release_id" ] && break
              sleep 1
            done
          fi
          test -n "$release_id" || { echo "new draft release did not become readable for ${RELEASE_TAG}" >&2; exit 1; }
          '''
          if old not in s:
              raise SystemExit('release readback anchor not found')
          s = s.replace(old, new, 1)

          old = '''      gh release upload "$RELEASE_TAG" "$assets/$name" --repo "$GITHUB_REPOSITORY"
                gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$work/assets.json"
              fi
          '''
          new = '''      gh release upload "$RELEASE_TAG" "$assets/$name" --repo "$GITHUB_REPOSITORY"
                asset_visible=false
                for attempt in $(seq 1 12); do
                  gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$work/assets.json"
                  if jq -e --arg name "$name" 'any(.[]; .name == $name)' "$work/assets.json" >/dev/null; then
                    asset_visible=true
                    break
                  fi
                  sleep 1
                done
                test "$asset_visible" = true || { echo "uploaded release asset did not become readable: ${name}" >&2; exit 1; }
              fi
          '''
          if old not in s:
              raise SystemExit('asset readback anchor not found')
          s = s.replace(old, new, 1)
          helper.write_text(s)

          test_file = Path('tests/pages015_release_target_staging_contract.test.mjs')
          t = test_file.read_text()
          if 'draft creation and upload tolerate GitHub read-after-write delay' not in t:
              t += '''\n\ntest("draft creation and upload tolerate GitHub read-after-write delay", () => {\n  assert.match(helper, /for attempt in \\$\\(seq 1 12\\); do/);\n  assert.match(helper, /new draft release did not become readable/);\n  assert.match(helper, /uploaded release asset did not become readable/);\n});\n'''
          test_file.write_text(t)

          doc = Path('PAGES_ONLINE_COMPATIBILITY.md')
          d = doc.read_text()
          d = d.replace(
              '- uses `PAGES_RELEASE_ADMIN_TOKEN` for release creation/promotion when available;',
              '- can stage the locked previous mutable draft through a dedicated branch that is re-resolved to the exact candidate SHA before use; `PAGES_RELEASE_ADMIN_TOKEN` remains mandatory for immutable publication/promotion;'
          )
          old_para = '''`RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS/*.json` is diagnostics only (`qualificationEvidence=false`). Archive run `32136510727` proved the retention-independent flow end-to-end after the originals had expired:\n\n- **active** `pages-archive-2026-08-18-geeb3b8e1-t4e4e5dec` / `3bb476e2…`: `stageState=exact-draft-verified`; the exact source resolved from the preserved recovered artifact, all release-asset bytes re-verified, and publication stopped only at the missing Admin credential.\n- **previous** `pages-archive-2026-08-18-geeb3b8e1-t5cc89e05` / `6769843e…`: `stageState=waiting-admin-to-create-draft`; the exact source likewise resolved and verified, but there is no reusable draft and the ordinary Actions integration cannot create the release.\n'''
          new_para = '''`RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS/*.json` is diagnostics only (`qualificationEvidence=false`). The retention-independent flow now has exact mutable drafts for **both** locked frontend keys. Run `32164753404` revalidated them after the original Actions artifacts had expired:\n\n- **active** `pages-archive-2026-08-18-geeb3b8e1-t4e4e5dec` / `3bb476e2…`: `stageState=exact-draft-verified`; release ID `372154227`.\n- **previous** `pages-archive-2026-08-18-geeb3b8e1-t5cc89e05` / `6769843e…`: `stageState=exact-draft-verified`; release ID `372518304`. Its mutable draft targets `pages015-release-target-previous-5cc89e05`, and that branch is re-resolved to exact candidate SHA `5cc89e05653b6461ed6a41332f374eaadb360945` before staging and again before any immutable publication.\n\nAll eight expected release assets are byte-checked before a `draft_staged` receipt is accepted. Neither draft is immutable or eligible yet; publication remains blocked on the Admin credential.\n'''
          if old_para not in d:
              raise SystemExit('stale archive status paragraph not found')
          d = d.replace(old_para, new_para, 1)

          old_perm = '''Therefore `PAGES_RELEASE_ADMIN_TOKEN` must be capable of:\n\n- creating/reading the draft and release assets;\n- creating/publishing the locked release tag/ref for candidate commits whose trees/history contain workflow files;'''
          new_perm = '''The branch-target proof subsequently showed that ordinary `github.token` can safely stage the **mutable previous draft** when the target branch is pre-created and independently locked to the exact candidate SHA. This does not weaken the historical raw-ref permission finding and does not remove the Admin publication gate.\n\nTherefore `PAGES_RELEASE_ADMIN_TOKEN` must be capable of:\n\n- reading the staged drafts and release assets and promoting them only after immutable-release proof;\n- creating/publishing the locked release tag/ref for candidate commits whose trees/history contain workflow files;'''
          if old_perm not in d:
              raise SystemExit('permission contract paragraph not found')
          d = d.replace(old_perm, new_perm, 1)

          d = d.replace(
              'Fresh explicit orchestrator run `32150414990` completed successfully at `2026-08-18T14:47:00Z`.',
              'Fresh explicit orchestrator run `32156873552` completed successfully at `2026-08-18T15:50:53Z`.'
          )
          d = d.replace(
              'The additive ledger still contains only initialization plus the active exact `draft_staged` event; there are no strong archive, deployment-generation, or backend-compatibility qualification rows.',
              'The additive ledger now contains initialization plus exact `draft_staged` events for both active and previous archives; there are still no strong archive, deployment-generation, or backend-compatibility qualification rows.'
          )
          d = d.replace(
              'the previous immutable release cannot yet be created/published with the required release/workflows/Admin authority,',
              'both mutable release drafts are staged but neither can yet be published/verified immutable without the required release/workflows/Admin authority,'
          )
          doc.write_text(d)
          PY

          bash -n scripts/pages015-archive-window-entry-v2.sh
          node --test tests/pages015_release_target_staging_contract.test.mjs

      - name: Commit hardening and current facts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pages015-archive-window-entry-v2.sh tests/pages015_release_target_staging_contract.test.mjs PAGES_ONLINE_COMPATIBILITY.md
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git commit -m 'PAGES-015 harden draft readback and record both exact drafts'
          git push origin HEAD:threejs-rebuild
