name: YAKOLAK Flash Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fast_publish:
        description: Deploy the committed web/ bundle without tests or a Godot rebuild
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yakolak-flash-main
  cancel-in-progress: true

jobs:
  flash-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js contract tests
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node.js dependencies
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        run: npm ci

      - name: Audit Node.js dependencies
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        run: npm audit --audit-level=high

      - name: Run backend and setup contracts
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        run: npm run test:release

      - name: Restore Godot caches
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-flash-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-flash-godot-4.7.1-
            yakolak-godot-4.7.1-

      - name: Ensure UI fonts exist
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s assets/fonts/thmanyahsans-Regular.otf ] || \
             [ ! -s assets/fonts/thmanyahsans-Light.otf ] || \
             [ ! -s assets/fonts/thmanyahsans-Medium.otf ] || \
             [ ! -s assets/fonts/thmanyahsans-Bold.otf ]; then
            mkdir -p assets/fonts
            BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
            curl -L --fail --retry 3 --retry-delay 1 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
            curl -L --fail --retry 3 --retry-delay 1 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
            curl -L --fail --retry 3 --retry-delay 1 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
            curl -L --fail --retry 3 --retry-delay 1 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          fi

      - name: Flash export Godot Web
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        run: bash scripts/godot-flash-build.sh

      - name: Publish ready files back to main
        if: ${{ !inputs.fast_publish && !contains(github.event.head_commit.message, '[flash-ready]') }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          git fetch origin main
          LATEST_SHA="$(git rev-parse origin/main)"

          if [ "$SOURCE_SHA" != "$LATEST_SHA" ]; then
            echo "A newer main exists; cancel stale flash publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web assets/fonts/thmanyahsans-*.otf
          git commit --allow-empty -m "[flash-ready] publish ${SOURCE_SHA:0:8}"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Require real-device multiplayer acceptance
        run: python3 scripts/check_online_release.py

      - name: Upload Godot Web preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
