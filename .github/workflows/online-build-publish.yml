name: YAKOLAK online build and publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yakolak-main-publish
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install small server dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify online rules and reliability contract
        run: |
          node tests/online_rules.test.mjs
          node tests/online_reliability_contract.test.mjs
      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-
      - name: Build latest web version online
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify gameplay and online recovery before publishing
        run: |
          python3 -m http.server 8000 --directory web >/tmp/yakolak-browser.log 2>&1 &
          npx playwright test tests/gameplay_smoke.spec.js tests/round_transition_smoke.spec.js tests/online_resilience_smoke.spec.js --workers=1 --reporter=line
      - name: Publish tested web files back to main
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "A newer main exists; its workflow will publish instead."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web
          if git diff --cached --quiet; then
            echo "Web output unchanged."
            exit 0
          fi
          git commit -m "[web-ready] نشر نسخة مختبرة حتى انتقال الدور الثاني"
          git push origin HEAD:main
