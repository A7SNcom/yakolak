name: PAGES-015 Draft Release Branch Target Probe Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-015-release-branch-target-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROBE_TAG: pages015-branch-target-probe-32163638806

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Delete disposable draft release
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existed=false
          deleted=false
          if gh release view "$PROBE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existed=true
            gh release delete "$PROBE_TAG" --repo "$GITHUB_REPOSITORY" --yes
            if ! gh release view "$PROBE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              deleted=true
            fi
          else
            deleted=true
          fi
          echo "existed=$existed" >> "$GITHUB_OUTPUT"
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          test "$deleted" = true

      - name: Record cleanup receipt
        env:
          EXISTED: ${{ steps.cleanup.outputs.existed }}
          DELETED: ${{ steps.cleanup.outputs.deleted }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg tag "$PROBE_TAG" \
            --argjson existed "$EXISTED" \
            --argjson deleted "$DELETED" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              gate: "PAGES-015",
              event: "draft_release_branch_target_probe_cleanup",
              workflowRunId: ($runId|tonumber),
              releaseTag: $tag,
              existed: $existed,
              deleted: $deleted,
              qualificationEvidence: false,
              recordedAt: $recordedAt
            }
          ' > RELEASE_QUALIFICATION/PAGES015_BRANCH_TARGET_RELEASE_CLEANUP.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/PAGES015_BRANCH_TARGET_RELEASE_CLEANUP.json
          git commit -m 'PAGES-015 record branch-target probe cleanup'
          git push origin HEAD:threejs-rebuild

# retrigger-after-cleanup-install: 2026-08-18T17:06Z
