name: PAGES-015 Inspect Previous Draft

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pages-015-inspect-previous-draft.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: pages-archive-2026-08-18-geeb3b8e1-t5cc89e05
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Inspect draft metadata without mutation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/releases.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "$releases"
          release_id="$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' "$releases" | head -n1)"
          test -n "$release_id"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > "$RUNNER_TEMP/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > "$RUNNER_TEMP/assets.json"

          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --argjson releaseId "$release_id" \
            --arg tagName "$(jq -r '.tag_name' "$RUNNER_TEMP/release.json")" \
            --arg targetCommitish "$(jq -r '.target_commitish' "$RUNNER_TEMP/release.json")" \
            --argjson draft "$(jq -r '.draft' "$RUNNER_TEMP/release.json")" \
            --argjson immutable "$(jq -r '.immutable // false' "$RUNNER_TEMP/release.json")" \
            --argjson assetCount "$(jq 'length' "$RUNNER_TEMP/assets.json")" \
            --argjson assetNames "$(jq -c '[.[].name] | sort' "$RUNNER_TEMP/assets.json")" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              gate: "PAGES-015",
              event: "previous_draft_metadata_inspected",
              workflowRunId: ($runId|tonumber),
              releaseId: $releaseId,
              tagName: $tagName,
              targetCommitish: $targetCommitish,
              draft: $draft,
              immutable: $immutable,
              assetCount: $assetCount,
              assetNames: $assetNames,
              containsSecretValues: false,
              qualificationEvidence: false,
              recordedAt: $recordedAt
            }
          ' > RELEASE_QUALIFICATION/PAGES015_PREVIOUS_DRAFT_INSPECTION.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/PAGES015_PREVIOUS_DRAFT_INSPECTION.json
          git commit -m 'PAGES-015 record previous draft metadata inspection'
          git push origin HEAD:threejs-rebuild
