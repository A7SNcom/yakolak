name: THREEJS-001 Public Production Baseline Capture

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - .github/workflows/threejs-baseline-capture-v3.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROD_URL: https://yakolak.vercel.app/
      PROD_DEPLOYMENT_URL: https://yakolak-b1evy5x1x-ahmdkcoms-projects.vercel.app
      PROD_DEPLOYMENT_ID: dpl_BRayrP6BRbm2UQUbcLxAPXDVWE1j
      PROD_SHA: 04c75be60501778028e8107992e85c74d113b3da
      MIGRATION_BRANCH: threejs-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Verify baseline source and public app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main threejs-rebuild
          test "$(git merge-base origin/main origin/threejs-rebuild)" = "$PROD_SHA"
          git merge-base --is-ancestor "$PROD_SHA" origin/main
          curl -fsSL --retry 3 "$PROD_URL" -o /tmp/prod.html
          grep -q '<title>YAKOLAK' /tmp/prod.html

      - name: Capture verified public Production views
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright==1.55.0
          mkdir -p docs/threejs-baseline/screenshots
          timeout 150s python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          target = os.environ['PROD_URL']
          out = Path('docs/threejs-baseline/screenshots')
          chrome = next((p for p in ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'] if Path(p).exists()), None)
          if not chrome:
              raise SystemExit('Chrome not found')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, executable_path=chrome, args=['--no-sandbox','--disable-dev-shm-usage'])
              page = browser.new_page(viewport={'width': 390, 'height': 844})
              response = page.goto(target, wait_until='load', timeout=120000)
              if response is None or not response.ok:
                  raise RuntimeError('Public Production did not load successfully')
              page.wait_for_timeout(18000)
              title = page.title()
              if 'YAKOLAK' not in title.upper():
                  raise RuntimeError(f'Unexpected page title: {title}')
              if page.locator('canvas#canvas').count() != 1:
                  raise RuntimeError('Godot canvas not found')
              for width, height, filename in [
                  (320,568,'production-320x568.png'),
                  (390,844,'production-390x844.png'),
                  (1440,900,'production-1440x900.png'),
              ]:
                  page.set_viewport_size({'width': width, 'height': height})
                  page.wait_for_timeout(1000)
                  page.screenshot(path=str(out / filename), full_page=False)
              (out / 'capture-state.txt').write_text(f'url={page.url}\ntitle={title}\ncanvas=present\n', encoding='utf-8')
              browser.close()
          PY
          for f in docs/threejs-baseline/screenshots/production-*.png; do test -s "$f"; done

      - name: Rewrite verified baseline manifest
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          CAPTURED_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          MAIN_SHA_AT_CAPTURE="$(git rev-parse origin/main)"
          START_SHA="$(git merge-base origin/main HEAD)"
          test "$MAIN_SHA_AT_CAPTURE" = "$PROD_SHA"
          PAGE_TITLE="$(sed -n 's/^title=//p' docs/threejs-baseline/screenshots/capture-state.txt)"
          H320="$(sha256sum docs/threejs-baseline/screenshots/production-320x568.png | awk '{print $1}')"
          H390="$(sha256sum docs/threejs-baseline/screenshots/production-390x844.png | awk '{print $1}')"
          H1440="$(sha256sum docs/threejs-baseline/screenshots/production-1440x900.png | awk '{print $1}')"
          cat > docs/threejs-baseline/BASELINE.md <<EOF
          # THREEJS-001 — Safe Migration Baseline

          Frozen from the Godot Production that was current when \`threejs-rebuild\` was created.

          ## Source of truth

          - Canonical Production URL: ${PROD_URL}
          - Vercel Production deployment URL: ${PROD_DEPLOYMENT_URL}
          - Vercel deployment ID: ${PROD_DEPLOYMENT_ID}
          - Production Git SHA / branch creation SHA: \`${PROD_SHA}\`
          - Migration branch: \`${MIGRATION_BRANCH}\`
          - Migration branch base SHA: \`${START_SHA}\`
          - Latest \`main\` observed when capture completed: \`${MAIN_SHA_AT_CAPTURE}\`
          - Captured UTC: ${CAPTURED_UTC}
          - Captured page title: ${PAGE_TITLE}
          - Capture validation: public Godot canvas present

          ## Isolation rule

          Until explicit cutover, all Three.js rewrite work belongs only on \`${MIGRATION_BRANCH}\`. Do not merge, fast-forward, or deploy this branch to Production. Existing Godot \`main\` and the canonical Production alias remain the reference implementation.

          ## Reference screenshots

          - \`screenshots/production-320x568.png\` — SHA-256 \`${H320}\`
          - \`screenshots/production-390x844.png\` — SHA-256 \`${H390}\`
          - \`screenshots/production-1440x900.png\` — SHA-256 \`${H1440}\`

          These screenshots were captured from the public canonical Production URL while Vercel Production and \`main\` were both verified at \`${PROD_SHA}\`.
          EOF

      - name: Finalize corrected branch-only baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/threejs-baseline-capture-v3.yml
          git add docs/threejs-baseline
          git commit -m "THREEJS-001 verify production screenshots"
          git pull --rebase origin threejs-rebuild
          git push origin HEAD:threejs-rebuild
