name: Verify Developer D1

on:
  push:
    branches:
      - agent/developer-d1-scene-gallery
  pull_request:
    paths:
      - developer.html
      - developer-scene.html
      - package.json
      - api/developer-d1.js
      - api/developer-d1-workspace.js
      - api/developer-d1-comparisons.js
      - src/developer-d1.js
      - src/developer-d1-workspace.js
      - src/developer-d1-before-after.js
      - src/developer-d1-board-v2.js
      - src/developer-d1-registry.js
      - src/developer-scene-d1.js
      - src/developer-scene-d1-router.js
      - src/developer-scene-d1-logo-helper.js
      - src/app-game-developer-d1.js
      - docs/design/developer-d1-scene-board-concept.svg
      - scripts/verify-developer-d1.mjs
      - scripts/verify-developer-d1-workspace.mjs
      - scripts/visual-developer-d1.mjs
      - scripts/visual-developer-d1-workspace.mjs
      - .github/workflows/developer-d1.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify D1 structure and syntax
        run: |
          node --check api/developer-d1.js
          node --check api/developer-d1-workspace.js
          node --check api/developer-d1-comparisons.js
          node --check src/developer-d1-registry.js
          node --check src/developer-d1.js
          node --check src/developer-d1-workspace.js
          node --check src/developer-d1-before-after.js
          node --check src/developer-d1-board-v2.js
          node --check src/developer-scene-d1.js
          node --check src/developer-scene-d1-router.js
          node --check src/developer-scene-d1-logo-helper.js
          node --check src/app-game-developer-d1.js
          node scripts/verify-developer-d1.mjs
          node scripts/verify-developer-d1-workspace.mjs
      - name: Install Chromium quietly
        run: |
          npm install --no-save --silent playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start Developer D1 locally
        run: |
          python3 -m http.server 4173 > /tmp/developer-d1-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/developer.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/developer-d1-server.log
          exit 1
      - name: Verify central reviews scenes elements and persisted statuses
        run: node scripts/visual-developer-d1.mjs
      - name: Verify requests board v2 before-after replay and published preview
        run: node scripts/visual-developer-d1-workspace.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-d1-visuals
          path: artifacts/developer-d1
          if-no-files-found: warn
