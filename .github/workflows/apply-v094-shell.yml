name: Apply v094 onboarding shell

on:
  push:
    branches: [feature/v094-interactive-onboarding]
    paths: [.github/workflows/apply-v094-shell.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v094-interactive-onboarding
          fetch-depth: 0
      - name: Wire v094 shell and onboarding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          s=s.replace('v092-calibration-tutorial-fixes','v094-interactive-onboarding')
          s=s.replace("const BUILD='92';","const BUILD='94';")
          p.write_text(s)

          Path('app.js').write_text("""console.info('[Yakolak] APP.JS v094 INTERACTIVE ONBOARDING LOADED');

const BUILD='94';
await import('./src/app-game-v085.js?v='+BUILD);
await import('./src/onboarding-v094.js?v='+BUILD);
""")

          Path('version.json').write_text('''{
            "version": "v094-interactive-onboarding",
            "build": 94,
            "updated_at": "2026-07-13",
            "note": "Adds a replayable interactive onboarding journey with skip, smart hints, progress memory, tutorial speed controls, and mobile-first guidance without changing game rules."
          }\n''')
          PY
          node --check app.js
          node --check src/onboarding-v094.js
          rm -f .github/workflows/apply-v094-shell.yml
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Wire v094 interactive onboarding shell"
          git push origin HEAD:feature/v094-interactive-onboarding
