name: PAGES-005 Cloudflare backend

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'backend/cloudflare/**'
      - 'scripts/pages005-bootstrap-live.sh'
      - 'scripts/pages015-finalize-live-window.sh'
      - 'scripts/probe-pages005-cloudflare-roundtrip.mjs'
      - 'scripts/probe-pages015-live-compatibility.mjs'
      - 'scripts/verify-pages015-frontend-window.mjs'
      - 'tests/pages_backend_runtime_contract.test.mjs'
      - 'tests/pages_online_compatibility_contract.test.mjs'
      - 'tests/pages005_worker_lock_identity_contract.test.mjs'
      - 'tests/pages015-browser-cors.spec.js'
      - '.github/workflows/pages-005-cloudflare-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-005-cloudflare-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate backend/finalizer helper syntax
        run: |
          bash -n scripts/pages005-bootstrap-live.sh
          bash -n scripts/pages015-finalize-live-window.sh
          node --check scripts/verify-pages015-frontend-window.mjs
      - name: Install runtime dependency
        run: npm install --ignore-scripts
      - name: Worker and online compatibility contract tests
        run: node --test tests/pages_backend_runtime_contract.test.mjs tests/pages_online_compatibility_contract.test.mjs tests/pages005_worker_lock_identity_contract.test.mjs
      - name: Wrangler dry-run bundle
        run: npx --yes wrangler@4 deploy --dry-run --config backend/cloudflare/wrangler.jsonc --outdir .tmp/pages005-worker

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-backend
    concurrency:
      group: pages-release-qualification-ledger
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate backend/finalizer helper syntax
        run: |
          bash -n scripts/pages005-bootstrap-live.sh
          bash -n scripts/pages015-finalize-live-window.sh
          node --check scripts/verify-pages015-frontend-window.mjs
      - name: Deploy and prove exact Cloudflare/Turso rollback window
        run: bash scripts/pages005-bootstrap-live.sh
