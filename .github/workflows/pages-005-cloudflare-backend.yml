name: PAGES-005 Cloudflare backend

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'backend/cloudflare/**'
      - 'scripts/probe-pages005-cloudflare-roundtrip.mjs'
      - 'tests/pages_backend_runtime_contract.test.mjs'
      - '.github/workflows/pages-005-cloudflare-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-005-cloudflare-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install runtime dependency
        run: npm install --ignore-scripts
      - name: Worker contract tests
        run: node --test tests/pages_backend_runtime_contract.test.mjs
      - name: Wrangler dry-run bundle
        run: npx --yes wrangler@4 deploy --dry-run --config backend/cloudflare/wrangler.jsonc --outdir .tmp/pages005-worker

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: cloudflare-backend
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install runtime dependency
        run: npm install --ignore-scripts
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$TURSO_DATABASE_URL" || { echo 'missing TURSO_DATABASE_URL'; exit 1; }
          test -n "$TURSO_AUTH_TOKEN" || { echo 'missing TURSO_AUTH_TOKEN'; exit 1; }
      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend/cloudflare
          wranglerVersion: '4'
          command: deploy
          secrets: |
            TURSO_DATABASE_URL
            TURSO_AUTH_TOKEN
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - name: Prove live room write/read round trip
        id: live
        env:
          API_ORIGIN: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          test -n "$API_ORIGIN" || { echo 'Wrangler did not return deployment-url'; exit 1; }
          case "$API_ORIGIN" in
            https://*.vercel.app*) echo 'refusing Vercel API_ORIGIN'; exit 1 ;;
            https://*) ;;
            *) echo "invalid API_ORIGIN: $API_ORIGIN"; exit 1 ;;
          esac
          api_origin="${API_ORIGIN%/}"
          if [[ "${api_origin#https://}" == */* ]]; then
            echo "API_ORIGIN must be a bare HTTPS origin: ${api_origin}" >&2
            exit 1
          fi
          node scripts/probe-pages005-cloudflare-roundtrip.mjs "$api_origin"
          echo "api_origin=$api_origin" >> "$GITHUB_OUTPUT"
          echo "PAGES005_API_ORIGIN=$api_origin" >> "$GITHUB_STEP_SUMMARY"
      - name: Lock proven public API_ORIGIN on threejs-rebuild
        env:
          API_ORIGIN: ${{ steps.live.outputs.api_origin }}
        run: |
          set -euo pipefail
          test -n "$API_ORIGIN"
          git fetch --quiet origin threejs-rebuild
          git checkout -B threejs-rebuild origin/threejs-rebuild
          mkdir -p backend/cloudflare
          printf '%s\n' "$API_ORIGIN" > backend/cloudflare/API_ORIGIN.txt
          if git diff --quiet -- backend/cloudflare/API_ORIGIN.txt && git ls-files --error-unmatch backend/cloudflare/API_ORIGIN.txt >/dev/null 2>&1; then
            echo 'Locked API_ORIGIN already matches the proven live origin.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cloudflare/API_ORIGIN.txt
          git diff --cached --name-only | grep -qx 'backend/cloudflare/API_ORIGIN.txt'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'PAGES-005 lock proven Cloudflare API_ORIGIN'
          git push origin HEAD:threejs-rebuild
