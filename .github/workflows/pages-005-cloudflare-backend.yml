name: PAGES-005 Cloudflare backend

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - 'backend/cloudflare/**'
      - 'package.json'
      - 'scripts/pages005-bootstrap-live.sh'
      - 'scripts/pages015-finalize-live-window.sh'
      - 'scripts/pages015-orchestrate-qualification.sh'
      - 'scripts/append-pages015-qualification.mjs'
      - 'scripts/probe-pages005-cloudflare-roundtrip.mjs'
      - 'scripts/probe-pages015-live-compatibility.mjs'
      - 'scripts/verify-pages015-frontend-window.mjs'
      - 'scripts/verify-pages015-current-lock-qualification.mjs'
      - 'scripts/verify-release-qualification.mjs'
      - 'tests/pages_backend_runtime_contract.test.mjs'
      - 'tests/pages_online_compatibility_contract.test.mjs'
      - 'tests/pages005_worker_lock_identity_contract.test.mjs'
      - 'tests/pages015_current_lock_qualification_contract.test.mjs'
      - 'tests/pages015_release_verifier_window_contract.test.mjs'
      - 'tests/pages015_single_resume_path_contract.test.mjs'
      - 'tests/pages015_retired_pages012_preserve_contract.test.mjs'
      - 'tests/pages015_online_compatibility_doc_contract.test.mjs'
      - 'tests/pages015-browser-cors.spec.js'
      - 'PAGES_ONLINE_COMPATIBILITY.md'
      - 'PAGES_RELEASE_ARCHIVES.md'
      - 'RELEASE_QUALIFICATION/README.md'
      - '.github/workflows/pages-005-cloudflare-backend.yml'
      - '.github/workflows/pages-012-immutable-release.yml'
      - '.github/workflows/pages-012-preserve-source.yml'
      - '.github/workflows/pages-012-rollback.yml'
      - '.github/workflows/pages-015-online-compatibility.yml'
      - '.github/workflows/pages-015-window-archive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-005-cloudflare-backend
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate backend/finalizer helper syntax
        run: |
          bash -n scripts/pages005-bootstrap-live.sh
          bash -n scripts/pages015-finalize-live-window.sh
          node --check scripts/append-pages015-qualification.mjs
          node --check scripts/verify-pages015-frontend-window.mjs
          node --check scripts/verify-pages015-current-lock-qualification.mjs
          node --check scripts/verify-release-qualification.mjs
          node --check tests/pages015-browser-cors.spec.js
      - name: Install pinned toolchain
        run: npm install --ignore-scripts
      - name: Verify pinned deployment/test runtimes
        run: |
          node --input-type=module -e "import { test, expect } from '@playwright/test'; if (!test || !expect) process.exit(1)"
          test "$(node -p "require('./node_modules/wrangler/package.json').version")" = "4.123.0"
      - name: Worker and online compatibility contract tests
        run: node --test tests/pages_backend_runtime_contract.test.mjs tests/pages_online_compatibility_contract.test.mjs tests/pages005_worker_lock_identity_contract.test.mjs tests/pages015_current_lock_qualification_contract.test.mjs tests/pages015_release_verifier_window_contract.test.mjs tests/pages015_single_resume_path_contract.test.mjs tests/pages015_retired_pages012_preserve_contract.test.mjs
      - name: Wrangler dry-run bundle
        run: ./node_modules/.bin/wrangler deploy --dry-run --config backend/cloudflare/wrangler.jsonc --outdir .tmp/pages005-worker

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-backend
    concurrency:
      group: pages-release-qualification-ledger
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate backend/finalizer helper syntax
        run: |
          bash -n scripts/pages005-bootstrap-live.sh
          bash -n scripts/pages015-finalize-live-window.sh
          node --check scripts/append-pages015-qualification.mjs
          node --check scripts/verify-pages015-frontend-window.mjs
          node --check scripts/verify-pages015-current-lock-qualification.mjs
          node --check scripts/verify-release-qualification.mjs
          node --check tests/pages015-browser-cors.spec.js
      - name: Deploy and prove exact Cloudflare/Turso rollback window
        run: bash scripts/pages005-bootstrap-live.sh
