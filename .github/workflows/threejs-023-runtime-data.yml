name: THREEJS-023 runtime data verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'YAKOLAK_PORTABLE_KIT/assets/layout/world-layout.json'
      - 'YAKOLAK_PORTABLE_KIT/assets/layout/intro-scatter.csv'
      - 'YAKOLAK_PORTABLE_KIT/assets/reference/approved-contract.json'
      - 'web/app/**'
      - 'scripts/verify-threejs-runtime-data.mjs'
      - 'scripts/verify-threejs-runtime-data-browser.mjs'
      - 'tests/threejs_runtime_data_contract.test.mjs'
      - '.github/workflows/threejs-023-runtime-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify immutable canonical data and hard-code ownership
        run: node scripts/verify-threejs-runtime-data.mjs
      - name: Run THREEJS-023 contract test
        run: node --test tests/threejs_runtime_data_contract.test.mjs
      - name: Install browser verifier only
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prepare verified runtime assets
        run: node scripts/prepare-threejs-runtime-assets.mjs
      - name: Serve static web source
        shell: bash
        run: |
          python3 -m http.server 4173 --directory web > /tmp/threejs-023-http.log 2>&1 &
          echo $! > /tmp/threejs-023-http.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/threejs-023-http.log
          exit 1
      - name: Verify immutable runtime data in Chromium
        run: node scripts/verify-threejs-runtime-data-browser.mjs
