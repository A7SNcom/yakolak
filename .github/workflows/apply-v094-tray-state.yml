name: Apply v094 robust tray state

on:
  push:
    branches: [feature/v094-interactive-onboarding]
    paths:
      - tests/e2e/verify-v094-onboarding.mjs
      - .github/workflows/apply-v094-tray-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v094-interactive-onboarding
          fetch-depth: 0
      - name: Make tray-open detection robust
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/onboarding-v094.js')
          s=p.read_text()
          old="if(wait==='tray-open')return g?.pieces?.some(p=>p.mesh?.userData?.inTray);if(wait==='piece-selected')return g?.pieces?.some(p=>p.mesh?.userData?.traySelected);"
          new="if(wait==='tray-open')return g?.pieces?.some(p=>p.mesh?.userData?.inTray||p.mesh?.userData?.traySelected);if(wait==='piece-selected')return g?.pieces?.some(p=>p.mesh?.userData?.traySelected);"
          if new not in s:
              if old not in s: raise SystemExit('tray-open anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check src/onboarding-v094.js
          rm -f .github/workflows/apply-v094-tray-state.yml
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Stabilize v094 tray-open onboarding transition"
          git push origin HEAD:feature/v094-interactive-onboarding
