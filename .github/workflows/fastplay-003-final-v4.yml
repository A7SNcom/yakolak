name: FASTPLAY-003 Final Public Acceptance v4

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/fastplay-003-final-v4.yml'

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-v4
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve web milestone
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark final acceptance pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-003/final-public' \
            -f description='v4 bounded public first-playable acceptance running' \
            -f target_url="$run_url"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build v4 verifier
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fastplay-003-final-v3.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          builder = textwrap.dedent(workflow[start:end])
          Path('/tmp/build-fastplay003-v3.py').write_text(builder)
          PY
          python /tmp/build-fastplay003-v3.py

          python - <<'PY'
          from pathlib import Path
          path = Path('fastplay-003-final-v3.mjs')
          source = path.read_text()
          a = source.index('async function allowRealTimeout(page) {')
          b = source.index('\nasync function verifyWebglRecovery', a)
          timeout = r'''async function allowRealTimeout(page) {
            const turnDurationMs = await page.evaluate(async () => {
              const deadlineModule = await import(new URL('app/session/local-turn-deadline.js', location.href).href);
              return deadlineModule.LOCAL_TURN_DURATION_MS;
            });
            assert.equal(turnDurationMs, 18_000, 'local turn duration drifted from 18 seconds');

            let observation = null;
            for (let attempt = 0; attempt < 800; attempt += 1) {
              const state = await getState(page);
              const seat = state.seats.find(candidate => candidate.seatId === state.activeSeatId);
              const nowMs = await page.evaluate(() => Date.now());
              const remainingMs = state.deadlineAtMs === null ? null : state.deadlineAtMs - nowMs;
              if (
                seat?.type === 'human'
                && Number.isSafeInteger(state.deadlineAtMs)
                && remainingMs > 0
                && remainingMs <= turnDurationMs
              ) {
                observation = {
                  state,
                  remainingMs,
                  startedAt: await page.evaluate(() => performance.now()),
                  turnDurationMs,
                };
                break;
              }
              await page.waitForTimeout(25);
            }
            assert.ok(observation, 'no unexpired human timeout window observed');

            const before = observation.state;
            const seat = before.seats.find(candidate => candidate.seatId === before.activeSeatId);
            assert.equal(seat?.type, 'human', 'real timeout must begin on the human seat');
            const timeoutSkipCountBefore = (before.skips || [])
              .filter(skip => skip.seatId === seat.seatId && skip.reason === 'timeout').length;

            await page.waitForTimeout(500);
            const early = await getState(page);
            assert.equal(early.revision, before.revision, 'authority advanced before human timeout window');
            assert.equal(early.activeSeatId, before.activeSeatId, 'active seat changed before human timeout window');

            const minimumElapsedMs = Math.max(0, observation.remainingMs - 350);
            await page.waitForTimeout(Math.max(0, minimumElapsedMs - 500));

            let transition = null;
            for (let attempt = 0; attempt < 200; attempt += 1) {
              const state = await getState(page);
              const timeoutSkips = (state.skips || [])
                .filter(skip => skip.seatId === seat.seatId && skip.reason === 'timeout').length;
              const direct = state.revision === before.revision + 1
                && timeoutSkips > timeoutSkipCountBefore
                && state.activeSeatId !== seat.seatId;
              const followed = state.revision >= before.revision + 2
                && state.lastMove?.seatId !== seat.seatId;
              if (direct || followed) {
                transition = {
                  revision: state.revision,
                  activeSeatId: state.activeSeatId,
                  deadlineAtMs: state.deadlineAtMs,
                  lastMove: state.lastMove,
                  timeoutSkips,
                  direct,
                  followed,
                };
                break;
              }
              await page.waitForTimeout(25);
            }
            assert.ok(transition, 'authoritative timeout transition was not observed');

            const elapsedMs = await page.evaluate(startedAt => performance.now() - startedAt, observation.startedAt);
            assert.ok(elapsedMs >= minimumElapsedMs, `timeout advanced too early after ${elapsedMs}ms`);
            console.log(JSON.stringify({
              stage: 'real-timeout-pass',
              beforeRevision: before.revision,
              beforeSeatId: seat.seatId,
              deadlineAtMs: before.deadlineAtMs,
              remainingMs: observation.remainingMs,
              turnDurationMs: observation.turnDurationMs,
              observedRevision: transition.revision,
              observedSeatId: transition.activeSeatId,
              observedLastMove: transition.lastMove,
              observedTimeoutSkips: transition.timeoutSkips,
              direct: transition.direct,
              followed: transition.followed,
              elapsedMs,
            }));
            return {
              seatId: seat.seatId,
              deadlineAtMs: before.deadlineAtMs,
              turnDurationMs: observation.turnDurationMs,
              observedRevision: transition.revision,
              elapsedMs,
              direct: transition.direct,
              followed: transition.followed,
            };
          }
          '''
          path.write_text(source[:a] + timeout + source[b:])
          PY
          node --check fastplay-003-final-v3.mjs
          ! grep -Fq "waitForFunction(async" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'real-timeout-pass'" fastplay-003-final-v3.mjs

      - name: Exercise full public first playable
        id: run
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: timeout --signal=TERM 12m node fastplay-003-final-v3.mjs 2>&1 | tee fastplay-003-final-v4.log

      - name: Freeze accepted generation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          result="$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)"
          git cat-file -e "${candidate}^{commit}" 2>/dev/null || git fetch --quiet origin "${candidate}"
          git merge-base --is-ancestor "${MILESTONE_SHA}" "${candidate}"
          test "$result" = PASS
          test -n "$generation"

          freeze_branch='first-playable-experimental'
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${freeze_branch}" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/${freeze_branch}" \
              -f sha="$candidate" >/dev/null
          elif [ "$existing" != "$candidate" ]; then
            echo "freeze branch already points to ${existing}" >&2
            exit 1
          fi

          title='FIRST_PLAYABLE_EXPERIMENTAL=PASS'
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "FIRST_PLAYABLE_EXPERIMENTAL=PASS") | .number' | head -n 1)"
          body="$(mktemp)"
          cat > "$body" <<BODY
          FIRST_PLAYABLE_EXPERIMENTAL=PASS

          milestone_sha: ${MILESTONE_SHA}
          candidate_sha: ${candidate}
          deployment_generation: ${generation}
          public_url: https://a7sncom.github.io/yakolak/threejs/
          freeze_branch: ${freeze_branch}
          workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Verified on the actual public page: desktop + mobile portrait Human/Computer setup, real pointer tap and drag across live remaining piece copies, authoritative 18-second human timeout, round scoring, next round, full match, rematch, return to setup, refresh recovery, WebGL loss/restore and no fatal/page errors.
          BODY
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$title" --body-file "$body" >/dev/null
          else
            gh issue edit "$existing_issue" --body-file "$body" --state open >/dev/null
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-003/final-public' \
            -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS; public candidate frozen' \
            -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=success \
            -f context='FASTPLAY-003/first-playable' \
            -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' \
            -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" \
            -f state=success \
            -f context='FASTPLAY-003/public-pass' \
            -f description='Public first-playable acceptance passed' \
            -f target_url="$run_url"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-final-v4-${{ steps.candidate.outputs.sha }}
          path: |
            fastplay-003-acceptance.json
            fastplay-003-final-v4.log
          if-no-files-found: warn
          retention-days: 90

      - name: Publish failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=failure \
            -f context='FASTPLAY-003/final-public' \
            -f description='v4 bounded public first-playable acceptance failed' \
            -f target_url="$run_url"

          title="FASTPLAY-003 final-v4 blocker ${MILESTONE_SHA}"
          body="$(mktemp)"
          {
            echo 'FASTPLAY-003 final-v4 public acceptance failed.'
            echo
            echo "milestone_sha: ${MILESTONE_SHA}"
            echo "workflow_run: ${run_url}"
            echo
            echo '```text'
            tail -n 220 fastplay-003-final-v4.log 2>/dev/null || echo '(verifier log unavailable; failure occurred before verifier execution)'
            echo '```'
          } > "$body"
          existing_issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "$existing_issue" ]; then
            gh issue create --title "$title" --body-file "$body" >/dev/null
          else
            gh issue edit "$existing_issue" --body-file "$body" >/dev/null
          fi
