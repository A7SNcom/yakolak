name: Apply fast reduced motion tutorial

on:
  push:
    branches: [feature/v093-visual-mobile]
    paths: [.github/workflows/apply-v093-fast-tutorial.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v093-visual-mobile
          fetch-depth: 0
      - name: Patch tutorial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app-game-v085.js')
          s=p.read_text()
          old="""async function runTutorial(){
  gameState.tutorial=true;
  await setCameraView({x:520,y:430,z:520},{x:0,y:0,z:0},520);
  const color=gameState.humanColor||'right';"""
          new="""async function runTutorial(){
  gameState.tutorial=true;
  await setCameraView({x:520,y:430,z:520},{x:0,y:0,z:0},520);
  if(REDUCED_MOTION){
    const prompts=['هل فهمت فوز ثلاث قطع من نفس الحجم؟','هل فهمت فوز الخط المتدرج؟','هل فهمت فوز نفس الخانة؟'];
    for(const text of prompts)await tutorialCheckpoint(text,()=>Promise.resolve());
    clearHighlights();caption('دورك: افتح طقمك، اختر الحجم، ثم اضغط خانة متاحة.');
    gameState.tutorial=false;
    return;
  }
  const color=gameState.humanColor||'right';"""
          if new not in s:
              if old not in s: raise SystemExit('runTutorial anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check src/app-game-v085.js
      - name: Commit patch
        run: |
          rm -f .github/workflows/apply-v093-fast-tutorial.yml
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Use direct tutorial checkpoints in reduced motion"
          git push origin HEAD:feature/v093-visual-mobile
