name: Apply v097 adaptive mobile clarity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-v097-mobile-crisp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply adaptive crisp mobile profile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          game = Path('src/app-game-v085.js')
          s = game.read_text()
          old = """const PERFORMANCE_MODE=!PERF_PARAMS.has('quality-full');
          const performancePixelRatio=()=>PERFORMANCE_MODE?(innerWidth<=900?Math.min(Math.max(devicePixelRatio||1,1),1.1):.9):Math.min(Math.max(devicePixelRatio||1,1),1.25);
          globalThis.__yakolakPerformance={enabled:PERFORMANCE_MODE,get pixelRatio(){return renderer?.getPixelRatio?.()||performancePixelRatio()}};"""
          new = """const PERFORMANCE_MODE=!PERF_PARAMS.has('quality-full');
          const MOBILE_VIEW=innerWidth<=900;
          const DEVICE_MEMORY=Number(navigator.deviceMemory||4);
          const CPU_CORES=Number(navigator.hardwareConcurrency||4);
          const MOBILE_HIGH_QUALITY=MOBILE_VIEW&&DEVICE_MEMORY>=4&&CPU_CORES>=6;
          const performancePixelRatio=()=>{
            const dpr=Math.max(devicePixelRatio||1,1);
            if(!PERFORMANCE_MODE)return Math.min(dpr,1.5);
            if(!MOBILE_VIEW)return .9;
            if(MOBILE_HIGH_QUALITY)return Math.min(dpr,1.4);
            if(DEVICE_MEMORY>=4||CPU_CORES>=6)return Math.min(dpr,1.25);
            return Math.min(dpr,1.1);
          };
          globalThis.__yakolakPerformance={enabled:PERFORMANCE_MODE,mobileHighQuality:MOBILE_HIGH_QUALITY,get pixelRatio(){return renderer?.getPixelRatio?.()||performancePixelRatio()}};"""
          if old not in s:
              raise SystemExit('v096 performance profile anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});", "const renderer=new THREE.WebGLRenderer({antialias:MOBILE_HIGH_QUALITY,alpha:false,powerPreference:'high-performance'});", 1)
          s = s.replace("addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render()},{passive:true});", "addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(performancePixelRatio());renderer.setSize(innerWidth,innerHeight);render()},{passive:true});", 1)
          s = s.replace("const BUILD='96';", "const BUILD='97';", 1)
          game.write_text(s)

          app = Path('app.js')
          a = app.read_text().replace('v096 MOBILE CLARITY', 'v097 ADAPTIVE MOBILE CRISP').replace("const BUILD='96';", "const BUILD='97';")
          app.write_text(a)

          index = Path('index.html')
          x = index.read_text().replace('v096-mobile-clarity', 'v097-adaptive-mobile-crisp').replace("const BUILD='96';", "const BUILD='97';")
          index.write_text(x)

          version = Path('version.json')
          v = json.loads(version.read_text())
          v.update({
              'version': 'v097-adaptive-mobile-crisp',
              'build': 97,
              'updated_at': '2026-07-23',
              'note': 'Adaptive mobile clarity: up to 1.4 pixel ratio with antialiasing on capable phones, balanced tiers for mid-range and low-end devices, and pixel ratio refresh after orientation changes.'
          })
          version.write_text(json.dumps(v, ensure_ascii=False, indent=2) + '\n')

          Path('.github/workflows/apply-v097-mobile-crisp.yml').unlink()
          PY
          node --check src/app-game-v085.js
          git config user.name yakolak-agent
          git config user.email ahmad.bn.kamal@gmail.com
          git add -A
          git commit -m "Improve v097 adaptive mobile clarity"
          git push origin HEAD:main
