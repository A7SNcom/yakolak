name: PAGES-012 Immutable Release Archive

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - "PAGES_RELEASE_ARCHIVES.md"
      - "scripts/verify-release-qualification.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-release-qualification-ledger
  cancel-in-progress: false

env:
  RELEASE_TAG: pages-archive-2026-08-17-gfbc0d15-t6b125c04
  GODOT_ROOT_SHA: fbc0d15c574a40c4a9f31c96d42c2f03b424bb39
  THREEJS_CANDIDATE_SHA: 6b125c04938330e1d6de4621e60a9f9e7757b556
  SOURCE_PAGES_RUN_ID: "32030598002"
  SOURCE_PAGES_ARTIFACT_ID: "9288731607"
  PRESERVED_SOURCE_RUN_ID: "32040323006"
  PREPARED_ARTIFACT_ID: "9291854729"
  PREPARED_ARTIFACT_ZIP_SHA256: ab23adcee5a8b2b5a4d743e014ba0689e8d3e4a9023957e92934de9dbebdb3c7
  PRESERVED_PAGES_TAR_SHA256: 799befc38e6dd6a86851bb62337093a1c1c863da68015d08b94f8235677efa9a

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require release Administration credential before archive recovery
        shell: bash
        env:
          ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "PAGES_RELEASE_ADMIN_TOKEN is required before exact-byte archive recovery or release mutation." >&2
            echo "Use a repository Actions secret backed by a token with Administration read/write for A7SNcom/yakolak." >&2
            exit 1
          fi
          echo "Release Administration credential is present; continuing with exact-byte recovery."

      - name: Recover the preserved prepared release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf release-assets prepared.zip draft-download immutable-download restore-proof
          mkdir -p release-assets draft-download

          curl --fail --location --retry 3 --retry-all-errors \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREPARED_ARTIFACT_ID}/zip" \
            --output prepared.zip

          actual_zip_sha="$(sha256sum prepared.zip | awk '{print $1}')"
          test "${actual_zip_sha}" = "${PREPARED_ARTIFACT_ZIP_SHA256}"
          unzip -q prepared.zip -d release-assets

          cat > /tmp/pages012-expected-assets.txt <<'EOF'
          ARCHIVE_SHA256SUMS
          GODOT_ROOT_FILES_SHA256
          IMMUTABLE_FACTS.json
          PAGES_COMPOSITE_FILES_SHA256
          THREEJS_FILES_SHA256
          godot-root.tar
          pages-composite.tar
          threejs-candidate.tar
          EOF
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > /tmp/pages012-actual-assets.txt
          diff -u /tmp/pages012-expected-assets.txt /tmp/pages012-actual-assets.txt

      - name: Verify exact bytes and immutable facts before touching Releases
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum -c ARCHIVE_SHA256SUMS
          )

          composite_sha="$(sha256sum release-assets/pages-composite.tar | awk '{print $1}')"
          test "${composite_sha}" = "${PRESERVED_PAGES_TAR_SHA256}"

          manifest_sha="$(sha256sum release-assets/ARCHIVE_SHA256SUMS | awk '{print $1}')"
          facts_manifest_sha="$(jq -r '.archiveSha256ManifestSha256' release-assets/IMMUTABLE_FACTS.json)"
          test "${manifest_sha}" = "${facts_manifest_sha}"

          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${THREEJS_CANDIDATE_SHA}" \
            --arg godot "${GODOT_ROOT_SHA}" \
            --arg three "${THREEJS_CANDIDATE_SHA}" \
            --argjson sourceRun "${SOURCE_PAGES_RUN_ID}" \
            --argjson sourceArtifact "${SOURCE_PAGES_ARTIFACT_ID}" \
            --argjson preservedRun "${PRESERVED_SOURCE_RUN_ID}" \
            --arg digest "${PRESERVED_PAGES_TAR_SHA256}" \
            '.releaseTag == $tag and
             .releaseTargetSha == $target and
             .source.godotRootSha == $godot and
             .source.threejsCandidateSha == $three and
             .source.pagesRunId == $sourceRun and
             .source.pagesArtifactId == $sourceArtifact and
             .source.preservedSourceRunId == $preservedRun and
             .source.preservedPagesTarSha256 == $digest and
             .archives["pages-composite.tar"].sha256 == $digest and
             .mutationPolicy == "immutable-release-bytes-never-change"' \
            release-assets/IMMUTABLE_FACTS.json >/dev/null

          test "$(sha256sum release-assets/GODOT_ROOT_FILES_SHA256 | awk '{print $1}')" = \
            "$(jq -r '.archives["godot-root.tar"].contentManifestSha256' release-assets/IMMUTABLE_FACTS.json)"
          test "$(sha256sum release-assets/THREEJS_FILES_SHA256 | awk '{print $1}')" = \
            "$(jq -r '.archives["threejs-candidate.tar"].contentManifestSha256' release-assets/IMMUTABLE_FACTS.json)"
          test "$(sha256sum release-assets/PAGES_COMPOSITE_FILES_SHA256 | awk '{print $1}')" = \
            "$(jq -r '.archives["pages-composite.tar"].contentManifestSha256' release-assets/IMMUTABLE_FACTS.json)"

      - name: Stage or validate the mutable draft with every exact asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
          release_id="$(jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' /tmp/releases.json | head -n1)"

          if [ -z "${release_id}" ]; then
            cat > /tmp/release-notes.md <<EOF
          Exact-byte YAKOLAK Pages archive from successful Pages run ${SOURCE_PAGES_RUN_ID}.

          Godot root source SHA: ${GODOT_ROOT_SHA}
          Three.js candidate source SHA: ${THREEJS_CANDIDATE_SHA}
          Exact deployed Pages artifact ID: ${SOURCE_PAGES_ARTIFACT_ID}
          Exact composite SHA-256: ${PRESERVED_PAGES_TAR_SHA256}

          This release is staged as a draft first. Publication is blocked until repository release immutability is independently verified enabled. Deployment-generation and backend-compatibility evidence live only in the additive RELEASE_QUALIFICATION ledger; immutable release bytes never change.
          EOF

            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${THREEJS_CANDIDATE_SHA}" \
              --title "YAKOLAK exact-byte Pages archive ${RELEASE_TAG}" \
              --notes-file /tmp/release-notes.md \
              --latest=false \
              --draft

            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json
            release_id="$(jq -r --arg tag "${RELEASE_TAG}" '.[] | select(.tag_name == $tag) | .id' /tmp/releases.json | head -n1)"
            test -n "${release_id}"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > /tmp/release.json
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg target "${THREEJS_CANDIDATE_SHA}" \
            '.tag_name == $tag and .draft == true and ((.immutable // false) == false) and .target_commitish == $target' \
            /tmp/release.json >/dev/null || {
              echo "Existing release is not the expected mutable draft; refusing to mutate it." >&2
              cat /tmp/release.json >&2
              exit 1
            }

          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > /tmp/assets.json
          while IFS= read -r name; do
            existing_id="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' /tmp/assets.json | head -n1)"
            if [ -z "${existing_id}" ]; then
              gh release upload "${RELEASE_TAG}" "release-assets/${name}" --repo "${GITHUB_REPOSITORY}"
              gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" > /tmp/assets.json
            fi
          done < /tmp/pages012-expected-assets.txt

          jq -r '.[].name' /tmp/assets.json | LC_ALL=C sort > /tmp/draft-asset-names.txt
          diff -u /tmp/pages012-expected-assets.txt /tmp/draft-asset-names.txt

          while IFS= read -r name; do
            asset_id="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .id' /tmp/assets.json | head -n1)"
            test -n "${asset_id}"
            curl --fail --location --retry 3 --retry-all-errors \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
              --output "draft-download/${name}"
            cmp "release-assets/${name}" "draft-download/${name}"
          done < /tmp/pages012-expected-assets.txt

          (
            cd draft-download
            sha256sum -c ARCHIVE_SHA256SUMS
          )
          echo "Exact-byte draft staged and verified; nothing published yet."

      - name: Record additive exact-draft staging evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(jq -r '.id' /tmp/release.json)"
          composite_sha="$(sha256sum draft-download/pages-composite.tar | awk '{print $1}')"
          record="$(jq -cn \
            --arg releaseTag "${RELEASE_TAG}" \
            --argjson releaseId "${release_id}" \
            --arg assetSha256 "${composite_sha}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,event:"draft_staged",releaseTag:$releaseTag,releaseId:$releaseId,assetName:"pages-composite.tar",assetSha256:$assetSha256,draft:true,published:false,exactDraftBytesVerified:true,workflowRunId:($workflowRunId|tonumber),recordedAt:$recordedAt}')"

          rm -rf ledger-repo
          git clone --quiet --branch threejs-rebuild "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ledger-repo
          git -C ledger-repo config user.name "github-actions[bot]"
          git -C ledger-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if jq -e --arg tag "${RELEASE_TAG}" --arg digest "${composite_sha}" \
            'select(.event == "draft_staged" and .releaseTag == $tag and .assetSha256 == $digest)' \
            ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl >/dev/null; then
            echo "Exact draft staging evidence already recorded."
          else
            printf '%s\n' "${record}" >> ledger-repo/RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-repo add RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-repo commit -m "PAGES-012 record exact draft staging"
            git -C ledger-repo push --quiet origin HEAD:threejs-rebuild
          fi

      - name: Verify repository release immutability before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/immutable-releases"
          token="${ADMIN_TOKEN:-${GH_TOKEN}}"

          check() {
            curl --silent --show-error \
              --output /tmp/immutable-releases.json \
              --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${token}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${api}"
          }

          code="$(check)"
          if [ "${code}" = "404" ] && [ -n "${ADMIN_TOKEN}" ]; then
            echo "Release immutability is disabled; enabling it before publication."
            put_code="$(curl --silent --show-error \
              --output /tmp/enable-immutable-releases.json \
              --write-out '%{http_code}' \
              --request PUT \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${ADMIN_TOKEN}" \
              --header "X-GitHub-Api-Version: 2026-03-10" \
              "${api}")"
            test "${put_code}" = "204" || {
              echo "Failed to enable release immutability (HTTP ${put_code}); exact-byte draft remains unpublished." >&2
              cat /tmp/enable-immutable-releases.json >&2 || true
              exit 1
            }
            code="$(check)"
          fi

          if [ "${code}" != "200" ]; then
            echo "Cannot prove repository release immutability (HTTP ${code}); exact-byte draft remains unpublished." >&2
            echo "PAGES_RELEASE_ADMIN_TOKEN needs repository Administration read/write." >&2
            cat /tmp/immutable-releases.json >&2 || true
            exit 1
          fi

          jq -e '.enabled == true' /tmp/immutable-releases.json >/dev/null || {
            echo "Repository release immutability is disabled; exact-byte draft remains unpublished." >&2
            exit 1
          }
          echo "Repository release immutability verified enabled before publication."

      - name: Publish the already verified draft exactly once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(jq -r '.id' /tmp/release.json)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > /tmp/pre-publish-release.json
          jq -e '.draft == true and ((.immutable // false) == false)' /tmp/pre-publish-release.json >/dev/null
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Verify published release is Immutable and attested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified=false
          for attempt in $(seq 1 12); do
            immutable="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isImmutable --jq '.isImmutable' 2>/dev/null || true)"
            if [ "${immutable}" = "true" ] && gh release verify "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/tmp/pages012-release-verify.txt 2>&1; then
              cat /tmp/pages012-release-verify.txt
              verified=true
              break
            fi
            sleep 5
          done
          test "${verified}" = "true" || {
            cat /tmp/pages012-release-verify.txt >&2 2>/dev/null || true
            exit 1
          }

      - name: Download and verify every immutable release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p immutable-download
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --dir immutable-download

          find immutable-download -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > /tmp/immutable-asset-names.txt
          diff -u /tmp/pages012-expected-assets.txt /tmp/immutable-asset-names.txt

          while IFS= read -r name; do
            cmp "release-assets/${name}" "immutable-download/${name}"
            gh release verify-asset "${RELEASE_TAG}" "release-assets/${name}" --repo "${GITHUB_REPOSITORY}"
            gh release verify-asset "${RELEASE_TAG}" "immutable-download/${name}" --repo "${GITHUB_REPOSITORY}"
          done < /tmp/pages012-expected-assets.txt

          (
            cd immutable-download
            sha256sum -c ARCHIVE_SHA256SUMS
          )

      - name: Prove non-production restore from immutable downloaded bytes
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum immutable-download/pages-composite.tar | awk '{print $1}')"
          test "${actual}" = "${PRESERVED_PAGES_TAR_SHA256}"

          mkdir -p restore-proof/site
          tar -xf immutable-download/pages-composite.tar -C restore-proof/site
          actual_content="$(cd restore-proof/site && find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r rel; do digest="$(sha256sum "${rel}" | awk '{print $1}')"; printf '%s  %s\n' "${digest}" "${rel}"; done | sha256sum | awk '{print $1}')"
          expected_content="$(jq -r '.archives["pages-composite.tar"].contentManifestSha256' immutable-download/IMMUTABLE_FACTS.json)"
          test "${actual_content}" = "${expected_content}"

          python3 -m http.server 8088 --directory restore-proof/site >/tmp/pages012-release-restore-http.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8088/ >/tmp/root.html \
              && curl --fail --silent http://127.0.0.1:8088/threejs/ >/tmp/three.html; then
              break
            fi
            sleep 0.25
          done
          test -s /tmp/root.html
          test -s /tmp/three.html
          ! grep -Fq 'THREEJS REBUILD' /tmp/root.html
          grep -Fq 'THREEJS REBUILD' /tmp/three.html
          echo "Immutable non-production restore proof passed without rebuild."

      - name: Append verified archive evidence to qualification ledger
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          composite_sha="$(sha256sum immutable-download/pages-composite.tar | awk '{print $1}')"
          content_sha="$(jq -r '.archives["pages-composite.tar"].contentManifestSha256' immutable-download/IMMUTABLE_FACTS.json)"
          record="$(jq -cn \
            --arg releaseTag "${RELEASE_TAG}" \
            --arg assetSha256 "${composite_sha}" \
            --arg contentManifestSha256 "${content_sha}" \
            --arg godotRootSha "${GODOT_ROOT_SHA}" \
            --arg threejsCandidateSha "${THREEJS_CANDIDATE_SHA}" \
            --arg sourcePagesRunId "${SOURCE_PAGES_RUN_ID}" \
            --arg sourcePagesArtifactId "${SOURCE_PAGES_ARTIFACT_ID}" \
            --arg workflowRunId "${GITHUB_RUN_ID}" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion:1,event:"archive_verified",releaseTag:$releaseTag,assetName:"pages-composite.tar",assetSha256:$assetSha256,contentManifestSha256:$contentManifestSha256,godotRootSha:$godotRootSha,threejsCandidateSha:$threejsCandidateSha,sourcePagesRunId:($sourcePagesRunId|tonumber),sourcePagesArtifactId:($sourcePagesArtifactId|tonumber),immutable:true,releaseAttestationVerified:true,archiveSha256Verified:true,nonProductionRestoreVerified:true,workflowRunId:($workflowRunId|tonumber),recordedAt:$recordedAt}')"

          rm -rf ledger-final
          git clone --quiet --branch threejs-rebuild "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ledger-final
          git -C ledger-final config user.name "github-actions[bot]"
          git -C ledger-final config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if jq -e --arg tag "${RELEASE_TAG}" --arg digest "${composite_sha}" \
            'select(.event == "archive_verified" and .releaseTag == $tag and .assetSha256 == $digest)' \
            ledger-final/RELEASE_QUALIFICATION/ledger.jsonl >/dev/null; then
            echo "Verified immutable archive evidence already recorded."
          else
            printf '%s\n' "${record}" >> ledger-final/RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-final add RELEASE_QUALIFICATION/ledger.jsonl
            git -C ledger-final commit -m "PAGES-012 record immutable archive qualification"
            git -C ledger-final push --quiet origin HEAD:threejs-rebuild
          fi
