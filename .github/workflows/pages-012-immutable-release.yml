name: PAGES-012 Immutable Release Archive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-release-qualification-ledger
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Historical PAGES-012 release writer is retired
        shell: bash
        run: |
          set -euo pipefail
          echo 'PAGES-012 immutable release publication is historical evidence only.'
          echo 'This workflow is intentionally read-only and manual-only.'
          echo 'Use PAGES-015 Frontend Window Archive for the locked active+previous frontend window.'
          echo 'Use PAGES-012 Immutable Exact-Byte Rollback for verified restore/rollback operations.'
