name: THREEJS-020 piece verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'YAKOLAK_PORTABLE_KIT/assets/models/piece-small.stl'
      - 'YAKOLAK_PORTABLE_KIT/assets/models/piece-medium.stl'
      - 'YAKOLAK_PORTABLE_KIT/assets/models/piece-large.stl'
      - 'YAKOLAK_PORTABLE_KIT/assets/layout/world-layout.json'
      - 'YAKOLAK_PORTABLE_KIT/assets/reference/approved-contract.json'
      - 'scripts/convert-threejs-assets.mjs'
      - 'scripts/lib/asset-conversion-pipeline.mjs'
      - 'scripts/lib/stl-glb-converter.mjs'
      - 'scripts/verify-threejs-pieces.mjs'
      - 'web/app/assets/asset-manifest.js'
      - 'web/app/assets/glb-components.js'
      - 'web/app/scene/piece-layout.js'
      - 'web/app/scene/pieces.js'
      - 'web/assets/models/piece-small.glb'
      - 'web/assets/models/piece-medium.glb'
      - 'web/assets/models/piece-large.glb'
      - 'web/assets/models/conversion-state.json'
      - 'tests/threejs_pieces_contract.test.mjs'
      - '.github/workflows/threejs-020-pieces.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deterministic converted assets are current
        run: node scripts/convert-threejs-assets.mjs --check
      - name: Verify piece pivots, nesting, instances and destinations
        run: node scripts/verify-threejs-pieces.mjs
      - name: Run THREEJS-020 contract test
        run: node --test tests/threejs_pieces_contract.test.mjs
