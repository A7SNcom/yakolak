name: YAKOLAK THREEJS-026 Final Post-Grounding Measurement

on:
  pull_request:
    branches:
      - threejs-rebuild
    paths:
      - 'THREEJS026_PR_TRIGGER'

permissions:
  contents: read

env:
  THREEJS026_CANDIDATE: b2ead11b752a55477ebfe11ce65e1b0d5e4bfc8e
  THREEJS026_GENERATION: sha256:c4ce95efbc0a85c9f5eeb4b75d01f0870eac74e4bd3412429ce055a8cf097bf4

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current measurement tooling and contracts
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact live Pages identity and grounding source
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-$(date +%s)"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://a7sncom.github.io/yakolak/deployment-manifest.json?threejs026_final=${nonce}" \
            -o /tmp/live.json
          test "$(jq -r '.threejsCandidateSha' /tmp/live.json)" = "${THREEJS026_CANDIDATE}"
          test "$(jq -r '.deploymentGeneration' /tmp/live.json)" = "${THREEJS026_GENERATION}"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://a7sncom.github.io/yakolak/threejs/app/scene/preview-scene.js?threejs026_final=${nonce}" \
            -o /tmp/live-preview-scene.js
          grep -Fq "mode: 'single-transparent-ellipse'" /tmp/live-preview-scene.js
          grep -Fq 'extraLightCount: 0' /tmp/live-preview-scene.js
          grep -Fq 'shadowMap: false' /tmp/live-preview-scene.js
          grep -Fq 'renderTarget: false' /tmp/live-preview-scene.js
          cat /tmp/live.json

      - name: Pin repository-side asset accounting to exact live candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "${THREEJS026_CANDIDATE}"
          git checkout "${THREEJS026_CANDIDATE}" -- web YAKOLAK_PORTABLE_KIT/assets

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify grounding and THREEJS-025 contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/threejs_lighting_contract.test.mjs tests/threejs_contact_grounding_contract.test.mjs
          node scripts/verify-threejs-lighting.mjs
          node --check scripts/measure-threejs-performance.mjs

      - name: Install Playwright measurement runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium

      - name: Measure exact cold mobile Pages candidate
        shell: bash
        env:
          SHELL_URL: https://a7sncom.github.io/yakolak/threejs/
          EXPECTED_THREEJS_SHA: ${{ env.THREEJS026_CANDIDATE }}
        run: |
          set -o pipefail
          node scripts/measure-threejs-performance.mjs 2>&1 | tee /tmp/threejs026-post-performance.log

      - name: Capture exact mobile visual and runtime presentation snapshot
        shell: bash
        env:
          SHELL_URL: https://a7sncom.github.io/yakolak/threejs/
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({
            headless: true,
            args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader'],
          });
          try {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await page.goto(process.env.SHELL_URL, { waitUntil: 'domcontentloaded', timeout: 120_000 });
            await page.waitForFunction(() => document.documentElement.dataset.bootState === 'ready', null, { timeout: 120_000 });
            await page.waitForFunction(() => Boolean(window.__YAKOLAK_THREEJS_SHELL__?.getStartupMarks?.().firstVisibleFrame), null, { timeout: 30_000 });
            const snapshot = await page.evaluate(() => ({
              presentation: window.__YAKOLAK_THREEJS_SHELL__.getPresentationSnapshot(),
              lighting: window.__YAKOLAK_THREEJS_SHELL__.getLightingSnapshot(),
              resources: window.__YAKOLAK_THREEJS_SHELL__.getResourceRegistrySnapshot(),
              marks: window.__YAKOLAK_THREEJS_SHELL__.getStartupMarks(),
            }));
            if (errors.length) throw new Error(`visual page errors: ${JSON.stringify(errors)}`);
            if (snapshot.presentation?.grounding?.mode !== 'single-transparent-ellipse') throw new Error('grounding runtime snapshot missing');
            if (snapshot.presentation?.grounding?.visible !== true) throw new Error('grounding cue not visible');
            if (snapshot.lighting?.neutral?.neutralLightCount !== 3) throw new Error('neutral light count changed');
            if (snapshot.lighting?.neutral?.shadows !== false) throw new Error('neutral shadows unexpectedly enabled');
            if ((snapshot.resources?.byKind?.['shadow-map'] || 0) !== 0) throw new Error('shadow map resource unexpectedly allocated');
            if ((snapshot.resources?.byKind?.['render-target'] || 0) !== 0) throw new Error('render target resource unexpectedly allocated');
            await writeFile('/tmp/threejs026-grounding-snapshot.json', JSON.stringify(snapshot, null, 2));
            await page.screenshot({ path: '/tmp/threejs026-grounding-390x844.png', fullPage: true });
            console.log('THREEJS026_GROUNDING_RUNTIME', JSON.stringify(snapshot));
            await context.close();
          } finally {
            await browser.close();
          }
          NODE

      - name: Upload final measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: threejs026-final-post-grounding-${{ github.run_id }}
          path: |
            /tmp/threejs026-post-performance.log
            /tmp/threejs026-grounding-snapshot.json
            /tmp/threejs026-grounding-390x844.png
          if-no-files-found: warn
