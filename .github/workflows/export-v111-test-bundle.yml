name: Export v111 test bundle

on:
  push:
    branches: ["111"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package exact branch source
        run: |
          zip -r yakolak-v111-test-bundle.zip . \
            -x '.git/*' \
            -x 'yakolak-v111-test-bundle.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: yakolak-v111-test-bundle
          path: yakolak-v111-test-bundle.zip
          retention-days: 1
          if-no-files-found: error
