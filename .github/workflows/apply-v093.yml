name: Apply v093 visual mobile upgrade

on:
  push:
    branches:
      - feature/v093-visual-mobile
    paths:
      - .github/workflows/apply-v093.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v093-visual-mobile
          fetch-depth: 0

      - name: Apply guarded v093 changes
        run: python .github/scripts/apply_v093.py

      - name: Validate JavaScript syntax and version consistency
        run: |
          node --check src/app-game-v085.js
          node --check api/calibration.js
          node --check config/calibration-v093.js
          node - <<'NODE'
          const fs=require('fs');
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(version.build!==93) throw new Error('version build mismatch');
          for(const file of ['index.html','app.js','src/app-game-v085.js']){
            const text=fs.readFileSync(file,'utf8');
            if(!text.includes("BUILD='93'")) throw new Error(`${file} build mismatch`);
          }
          const game=fs.readFileSync('src/app-game-v085.js','utf8');
          for(const invariant of [
            'const D=48,R3=135',
            'const DEFAULT_TURN_SECONDS=18',
            "const SIZE_TYPES=['s','m','l']",
            'const WIN_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]]'
          ]) if(!game.includes(invariant)) throw new Error(`game rule changed: ${invariant}`);
          console.log('v093 consistency and rule guardrails passed');
          NODE

      - name: Commit v093 implementation
        run: |
          rm -f .github/scripts/apply_v093.py .github/workflows/apply-v093.yml
          git config user.name "yakolak-agent"
          git config user.email "ahmad.bn.kamal@gmail.com"
          git add -A
          git commit -m "Build v093 visual clarity and mobile experience"
          git push origin HEAD:feature/v093-visual-mobile
