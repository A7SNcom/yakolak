name: PAGES-011 Composed Artifact Verify

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/pages-011-composed-artifact-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify PAGES-011 contract regression
        run: |
          set -euo pipefail
          bash -n scripts/pages-public-artifact-scan.sh
          node --test tests/pages_service_worker_decision.test.mjs

      - name: Prove composed artifact fails closed on Service Workers
        shell: bash
        run: |
          set -euo pipefail
          site="${RUNNER_TEMP}/pages011-site"
          rm -rf "${site}"
          mkdir -p "${site}/threejs"
          printf '<!doctype html><title>root</title>\n' > "${site}/index.html"
          printf '<!doctype html><title>threejs</title>\n' > "${site}/threejs/index.html"
          cat > "${site}/threejs/runtime-config.json" <<'JSON'
          {
            "frontendSha": "0123456789abcdef0123456789abcdef01234567",
            "protocolVersion": "1",
            "apiOrigin": null,
            "environment": "production",
            "branch": "threejs-rebuild",
            "apiOriginState": "absent"
          }
          JSON

          bash scripts/pages-public-artifact-scan.sh "${site}"

          printf 'self.addEventListener("fetch", () => {});\n' > "${site}/service-worker.js"
          if bash scripts/pages-public-artifact-scan.sh "${site}"; then
            echo 'Expected service-worker.js to be rejected.' >&2
            exit 1
          fi
          rm "${site}/service-worker.js"

          printf 'navigator.serviceWorker.register("./worker.js");\n' > "${site}/register.js"
          if bash scripts/pages-public-artifact-scan.sh "${site}"; then
            echo 'Expected serviceWorker.register() to be rejected.' >&2
            exit 1
          fi

          echo 'PAGES_011_COMPOSED_ARTIFACT_GUARD=PASS'
