name: YAKOLAK THREEJS-026 Exact Pages Performance

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/threejs-026-measure.yml'
      - 'scripts/measure-threejs-performance.mjs'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: yakolak-threejs-026-pages-performance
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout measurement tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Mark measurement relay start
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/69/comments" \
            -f body="THREEJS-026 measurement resolver started from tooling commit ${GITHUB_SHA}." >/dev/null

      - name: Resolve one exact live Pages candidate and generation
        id: live
        shell: bash
        env:
          PUSH_SHA: ${{ github.sha }}
          MANIFEST_URL: https://a7sncom.github.io/yakolak/deployment-manifest.json
        run: |
          set -euo pipefail
          web_changed=false
          if git rev-parse HEAD^ >/dev/null 2>&1 && git diff --name-only HEAD^ HEAD -- web/ | grep -q .; then
            web_changed=true
          fi

          rm -f /tmp/deployment-manifest.json
          for attempt in $(seq 1 120); do
            nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${MANIFEST_URL}?threejs026=${nonce}" \
              -o /tmp/deployment-manifest.next.json; then
              live_sha="$(jq -r '.threejsCandidateSha // empty' /tmp/deployment-manifest.next.json)"
              if [ -n "${live_sha}" ] && { [ "${web_changed}" = false ] || [ "${live_sha}" = "${PUSH_SHA}" ]; }; then
                mv /tmp/deployment-manifest.next.json /tmp/deployment-manifest.json
                break
              fi
            fi
            sleep 5
          done

          if [ ! -s /tmp/deployment-manifest.json ]; then
            if [ "${web_changed}" = true ]; then
              echo "Web-changing candidate ${PUSH_SHA} never became the live Pages generation." >&2
            else
              echo 'Unable to resolve a current live Pages generation.' >&2
            fi
            exit 1
          fi

          candidate_sha="$(jq -r '.threejsCandidateSha' /tmp/deployment-manifest.json)"
          generation="$(jq -r '.deploymentGeneration' /tmp/deployment-manifest.json)"
          root_sha="$(jq -r '.godotRootSha' /tmp/deployment-manifest.json)"
          runtime_sha="$(jq -r '.publicRuntimeProtocol.sha256' /tmp/deployment-manifest.json)"

          git fetch --quiet --depth=1 origin "${candidate_sha}"
          git checkout "${candidate_sha}" -- web YAKOLAK_PORTABLE_KIT/assets

          echo "web_changed=${web_changed}" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "generation=${generation}" >> "$GITHUB_OUTPUT"
          echo "root_sha=${root_sha}" >> "$GITHUB_OUTPUT"
          echo "runtime_sha=${runtime_sha}" >> "$GITHUB_OUTPUT"
          cat /tmp/deployment-manifest.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright measurement runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Measure exact live Pages generation with fixed cold mobile profile
        id: perf
        shell: bash
        env:
          SHELL_URL: https://a7sncom.github.io/yakolak/threejs/
          EXPECTED_THREEJS_SHA: ${{ steps.live.outputs.candidate_sha }}
        run: |
          set +e
          node scripts/measure-threejs-performance.mjs 2>&1 | tee /tmp/threejs026-performance.log
          status=${PIPESTATUS[0]}
          set -e
          metrics="$(grep '^THREEJS026_METRICS ' /tmp/threejs026-performance.log | tail -n 1 | sed 's/^THREEJS026_METRICS //')"
          if [ -z "${metrics}" ]; then
            echo 'Measurement did not emit THREEJS026_METRICS.' >&2
            tail -n 120 /tmp/threejs026-performance.log >&2
            exit 1
          fi
          printf '%s' "${metrics}" > /tmp/threejs026-metrics.json
          jq -e . /tmp/threejs026-metrics.json >/dev/null
          echo "measurement_status=${status}" >> "$GITHUB_OUTPUT"

      - name: Publish measurement evidence to relay issue
        if: always() && steps.live.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ steps.live.outputs.candidate_sha }}
          DEPLOYMENT_GENERATION: ${{ steps.live.outputs.generation }}
          ROOT_SHA: ${{ steps.live.outputs.root_sha }}
          RUNTIME_SHA: ${{ steps.live.outputs.runtime_sha }}
          MEASUREMENT_STATUS: ${{ steps.perf.outputs.measurement_status }}
        run: |
          set -euo pipefail
          if [ -s /tmp/threejs026-metrics.json ]; then
            compact="$(jq -c . /tmp/threejs026-metrics.json)"
            summary="$(jq -r '
              "encoded=" + (.startupNetwork.encodedBytes|tostring) +
              " decodedGeometry=" + (.decodedRequiredGeometryBytes|tostring) +
              " critical=" + (.marks.criticalAssetsReady|tostring) +
              " interactive=" + (.marks.firstInteractive|tostring) +
              " visible=" + (.marks.firstVisibleFrame|tostring) +
              " hitch=" + (.startupHitchMs|tostring) +
              " draws=" + (.gpuFrame.drawCalls|tostring) +
              " triangles=" + (.gpuFrame.triangles|tostring) +
              " geometries=" + (.gpuFrame.geometries|tostring) +
              " textures=" + (.gpuFrame.textures|tostring) +
              " programs=" + (.gpuFrame.programs|tostring) +
              " regression=" + (.regression.ok|tostring) +
              " lifecycle=" + (.lifecycleRecreate.ok|tostring)
            ' /tmp/threejs026-metrics.json)"
            body=$(cat <<EOF
THREEJS-026 exact Pages measurement

tooling: ${TOOLING_SHA}
candidate: ${CANDIDATE_SHA}
generation: ${DEPLOYMENT_GENERATION}
godotRootSha: ${ROOT_SHA}
runtimeProtocolSha256: ${RUNTIME_SHA}
measurementExit: ${MEASUREMENT_STATUS}
summary: ${summary}

\`\`\`json
${compact}
\`\`\`
EOF
)
          else
            tail_text="$(tail -n 80 /tmp/threejs026-performance.log 2>/dev/null || true)"
            body=$(cat <<EOF
THREEJS-026 measurement failed before JSON evidence.

tooling: ${TOOLING_SHA}
candidate: ${CANDIDATE_SHA}
generation: ${DEPLOYMENT_GENERATION}

\`\`\`
${tail_text}
\`\`\`
EOF
)
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/69/comments" -f body="${body}" >/dev/null

      - name: Persist exact measurement evidence in repository
        if: always() && steps.live.outcome == 'success' && steps.perf.outcome == 'success'
        shell: bash
        env:
          TOOLING_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ steps.live.outputs.candidate_sha }}
          DEPLOYMENT_GENERATION: ${{ steps.live.outputs.generation }}
          ROOT_SHA: ${{ steps.live.outputs.root_sha }}
          RUNTIME_SHA: ${{ steps.live.outputs.runtime_sha }}
          MEASUREMENT_STATUS: ${{ steps.perf.outputs.measurement_status }}
        run: |
          set -euo pipefail
          test -s /tmp/threejs026-metrics.json
          git restore --source=HEAD --staged --worktree web YAKOLAK_PORTABLE_KIT/assets
          mkdir -p THREEJS026_MEASUREMENTS
          evidence_path="THREEJS026_MEASUREMENTS/${CANDIDATE_SHA}.json"
          jq -n \
            --arg tooling "${TOOLING_SHA}" \
            --arg candidate "${CANDIDATE_SHA}" \
            --arg generation "${DEPLOYMENT_GENERATION}" \
            --arg root "${ROOT_SHA}" \
            --arg runtime "${RUNTIME_SHA}" \
            --argjson measurementExit "${MEASUREMENT_STATUS:-1}" \
            --slurpfile metrics /tmp/threejs026-metrics.json \
            '{schema:"THREEJS-026-PAGES-EVIDENCE-V1", toolingSha:$tooling, candidateSha:$candidate, deploymentGeneration:$generation, godotRootSha:$root, runtimeProtocolSha256:$runtime, measurementExit:$measurementExit, metrics:$metrics[0]}' \
            > "${evidence_path}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${evidence_path}"
          git commit -m "[threejs-026-evidence] record ${CANDIDATE_SHA:0:8} exact Pages metrics"
          git push origin HEAD:threejs-rebuild

      - name: Enforce measurement result
        if: steps.perf.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.perf.outputs.measurement_status }}" = '0'
          jq -e '.regression.ok == true and .lifecycleRecreate.ok == true' /tmp/threejs026-metrics.json >/dev/null
