name: Apply Closed Shell Orbit Isolation

on:
  push:
    branches:
      - agent/yakolak-3.0-star-to-table-preintro
    paths:
      - scripts/apply_closed_shell_orbit_isolation.py
      - .github/workflows/apply-closed-shell-orbit-isolation.yml

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[closed-shell-orbit-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yakolak-3.0-star-to-table-preintro
          fetch-depth: 0
      - name: Apply closed shell and orbit isolation
        run: python3 scripts/apply_closed_shell_orbit_isolation.py
      - name: Commit fix
        run: |
          git config user.name "YAKOLAK Visual Fix"
          git config user.email "actions@github.com"
          git add scripts/pre_intro_star_to_table.gd scripts/intro.gd tests/pre_intro_smoke.spec.js
          git commit -m "إصلاح الصندوق المفتوح والشائبة السوداء أثناء دوران الكاميرا [closed-shell-orbit-fixed]"
          git push origin HEAD:agent/yakolak-3.0-star-to-table-preintro
