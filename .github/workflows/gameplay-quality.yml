name: YAKOLAK browser truth check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gameplay-quality.yml
      - qa/full-flow-trigger.txt
      - export_presets.cfg
      - "web/**"
      - tests/runtime_game_smoke.spec.js
      - tests/natural_flow_smoke.spec.js
      - tests/round_transition_smoke.spec.js

concurrency:
  group: yakolak-browser-truth
  cancel-in-progress: true

jobs:
  browser-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify intro through second round on mobile
        run: |
          python3 -m http.server 8000 --directory web >/tmp/yakolak-browser.log 2>&1 &
          npx playwright test tests/round_transition_smoke.spec.js --workers=1 --reporter=line
