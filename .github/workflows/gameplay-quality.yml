name: YAKOLAK full quality check

on:
  workflow_dispatch:

concurrency:
  group: yakolak-full-quality
  cancel-in-progress: true

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full Godot and browser verification
        run: bash scripts/vercel-build.sh
