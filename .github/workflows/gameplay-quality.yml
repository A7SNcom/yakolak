name: YAKOLAK online quality

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: yakolak-main-online
  cancel-in-progress: true

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full online Godot and browser verification
        run: bash scripts/vercel-build.sh
