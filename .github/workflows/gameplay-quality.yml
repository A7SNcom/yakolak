name: YAKOLAK full quality check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gameplay-quality.yml
      - qa/full-flow-trigger.txt

concurrency:
  group: yakolak-full-quality
  cancel-in-progress: true

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Full Godot and browser verification
        run: bash scripts/vercel-build.sh
