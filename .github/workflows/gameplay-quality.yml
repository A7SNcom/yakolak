name: YAKOLAK gameplay quality

on:
  pull_request:
    branches:
      - perf/perfect-intro-v1-smooth
  workflow_dispatch:

concurrency:
  group: yakolak-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full Godot and browser verification
        run: bash scripts/vercel-build.sh
