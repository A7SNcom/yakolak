name: Verify v120 online all colors

on:
  pull_request:
    paths:
      - 'src/mobile-clarity-v120.js'
      - 'src/app-game-v114.js'
      - 'scripts/verify-v120-online-all-colors.mjs'
      - '.github/workflows/verify-v120-online-all-colors.yml'
  workflow_dispatch:

jobs:
  real-online-four-color:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start v120 static client
        run: |
          python3 -m http.server 4174 --bind 127.0.0.1 > /tmp/v120-online-server.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4174/version.json >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/v120-online-server.log
          exit 1

      - name: Play real four-color online match on desktop and mobile
        env:
          APP_URL: 'http://127.0.0.1:4174'
          V120_COMMIT: '${{ github.event.pull_request.head.sha }}'
        run: node scripts/verify-v120-online-all-colors.mjs

      - name: Upload online all-color evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v120-online-all-colors
          path: artifacts/v120-online-all-colors
          if-no-files-found: warn
