name: YAKOLAK THREEJS-026 Force Pages Probe

on:
  pull_request:
    branches:
      - threejs-rebuild
    paths:
      - 'THREEJS026_PR_TRIGGER'

permissions:
  contents: read
  actions: write

jobs:
  deploy-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Snapshot current live generation
        id: before
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_RUN_ID}-before-$(date +%s)"
          curl --fail --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
            "https://a7sncom.github.io/yakolak/deployment-manifest.json?threejs026_force=${nonce}" \
            -o /tmp/before.json
          echo "candidate=$(jq -r '.threejsCandidateSha // empty' /tmp/before.json)" >> "$GITHUB_OUTPUT"
          echo "generation=$(jq -r '.deploymentGeneration // empty' /tmp/before.json)" >> "$GITHUB_OUTPUT"
          cat /tmp/before.json

      - name: Dispatch canonical composite Pages workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pages-single-site.yml/dispatches" \
            -f ref=main
          echo 'THREEJS026_COMPOSITE_DISPATCHED'

      - name: Resolve newly published grounding generation
        shell: bash
        env:
          BEFORE_CANDIDATE: ${{ steps.before.outputs.candidate }}
          BEFORE_GENERATION: ${{ steps.before.outputs.generation }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 150); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            if curl --fail --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://a7sncom.github.io/yakolak/deployment-manifest.json?threejs026_force=${nonce}" \
              -o /tmp/live.json; then
              candidate="$(jq -r '.threejsCandidateSha // empty' /tmp/live.json)"
              generation="$(jq -r '.deploymentGeneration // empty' /tmp/live.json)"
              if [ -n "${candidate}" ] && [ -n "${generation}" ] \
                && { [ "${candidate}" != "${BEFORE_CANDIDATE}" ] || [ "${generation}" != "${BEFORE_GENERATION}" ]; }; then
                if curl --fail --silent --show-error -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                  "https://a7sncom.github.io/yakolak/threejs/app/scene/preview-scene.js?threejs026_force=${nonce}" \
                  | grep -Fq "mode: 'single-transparent-ellipse'"; then
                  echo "THREEJS026_DEPLOYED_CANDIDATE ${candidate} ${generation}"
                  cat /tmp/live.json
                  exit 0
                fi
              fi
            fi
            sleep 4
          done
          echo 'No newly published grounding generation became live.' >&2
          cat /tmp/live.json 2>/dev/null || true
          exit 1
