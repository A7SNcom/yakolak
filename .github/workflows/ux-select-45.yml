name: UX-SELECT-45 selection visibility matrix

on:
  pull_request:
    paths:
      - 'tests/ux_select_45_visibility_matrix.spec.js'
      - '.github/workflows/ux-select-45.yml'
      - 'scripts/gameplay_selected_state.gd'
      - 'scripts/gameplay_session_efficient.gd'
      - 'scripts/gameplay_turn_transition_stale_safe.gd'
      - 'scripts/gameplay_authoritative_turn_state.gd'
      - 'scripts/turn_light_crossfade.gd'
      - 'scripts/gameplay_touch_targets.gd'
  push:
    branches:
      - main
    paths:
      - 'tests/ux_select_45_visibility_matrix.spec.js'
      - '.github/workflows/ux-select-45.yml'
      - 'scripts/gameplay_selected_state.gd'
      - 'scripts/gameplay_session_efficient.gd'
      - 'scripts/gameplay_turn_transition_stale_safe.gd'
      - 'scripts/gameplay_authoritative_turn_state.gd'
      - 'scripts/turn_light_crossfade.gd'
      - 'scripts/gameplay_touch_targets.gd'
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: ux-select-45-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: source / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [mobile, desktop, reduced-lifecycle]
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          test "$(git hash-object assets/fonts/thmanyahsans-Regular.otf)" = "ca891297805da60b4b4e6d3a6f02cd7c0f2f33b7"
          test "$(git hash-object assets/fonts/thmanyahsans-Light.otf)" = "aebd416113380e9e96bbe9bfbc5c4a008b2f7b67"
          test "$(git hash-object assets/fonts/thmanyahsans-Medium.otf)" = "87fdec346be83a9dcc9eed5ea8aa04cc5a87faef"
          test "$(git hash-object assets/fonts/thmanyahsans-Bold.otf)" = "349937a73e14f681a3d4cb95e966aa7cec35bcc3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify test syntax and install server dependency
        run: |
          node --check tests/ux_select_45_visibility_matrix.spec.js
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: yakolak-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            yakolak-godot-4.7.1-

      - name: Drop stale compiled scene cache
        run: rm -rf .godot/exported

      - name: Build exact source under test
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh

      - name: Install browser runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Run deterministic selection visibility shard
        env:
          YAKOLAK_UX_SELECT_45_LABEL: source-${{ github.sha }}-${{ matrix.shard }}
          YAKOLAK_UX_SELECT_45_SHARD: ${{ matrix.shard }}
        run: |
          rm -rf artifacts/ux-select-45-*
          node tests/web_test_server.mjs >/tmp/yakolak-ux-select-45.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/ux_select_45_visibility_matrix.spec.js --workers=1 --reporter=github

      - name: Upload paired visual proofs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-45-source-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/ux-select-45-source-${{ github.sha }}-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14

  production:
    name: production / ${{ matrix.shard }}
    if: ${{ github.event_name == 'push' }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [mobile, desktop, reduced-lifecycle]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require canonical Production to match committed web package
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum web/index.pck | awk '{print $1}')"
          MATCHED=0
          for attempt in $(seq 1 36); do
            curl -fsSL --retry 2 --retry-delay 1 -o /tmp/yakolak-production.pck https://yakolak.vercel.app/index.pck
            ACTUAL="$(sha256sum /tmp/yakolak-production.pck | awk '{print $1}')"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              MATCHED=1
              break
            fi
            echo "Production package not current yet; retry $attempt/36"
            sleep 5
          done
          test "$MATCHED" = "1"

      - name: Install Production browser runner
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
          node --check tests/ux_select_45_visibility_matrix.spec.js

      - name: Run the same shard on canonical Production
        env:
          YAKOLAK_UX_SELECT_45_BASE_URL: https://yakolak.vercel.app
          YAKOLAK_UX_SELECT_45_LABEL: production-${{ github.sha }}-${{ matrix.shard }}
          YAKOLAK_UX_SELECT_45_SHARD: ${{ matrix.shard }}
        run: |
          rm -rf artifacts/ux-select-45-*
          npx playwright test tests/ux_select_45_visibility_matrix.spec.js --workers=1 --reporter=github

      - name: Upload Production paired visual proofs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-45-production-${{ matrix.shard }}-${{ github.sha }}
          path: artifacts/ux-select-45-production-${{ github.sha }}-${{ matrix.shard }}/
          if-no-files-found: warn
          retention-days: 14
