name: UX-SELECT-45 selection visibility regression matrix

on:
  push:
    branches:
      - main
    paths:
      - 'tests/ux_select_45_selection_visibility.spec.js'
      - '.github/workflows/ux-select-45.yml'
      - 'scripts/gameplay_selected_state.gd'
      - 'scripts/gameplay_turn_transition_stale_safe.gd'
      - 'scripts/turn_light_crossfade.gd'
      - 'scripts/gameplay_session*.gd'
      - 'scripts/gameplay.gd'
      - 'scenes/intro.tscn'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-select-45-${{ contains(github.event.head_commit.message || '', '[web-ready]') && 'production' || 'source' }}
  cancel-in-progress: true

jobs:
  source-selection-matrix:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message || '', '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch pinned Thmanyah Sans UI font weights
        run: |
          mkdir -p assets/fonts
          BASE=https://raw.githubusercontent.com/islamic-center-regensburg/izr-mobile-app/1f9055ae105e6679d95f919b95b355baa5bfb43d/assets/fonts/Thmanyah/thmanyahsans/otf
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Regular.otf "$BASE/thmanyahsans-Regular.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Light.otf "$BASE/thmanyahsans-Light.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Medium.otf "$BASE/thmanyahsans-Medium.otf"
          curl -L --fail --retry 3 --retry-delay 2 -o assets/fonts/thmanyahsans-Bold.otf "$BASE/thmanyahsans-Bold.otf"
          test "$(git hash-object assets/fonts/thmanyahsans-Regular.otf)" = "ca891297805da60b4b4e6d3a6f02cd7c0f2f33b7"
          test "$(git hash-object assets/fonts/thmanyahsans-Light.otf)" = "aebd416113380e9e96bbe9bfbc5c4a008b2f7b67"
          test "$(git hash-object assets/fonts/thmanyahsans-Medium.otf)" = "87fdec346be83a9dcc9eed5ea8aa04cc5a87faef"
          test "$(git hash-object assets/fonts/thmanyahsans-Bold.otf)" = "349937a73e14f681a3d4cb95e966aa7cec35bcc3"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate UX-SELECT-45 source contract
        run: |
          node --check tests/ux_select_45_selection_visibility.spec.js
          grep -q "yakolakSelectionEmphasisCount" scripts/gameplay_selected_state.gd
          grep -q "yakolak_selection_outline" scripts/gameplay_selected_state.gd
          grep -q "SELECT44_OUTLINE_GROW" scripts/gameplay_selected_state.gd
          grep -q "_cancel_stale_selection_presentation" scripts/gameplay_selected_state.gd
          grep -q "_apply_online_board" scripts/gameplay_selected_state.gd
          grep -q "single-authoritative-controller" scripts/turn_light_crossfade.gd

      - name: Install build dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Restore Godot caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/yakolak-tools
            ~/.local/share/godot/export_templates/4.7.1.stable
            .godot
          key: ux-select-45-godot-4.7.1-${{ hashFiles('project.godot', 'export_presets.cfg') }}
          restore-keys: |
            ux-select-45-godot-4.7.1-
            ux-select-44-godot-4.7.1-
            yakolak-godot-4.7.1-

      - name: Build latest main Web artifact
        env:
          YAKOLAK_KEEP_IMPORT_CACHE: "1"
        run: bash scripts/vercel-fast-build.sh

      - name: Install Chromium visual runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Run desktop mobile Reduced Motion and hydration matrix
        env:
          YAKOLAK_UX_SELECT_45_LABEL: source
        run: |
          set -o pipefail
          rm -rf artifacts/ux-select-45-source
          node tests/web_test_server.mjs >/tmp/yakolak-ux-select-45-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 0.25
          done
          npx playwright test tests/ux_select_45_selection_visibility.spec.js --workers=1 --reporter=github 2>&1 | tee /tmp/yakolak-ux-select-45-playwright.log
          COUNT=$(find artifacts/ux-select-45-source -type f -name '*.png' | wc -l)
          echo "UX-SELECT-45 rendered frame count: $COUNT"
          test "$COUNT" -ge 154

      - name: Verify tested artifact already matches canonical Production
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum web/index.pck | awk '{print $1}')"
          for attempt in $(seq 1 12); do
            if curl -L --fail --silent --show-error -o /tmp/yakolak-production.pck "https://yakolak.vercel.app/index.pck?ux-select-45-source=${GITHUB_SHA}-${attempt}"; then
              ACTUAL="$(sha256sum /tmp/yakolak-production.pck | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Canonical Production matches the tested source artifact."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::Canonical Production does not match the tested source artifact."
          exit 1

      - name: Upload 154+ deterministic rendered frames
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-45-source-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/ux-select-45-source/*.png

      - name: Upload UX-SELECT-45 failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-45-source-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ux-select-45-source/
            /tmp/yakolak-ux-select-45-server.log
            /tmp/yakolak-ux-select-45-playwright.log

  production-selection-matrix:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message || '', '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for canonical Production to match tested Web artifact
        run: |
          set -euo pipefail
          EXPECTED="$(sha256sum web/index.pck | awk '{print $1}')"
          for attempt in $(seq 1 36); do
            if curl -L --fail --silent --show-error -o /tmp/yakolak-production.pck "https://yakolak.vercel.app/index.pck?ux-select-45=${GITHUB_SHA}-${attempt}"; then
              ACTUAL="$(sha256sum /tmp/yakolak-production.pck | awk '{print $1}')"
              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "Canonical Production matches tested UX-SELECT-45 artifact."
                exit 0
              fi
            fi
            if [ "$attempt" -lt 36 ]; then sleep 5; fi
          done
          echo "::error::Canonical Production never matched this web-ready artifact."
          exit 1

      - name: Install Chromium visual runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium

      - name: Re-run full selection visibility matrix on canonical Production
        env:
          YAKOLAK_UX_SELECT_45_BASE_URL: https://yakolak.vercel.app
          YAKOLAK_UX_SELECT_45_LABEL: production
        run: |
          set -o pipefail
          rm -rf artifacts/ux-select-45-production
          npx playwright test tests/ux_select_45_selection_visibility.spec.js --workers=1 --reporter=github 2>&1 | tee /tmp/yakolak-ux-select-45-production.log
          COUNT=$(find artifacts/ux-select-45-production -type f -name '*.png' | wc -l)
          echo "UX-SELECT-45 Production rendered frame count: $COUNT"
          test "$COUNT" -ge 154

      - name: Upload Production rendered frames
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-45-production-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/ux-select-45-production/*.png

      - name: Upload Production failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ux-select-45-production-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            artifacts/ux-select-45-production/
            /tmp/yakolak-ux-select-45-production.log
