name: PAGES-005 Backend Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-005-cloudflare-backend
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Checkout authoritative Three.js backend source
        uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Validate centralized bootstrap helper syntax
        run: bash -n scripts/pages005-bootstrap-live.sh

      - name: Deploy and prove exact Cloudflare/Turso rollback window
        run: bash scripts/pages005-bootstrap-live.sh
