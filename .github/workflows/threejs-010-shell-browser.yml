name: THREEJS-010 Shell Browser Verification

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - web/**
      - api/build-info.js
      - scripts/verify-threejs-browser.mjs
      - scripts/prepare-threejs-runtime-assets.mjs
      - YAKOLAK_PORTABLE_KIT/assets/**
      - vercel.json
      - package.json
      - .github/workflows/threejs-010-shell-browser.yml

permissions:
  contents: read

concurrency:
  group: threejs-010-shell-browser
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser verifier only
        shell: bash
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: Prepare verified runtime assets
        shell: bash
        run: node scripts/prepare-threejs-runtime-assets.mjs

      - name: Serve static web source
        shell: bash
        run: |
          python3 -m http.server 4173 --directory web > /tmp/threejs-shell-http.log 2>&1 &
          echo $! > /tmp/threejs-shell-http.pid
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/threejs-shell-http.log
          exit 1

      - name: Verify desktop mobile and network graph
        shell: bash
        run: node scripts/verify-threejs-browser.mjs
