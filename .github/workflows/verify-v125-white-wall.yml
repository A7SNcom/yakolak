name: Verify v125 white wall

on:
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'package.json'
      - 'version.json'
      - 'src/app-game-v125.js'
      - 'scripts/verify-v125-white-wall.mjs'
      - '.github/workflows/verify-v125-white-wall.yml'
  workflow_dispatch:

jobs:
  white-wall-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Build 125 source and contracts
        run: npm test
