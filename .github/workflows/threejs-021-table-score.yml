name: THREEJS-021 table and score verification

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'YAKOLAK_PORTABLE_KIT/assets/models/score-marker.stl'
      - 'YAKOLAK_PORTABLE_KIT/assets/table/table.svg'
      - 'YAKOLAK_PORTABLE_KIT/assets/table/*.png'
      - 'YAKOLAK_PORTABLE_KIT/assets/layout/world-layout.json'
      - 'YAKOLAK_PORTABLE_KIT/assets/room/ROOM.md'
      - 'YAKOLAK_PORTABLE_KIT/assets/reference/approved-contract.json'
      - 'THREEJS_SOURCE_OF_TRUTH.md'
      - 'scripts/convert-threejs-assets.mjs'
      - 'scripts/verify-threejs-table-score.mjs'
      - 'web/app/assets/asset-manifest.js'
      - 'web/app/assets/glb-components.js'
      - 'web/app/scene/table-score-layout.js'
      - 'web/app/scene/table-and-score.js'
      - 'web/assets/models/score-marker.glb'
      - 'web/assets/models/conversion-state.json'
      - 'web/assets/models/board-and-lid-layout.json'
      - 'tests/threejs_table_score_contract.test.mjs'
      - '.github/workflows/threejs-021-table-score.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact migration SHA
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deterministic score conversion is current
        run: node scripts/convert-threejs-assets.mjs --check --only=model.score-marker
      - name: Verify table footprint score layout reuse and contact planes
        run: node scripts/verify-threejs-table-score.mjs
      - name: Run THREEJS-021 contract test
        run: node --test tests/threejs_table_score_contract.test.mjs
