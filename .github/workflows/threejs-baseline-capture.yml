name: THREEJS-001 Production Baseline Capture

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - .github/workflows/threejs-baseline-capture.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threejs-baseline-capture
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROD_URL_AT_BASELINE: https://yakolak.vercel.app/
      PROD_DEPLOYMENT_URL: https://yakolak-b1evy5x1x-ahmdkcoms-projects.vercel.app
      PROD_DEPLOYMENT_ID: dpl_BRayrP6BRbm2UQUbcLxAPXDVWE1j
      PROD_SHA: 04c75be60501778028e8107992e85c74d113b3da
      BASE_BRANCH: main
      MIGRATION_BRANCH: threejs-rebuild
    steps:
      - uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Confirm exact baseline relationship
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main threejs-rebuild
          test "$(git merge-base origin/main origin/threejs-rebuild)" = "$PROD_SHA"
          git merge-base --is-ancestor "$PROD_SHA" origin/main
          curl -fsSIL --retry 3 "$PROD_DEPLOYMENT_URL" >/tmp/prod-headers.txt

      - name: Capture immutable Production deployment screenshots
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet playwright==1.55.0
          mkdir -p docs/threejs-baseline/screenshots
          timeout 180s python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          target = os.environ['PROD_DEPLOYMENT_URL']
          out = Path('docs/threejs-baseline/screenshots')
          candidates = ['/usr/bin/google-chrome', '/usr/bin/google-chrome-stable', '/usr/bin/chromium']
          executable = next((p for p in candidates if Path(p).exists()), None)
          if not executable:
              raise SystemExit('No system Chrome/Chromium found')

          sizes = [
              (320, 568, 'production-320x568.png'),
              (390, 844, 'production-390x844.png'),
              (1440, 900, 'production-1440x900.png'),
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  executable_path=executable,
                  args=['--no-sandbox', '--disable-dev-shm-usage'],
              )
              page = browser.new_page(viewport={'width': 390, 'height': 844})
              response = page.goto(target, wait_until='load', timeout=120000)
              if response is None or not response.ok:
                  raise RuntimeError(f'Production deployment navigation failed: {response.status if response else "no response"}')
              page.wait_for_timeout(18000)
              title = page.title()
              for width, height, filename in sizes:
                  page.set_viewport_size({'width': width, 'height': height})
                  page.wait_for_timeout(1200)
                  page.screenshot(path=str(out / filename), full_page=False)
              (out / 'capture-state.txt').write_text(
                  f'url={page.url}\ntitle={title}\n', encoding='utf-8'
              )
              browser.close()
          PY

          test -s docs/threejs-baseline/screenshots/production-320x568.png
          test -s docs/threejs-baseline/screenshots/production-390x844.png
          test -s docs/threejs-baseline/screenshots/production-1440x900.png

      - name: Write immutable baseline record
        shell: bash
        run: |
          set -euo pipefail
          CAPTURED_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          MAIN_SHA_AT_CAPTURE="$(git rev-parse origin/main)"
          START_SHA="$(git merge-base origin/main origin/threejs-rebuild)"
          H320="$(sha256sum docs/threejs-baseline/screenshots/production-320x568.png | awk '{print $1}')"
          H390="$(sha256sum docs/threejs-baseline/screenshots/production-390x844.png | awk '{print $1}')"
          H1440="$(sha256sum docs/threejs-baseline/screenshots/production-1440x900.png | awk '{print $1}')"
          PAGE_TITLE="$(sed -n 's/^title=//p' docs/threejs-baseline/screenshots/capture-state.txt)"

          cat > docs/threejs-baseline/BASELINE.md <<EOF
          # THREEJS-001 — Safe Migration Baseline

          Frozen from the Godot Production deployment that was current when \`threejs-rebuild\` was created.

          ## Source of truth

          - Canonical Production URL at baseline: ${PROD_URL_AT_BASELINE}
          - Immutable Production deployment URL: ${PROD_DEPLOYMENT_URL}
          - Vercel deployment ID: ${PROD_DEPLOYMENT_ID}
          - Production Git SHA / branch creation SHA: \`${PROD_SHA}\`
          - Migration branch: \`${MIGRATION_BRANCH}\`
          - Migration branch base SHA: \`${START_SHA}\`
          - Latest \`main\` observed when screenshots completed: \`${MAIN_SHA_AT_CAPTURE}\`
          - Captured UTC: ${CAPTURED_UTC}
          - Captured page title: ${PAGE_TITLE}

          ## Migration isolation rule

          Until explicit cutover, all Three.js rewrite work belongs only on \`${MIGRATION_BRANCH}\`. Do not merge, fast-forward, or deploy this branch to Production. Existing Godot \`main\` and the canonical Production alias remain the reference implementation.

          ## Reference screenshots

          - \`screenshots/production-320x568.png\` — SHA-256 \`${H320}\`
          - \`screenshots/production-390x844.png\` — SHA-256 \`${H390}\`
          - \`screenshots/production-1440x900.png\` — SHA-256 \`${H1440}\`

          The images were captured from the immutable Vercel deployment URL above, so they remain tied to \`${PROD_SHA}\` even if \`main\` or the canonical alias advances later.
          EOF

      - name: Commit baseline and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/threejs-baseline-capture.yml
          git add docs/threejs-baseline
          git commit -m "THREEJS-001 record safe migration baseline"
          git push origin HEAD:threejs-rebuild
