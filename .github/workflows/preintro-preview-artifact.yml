name: Preintro Preview Artifact

on:
  push:
    branches:
      - agent/yakolak-3.0-star-to-table-preintro

permissions:
  contents: write

jobs:
  build-web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Build Godot Web and verify pixel-matched motion
        shell: bash
        run: bash scripts/vercel-build.sh

      - name: Upload visual review capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-preintro-visual-capture
          path: |
            visual-review/
            test-results/
            web/preintro-*.png
            web/intro-*.png
            web/gameplay-*.png
          if-no-files-found: warn
          compression-level: 0
          retention-days: 3

      - name: Upload deployable preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-preintro-web
          path: web/
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Publish isolated preview branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          cp -a web/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          cd "$publish_dir"
          git init
          git config user.name "YAKOLAK Preview Bot"
          git config user.email "actions@github.com"
          git checkout -b preview-star-to-table
          git add -A
          git commit -m "Publish browser-tested pixel-matched intro from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin preview-star-to-table
