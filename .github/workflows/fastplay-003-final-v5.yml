name: FASTPLAY-003 Final Public Acceptance v5

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/fastplay-003-final-v5.yml'

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-v5
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve web milestone
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(git log -1 --format='%H' -- web)"
          test "${#candidate}" -eq 40
          echo "sha=${candidate}" >> "$GITHUB_OUTPUT"

      - name: Mark final acceptance pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state=pending \
            -f context='FASTPLAY-003/final-public' \
            -f description='v5 stable-human WebGL acceptance running' \
            -f target_url="$run_url"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium

      - name: Build v5 verifier from proven v4
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fastplay-003-final-v4.yml').read_text()
          start_anchor = '      - name: Build v4 verifier\n'
          end_anchor = '      - name: Exercise full public first playable\n'
          start = workflow.index(start_anchor) + len(start_anchor)
          end = workflow.index(end_anchor, start)
          block = workflow[start:end]
          run_anchor = '        run: |\n'
          run = block.index(run_anchor) + len(run_anchor)
          script = textwrap.dedent(block[run:])
          Path('/tmp/build-v4.sh').write_text(script)
          PY
          bash /tmp/build-v4.sh

          python - <<'PY'
          from pathlib import Path
          path = Path('fastplay-003-final-v3.mjs')
          source = path.read_text()
          a = source.index('async function verifyWebglRecovery(page) {')
          b = source.index('\nasync function finishRound', a)
          replacement = r'''async function verifyWebglRecovery(page) {
            let before = null;
            for (let attempt = 0; attempt < 800; attempt += 1) {
              const state = await getState(page);
              const seat = state.seats.find(candidate => candidate.seatId === state.activeSeatId);
              const nowMs = await page.evaluate(() => Date.now());
              const remainingMs = state.deadlineAtMs === null ? 0 : state.deadlineAtMs - nowMs;
              if (
                state.roundEndRevision === null
                && !state.matchComplete
                && seat?.type === 'human'
                && Number.isSafeInteger(state.deadlineAtMs)
                && remainingMs >= 5_000
              ) {
                before = { state, remainingMs };
                break;
              }
              await page.waitForTimeout(25);
            }
            assert.ok(before, 'no stable human turn available for WebGL recovery');

            const initialGraphics = await page.evaluate(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot());
            assert.equal(initialGraphics.state, 'ready');
            const supported = await page.evaluate(() => {
              const canvas = window.__YAKOLAK_THREEJS_SHELL__.canvas;
              const gl = canvas.getContext('webgl2');
              const ext = gl?.getExtension('WEBGL_lose_context');
              if (!ext) return false;
              window.__FASTPLAY003_WEBGL_LOSE_CONTEXT__ = ext;
              ext.loseContext();
              return true;
            });
            assert.equal(supported, true, 'WEBGL_lose_context is required to verify real WebGL recovery');
            await page.waitForFunction(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot().state === 'lost', null, { timeout: 5_000 });
            await page.evaluate(() => window.__FASTPLAY003_WEBGL_LOSE_CONTEXT__.restoreContext());
            await page.waitForFunction(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot().state === 'ready', null, { timeout: 10_000 });

            const after = await getState(page);
            const graphics = await page.evaluate(() => window.__YAKOLAK_THREEJS_SHELL__.getGraphicsContextSnapshot());
            assert.equal(after.revision, before.state.revision, 'WebGL recovery mutated canonical revision during stable human turn');
            assert.equal(after.activeSeatId, before.state.activeSeatId, 'WebGL recovery changed active seat during stable human turn');
            assert.deepEqual(after.board, before.state.board, 'WebGL recovery mutated board');
            assert.deepEqual(after.scores, before.state.scores, 'WebGL recovery mutated scores');
            assert.ok(graphics.restoreCount >= initialGraphics.restoreCount + 1);
            console.log(JSON.stringify({
              stage: 'webgl-recovery-pass',
              revision: after.revision,
              activeSeatId: after.activeSeatId,
              remainingMsAtStart: before.remainingMs,
              restoreCountBefore: initialGraphics.restoreCount,
              restoreCountAfter: graphics.restoreCount,
            }));
            return { before: initialGraphics, after: graphics };
          }
          '''
          source = source[:a] + replacement + source[b:]
          path.write_text(source)
          PY
          node --check fastplay-003-final-v3.mjs
          grep -Fq "stage: 'real-timeout-pass'" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'webgl-recovery-pass'" fastplay-003-final-v3.mjs
          grep -Fq "desktop match never exercised a real drag" fastplay-003-final-v3.mjs

      - name: Exercise full public first playable
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: timeout --signal=TERM 12m node fastplay-003-final-v3.mjs 2>&1 | tee fastplay-003-final-v5.log

      - name: Mark accepted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          result="$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)"
          test "$result" = PASS
          test -n "$candidate"
          test -n "$generation"
          git cat-file -e "${candidate}^{commit}" 2>/dev/null || git fetch --quiet origin "$candidate"
          git merge-base --is-ancestor "$MILESTONE_SHA" "$candidate"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=success -f context='FASTPLAY-003/final-public' \
            -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=success -f context='FASTPLAY-003/first-playable' \
            -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" \
            -f state=success -f context='FASTPLAY-003/public-pass' \
            -f description='Public first-playable acceptance passed' -f target_url="$run_url"

      - name: Publish failure evidence
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" \
            -f state=failure -f context='FASTPLAY-003/final-public' \
            -f description='v5 public first-playable acceptance failed' -f target_url="$run_url"
          title="FASTPLAY-003 final-v5 blocker ${MILESTONE_SHA}"
          body="$(mktemp)"
          {
            echo 'FASTPLAY-003 final-v5 public acceptance failed.'
            echo
            echo "milestone_sha: ${MILESTONE_SHA}"
            echo "workflow_run: ${run_url}"
            echo
            echo '```text'
            tail -n 220 fastplay-003-final-v5.log 2>/dev/null || echo '(verifier log unavailable)'
            echo '```'
          } > "$body"
          gh issue create --title "$title" --body-file "$body" >/dev/null
