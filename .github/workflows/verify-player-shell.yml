name: Verify player shell

on:
  push:
    branches:
      - "111"
  pull_request:
    paths:
      - index.html
      - app.js
      - version.json
      - package.json
      - src/app-game-v111.js
      - scripts/verify-player-shell.mjs
      - .github/workflows/verify-player-shell.yml

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify v111 player shell
        run: npm test
      - name: Package exact tested source
        run: |
          zip -r yakolak-v111-tested-source.zip . \
            -x '.git/*' \
            -x 'yakolak-v111-tested-source.zip'
      - name: Upload tested source
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-v111-tested-source
          path: yakolak-v111-tested-source.zip
          retention-days: 1
          if-no-files-found: error
