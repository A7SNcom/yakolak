name: Apply Governed Closed Box V36

on:
  push:
    branches:
      - agent/yakolak-3.0-star-to-table-preintro

permissions:
  contents: write

jobs:
  apply-motion-refinement:
    if: ${{ !contains(github.event.head_commit.message, '[motion-v36-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/yakolak-3.0-star-to-table-preintro

      - name: Apply governed motion refinement
        shell: bash
        run: |
          python3 scripts/apply_governed_closed_box_v36.py
          python3 scripts/check_approved_baseline.py
          git diff --check

      - name: Commit refined motion
        shell: bash
        run: |
          git config user.name "YAKOLAK Motion Loop"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "حوكمة المشاهد وهبوط البوكس المغلق ككتلة واحدة [motion-v36-applied]"
          git push origin HEAD:agent/yakolak-3.0-star-to-table-preintro
