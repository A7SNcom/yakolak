name: THREEJS-027 reentrant rollback hardening

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - .github/workflows/threejs-027-reentrant-rollback.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: threejs-rebuild
          fetch-depth: 0
      - name: Rebase onto latest branch
        run: git pull --rebase origin threejs-rebuild
      - name: Apply lifecycle rollback hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/app/core/resource-registry.js')
          text = path.read_text()

          old = """  function listen(target, type, listener, options, metadata = {}) {
    assertLive();
    if (!target?.addEventListener || !target?.removeEventListener) {
      throw new TypeError('Registry listener target must implement addEventListener/removeEventListener');
    }
    if (typeof listener !== 'function') throw new TypeError('Registry listener must be a function');
    const prepared = normaliseMetadata({ ...metadata, kind: RESOURCE_KINDS.LISTENER });
    target.addEventListener(type, listener, options);
    const holder = { target, type, listener };
    return register(holder, {
      ...prepared,
      cleanup: () => target.removeEventListener(type, listener, options),
    });
  }

  function subscribe(subscribeFn, listener, metadata = {}) {
    assertLive();
    if (typeof subscribeFn !== 'function') throw new TypeError('Registry subscription requires a subscribe function');
    const prepared = normaliseMetadata({ ...metadata, kind: RESOURCE_KINDS.SUBSCRIPTION });
    const unsubscribe = subscribeFn(listener);
    if (typeof unsubscribe !== 'function') throw new TypeError('Subscription must return an unsubscribe function');
    const holder = { unsubscribe };
    return register(holder, {
      ...prepared,
      cleanup: unsubscribe,
    });
  }

  function observe(observer, target, options, metadata = {}) {
    assertLive();
    if (!observer?.observe || !observer?.disconnect) throw new TypeError('Registry observer must implement observe/disconnect');
    const prepared = normaliseMetadata({ ...metadata, kind: RESOURCE_KINDS.OBSERVER });
    assertObjectRegistrationAllowed(observer, prepared);
    observer.observe(target, options);
    return register(observer, prepared);
  }
"""

          new = """  function rollbackExternalSetup(cleanup) {
    try {
      cleanup?.();
    } catch {
      // Rollback is best-effort and must never hide the original setup/registration error.
    }
  }

  function registerAfterExternalSetup(resource, metadata, rollback) {
    try {
      return register(resource, metadata);
    } catch (error) {
      rollbackExternalSetup(rollback);
      throw error;
    }
  }

  function listen(target, type, listener, options, metadata = {}) {
    assertLive();
    if (!target?.addEventListener || !target?.removeEventListener) {
      throw new TypeError('Registry listener target must implement addEventListener/removeEventListener');
    }
    if (typeof listener !== 'function') throw new TypeError('Registry listener must be a function');
    const prepared = normaliseMetadata({ ...metadata, kind: RESOURCE_KINDS.LISTENER });
    const rollback = () => target.removeEventListener(type, listener, options);
    try {
      target.addEventListener(type, listener, options);
    } catch (error) {
      rollbackExternalSetup(rollback);
      throw error;
    }
    const holder = { target, type, listener };
    return registerAfterExternalSetup(holder, {
      ...prepared,
      cleanup: rollback,
    }, rollback);
  }

  function subscribe(subscribeFn, listener, metadata = {}) {
    assertLive();
    if (typeof subscribeFn !== 'function') throw new TypeError('Registry subscription requires a subscribe function');
    const prepared = normaliseMetadata({ ...metadata, kind: RESOURCE_KINDS.SUBSCRIPTION });
    const unsubscribe = subscribeFn(listener);
    if (typeof unsubscribe !== 'function') throw new TypeError('Subscription must return an unsubscribe function');
    const holder = { unsubscribe };
    return registerAfterExternalSetup(holder, {
      ...prepared,
      cleanup: unsubscribe,
    }, unsubscribe);
  }

  function observe(observer, target, options, metadata = {}) {
    assertLive();
    if (!observer?.observe || !observer?.disconnect) throw new TypeError('Registry observer must implement observe/disconnect');
    const prepared = normaliseMetadata({ ...metadata, kind: RESOURCE_KINDS.OBSERVER });
    assertObjectRegistrationAllowed(observer, prepared);
    const rollback = () => observer.disconnect();
    try {
      observer.observe(target, options);
    } catch (error) {
      rollbackExternalSetup(rollback);
      throw error;
    }
    return registerAfterExternalSetup(observer, prepared, rollback);
  }
"""

          if old not in text:
            raise SystemExit('listener/subscription/observer source block did not match expected content')
          text = text.replace(old, new, 1)

          old = """    holder.handle = delay == null ? scheduleFn(wrapped) : scheduleFn(wrapped, delay);
    token = register(holder, {
      ...prepared,
      cleanup: () => cancelFn(holder.handle),
    });
    return token;
"""
          new = """    holder.handle = delay == null ? scheduleFn(wrapped) : scheduleFn(wrapped, delay);
    const rollback = () => cancelFn(holder.handle);
    token = registerAfterExternalSetup(holder, {
      ...prepared,
      cleanup: rollback,
    }, rollback);
    return token;
"""
          if old not in text:
            raise SystemExit('one-shot source block did not match expected content')
          text = text.replace(old, new, 1)

          old = """    const holder = { handle: setIntervalFn(callback, Math.max(0, Number(delay) || 0)) };
    return register(holder, {
      ...prepared,
      cleanup: () => clearIntervalFn(holder.handle),
    });
"""
          new = """    const holder = { handle: setIntervalFn(callback, Math.max(0, Number(delay) || 0)) };
    const rollback = () => clearIntervalFn(holder.handle);
    return registerAfterExternalSetup(holder, {
      ...prepared,
      cleanup: rollback,
    }, rollback);
"""
          if old not in text:
            raise SystemExit('interval source block did not match expected content')
          text = text.replace(old, new, 1)
          path.write_text(text)

          verifier = Path('scripts/verify-threejs-shell.sh')
          text = verifier.read_text()
          anchor = '  tests/threejs_resource_registry_cross_scope_ownership.test.mjs\n'
          addition = anchor + '  tests/threejs_resource_registry_reentrant_rollback.test.mjs\n'
          if 'tests/threejs_resource_registry_reentrant_rollback.test.mjs' not in text:
            if anchor not in text:
              raise SystemExit('verifier required-list anchor missing')
            text = text.replace(anchor, addition, 1)
          run_anchor = 'node tests/threejs_resource_registry_cross_scope_ownership.test.mjs\n'
          run_addition = run_anchor + 'node tests/threejs_resource_registry_reentrant_rollback.test.mjs\n'
          if 'node tests/threejs_resource_registry_reentrant_rollback.test.mjs' not in text:
            if run_anchor not in text:
              raise SystemExit('verifier execution anchor missing')
            text = text.replace(run_anchor, run_addition, 1)
          verifier.write_text(text)

          contract = Path('THREEJS_RESOURCE_LIFECYCLE.md')
          text = contract.read_text()
          rule = '11. Replacement is transactional at external setup boundaries. In particular, a listener with a stable replacement key remains authoritative until the replacement listener has been installed successfully; if installation throws, the prior listener and its registry token remain active and no teardown is committed.\n'
          extended = rule + '12. External lifecycle setup is rollback-safe. If a listener, subscription, observer, RAF, timeout or interval is created successfully but registry registration then fails (including reentrant disposal), the newly created external handle is synchronously removed/unsubscribed/disconnected/cancelled before the original registration error is rethrown.\n'
          if '12. External lifecycle setup is rollback-safe.' not in text:
            if rule not in text:
              raise SystemExit('lifecycle contract anchor missing')
            text = text.replace(rule, extended, 1)
          contract.write_text(text)
          PY
      - name: Run focused THREEJS-027 lifecycle tests
        run: |
          node tests/threejs_resource_registry_reentrant_rollback.test.mjs
          node tests/threejs_resource_registry_preflight_contract.test.mjs
          node tests/threejs_resource_registry_atomic_listener_replacement.test.mjs
          node tests/threejs_resource_registry_cross_scope_ownership.test.mjs
          node tests/threejs_resource_registry_scope_ownership.test.mjs
          node tests/threejs_resource_registry_contract.test.mjs
      - name: Commit hardened lifecycle contract
        run: |
          if git diff --quiet; then
            echo 'No lifecycle changes required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/core/resource-registry.js scripts/verify-threejs-shell.sh THREEJS_RESOURCE_LIFECYCLE.md
          git commit -m 'THREEJS-027 rollback failed external lifecycle setup'
          git pull --rebase origin threejs-rebuild
          git push origin HEAD:threejs-rebuild
