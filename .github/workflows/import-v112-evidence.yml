name: Import v112 verified evidence

on:
  push:
    branches:
      - "112"
    paths:
      - .github/workflows/import-v112-evidence.yml

permissions:
  actions: read
  contents: write

jobs:
  import-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out v112
        uses: actions/checkout@v4
        with:
          ref: "112"
      - name: Download successful visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 30016971088 -n v112-visual-diagnostics --dir /tmp/v112-evidence
      - name: Import verified screenshots and results
        run: |
          source_dir=$(find /tmp/v112-evidence -type f -path '*/docs/screenshots/v112/results.json' -printf '%h\n' | head -n 1)
          test -n "$source_dir"
          mkdir -p docs/screenshots/v112
          cp -f "$source_dir"/* docs/screenshots/v112/
      - name: Commit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/v112
          git commit -m "Attach v112 visual playtest evidence"
          git push origin HEAD:112
