name: Verify v120 visual comparison

on:
  pull_request:
    paths:
      - 'src/mobile-clarity-v120.js'
      - 'src/app-game-v114.js'
      - 'scripts/verify-v120-visual-comparison-fast.mjs'
      - '.github/workflows/verify-v120-visual-comparison.yml'
  workflow_dispatch:

jobs:
  compare-v119-v120:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      V119_URL: 'https://yakolak-jwtqngovr-ahmdkcoms-projects.vercel.app/?_vercel_share=tCQKZTHQwhxBBcd57LFOjpML2Dtoxmpv'
      V120_URL: 'https://yakolak-2vyaqsin2-ahmdkcoms-projects.vercel.app/?_vercel_share=obqVJKwOzDnyK4mMx1ze920O002xWVEN'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Compare v119 and v120 visually and structurally
        run: node scripts/verify-v120-visual-comparison-fast.mjs

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v120-visual-comparison
          path: artifacts/v120-visual-comparison
          if-no-files-found: warn
