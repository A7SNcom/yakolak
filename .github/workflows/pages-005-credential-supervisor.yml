name: PAGES-005 credential probe supervisor

on:
  push:
    branches:
      - main
    paths:
      - '.github/PAGES005_CREDENTIAL_TRIGGER'
      - '.github/workflows/pages-005-credential-supervisor.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pages-005-credential-probe-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Dispatch credential probe and capture exact run
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/pages-005-credential-probe.yml/runs"
          before="$(gh api "$api" -f branch=main -f event=workflow_dispatch -f per_page=20 --jq '[.workflow_runs[].id]')"
          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pages-005-credential-probe.yml/dispatches" \
            -f ref=main >/dev/null

          run_id=''
          for attempt in $(seq 1 30); do
            runs="$(gh api "$api" -f branch=main -f event=workflow_dispatch -f per_page=20)"
            run_id="$(jq -r --argjson before "$before" --arg requested "$requested_at" '
              [.workflow_runs[]
                | select((.id as $id | ($before | index($id)) == null))
                | select(.created_at >= $requested)]
              | sort_by(.created_at)
              | last
              | .id // empty
            ' <<<"$runs")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 2
          done
          test -n "$run_id" || { echo 'could not resolve dispatched credential-probe run id' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          status=''
          conclusion=''
          for attempt in $(seq 1 90); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"$run")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            if [ "$status" = completed ]; then
              break
            fi
            sleep 3
          done
          test "$status" = completed || { echo "credential probe did not complete: ${status}" >&2; exit 1; }
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Record non-qualification probe run receipt
        if: always() && steps.probe.outputs.run_id != ''
        env:
          PROBE_RUN_ID: ${{ steps.probe.outputs.run_id }}
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
          PROBE_CONCLUSION: ${{ steps.probe.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          mkdir -p backend/cloudflare
          jq -n \
            --arg probeRunId "$PROBE_RUN_ID" \
            --arg probeStatus "$PROBE_STATUS" \
            --arg probeConclusion "$PROBE_CONCLUSION" \
            --arg supervisorRunId "$GITHUB_RUN_ID" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              event: "pages005_credential_probe_supervised",
              probeWorkflowRunId: ($probeRunId|tonumber),
              probeStatus: $probeStatus,
              probeConclusion: $probeConclusion,
              supervisorWorkflowRunId: ($supervisorRunId|tonumber),
              recordedAt: $recordedAt,
              containsSecretValues: false,
              qualificationEvidence: false
            }
            ' > backend/cloudflare/CREDENTIAL_PROBE_RUN.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cloudflare/CREDENTIAL_PROBE_RUN.json
          if ! git diff --cached --quiet; then
            git commit -m 'PAGES-005 record supervised credential probe run'
            git push origin HEAD:threejs-rebuild
          fi

      - name: Fail supervisor when probe failed
        if: steps.probe.outputs.conclusion != 'success'
        run: |
          echo "Credential probe concluded: ${{ steps.probe.outputs.conclusion }}" >&2
          exit 1
