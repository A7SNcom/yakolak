name: PAGES-015 Frontend Window Archive

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/pages-015-window-archive.yml'
      - 'scripts/pages015-archive-window-entry-v2.sh'
      - 'RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json'
      - 'backend/cloudflare/CREDENTIAL_STATUS.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-015-window-archive
  cancel-in-progress: false

jobs:
  resolve_window:
    runs-on: ubuntu-latest
    outputs:
      frontends: ${{ steps.window.outputs.frontends }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
      - name: Validate locked active + previous frontend window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          window='RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json'
          jq -e '
            .schemaVersion == 1 and
            .rules.thisFileDoesNotConferEligibility == true and
            .rules.bothRequireSuccessfulPages014LiveEvidence == true and
            .rules.bothRequireExactArchivedCompatibilityDescriptorDigest == true and
            (.frontends | length) == 2 and
            ([.frontends[].role] | sort) == ["active", "previous"] and
            (.frontends[0].releaseTag != .frontends[1].releaseTag or .frontends[0].assetSha256 != .frontends[1].assetSha256) and
            all(.frontends[];
              .assetName == "pages-composite.tar" and
              (.assetSha256 | test("^[a-f0-9]{64}$")) and
              (.onlineCompatibilityDescriptorSha256 | test("^[a-f0-9]{64}$")) and
              (.deploymentGeneration | test("^sha256:[a-f0-9]{64}$")) and
              (.publicRuntimeProtocolSha256 | test("^[a-f0-9]{64}$")) and
              (.contentIdentitySha256 | test("^[a-f0-9]{64}$")) and
              .pages014LiveEvidence.verified == true and
              (.pages014LiveEvidence.verifierWorkflowRunId | type == "number") and
              (.pages014LiveEvidence.verifierJobId | type == "number") and
              (.pages014LiveEvidence.liveManifestSha256 | test("^[a-f0-9]{64}$")) and
              .pages014LiveEvidence.pageUrl == "https://a7sncom.github.io/yakolak/"
            )
          ' "$window" >/dev/null
          echo "frontends=$(jq -c '.frontends' "$window")" >> "$GITHUB_OUTPUT"

  archive:
    needs: resolve_window
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        frontend: ${{ fromJSON(needs.resolve_window.outputs.frontends) }}
    env:
      ROLE: ${{ matrix.frontend.role }}
      RELEASE_TAG: ${{ matrix.frontend.releaseTag }}
      GODOT_ROOT_SHA: ${{ matrix.frontend.godotRootSha }}
      THREEJS_CANDIDATE_SHA: ${{ matrix.frontend.threejsCandidateSha }}
      SOURCE_PAGES_RUN_ID: ${{ matrix.frontend.sourcePagesRunId }}
      SOURCE_PAGES_ARTIFACT_ID: ${{ matrix.frontend.sourcePagesArtifactId }}
      SOURCE_ARTIFACT_TAR_SHA256: ${{ matrix.frontend.assetSha256 }}
      EXPECTED_ONLINE_DESCRIPTOR_SHA256: ${{ matrix.frontend.onlineCompatibilityDescriptorSha256 }}
      DEPLOYMENT_GENERATION: ${{ matrix.frontend.deploymentGeneration }}
      PUBLIC_RUNTIME_PROTOCOL_SHA256: ${{ matrix.frontend.publicRuntimeProtocolSha256 }}
      CONTENT_IDENTITY_SHA256: ${{ matrix.frontend.contentIdentitySha256 }}
      PAGES014_VERIFIER_RUN_ID: ${{ matrix.frontend.pages014LiveEvidence.verifierWorkflowRunId }}
      PAGES014_VERIFIER_JOB_ID: ${{ matrix.frontend.pages014LiveEvidence.verifierJobId }}
      PAGES014_LIVE_MANIFEST_SHA256: ${{ matrix.frontend.pages014LiveEvidence.liveManifestSha256 }}
      PAGES014_PAGE_URL: ${{ matrix.frontend.pages014LiveEvidence.pageUrl }}
      GH_TOKEN: ${{ github.token }}
      ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0
      - name: Validate archive helper syntax
        run: bash -n scripts/pages015-archive-window-entry-v2.sh
      - name: Qualify immutable frontend archive serially
        run: bash scripts/pages015-archive-window-entry-v2.sh
