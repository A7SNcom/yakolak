name: PAGES-015 Frontend Window Archive

on:
  push:
    branches:
      - threejs-rebuild
    paths:
      - '.github/workflows/pages-015-window-archive.yml'
      - 'scripts/pages015-archive-window-entry-v2.sh'
      - 'scripts/pages015-record-exact-draft-stage.sh'
      - 'RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json'
      - 'RELEASE_QUALIFICATION/PAGES015_ARCHIVE_TRIGGER'
      - 'backend/cloudflare/CREDENTIAL_STATUS.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pages-015-window-archive
  cancel-in-progress: false

jobs:
  resolve_window:
    runs-on: ubuntu-latest
    outputs:
      frontends: ${{ steps.window.outputs.frontends }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Record non-qualification archive run receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          mkdir -p RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS
          jq -n \
            --arg runId "$GITHUB_RUN_ID" \
            --arg headSha "$GITHUB_SHA" \
            --arg eventName "$GITHUB_EVENT_NAME" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              workflow: "pages-015-window-archive.yml",
              workflowRunId: ($runId|tonumber),
              triggerHeadSha: $headSha,
              eventName: $eventName,
              state: "started",
              recordedAt: $recordedAt,
              qualificationEvidence: false
            }
            ' > RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS/run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS/run.json
          if ! git diff --cached --quiet; then
            git commit -m 'PAGES-015 record archive workflow run'
            git push origin HEAD:threejs-rebuild
          fi

      - name: Validate locked active + previous frontend window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          window='RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json'
          jq -e '
            .schemaVersion == 1 and
            .rules.thisFileDoesNotConferEligibility == true and
            .rules.bothRequireSuccessfulPages014LiveEvidence == true and
            .rules.bothRequireExactArchivedCompatibilityDescriptorDigest == true and
            (.frontends | length) == 2 and
            ([.frontends[].role] | sort) == ["active", "previous"] and
            (.frontends[0].releaseTag != .frontends[1].releaseTag or .frontends[0].assetSha256 != .frontends[1].assetSha256) and
            all(.frontends[];
              .assetName == "pages-composite.tar" and
              (.assetSha256 | test("^[a-f0-9]{64}$")) and
              (.onlineCompatibilityDescriptorSha256 | test("^[a-f0-9]{64}$")) and
              (.deploymentGeneration | test("^sha256:[a-f0-9]{64}$")) and
              (.publicRuntimeProtocolSha256 | test("^[a-f0-9]{64}$")) and
              (.contentIdentitySha256 | test("^[a-f0-9]{64}$")) and
              .pages014LiveEvidence.verified == true and
              (.pages014LiveEvidence.verifierWorkflowRunId | type == "number") and
              (.pages014LiveEvidence.verifierJobId | type == "number") and
              (.pages014LiveEvidence.liveManifestSha256 | test("^[a-f0-9]{64}$")) and
              .pages014LiveEvidence.pageUrl == "https://a7sncom.github.io/yakolak/"
            )
          ' "$window" >/dev/null
          echo "frontends=$(jq -c '.frontends' "$window")" >> "$GITHUB_OUTPUT"

  archive:
    needs: resolve_window
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-backend
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        frontend: ${{ fromJSON(needs.resolve_window.outputs.frontends) }}
    env:
      ROLE: ${{ matrix.frontend.role }}
      RELEASE_TAG: ${{ matrix.frontend.releaseTag }}
      GODOT_ROOT_SHA: ${{ matrix.frontend.godotRootSha }}
      THREEJS_CANDIDATE_SHA: ${{ matrix.frontend.threejsCandidateSha }}
      SOURCE_PAGES_RUN_ID: ${{ matrix.frontend.sourcePagesRunId }}
      SOURCE_PAGES_ARTIFACT_ID: ${{ matrix.frontend.sourcePagesArtifactId }}
      SOURCE_ARTIFACT_TAR_SHA256: ${{ matrix.frontend.assetSha256 }}
      EXPECTED_ONLINE_DESCRIPTOR_SHA256: ${{ matrix.frontend.onlineCompatibilityDescriptorSha256 }}
      DEPLOYMENT_GENERATION: ${{ matrix.frontend.deploymentGeneration }}
      PUBLIC_RUNTIME_PROTOCOL_SHA256: ${{ matrix.frontend.publicRuntimeProtocolSha256 }}
      CONTENT_IDENTITY_SHA256: ${{ matrix.frontend.contentIdentitySha256 }}
      PAGES014_VERIFIER_RUN_ID: ${{ matrix.frontend.pages014LiveEvidence.verifierWorkflowRunId }}
      PAGES014_VERIFIER_JOB_ID: ${{ matrix.frontend.pages014LiveEvidence.verifierJobId }}
      PAGES014_LIVE_MANIFEST_SHA256: ${{ matrix.frontend.pages014LiveEvidence.liveManifestSha256 }}
      PAGES014_PAGE_URL: ${{ matrix.frontend.pages014LiveEvidence.pageUrl }}
      GH_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN || github.token }}
      ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Validate archive helper syntax
        run: |
          set -euo pipefail
          bash -n scripts/pages015-archive-window-entry-v2.sh
          bash -n scripts/pages015-record-exact-draft-stage.sh

      - name: Resolve immutable-release admin readiness
        id: admin
        shell: bash
        run: |
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=PAGES-015 waiting for immutable-release admin credential::Existing exact drafts are byte-verified; missing drafts cannot be created or published until the admin credential exists. No eligibility event is written.'
          fi

      - name: Stage or verify exact mutable draft while admin credential is absent
        id: stage
        if: steps.admin.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/pages015-stage-${ROLE}.log"
          echo 'state=checking' >> "$GITHUB_OUTPUT"
          set +e
          bash scripts/pages015-archive-window-entry-v2.sh >"$log" 2>&1
          rc=$?
          set -e
          cat "$log"

          if [ "$rc" -eq 0 ]; then
            echo 'state=completed-or-existing-immutable' >> "$GITHUB_OUTPUT"
            echo "${ROLE} archive was already immutable/qualified or otherwise completed safely."
            exit 0
          fi

          if grep -Fq 'PAGES_RELEASE_ADMIN_TOKEN is required before publishing the exact draft.' "$log"; then
            bash scripts/pages015-record-exact-draft-stage.sh
            echo 'state=exact-draft-verified' >> "$GITHUB_OUTPUT"
            echo "${ROLE} exact draft verified; publication remains WAITING for immutable-release admin proof."
            exit 0
          fi

          if grep -Fq 'HTTP 403: Resource not accessible by integration' "$log" && grep -Fq '/releases' "$log"; then
            echo 'state=waiting-admin-to-create-draft' >> "$GITHUB_OUTPUT"
            echo "::notice title=PAGES-015 draft creation waiting for admin credential::${ROLE} has no reusable draft and github.token cannot create it. It will be created with PAGES_RELEASE_ADMIN_TOKEN once that credential exists."
            exit 0
          fi

          echo 'state=unexpected-failure' >> "$GITHUB_OUTPUT"
          echo "archive helper failed before an expected external credential gate" >&2
          exit "$rc"

      - name: Publish and fully qualify immutable frontend archive serially
        id: publish
        if: steps.admin.outputs.ready == 'true'
        run: bash scripts/pages015-archive-window-entry-v2.sh

      - name: Record non-qualification role outcome
        if: always()
        env:
          ADMIN_READY: ${{ steps.admin.outputs.ready }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
          STAGE_STATE: ${{ steps.stage.outputs.state }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild
          mkdir -p RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS
          jq -n \
            --arg role "$ROLE" \
            --arg releaseTag "$RELEASE_TAG" \
            --arg assetSha256 "$SOURCE_ARTIFACT_TAR_SHA256" \
            --arg adminReady "${ADMIN_READY:-}" \
            --arg stageOutcome "${STAGE_OUTCOME:-}" \
            --arg stageState "${STAGE_STATE:-}" \
            --arg publishOutcome "${PUBLISH_OUTCOME:-}" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              schemaVersion: 1,
              role: $role,
              releaseTag: $releaseTag,
              assetSha256: $assetSha256,
              immutableAdminReady: ($adminReady == "true"),
              stageOutcome: $stageOutcome,
              stageState: $stageState,
              publishOutcome: $publishOutcome,
              workflowRunId: ($runId|tonumber),
              recordedAt: $recordedAt,
              qualificationEvidence: false
            }
            ' > "RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS/${ROLE}.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "RELEASE_QUALIFICATION/PAGES015_ARCHIVE_STATUS/${ROLE}.json"
          if ! git diff --cached --quiet; then
            git commit -m "PAGES-015 record ${ROLE} archive workflow outcome"
            git push origin HEAD:threejs-rebuild
          fi
