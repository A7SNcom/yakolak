name: Sync Rashed Leadership Branch

on:
  push:
    branches:
      - agent/president-portal-v3
    paths:
      - '.github/workflows/sync-rashed-leadership.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/president-portal-v3
          fetch-depth: 0
      - name: Merge latest team head and remove this one-shot workflow
        run: |
          git config user.name "Yakolak Framework Sync"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin agent/yakolak-team-os
          git merge --no-ff -X ours origin/agent/yakolak-team-os -m "chore: sync latest team evidence into Rashed Leadership OS"
          git rm .github/workflows/sync-rashed-leadership.yml
          git commit -m "chore: remove one-shot branch sync"
          git push origin HEAD:agent/president-portal-v3
