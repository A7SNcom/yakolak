name: FASTPLAY-003 Final Public Acceptance v13
# Authoritative rerun: preserve default motion, await round-result presentation, and verify the current branch head.

on:
  push:
    branches: [threejs-rebuild]
    paths:
      - 'web/**'
      - '.github/workflows/fastplay-003-final-v13.yml'

permissions:
  contents: write
  issues: write
  statuses: write

concurrency:
  group: fastplay-003-final-v13
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - id: candidate
        shell: bash
        run: echo "sha=$(git log -1 --format='%H' -- web)" >> "$GITHUB_OUTPUT"
      - name: Mark pending
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" -f state=pending -f context='FASTPLAY-003/final-public' -f description='v13 authoritative public acceptance running' -f target_url="$run_url"
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build verifier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/fastplay-003-final-v10.yml').read_text()
          a = workflow.index('      - name: Build verifier\n')
          b = workflow.index('      - name: Exercise full public first playable\n', a)
          block = workflow[a:b]
          r = block.index('        run: |\n') + len('        run: |\n')
          Path('/tmp/build-v10.sh').write_text(textwrap.dedent(block[r:]))
          PY
          bash /tmp/build-v10.sh
          python - <<'PY'
          from pathlib import Path
          p = Path('fastplay-003-final-v3.mjs')
          s = p.read_text()
          old = """const ready = state.activeSeatId === seatId
                  && !presentation?.movePresentationLock
                  && (!presentation?.drag?.phase || presentation.drag.phase === 'idle')
                  && (!presentation?.tap?.phase || presentation.tap.phase === 'idle');"""
          new = """const ready = state.activeSeatId === seatId
                  && !presentation?.movePresentationLock;"""
          if old not in s:
              raise SystemExit('physical readiness predicate anchor changed')
          s = s.replace(old, new, 1)
          old_wait = "await waitForRevisionOrRoundEnd(page, beforeRevision, { timeoutMs: 3_000, pollingMs: 25 });"
          new_wait = "await waitForRevisionOrRoundEnd(page, beforeRevision, { timeoutMs: 23_000, pollingMs: 25 });"
          if old_wait not in s:
              raise SystemExit('computer handoff timeout anchor changed')
          s = s.replace(old_wait, new_wait, 1)
          old_result = """    const visibleResult = await page.locator('#round-result').isVisible();
    assert.equal(visibleResult, true, `round result not visible for round ${state.round}`);"""
          new_result = """    try {
      await page.locator('#round-result').waitFor({ state: 'visible', timeout: 5_000 });
    } catch (error) {
      const ui = await page.evaluate(() => ({
        bootState: document.documentElement.dataset.bootState,
        scene: document.documentElement.dataset.fastplayScene,
        roundResultHidden: document.querySelector('#round-result')?.hidden ?? null,
        roundResultText: document.querySelector('#round-result')?.textContent || '',
      }));
      throw new Error(`round result did not become visible for round ${state.round}: ${JSON.stringify(ui)}`, { cause: error });
    }"""
          if old_result not in s:
              raise SystemExit('round result visibility anchor changed')
          s = s.replace(old_result, new_result, 1)
          p.write_text(s)
          PY
          node --check fastplay-003-final-v3.mjs
          grep -Fq "state.activeSeatId === seatId" fastplay-003-final-v3.mjs
          grep -Fq "&& !presentation?.movePresentationLock;" fastplay-003-final-v3.mjs
          grep -Fq "timeoutMs: 23_000" fastplay-003-final-v3.mjs
          grep -Fq "waitFor({ state: 'visible', timeout: 5_000 })" fastplay-003-final-v3.mjs
          grep -Fq "WebGL recovery must run at a stable round boundary" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'real-timeout-pass'" fastplay-003-final-v3.mjs
          grep -Fq "stage: 'webgl-recovery-pass'" fastplay-003-final-v3.mjs
          ! grep -Fq "reducedMotion: 'reduce'" fastplay-003-final-v3.mjs
      - name: Exercise full public first playable
        env:
          FASTPLAY003_EXPECTED_CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          FASTPLAY003_BASE_URL: https://a7sncom.github.io/yakolak/threejs/
          FASTPLAY003_ARTIFACT_PATH: fastplay-003-acceptance.json
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 14m node fastplay-003-final-v3.mjs 2>&1 | tee fastplay-003-final-v13.log
      - name: Mark success and freeze evidence
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(jq -r '.candidateSha' fastplay-003-acceptance.json)"
          generation="$(jq -r '.deploymentGeneration' fastplay-003-acceptance.json)"
          public_url="$(jq -r '.publicUrl' fastplay-003-acceptance.json)"
          test "$(jq -r '.FIRST_PLAYABLE_EXPERIMENTAL' fastplay-003-acceptance.json)" = PASS
          test -n "$candidate"
          test -n "$generation"
          test "$public_url" = 'https://a7sncom.github.io/yakolak/threejs/'
          git cat-file -e "${candidate}^{commit}" 2>/dev/null || git fetch --quiet origin "$candidate"
          git merge-base --is-ancestor "$MILESTONE_SHA" "$candidate"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/first-playable-experimental" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/heads/first-playable-experimental' -f sha="$candidate" >/dev/null
          elif [ "$existing" != "$candidate" ]; then
            echo "refusing to move frozen first-playable-experimental from $existing to $candidate" >&2
            exit 1
          fi

          body="$(mktemp)"
          cat > "$body" <<EOF
          FIRST_PLAYABLE_EXPERIMENTAL=PASS

          milestone_sha: ${MILESTONE_SHA}
          candidate_sha: ${candidate}
          deployment_generation: ${generation}
          public_url: ${public_url}
          freeze_branch: first-playable-experimental
          workflow_run: ${run_url}

          Verified on the actual public GitHub Pages generation: desktop and mobile portrait, explicit 2-player Human+Computer, real tap and drag moves, one real 18-second timeout, completed round and match, score, next-round reset, rematch, return to setup, refresh recovery, WebGL recovery, and no fatal/page errors.
          EOF
          title='FIRST_PLAYABLE_EXPERIMENTAL=PASS'
          issue="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "$issue" ]; then gh issue create --title "$title" --body-file "$body" >/dev/null; else gh issue edit "$issue" --body-file "$body" >/dev/null; fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/final-public' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=success -f context='FASTPLAY-003/first-playable' -f description='FIRST_PLAYABLE_EXPERIMENTAL=PASS' -f target_url="$run_url"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate}" -f state=success -f context='FASTPLAY-003/public-pass' -f description="PASS generation ${generation}" -f target_url="$run_url"
      - name: Upload evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fastplay-003-v13-${{ steps.candidate.outputs.sha }}
          path: fastplay-003-acceptance.json
          retention-days: 90
      - name: Publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          MILESTONE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${MILESTONE_SHA}" -f state=failure -f context='FASTPLAY-003/final-public' -f description='v13 acceptance failed' -f target_url="$run_url"
          title="FASTPLAY-003 final-v13 blocker ${MILESTONE_SHA}"
          body="$(mktemp)"
          { echo 'FASTPLAY-003 final-v13 failed.'; echo; echo "workflow_run: ${run_url}"; echo '```text'; tail -n 280 fastplay-003-final-v13.log 2>/dev/null || echo '(verifier log unavailable)'; echo '```'; } > "$body"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -z "$existing" ]; then gh issue create --title "$title" --body-file "$body" >/dev/null; else gh issue edit "$existing" --body-file "$body" >/dev/null; fi
