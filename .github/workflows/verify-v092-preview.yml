name: Verify recovered v092 gameplay

on:
  push:
    branches:
      - agent/recover-vercel-v092
    paths:
      - tests/e2e/diagnose-v092-preview.mjs
      - tests/e2e/verify-v092-preview.mjs
      - .github/workflows/verify-v092-preview.yml
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/diagnose-v092-preview.mjs
      - tests/e2e/verify-v092-preview.mjs
      - .github/workflows/verify-v092-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://yakolak.vercel.app
      ARTIFACT_DIR: artifacts/e2e
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/recover-vercel-v092

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Improve 3D test targeting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/verify-v092-preview.mjs')
          s = p.read_text()
          s = s.replace('async function projectedPoint(page, resolver) {', 'async function projectedPoint(page, resolver, arg) {')
          s = s.replace('const point = await page.evaluate(resolver);', 'const point = await page.evaluate(resolver, arg);')
          old = '''    const z = g.boardZones.find((x) => x.id === zoneId);
              if (!z) return null;
              const p = new g.THREE.Vector3(z.px, z.py, z.pz);
              g.gameGroup.localToWorld(p);'''
          new = '''    const z = g.boardZones.find((x) => x.id === zoneId);
              if (!z) return null;
              const marker = g.gameGroup.getObjectByName(`yakolak-drop-zone-${zoneId + 1}`);
              const p = new g.THREE.Vector3();
              if (marker) marker.getWorldPosition(p);
              else {
                p.set(z.px, z.py, z.pz);
                g.gameGroup.localToWorld(p);
              }'''
          s = s.replace(old, new)
          old2 = '''  await clickHumanPiece(page);
            await page.waitForTimeout(700);'''
          new2 = '''  await clickHumanPiece(page);
            await page.screenshot({ path: `${outDir}/${name}-04b-piece-opened.png`, fullPage: true });
            await page.waitForFunction(() => {
              const g = globalThis.__yakolakGame;
              return g.gameGroup.children.some((o) => o.name?.startsWith('yakolak-drop-zone-') && o.visible);
            }, null, { timeout: 10_000 });
            await page.waitForTimeout(300);'''
          s = s.replace(old2, new2)
          old3 = '''  await clickBoardZone(page, 4);
            await page.waitForFunction(() => {
              const g = globalThis.__yakolakGame;
              const color = g.state.humanColor;
              return g.state.board?.[4]?.l === color || g.state.board?.[4]?.m === color || g.state.board?.[4]?.s === color;
            }, null, { timeout: 15_000 });'''
          new3 = '''  const candidateZones = await page.evaluate(() => {
              const g = globalThis.__yakolakGame;
              const r = g.renderer.domElement.getBoundingClientRect();
              return g.gameGroup.children
                .filter((o) => o.name?.startsWith('yakolak-drop-zone-') && o.visible)
                .map((o) => {
                  const p = new g.THREE.Vector3();
                  o.getWorldPosition(p);
                  p.project(g.camera);
                  return { name: o.name, x: r.left + (p.x + 1) * r.width / 2, y: r.top + (1 - p.y) * r.height / 2 };
                });
            });
            let humanMovePlaced = false;
            for (const point of candidateZones) {
              await page.mouse.click(point.x, point.y);
              await page.waitForTimeout(900);
              humanMovePlaced = await page.evaluate(() => {
                const g = globalThis.__yakolakGame;
                return Object.values(g.state.board || {}).some((cell) => Object.values(cell || {}).some((color) => color === g.state.humanColor));
              });
              if (humanMovePlaced) break;
            }
            assert(humanMovePlaced, `${name}: no visible board zone accepted the selected piece`);
            await page.screenshot({ path: `${outDir}/${name}-04c-human-move.png`, fullPage: true });'''
          if old3 not in s:
              raise SystemExit('Expected board placement block was not found')
          s = s.replace(old3, new3)
          p.write_text(s)
          PY

      - name: Diagnose public v092 loading
        run: node tests/e2e/diagnose-v092-preview.mjs

      - name: Run desktop and mobile gameplay tests
        run: node tests/e2e/verify-v092-preview.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-v092-gameplay-e2e
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 7
