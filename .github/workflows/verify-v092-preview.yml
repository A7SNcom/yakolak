name: Verify recovered v092 gameplay

on:
  push:
    branches:
      - agent/recover-vercel-v092
    paths:
      - tests/e2e/diagnose-v092-preview.mjs
      - tests/e2e/verify-v092-preview.mjs
      - .github/workflows/verify-v092-preview.yml
  pull_request:
    branches:
      - main
    paths:
      - tests/e2e/diagnose-v092-preview.mjs
      - tests/e2e/verify-v092-preview.mjs
      - .github/workflows/verify-v092-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://yakolak.vercel.app
      ARTIFACT_DIR: artifacts/e2e
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: agent/recover-vercel-v092

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Fix test harness argument forwarding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/e2e/verify-v092-preview.mjs')
          s = p.read_text()
          s = s.replace('async function projectedPoint(page, resolver) {', 'async function projectedPoint(page, resolver, arg) {')
          s = s.replace('const point = await page.evaluate(resolver);', 'const point = await page.evaluate(resolver, arg);')
          p.write_text(s)
          PY

      - name: Diagnose public v092 loading
        run: node tests/e2e/diagnose-v092-preview.mjs

      - name: Run desktop and mobile gameplay tests
        run: node tests/e2e/verify-v092-preview.mjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yakolak-v092-gameplay-e2e
          path: artifacts/e2e
          if-no-files-found: error
          retention-days: 7
