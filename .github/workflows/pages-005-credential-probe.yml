name: PAGES-005 credential probe and bootstrap dispatch

on:
  push:
    branches:
      - main
    paths:
      - '.github/PAGES005_CREDENTIAL_TRIGGER'
      - '.github/workflows/pages-005-credential-probe.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: pages-005-credential-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: cloudflare-backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: threejs-rebuild
          fetch-depth: 0

      - name: Probe readiness without exposing secret values
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          PAGES_RELEASE_ADMIN_TOKEN: ${{ secrets.PAGES_RELEASE_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin threejs-rebuild
          git reset --hard origin/threejs-rebuild

          # Stop doing credential work once the locked active+previous frontend window is fully qualified.
          if [ -s RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json ] && [ -s RELEASE_QUALIFICATION/ledger.jsonl ]; then
            active_tag="$(jq -r '.frontends[] | select(.role == "active") | .releaseTag' RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json)"
            active_digest="$(jq -r '.frontends[] | select(.role == "active") | .assetSha256' RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json)"
            previous_tag="$(jq -r '.frontends[] | select(.role == "previous") | .releaseTag' RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json)"
            previous_digest="$(jq -r '.frontends[] | select(.role == "previous") | .assetSha256' RELEASE_QUALIFICATION/ONLINE_FRONTEND_WINDOW.json)"
            if node scripts/verify-release-qualification.mjs "$active_tag" "$active_digest" >/dev/null 2>&1 && \
               node scripts/verify-release-qualification.mjs "$previous_tag" "$previous_digest" >/dev/null 2>&1; then
              echo 'PAGES-015 already fully qualified; credential probe exits without changes.'
              exit 0
            fi
          fi

          present() { if [ -n "$1" ]; then printf true; else printf false; fi; }
          cf_token="$(present "${CLOUDFLARE_API_TOKEN:-}")"
          cf_account="$(present "${CLOUDFLARE_ACCOUNT_ID:-}")"
          turso_url="$(present "${TURSO_DATABASE_URL:-}")"
          turso_token="$(present "${TURSO_AUTH_TOKEN:-}")"
          release_admin="$(present "${PAGES_RELEASE_ADMIN_TOKEN:-}")"

          cloudflare_ready=false
          if [ "$cf_token" = true ] && [ "$cf_account" = true ] && [ "$turso_url" = true ] && [ "$turso_token" = true ]; then
            cloudflare_ready=true
          fi

          worker_locked=false
          if [ -s backend/cloudflare/API_ORIGIN.txt ] && [ -s backend/cloudflare/WORKER_ROLLBACK_WINDOW.json ]; then
            if jq -e '
              .schemaVersion == 1 and
              .gate == "PAGES-005" and
              .provider == "cloudflare-workers" and
              (.activeWorkerVersionId | type == "string" and length > 0) and
              (.previousWorkerVersionId | type == "string" and length > 0) and
              .activeWorkerVersionId != .previousWorkerVersionId and
              .versionOverrideProof == true and
              .browserCorsVerified == true and
              .liveTursoRoundTripVerified == true
            ' backend/cloudflare/WORKER_ROLLBACK_WINDOW.json >/dev/null; then
              worker_locked=true
            fi
          fi

          dispatched=false
          dispatch_code='not-attempted'
          if [ "$cloudflare_ready" = true ] && [ "$worker_locked" != true ]; then
            dispatch_code="$(curl --silent --show-error \
              --output /tmp/pages005-bootstrap-dispatch.json \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --header 'Content-Type: application/json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages-005-backend-bootstrap.yml/dispatches" \
              --data '{"ref":"main"}')"
            if [ "$dispatch_code" = '204' ]; then
              dispatched=true
            else
              echo "PAGES-005 bootstrap dispatch failed (HTTP ${dispatch_code})." >&2
              cat /tmp/pages005-bootstrap-dispatch.json >&2 || true
            fi
          fi

          mkdir -p backend/cloudflare
          core="$RUNNER_TEMP/pages005-credential-core.json"
          jq -n \
            --argjson cloudflareApiTokenPresent "$cf_token" \
            --argjson cloudflareAccountIdPresent "$cf_account" \
            --argjson tursoDatabaseUrlPresent "$turso_url" \
            --argjson tursoAuthTokenPresent "$turso_token" \
            --argjson pagesReleaseAdminTokenPresent "$release_admin" \
            --argjson cloudflareBootstrapReady "$cloudflare_ready" \
            --argjson workerRollbackWindowLocked "$worker_locked" \
            --argjson bootstrapDispatched "$dispatched" \
            --arg dispatchHttpCode "$dispatch_code" \
            '{
              schemaVersion: 1,
              event: "pages005_credential_presence_checked",
              cloudflareApiTokenPresent: $cloudflareApiTokenPresent,
              cloudflareAccountIdPresent: $cloudflareAccountIdPresent,
              tursoDatabaseUrlPresent: $tursoDatabaseUrlPresent,
              tursoAuthTokenPresent: $tursoAuthTokenPresent,
              pagesReleaseAdminTokenPresent: $pagesReleaseAdminTokenPresent,
              cloudflareBootstrapReady: $cloudflareBootstrapReady,
              workerRollbackWindowLocked: $workerRollbackWindowLocked,
              bootstrapDispatched: $bootstrapDispatched,
              dispatchHttpCode: $dispatchHttpCode,
              containsSecretValues: false,
              qualificationEvidence: false
            }' > "$core"

          # Do not create daily churn when the semantic credential/lock state has not changed.
          if [ -s backend/cloudflare/CREDENTIAL_STATUS.json ]; then
            jq 'del(.probeWorkflowRunId,.recordedAt)' backend/cloudflare/CREDENTIAL_STATUS.json > "$RUNNER_TEMP/pages005-existing-core.json"
            if cmp -s "$core" "$RUNNER_TEMP/pages005-existing-core.json"; then
              echo 'Credential/lock state unchanged; no repository commit.'
              exit 0
            fi
          fi

          jq \
            --arg probeRunId "$GITHUB_RUN_ID" \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '. + {probeWorkflowRunId:($probeRunId|tonumber),recordedAt:$recordedAt}' \
            "$core" > backend/cloudflare/CREDENTIAL_STATUS.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cloudflare/CREDENTIAL_STATUS.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --name-only | grep -qx 'backend/cloudflare/CREDENTIAL_STATUS.json'
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m 'PAGES-005 record credential readiness'
          git push origin HEAD:threejs-rebuild
