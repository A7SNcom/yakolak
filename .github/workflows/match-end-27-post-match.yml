name: MATCH-END-27 post-match multi-client regression

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: match-end-27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  post-match-multiclient:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[web-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install online room dependency
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Verify MATCH-END-27 local model and exposed-action contract
        run: |
          node --check tests/post_match_multiclient_regression.test.mjs
          node tests/post_match_multiclient_regression.test.mjs
      - name: Verify MATCH-END-27 canonical production convergence
        env:
          YAKOLAK_PROBE_BASE: https://yakolak.vercel.app
        run: |
          for attempt in {1..12}; do
            if node tests/post_match_multiclient_regression.test.mjs; then exit 0; fi
            echo "Production post-match state is not ready; retry $attempt/12"
            sleep 10
          done
          exit 1
