<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yakolak - Real Empty Room</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:#e9eef2;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:#1e1e1e}
    #app{position:fixed;inset:0}
    .hud{position:fixed;right:18px;top:18px;z-index:5;width:min(365px,calc(100vw - 36px));padding:14px 16px;border:1px solid rgba(30,30,30,.08);border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(16,24,40,.08)}
    .hud h1{margin:0 0 6px;font-size:17px;line-height:1.4}
    .hud p{margin:0;font-size:13px;line-height:1.7;color:#667085}
    .badge{display:inline-flex;gap:6px;align-items:center;margin-top:10px;padding:7px 10px;border-radius:999px;background:rgba(60,163,187,.12);color:#2d7f94;font-weight:700;font-size:12px}
    .controls{position:fixed;left:18px;bottom:18px;z-index:5;display:flex;gap:8px;flex-wrap:wrap}
    button{border:1px solid rgba(30,30,30,.09);border-radius:999px;background:rgba(255,255,255,.82);padding:10px 13px;cursor:pointer;color:#1e1e1e;box-shadow:0 10px 30px rgba(16,24,40,.07);font-weight:700}
    .error{position:fixed;inset:auto 18px 18px auto;max-width:520px;z-index:99;padding:12px 14px;border-radius:14px;background:#fff3f3;color:#9b1c1c;border:1px solid #ffd0d0;display:none;direction:ltr;text-align:left;font:13px/1.5 monospace}
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <section class="hud">
    <h1>غرفة Yakolak الفاضية</h1>
    <p>غرفة حقيقية واضحة: أرض + سقف + 4 جدران. الجدار الأمامي شفاف للمعاينة فقط حتى تشوف الداخل.</p>
    <div class="badge">✅ Floor + Ceiling + 4 Walls</div>
  </section>

  <div class="controls">
    <button id="reset">إعادة الكاميرا</button>
    <button id="front">إظهار/إخفاء الجدار الأمامي</button>
  </div>
  <div id="error" class="error"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const errorBox = document.getElementById("error");
    window.addEventListener("error", e => {
      errorBox.style.display = "block";
      errorBox.textContent = e.message || "Unknown error";
    });

    const app = document.getElementById("app");

    const ROOM = {
      width: 9.2,
      depth: 10.8,
      height: 4.8
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9eef2);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
    const defaultCam = new THREE.Vector3(0, 2.35, 8.25);
    camera.position.copy(defaultCam);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.75, -0.45);
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 3.2;
    controls.maxDistance = 11;
    controls.maxPolarAngle = Math.PI * 0.63;
    controls.minPolarAngle = Math.PI * 0.22;
    controls.update();

    const room = new THREE.Group();
    scene.add(room);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0xfafcfd, roughness: .94, metalness: 0, side: THREE.DoubleSide });
    const sideWallMat = new THREE.MeshStandardMaterial({ color: 0xf5f8fa, roughness: .94, metalness: 0, side: THREE.DoubleSide });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0xe6ecef, roughness: .9, metalness: 0, side: THREE.DoubleSide });
    const ceilingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .96, metalness: 0, side: THREE.DoubleSide });
    const frontMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .94, transparent: true, opacity: .13, depthWrite: false, side: THREE.DoubleSide });
    const trimMat = new THREE.MeshStandardMaterial({ color: 0xd2dbe1, roughness: .9, side: THREE.DoubleSide });
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x9eacb5, transparent: true, opacity: .85 });
    const gridMat = new THREE.LineBasicMaterial({ color: 0xc9d3da, transparent: true, opacity: .42 });

    function addPlane(name, w, h, mat, x, y, z, rx, ry, rz) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      mesh.name = name;
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.receiveShadow = true;
      room.add(mesh);
      return mesh;
    }

    const floor = addPlane("floor", ROOM.width, ROOM.depth, floorMat, 0, 0, 0, -Math.PI/2, 0, 0);
    const ceiling = addPlane("ceiling", ROOM.width, ROOM.depth, ceilingMat, 0, ROOM.height, 0, Math.PI/2, 0, 0);
    const back = addPlane("back-wall", ROOM.width, ROOM.height, wallMat, 0, ROOM.height/2, -ROOM.depth/2, 0, 0, 0);
    const frontWall = addPlane("front-wall", ROOM.width, ROOM.height, frontMat, 0, ROOM.height/2, ROOM.depth/2, 0, Math.PI, 0);
    const left = addPlane("left-wall", ROOM.depth, ROOM.height, sideWallMat, -ROOM.width/2, ROOM.height/2, 0, 0, Math.PI/2, 0);
    const right = addPlane("right-wall", ROOM.depth, ROOM.height, sideWallMat, ROOM.width/2, ROOM.height/2, 0, 0, -Math.PI/2, 0);

    function box(name, sx, sy, sz, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), trimMat);
      mesh.name = name;
      mesh.position.set(x, y, z);
      mesh.receiveShadow = true;
      room.add(mesh);
      return mesh;
    }

    const t = 0.045;
    const base = 0.12;
    box("base-back", ROOM.width, base, t, 0, base/2, -ROOM.depth/2 + t/2);
    box("base-front", ROOM.width, base, t, 0, base/2, ROOM.depth/2 - t/2);
    box("base-left", t, base, ROOM.depth, -ROOM.width/2 + t/2, base/2, 0);
    box("base-right", t, base, ROOM.depth, ROOM.width/2 - t/2, base/2, 0);
    box("top-back", ROOM.width, t, t, 0, ROOM.height - t/2, -ROOM.depth/2 + t/2);
    box("top-front", ROOM.width, t, t, 0, ROOM.height - t/2, ROOM.depth/2 - t/2);
    box("top-left", t, t, ROOM.depth, -ROOM.width/2 + t/2, ROOM.height - t/2, 0);
    box("top-right", t, t, ROOM.depth, ROOM.width/2 - t/2, ROOM.height - t/2, 0);

    function addLine(points, mat = edgeMat) {
      const geo = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
      const line = new THREE.Line(geo, mat);
      room.add(line);
      return line;
    }

    const xL = -ROOM.width/2, xR = ROOM.width/2, zB = -ROOM.depth/2, zF = ROOM.depth/2, h = ROOM.height;
    addLine([[xL,0,zB],[xL,h,zB]]); addLine([[xR,0,zB],[xR,h,zB]]); addLine([[xL,0,zF],[xL,h,zF]]); addLine([[xR,0,zF],[xR,h,zF]]);
    addLine([[xL,0,zB],[xR,0,zB]]); addLine([[xL,0,zF],[xR,0,zF]]); addLine([[xL,0,zB],[xL,0,zF]]); addLine([[xR,0,zB],[xR,0,zF]]);
    addLine([[xL,h,zB],[xR,h,zB]]); addLine([[xL,h,zF],[xR,h,zF]]); addLine([[xL,h,zB],[xL,h,zF]]); addLine([[xR,h,zB],[xR,h,zF]]);

    // خطوط أرضية خفيفة جدًا لإظهار مستوى الأرض بدون تكتشر ثقيل
    for (let x = -4; x <= 4; x += 1) addLine([[x, .006, zB], [x, .006, zF]], gridMat);
    for (let z = -5; z <= 5; z += 1) addLine([[xL, .007, z], [xR, .007, z]], gridMat);

    const hemi = new THREE.HemisphereLight(0xffffff, 0xd7e0e5, 1.55);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffffff, 1.9);
    key.position.set(-4.5, 7, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    scene.add(key);

    const fill = new THREE.PointLight(0xffffff, .75, 18);
    fill.position.set(3.2, 3.4, 4.2);
    scene.add(fill);

    function resetCamera() {
      camera.position.copy(defaultCam);
      controls.target.set(0, 1.75, -0.45);
      controls.update();
    }

    document.getElementById("reset").addEventListener("click", resetCamera);
    document.getElementById("front").addEventListener("click", () => { frontWall.visible = !frontWall.visible; });

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
