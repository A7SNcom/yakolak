<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#eef1f3"/>
  <style>
    text{font-family:Arial,"Segoe UI",sans-serif;direction:rtl}
    .title{font-size:30px;font-weight:800;fill:#17212a}
    .label{font-size:20px;font-weight:700;fill:#fff}
    .note{font-size:17px;fill:#31404b}
    .small{font-size:15px;fill:#52626e}
    .card{fill:#fff;stroke:#c8d1d7;stroke-width:2}
    .table{fill:#aeb2b6;stroke:#89939a;stroke-width:4}
    .board{fill:#4a5562;stroke:#303944;stroke-width:3}
  </style>
  <text class="title" x="720" y="55" text-anchor="middle">v117 — الأونلاين يستخدم أنظمة اللعبة الطبيعية</text>

  <g transform="translate(55 95)">
    <rect class="card" width="410" height="730" rx="28"/>
    <rect x="0" y="0" width="410" height="66" rx="28" fill="#6a2424"/>
    <text class="label" x="205" y="43" text-anchor="middle">المسار السابق — مرفوض</text>
    <ellipse class="table" cx="205" cy="295" rx="150" ry="120" fill="#766b61"/>
    <rect x="55" y="175" width="300" height="315" rx="24" fill="#15242d" opacity=".97"/>
    <text class="label" x="205" y="225" text-anchor="middle">نافذة منفصلة</text>
    <text class="note" x="205" y="270" text-anchor="middle" fill="#fff">أزرار 2 / 3 / 4</text>
    <text class="note" x="205" y="310" text-anchor="middle" fill="#fff">ألوان كأزرار HTML</text>
    <text class="note" x="205" y="350" text-anchor="middle" fill="#fff">اختيار الحجم بالنقر المباشر</text>
    <text class="note" x="205" y="390" text-anchor="middle" fill="#fff">النافذة تغطي الجوال</text>
    <text class="note" x="205" y="545" text-anchor="middle">نظام موازٍ يكرر منطق اللعبة</text>
    <text class="small" x="205" y="585" text-anchor="middle">مصدر اختلاف المواقع والإحساس واللمس</text>
  </g>

  <g transform="translate(515 95)">
    <rect class="card" width="410" height="730" rx="28"/>
    <rect x="0" y="0" width="410" height="66" rx="28" fill="#0f5b43"/>
    <text class="label" x="205" y="43" text-anchor="middle">الإعداد الصحيح — مشترك</text>
    <ellipse class="table" cx="205" cy="300" rx="168" ry="132"/>
    <g transform="translate(115 245)">
      <circle cx="0" cy="0" r="22" fill="#2f856a"/>
      <circle cx="60" cy="-25" r="22" fill="#b78a44"/>
      <circle cx="120" cy="-4" r="22" fill="#3769a5"/>
      <circle cx="180" cy="18" r="22" fill="#f1eee6" stroke="#999"/>
    </g>
    <text class="note" x="205" y="480" text-anchor="middle">نفس مجسمات اختيار اللون</text>
    <text class="note" x="205" y="520" text-anchor="middle">نفس مواقع اختيار عدد اللاعبين</text>
    <text class="note" x="205" y="560" text-anchor="middle">نفس الطاولة والكاميرا والخامات</text>
    <text class="small" x="205" y="620" text-anchor="middle">الاختلاف الوحيد: إنشاء الغرفة في الخلفية</text>
  </g>

  <g transform="translate(975 95)">
    <rect class="card" width="410" height="730" rx="28"/>
    <rect x="0" y="0" width="410" height="66" rx="28" fill="#12456d"/>
    <text class="label" x="205" y="43" text-anchor="middle">أثناء اللعب — نفس درج القطع</text>
    <ellipse class="table" cx="205" cy="315" rx="168" ry="132"/>
    <rect class="board" x="125" y="235" width="160" height="160" rx="18"/>
    <circle cx="82" cy="370" r="26" fill="#3769a5"/>
    <circle cx="82" cy="325" r="21" fill="#3769a5"/>
    <circle cx="82" cy="286" r="16" fill="#3769a5"/>
    <circle cx="165" cy="270" r="14" fill="none" stroke="#d9edf7" stroke-width="6"/>
    <circle cx="245" cy="350" r="14" fill="none" stroke="#d9edf7" stroke-width="6"/>
    <text class="note" x="205" y="510" text-anchor="middle">فتح طقم اللاعب الطبيعي</text>
    <text class="note" x="205" y="550" text-anchor="middle">اختيار كبير / وسط / صغير بالطريقة الأصلية</text>
    <text class="note" x="205" y="590" text-anchor="middle">الخادم يثبت الحركة فقط</text>
    <text class="small" x="205" y="645" text-anchor="middle">لا مستمع لمس ثانٍ ولا حالة اختيار مكررة</text>
  </g>
</svg>
