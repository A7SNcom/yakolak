<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef3f5"/>
      <stop offset="1" stop-color="#dce5e8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#21313b"/>
      <stop offset="1" stop-color="#111b22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <text x="640" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#14232c">مسار الأونلاين المقترح — قبل التنفيذ</text>
  <text x="640" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#52636d">ثلاث حالات فقط؛ قرار واحد واضح في كل شاشة</text>

  <!-- phone 1 -->
  <g transform="translate(60 110)" filter="url(#shadow)">
    <rect width="340" height="590" rx="34" fill="#0a1116"/>
    <rect x="12" y="12" width="316" height="566" rx="25" fill="url(#card)"/>
    <text x="300" y="54" text-anchor="end" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white">إنشاء غرفة</text>
    <text x="300" y="85" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#cad7dc">اختر عدد اللاعبين أولًا</text>
    <g transform="translate(28 112)">
      <rect width="88" height="58" rx="14" fill="#f4efe5"/>
      <text x="44" y="36" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#15212a">2</text>
      <rect x="100" width="88" height="58" rx="14" fill="#263943" stroke="#5c727e"/>
      <text x="144" y="36" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="white">3</text>
      <rect x="200" width="88" height="58" rx="14" fill="#263943" stroke="#5c727e"/>
      <text x="244" y="36" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="white">4</text>
    </g>
    <text x="300" y="210" text-anchor="end" font-family="Arial" font-size="14" fill="#cad7dc">ثم اختر لونك</text>
    <g transform="translate(28 232)">
      <rect width="136" height="62" rx="15" fill="#263943" stroke="#f1eee6" stroke-width="2"/>
      <circle cx="112" cy="31" r="9" fill="#f1eee6"/><text x="67" y="37" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الأبيض</text>
      <rect x="152" width="136" height="62" rx="15" fill="#263943" stroke="#3769a5" stroke-width="2"/>
      <circle cx="264" cy="31" r="9" fill="#3769a5"/><text x="219" y="37" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الأزرق</text>
      <rect y="76" width="136" height="62" rx="15" fill="#263943" stroke="#b78a44" stroke-width="2"/>
      <circle cx="112" cy="107" r="9" fill="#b78a44"/><text x="67" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الذهبي</text>
      <rect x="152" y="76" width="136" height="62" rx="15" fill="#263943" stroke="#2f856a" stroke-width="2"/>
      <circle cx="264" cy="107" r="9" fill="#2f856a"/><text x="219" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الأخضر</text>
    </g>
    <rect x="28" y="414" width="288" height="58" rx="16" fill="#f4efe5"/>
    <text x="172" y="450" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#15212a">إنشاء الغرفة</text>
    <text x="170" y="520" text-anchor="middle" font-family="Arial" font-size="13" fill="#91a5af">لا رمز ولا رابط قبل اكتمال الإعداد</text>
  </g>

  <!-- arrow -->
  <path d="M420 405h38" stroke="#52707f" stroke-width="5" stroke-linecap="round"/>
  <path d="M452 395l14 10-14 10" fill="none" stroke="#52707f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone 2 -->
  <g transform="translate(470 110)" filter="url(#shadow)">
    <rect width="340" height="590" rx="34" fill="#0a1116"/>
    <rect x="12" y="12" width="316" height="566" rx="25" fill="url(#card)"/>
    <text x="300" y="54" text-anchor="end" font-family="Arial" font-size="21" font-weight="700" fill="white">دعوة للعب</text>
    <rect x="28" y="82" width="288" height="76" rx="16" fill="#0b151c" stroke="#45606e"/>
    <text x="172" y="111" text-anchor="middle" font-family="Arial" font-size="13" fill="#98aeb8">الغرفة</text>
    <text x="172" y="143" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" letter-spacing="5" fill="white">A7SN24</text>
    <text x="300" y="198" text-anchor="end" font-family="Arial" font-size="15" fill="#d8e2e6">لاعب واحد بانتظارك · 1/2</text>
    <text x="300" y="232" text-anchor="end" font-family="Arial" font-size="14" fill="#cad7dc">اختر لونك المتاح</text>
    <g transform="translate(28 252)">
      <rect width="136" height="62" rx="15" fill="#263943" stroke="#f1eee6" stroke-width="2"/>
      <circle cx="112" cy="31" r="9" fill="#f1eee6"/><text x="67" y="37" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الأبيض</text>
      <rect x="152" width="136" height="62" rx="15" fill="#263943" stroke="#3769a5" stroke-width="2"/>
      <circle cx="264" cy="31" r="9" fill="#3769a5"/><text x="219" y="37" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الأزرق</text>
      <rect y="76" width="136" height="62" rx="15" fill="#263943" stroke="#b78a44" stroke-width="2"/>
      <circle cx="112" cy="107" r="9" fill="#b78a44"/><text x="67" y="113" text-anchor="middle" font-family="Arial" font-size="14" fill="white">الذهبي</text>
      <rect x="152" y="76" width="136" height="62" rx="15" fill="#182228" opacity=".45"/>
      <text x="220" y="113" text-anchor="middle" font-family="Arial" font-size="13" fill="#82959e">محجوز</text>
    </g>
    <rect x="28" y="430" width="288" height="58" rx="16" fill="#f4efe5"/>
    <text x="172" y="466" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#15212a">انضمام وبدء اللعب</text>
    <text x="170" y="530" text-anchor="middle" font-family="Arial" font-size="13" fill="#91a5af">الرابط مفهوم؛ لا إعادة إدخال للرمز</text>
  </g>

  <!-- arrow -->
  <path d="M830 405h38" stroke="#52707f" stroke-width="5" stroke-linecap="round"/>
  <path d="M862 395l14 10-14 10" fill="none" stroke="#52707f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone 3 -->
  <g transform="translate(880 110)" filter="url(#shadow)">
    <rect width="340" height="590" rx="34" fill="#0a1116"/>
    <rect x="12" y="12" width="316" height="566" rx="25" fill="url(#card)"/>
    <text x="300" y="54" text-anchor="end" font-family="Arial" font-size="21" font-weight="700" fill="white">الغرفة جاهزة</text>
    <text x="300" y="85" text-anchor="end" font-family="Arial" font-size="15" fill="#cfe2d8">اكتمل اللاعبون · 2/2</text>
    <g transform="translate(28 116)">
      <rect width="288" height="72" rx="16" fill="#263943"/>
      <circle cx="256" cy="36" r="12" fill="#2f856a"/>
      <text x="226" y="32" text-anchor="end" font-family="Arial" font-size="15" font-weight="700" fill="white">أنت</text>
      <text x="226" y="52" text-anchor="end" font-family="Arial" font-size="12" fill="#b8c8cf">الأخضر</text>
      <circle cx="34" cy="36" r="8" fill="#48d597"/>
    </g>
    <g transform="translate(28 202)">
      <rect width="288" height="72" rx="16" fill="#263943"/>
      <circle cx="256" cy="36" r="12" fill="#f1eee6"/>
      <text x="226" y="32" text-anchor="end" font-family="Arial" font-size="15" font-weight="700" fill="white">صديقك</text>
      <text x="226" y="52" text-anchor="end" font-family="Arial" font-size="12" fill="#b8c8cf">الأبيض</text>
      <circle cx="34" cy="36" r="8" fill="#48d597"/>
    </g>
    <circle cx="170" cy="350" r="54" fill="#0d171e" stroke="#3b5360" stroke-width="2"/>
    <text x="170" y="341" text-anchor="middle" font-family="Arial" font-size="13" fill="#9db1ba">تبدأ المباراة</text>
    <text x="170" y="377" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="white">1</text>
    <rect x="28" y="452" width="288" height="58" rx="16" fill="#25363f"/>
    <text x="172" y="488" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#dce7eb">إلغاء قبل البدء</text>
    <text x="170" y="544" text-anchor="middle" font-family="Arial" font-size="13" fill="#91a5af">يبدأ تلقائيًا عند اكتمال العدد</text>
  </g>
</svg>
