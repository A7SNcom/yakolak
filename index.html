<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="yakolak-version" content="v126-clean-entry-journey">
<title>Yakolak Live</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles/v114-online.css?v=126">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#20201e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0;z-index:1;opacity:0;background:#fff}
#hint,#settingsBtn,#panel,textarea,#clearCacheBtn{display:none!important}
#yakolakLoader{position:fixed;inset:0;z-index:20000;overflow:hidden;background:#fff;pointer-events:auto}
#yakolakLoader.handoff{background:transparent;pointer-events:none}
#yakolakLoaderAnchor{position:absolute;left:50%;top:50%;width:72px;height:72px;transform:translate3d(-50%,-50%,0);will-change:left,top}
#yakolakLoaderStar{display:block;width:72px;height:72px;animation:yakolak-star-spin 1.15s linear infinite;transform-origin:50% 50%;will-change:transform}
#yakolakLoaderStar path{fill:#242421}
#yakolakLoader.error #yakolakLoaderStar path{fill:#8f3b34}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@keyframes yakolak-star-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
#yakolakGameHud,#yakolakGameScore,#yakolakGameSetup,#yakolakTools,#yakolakCalibrationPanel,#yakolakOnlineDialog,#yakolakTutorialDialog,#yakolakOnlineEntry,#yakolakHowTo,#yakolakEntry,#yakolakFloatingSettings,#yakolakEntrySettings{display:none!important;visibility:hidden!important;pointer-events:none!important}
@media (max-width:700px){#yakolakLoaderAnchor,#yakolakLoaderStar{width:62px;height:62px}}
@media (prefers-reduced-motion:reduce){#yakolakLoaderStar{animation-duration:1.8s}}
</style>
</head>
<body>
<div id="yakolakLoader" aria-busy="true" aria-describedby="yakolakLoaderStatus">
  <div id="yakolakLoaderAnchor" aria-hidden="true">
    <svg id="yakolakLoaderStar" viewBox="0 0 100 100" focusable="false">
      <path d="M50 2 59.8 34.1 86 14 65.9 40.2 98 50 65.9 59.8 86 86 59.8 65.9 50 98 40.2 65.9 14 86 34.1 59.8 2 50 34.1 40.2 14 14 40.2 34.1Z"/>
    </svg>
  </div>
  <span id="yakolakLoaderStatus" class="sr-only">تحميل اللعبة</span>
</div>
<div id="view"></div>
<div id="hint" aria-hidden="true"></div>
<button id="settingsBtn" aria-hidden="true">SET</button>
<button id="clearCacheBtn" type="button" hidden>مسح</button>
<div id="panel" aria-hidden="true"></div>
<textarea id="out"></textarea>
<script type="module">
const BUILD='126';
const params=new URLSearchParams(location.search);
const clearToken=params.get('clear');
const ASSET_VERSION=clearToken||BUILD;
const loaderEl=document.getElementById('yakolakLoader');
const loaderAnchor=document.getElementById('yakolakLoaderAnchor');
const loaderStatus=document.getElementById('yakolakLoaderStatus');
const removeLoaderNow=()=>{if(loaderEl?.parentNode)loaderEl.parentNode.removeChild(loaderEl)};
if(loaderEl)loaderEl.remove=()=>{loaderEl.dataset.removePending='1'};
window.__yakolakEntryLoader={
  anchor(x,y){
    if(!loaderAnchor?.isConnected)return;
    loaderAnchor.style.left=`${Math.round(x)}px`;
    loaderAnchor.style.top=`${Math.round(y)}px`;
  },
  handoff(){
    if(!loaderEl?.isConnected)return;
    loaderEl.classList.add('handoff');
    loaderEl.setAttribute('aria-busy','false');
  },
  finish(){
    if(!loaderEl?.isConnected)return;
    removeLoaderNow();
  }
};
window.__yakolakLoading={set(value,status){if(status&&loaderStatus)loaderStatus.textContent=status}};
function hardReload(){const url=new URL(location.href);url.searchParams.set('clear',Date.now().toString());location.replace(url.toString())}
async function clearIndexedDB(){
  if(!('indexedDB' in window)||!indexedDB.databases)return;
  const dbs=await indexedDB.databases();
  await Promise.allSettled(dbs.filter(db=>db&&db.name).map(db=>new Promise(resolve=>{
    const req=indexedDB.deleteDatabase(db.name);req.onsuccess=req.onerror=req.onblocked=()=>resolve();
  })));
}
async function cleanReload(){
  const jobs=[];
  try{if('caches' in window)jobs.push(caches.keys().then(names=>Promise.allSettled(names.map(name=>caches.delete(name)))))}catch(error){}
  try{if('serviceWorker' in navigator)jobs.push(navigator.serviceWorker.getRegistrations().then(regs=>Promise.allSettled(regs.map(reg=>reg.unregister()))))}catch(error){}
  jobs.push(clearIndexedDB().catch(()=>{}));
  await Promise.allSettled(jobs);hardReload();
}
window.__yakolakCleanReload=cleanReload;
async function checkVersion(){
  try{
    const response=await fetch('./version.json?v='+ASSET_VERSION,{cache:'no-store'});
    const version=await response.json();
    if(String(version.build||BUILD)!==BUILD){hardReload();return false}
  }catch(error){}
  return true;
}
if(await checkVersion()){
  await import('./app.js?v='+ASSET_VERSION);
  if(clearToken){const clean=new URL(location.href);clean.searchParams.delete('clear');history.replaceState(null,'',clean.toString())}
}
</script>
</body>
</html>
