<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="yakolak-version" content="v049-room-boot">
<title>Yakolak Live</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity .55s ease}
#hint,#settingsBtn,#panel,textarea{display:none!important}
#yakolakLoader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0b0b0b;transition:opacity .45s ease,visibility .45s ease}
#yakolakLoader.done{opacity:0;visibility:hidden;pointer-events:none}
#yakolakLoader.error .loaderRing{border-top-color:#b35a5a}
.loaderRing{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#fff;animation:spin .85s linear infinite}
#clearCacheBtn{position:fixed;left:16px;bottom:16px;z-index:10000;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.72);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;cursor:pointer}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="yakolakLoader"><div class="loaderRing"></div></div>
<div id="view"></div>
<div id="hint" aria-hidden="true"></div>
<button id="settingsBtn" aria-hidden="true">SET</button>
<button id="clearCacheBtn" title="Fresh reload" aria-label="Fresh reload">NEW</button>
<div id="panel" aria-hidden="true"></div>
<textarea id="out"></textarea>
<script type="module">
const KEY='yakolak_build_seen';
const clearBtn=document.getElementById('clearCacheBtn');
function reloadFresh(){try{localStorage.removeItem(KEY);sessionStorage.clear()}catch(e){} location.href=location.pathname+'?fresh='+Date.now()}
if(clearBtn)clearBtn.addEventListener('click',reloadFresh);
async function checkVersion(){
  try{
    const r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});
    const v=await r.json();
    const next=String(v.build);
    const old=localStorage.getItem(KEY);
    if(old&&old!==next){localStorage.setItem(KEY,next);location.href=location.pathname+'?auto='+v.build+'&t='+Date.now();return}
    localStorage.setItem(KEY,next);
  }catch(e){}
}
await checkVersion();
setInterval(checkVersion,8000);
import('./room-boot-v049.js?boot='+Date.now());
</script>
</body>
</html>
