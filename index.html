<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="yakolak-version" content="v014-spacing-only" />
  <title>Yakolak STL Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
    #view{position:fixed;inset:0}
    #hint{position:fixed;top:14px;right:14px;z-index:10;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;direction:ltr}
    #settingsBtn{position:fixed;top:14px;left:14px;z-index:20;width:52px;height:52px;border:0;border-radius:16px;background:rgba(0,0,0,.78);color:#fff;font-size:25px;cursor:pointer}
    #panel{position:fixed;top:76px;left:14px;z-index:20;width:min(390px,calc(100vw - 28px));padding:14px;border-radius:18px;background:rgba(0,0,0,.84);color:#fff;display:none;direction:ltr}
    #panel.show{display:block}.row{margin:12px 0}.label{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}.num{width:96px;border:0;border-radius:10px;padding:8px;background:#181818;color:#fff;text-align:center;direction:ltr}input[type=range]{width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:10px;background:#333;color:#fff;cursor:pointer}textarea{width:100%;height:115px;box-sizing:border-box;border:0;border-radius:12px;padding:10px;background:#151515;color:#fff;resize:none;direction:ltr;margin-top:10px}#status{font-size:12px;line-height:1.6;color:#ddd;background:#151515;border-radius:12px;padding:9px;white-space:pre-wrap;direction:ltr}
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hint">loading v014...</div>
  <button id="settingsBtn">⚙</button>
  <div id="panel">
    <div class="row"><b>Spacing Only</b> <span style="font-size:12px;color:#aaa">v014</span></div>
    <div id="status" class="row">loading...</div>
    <div class="row"><div class="label"><span>A horizontal spacing</span><input class="num" id="spacingANum" type="number" value="42" step="1"></div><input id="spacingARange" type="range" min="10" max="120" step="1" value="42"></div>
    <div class="row"><div class="label"><span>B diagonal spacing</span><input class="num" id="spacingBNum" type="number" value="42" step="1"></div><input id="spacingBRange" type="range" min="10" max="120" step="1" value="42"></div>
    <div class="actions"><button id="resetBtn">Reset</button><button id="copyBtn">Copy</button></div>
    <textarea id="out" readonly></textarea>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const APP_VERSION = 'v014-spacing-only';
    const assetVersion = `${APP_VERSION}-${Date.now()}`;

    setInterval(async () => {
      try {
        const res = await fetch(`${location.pathname || '/'}?check=${Date.now()}`, { cache: 'no-store' });
        const html = await res.text();
        const latest = (html.match(/yakolak-version" content="([^"]+)/) || [])[1];
        if (latest && latest !== APP_VERSION) location.reload();
      } catch (e) {}
    }, 30000);

    const hint = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const root = document.getElementById('view');
    const panel = document.getElementById('panel');
    const out = document.getElementById('out');

    const settings = { spacingA: 42, spacingB: 42 };
    const fixed = {
      board: { px: 0, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 },
      racks: [
        { px: 135, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 },
        { px: -135, py: 6, pz: 0, rx: -90, ry: 0, rz: 180 },
        { px: 0, py: 6, pz: 135, rx: -90, ry: 0, rz: 90 },
        { px: 0, py: 6, pz: -135, rx: -90, ry: 0, rz: -90 }
      ]
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100000);
    camera.position.set(320, 260, 320);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    root.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.2));
    const light = new THREE.DirectionalLight(0xffffff, 2.4);
    light.position.set(180, 240, 180);
    scene.add(light);
    scene.add(new THREE.GridHelper(520, 52, 0x444444, 0x252525));

    const loader = new STLLoader();
    const geos = {};
    const objects = [];
    const setGroups = [];
    const status = { '9': 'loading', '3': 'loading', 'l': 'loading', 'm': 'loading', 's': 'loading' };

    const mats = {
      board: new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: .55, metalness: .05 }),
      rack: new THREE.MeshStandardMaterial({ color: 0x89a790, roughness: .55, metalness: .05 }),
      set1: new THREE.MeshStandardMaterial({ color: 0xf2c078, roughness: .55, metalness: .05 }),
      set2: new THREE.MeshStandardMaterial({ color: 0x8ecae6, roughness: .55, metalness: .05 }),
      set3: new THREE.MeshStandardMaterial({ color: 0xbde0fe, roughness: .55, metalness: .05 }),
      set4: new THREE.MeshStandardMaterial({ color: 0xcdb4db, roughness: .55, metalness: .05 }),
      set5: new THREE.MeshStandardMaterial({ color: 0xffafcc, roughness: .55, metalness: .05 }),
      set6: new THREE.MeshStandardMaterial({ color: 0xa7c957, roughness: .55, metalness: .05 })
    };

    function deg(v){ return THREE.MathUtils.degToRad(v); }
    function applyTransform(obj, t){ obj.position.set(t.px,t.py,t.pz); obj.rotation.set(deg(t.rx),deg(t.ry),deg(t.rz)); }

    function normalizeGeometry(g){
      g.computeBoundingBox();
      const box = g.boundingBox;
      const cx = (box.min.x + box.max.x) / 2;
      const cz = (box.min.z + box.max.z) / 2;
      g.translate(-cx, -box.min.y, -cz);
      g.computeVertexNormals();
      return g;
    }

    function loadGeo(name){
      return new Promise(resolve => {
        loader.load(`./${name}.stl?v=${assetVersion}`, g => {
          try {
            if (!g.attributes.position || g.attributes.position.count === 0) throw new Error('empty STL');
            geos[name] = normalizeGeometry(g);
            status[name] = 'loaded';
          } catch(e) { status[name] = `failed: ${e.message}`; }
          refresh(); resolve();
        }, undefined, e => { status[name] = `failed: ${e?.message || 'load error'}`; refresh(); resolve(); });
      });
    }

    function mesh(name, mat){ return geos[name] ? new THREE.Mesh(geos[name], mat) : null; }

    function buildSet(material){
      const group = new THREE.Group();
      const large = mesh('l', material);
      const medium = mesh('m', material);
      const small = mesh('s', material);
      if (large) group.add(large);
      if (medium) group.add(medium);
      if (small) group.add(small);
      return group;
    }

    function buildScene(){
      if (geos['9']) { const b = mesh('9', mats.board); applyTransform(b, fixed.board); scene.add(b); objects.push(b); }
      if (geos['3']) fixed.racks.forEach(t => { const r = mesh('3', mats.rack); applyTransform(r, t); scene.add(r); objects.push(r); });

      for (let i = 1; i <= 6; i++) {
        const g = buildSet(mats[`set${i}`]);
        scene.add(g);
        setGroups.push(g);
        objects.push(g);
      }
      layoutSets();
      frameCamera();
      refresh();
    }

    function layoutSets(){
      const a = settings.spacingA;
      const b = settings.spacingB;
      const baseZ = 210;
      const diagBaseZ = -210;
      const diagStepZ = b * 0.55;
      const positions = [
        { x: -a, y: 0, z: baseZ, rz: 0 },
        { x: 0, y: 0, z: baseZ, rz: 0 },
        { x: a, y: 0, z: baseZ, rz: 0 },
        { x: -b, y: 0, z: diagBaseZ - diagStepZ, rz: 0 },
        { x: 0, y: 0, z: diagBaseZ, rz: 0 },
        { x: b, y: 0, z: diagBaseZ + diagStepZ, rz: 0 }
      ];
      setGroups.forEach((g, i) => {
        const p = positions[i];
        g.position.set(p.x, p.y, p.z);
        g.rotation.set(deg(-90), 0, deg(p.rz));
      });
    }

    function frameCamera(){
      const box = new THREE.Box3();
      objects.forEach(o => box.expandByObject(o));
      if (!objects.length) return;
      const size = box.getSize(new THREE.Vector3());
      const maxAxis = Math.max(size.x,size.y,size.z) || 1;
      const d = maxAxis * 1.45;
      camera.position.set(d, d*.82, d);
      camera.near = Math.max(d/1000,.01);
      camera.far = d*30;
      camera.updateProjectionMatrix();
      controls.target.set(0,0,0);
      controls.update();
    }

    function refresh(){
      document.getElementById('spacingANum').value = settings.spacingA;
      document.getElementById('spacingARange').value = settings.spacingA;
      document.getElementById('spacingBNum').value = settings.spacingB;
      document.getElementById('spacingBRange').value = settings.spacingB;
      out.value = `const PIECE_SET_SPACING = ${JSON.stringify(settings, null, 2)};`;
      statusEl.textContent = Object.entries(status).map(([k,v]) => `${k}.stl: ${v}`).join('\n');
    }

    function bindSpacing(key){
      const num = document.getElementById(`${key}Num`);
      const range = document.getElementById(`${key}Range`);
      const setter = v => { settings[key] = Math.max(10, Math.min(120, Number(v) || 10)); layoutSets(); refresh(); };
      num.addEventListener('input', e => setter(e.target.value));
      range.addEventListener('input', e => setter(e.target.value));
    }

    document.getElementById('settingsBtn').onclick = () => panel.classList.toggle('show');
    document.getElementById('resetBtn').onclick = () => { settings.spacingA = 42; settings.spacingB = 42; layoutSets(); refresh(); };
    document.getElementById('copyBtn').onclick = async () => { await navigator.clipboard.writeText(out.value); hint.textContent = 'spacing copied'; setTimeout(() => hint.textContent = `Yakolak ${APP_VERSION}`, 1200); };
    bindSpacing('spacingA'); bindSpacing('spacingB');

    Promise.all(['9','3','l','m','s'].map(loadGeo)).then(() => { buildScene(); hint.textContent = `Yakolak ${APP_VERSION}`; });

    addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
    animate(); refresh();
  </script>
</body>
</html>
