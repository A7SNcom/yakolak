<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="yakolak-version" content="v023-github-save" />
  <title>Yakolak STL Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root{--panel:#070707ee;--card:#121212;--line:#292929;--text:#fff;--muted:#bdbdbd;--btn:#242424;--accent:#89a790;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);touch-action:none}
    #view{position:fixed;inset:0}
    #hint{position:fixed;top:calc(12px + var(--safe-top));right:12px;z-index:10;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.62);font-size:12px;direction:ltr;max-width:calc(100vw - 86px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(12px)}
    #settingsBtn{position:fixed;top:calc(10px + var(--safe-top));left:10px;z-index:25;width:58px;height:58px;border:0;border-radius:20px;background:rgba(0,0,0,.78);color:#fff;font-size:26px;box-shadow:0 10px 26px rgba(0,0,0,.4);backdrop-filter:blur(12px);touch-action:manipulation}
    #shade{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.25);display:none;touch-action:manipulation}#shade.show{display:block}
    #wizard{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));z-index:30;display:none;direction:rtl;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(18px);touch-action:auto}#wizard.show{display:block}.grab{width:46px;height:5px;border-radius:999px;background:#444;margin:0 auto 12px}.q{font-size:16px;font-weight:700;margin:0 0 10px}.sub{font-size:12px;color:var(--muted);margin:-4px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid var(--line);border-radius:18px;background:var(--card);color:#fff;min-height:52px;font-size:16px;touch-action:manipulation}.choice.primary{background:#26352b;border-color:#4f705a}.wizardActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.ghost{border:1px solid var(--line);border-radius:16px;background:#171717;color:#fff;min-height:48px;font-size:15px;touch-action:manipulation}
    #miniCal{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));z-index:22;display:none;direction:rtl;background:rgba(7,7,7,.82);border:1px solid #2a2a2a;border-radius:24px;padding:10px;box-shadow:0 14px 42px rgba(0,0,0,.42);backdrop-filter:blur(16px);touch-action:auto}#miniCal.show{display:block}.miniTop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.miniTitle{font-size:14px;font-weight:800}.miniMeta{font-size:12px;color:var(--muted);direction:ltr}.miniInputRow{display:grid;grid-template-columns:52px 1fr 52px 92px;gap:8px;align-items:center}.roundBtn{height:48px;border:0;border-radius:16px;background:var(--btn);color:#fff;font-size:24px;touch-action:manipulation}.num{height:48px;width:100%;border:1px solid #2c2c2c;border-radius:16px;background:#101010;color:#fff;text-align:center;font-size:18px;direction:ltr}input[type=range]{width:100%;height:44px;accent-color:var(--accent);touch-action:pan-x}.miniBottom{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:8px}.miniBottom button{height:44px;border:0;border-radius:15px;background:#252525;color:#fff;font-size:14px;touch-action:manipulation}.miniBottom #saveBtn{background:#26352b;color:#fff}#status{position:fixed;left:10px;bottom:calc(90px + var(--safe-bottom));z-index:9;display:none;max-width:310px;padding:8px 10px;background:rgba(0,0,0,.58);border-radius:14px;color:#ddd;font-size:11px;white-space:pre-wrap;direction:ltr;pointer-events:none}.debug #status{display:block}
    textarea{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0}
    @media (min-width:760px){#wizard{left:16px;right:auto;width:420px;bottom:16px}#miniCal{left:16px;right:auto;width:560px;bottom:16px}.miniInputRow{grid-template-columns:54px 1fr 54px 110px}#status{bottom:100px;left:16px}}
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hint">loading v023...</div>
  <button id="settingsBtn" aria-label="settings">⚙</button>
  <div id="shade"></div>
  <div id="wizard"><div class="grab"></div><div id="wizardContent"></div></div>
  <div id="miniCal">
    <div class="miniTop"><div><div class="miniTitle" id="calTitle">المعايرة</div><div class="miniMeta" id="calMeta">—</div></div><button class="ghost" id="changeBtn" style="width:92px;min-height:42px">تغيير</button></div>
    <div class="miniInputRow"><button class="roundBtn" id="minusBtn">−</button><input id="calRange" type="range"><button class="roundBtn" id="plusBtn">+</button><input class="num" id="calNum" type="number"></div>
    <div class="miniBottom"><button id="saveBtn">حفظ</button><button id="resetBtn">Reset</button><button id="copyBtn">Copy</button><button id="closeMiniBtn">إخفاء</button></div>
  </div>
  <div id="status">loading models...</div><textarea id="out" readonly></textarea>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const APP_VERSION = 'v023-github-save';
    const assetVersion = `${APP_VERSION}-${Date.now()}`;
    setInterval(async () => { try { const res = await fetch(`${location.pathname || '/'}?check=${Date.now()}`, { cache: 'no-store' }); const html = await res.text(); const latest = (html.match(/yakolak-version" content="([^"]+)/) || [])[1]; if (latest && latest !== APP_VERSION) location.reload(); } catch (e) {} }, 30000);

    const hint = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const root = document.getElementById('view');
    const out = document.getElementById('out');
    const shade = document.getElementById('shade');
    const wizard = document.getElementById('wizard');
    const wizardContent = document.getElementById('wizardContent');
    const miniCal = document.getElementById('miniCal');
    const calTitle = document.getElementById('calTitle');
    const calMeta = document.getElementById('calMeta');
    const calRange = document.getElementById('calRange');
    const calNum = document.getElementById('calNum');

    const modelDefs = {
      '9': { file: '9.stl', color: 0xd8d8d8, label: '9 board' },
      '3-right': { file: '3.stl', color: 0x89a790, label: '3 right' },
      '3-left': { file: '3.stl', color: 0x89a790, label: '3 left' },
      '3-front': { file: '3.stl', color: 0x89a790, label: '3 front' },
      '3-back': { file: '3.stl', color: 0x89a790, label: '3 back' }
    };
    const defaultState = {
      '9': { px: 0, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 },
      '3-right': { px: 135, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 },
      '3-left': { px: -135, py: 6, pz: 0, rx: -90, ry: 0, rz: 180 },
      '3-front': { px: 0, py: 6, pz: 135, rx: -90, ry: 0, rz: 90 },
      '3-back': { px: 0, py: 6, pz: -135, rx: -90, ry: 0, rz: -90 }
    };
    const lmsDefault = { px: 0, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 };
    const state = JSON.parse(JSON.stringify(defaultState));
    const lmsState = { ...lmsDefault };
    const meshes = {}, loadStatus = {};
    Object.keys(modelDefs).forEach(id => loadStatus[id] = 'loading'); ['l','m','s'].forEach(id => loadStatus[id] = 'loading');
    let centerGroup = null, lmsBaseGuide = null, activeModel = 'LMS', activeProp = 'py';
    const fields = {
      px: { label: 'Move X', min: -300, max: 300, step: 1, jump: 1 },
      py: { label: 'Move Y', min: -120, max: 150, step: 1, jump: 1 },
      pz: { label: 'Move Z', min: -300, max: 300, step: 1, jump: 1 },
      rx: { label: 'Rotate X', min: -180, max: 180, step: 1, jump: 1 },
      ry: { label: 'Rotate Y', min: -180, max: 180, step: 1, jump: 1 },
      rz: { label: 'Rotate Z', min: -180, max: 180, step: 1, jump: 1 }
    };

    const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100000); camera.position.set(260, 210, 260);
    const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); root.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.2)); const light = new THREE.DirectionalLight(0xffffff, 2.4); light.position.set(150, 220, 160); scene.add(light); scene.add(new THREE.GridHelper(360, 36, 0x444444, 0x252525));

    function deg(v){return THREE.MathUtils.degToRad(v)}
    function clampValue(prop,v){const f=fields[prop];const n=Number(v)||0;return Math.max(f.min,Math.min(f.max,n))}
    function getActiveState(){return activeModel==='LMS'?lmsState:state[activeModel]}
    function getActiveLabel(){return activeModel==='LMS'?'LMS':(modelDefs[activeModel]?.label||activeModel)}
    function applyModel(id){const mesh=meshes[id];if(!mesh)return;const s=state[id];mesh.position.set(s.px,s.py,s.pz);mesh.rotation.set(deg(s.rx),deg(s.ry),deg(s.rz))}
    function applyLMS(){if(!centerGroup)return;centerGroup.position.set(lmsState.px,lmsState.py,lmsState.pz);centerGroup.rotation.set(deg(lmsState.rx),deg(lmsState.ry),deg(lmsState.rz))}
    function updateBaseGuideVisibility(){if(!lmsBaseGuide)return;lmsBaseGuide.visible=activeModel==='LMS'&&miniCal.classList.contains('show')}
    function outputAll(){return{approved_9_and_3:state,LMS:{الارتفاع:lmsState.py,px:lmsState.px,py:lmsState.py,pz:lmsState.pz,rx:lmsState.rx,ry:lmsState.ry,rz:lmsState.rz},LMS_rule:'l/m/s local bottoms are equalized; transparent base guide appears only during LMS calibration'}}
    function getCalibrationPayload(){return{saved_at:new Date().toISOString(),app_version:APP_VERSION,page:location.href,active:{model:activeModel,property:activeProp},alignment:outputAll()}}
    function refreshOutput(){out.value=`const YAKOLAK_ALIGNMENT = ${JSON.stringify(outputAll(),null,2)};`;statusEl.textContent=Object.entries(loadStatus).map(([id,st])=>`${id}: ${st}`).join('\n')+`\nLMS الارتفاع: ${lmsState.py}\nactive: ${activeModel}.${activeProp}`;updateBaseGuideVisibility()}
    function applyAll(){Object.keys(state).forEach(applyModel);applyLMS();refreshOutput();updateMiniValues()}

    function showWizardStep1(){miniCal.classList.remove('show');updateBaseGuideVisibility();shade.classList.add('show');wizard.classList.add('show');wizardContent.innerHTML=`<div class="q">إيش تبغى تعاير؟</div><div class="sub">سؤال واحد فقط. اختر الموديل، وبعدها تظهر أداة صغيرة لا تحجب المعاينة.</div><div class="grid"><button class="choice primary" data-model="LMS">LMS</button><button class="choice" data-model="9">9 board</button><button class="choice" data-model="3-right">3 right</button><button class="choice" data-model="3-left">3 left</button><button class="choice" data-model="3-front">3 front</button><button class="choice" data-model="3-back">3 back</button></div><div class="wizardActions"><button class="ghost" id="cancelWizard">إلغاء</button><button class="ghost" id="debugBtn">Status</button></div>`;wizardContent.querySelectorAll('[data-model]').forEach(btn=>btn.onclick=()=>{activeModel=btn.dataset.model;if(activeModel==='LMS'){activeProp='py';startMiniCalibration()}else showWizardStep2()});document.getElementById('cancelWizard').onclick=closeWizard;document.getElementById('debugBtn').onclick=()=>document.body.classList.toggle('debug')}
    function showWizardStep2(){wizardContent.innerHTML=`<div class="q">إيش الخاصية؟</div><div class="sub">الموديل: ${getActiveLabel()}</div><div class="grid"><button class="choice" data-prop="px">Move X</button><button class="choice" data-prop="py">Move Y</button><button class="choice" data-prop="pz">Move Z</button><button class="choice" data-prop="rx">Rotate X</button><button class="choice" data-prop="ry">Rotate Y</button><button class="choice" data-prop="rz">Rotate Z</button></div><div class="wizardActions"><button class="ghost" id="backWizard">رجوع</button><button class="ghost" id="cancelWizard">إلغاء</button></div>`;wizardContent.querySelectorAll('[data-prop]').forEach(btn=>btn.onclick=()=>{activeProp=btn.dataset.prop;startMiniCalibration()});document.getElementById('backWizard').onclick=showWizardStep1;document.getElementById('cancelWizard').onclick=closeWizard}
    function closeWizard(){wizard.classList.remove('show');shade.classList.remove('show')}
    function startMiniCalibration(){closeWizard();miniCal.classList.add('show');updateMiniForActive();updateBaseGuideVisibility()}
    function updateMiniForActive(){const f=fields[activeProp];calTitle.textContent=activeModel==='LMS'?'LMS — الارتفاع':`${getActiveLabel()} — ${f.label}`;calMeta.textContent=activeModel==='LMS'?'قاعدة شفافة ظاهرة':`${activeModel}.${activeProp}`;calRange.min=f.min;calRange.max=f.max;calRange.step=f.step;calNum.min=f.min;calNum.max=f.max;calNum.step=f.step;updateMiniValues()}
    function updateMiniValues(){if(!miniCal.classList.contains('show'))return;const s=getActiveState();if(!s||!(activeProp in s))return;calRange.value=s[activeProp];calNum.value=s[activeProp]}
    function setActiveValue(v){const s=getActiveState();s[activeProp]=clampValue(activeProp,v);applyAll()}

    function base64Encode(text){const bytes=new TextEncoder().encode(text);let binary='';for(let i=0;i<bytes.length;i+=0x8000){binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000))}return btoa(binary)}
    function getGitHubToken(){let token=localStorage.getItem('yakolak_github_token')||'';if(token)return token;token=prompt('الصق GitHub Fine-grained Token هنا. لا ترسله في المحادثة.');if(!token)return '';localStorage.setItem('yakolak_github_token',token.trim());return token.trim()}
    async function githubRequest(path,options={}){const token=getGitHubToken();if(!token)throw new Error('لا يوجد توكن');const res=await fetch(`https://api.github.com/repos/A7SNcom/yakolak${path}`,{...options,headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28',...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||`GitHub error ${res.status}`);return data}
    async function putGithubFile(path,text,message,sha=null){const body={message,content:base64Encode(text),branch:'main'};if(sha)body.sha=sha;return githubRequest(`/contents/${encodeURIComponent(path).replaceAll('%2F','/')}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
    async function getGithubFileSha(path){try{const data=await githubRequest(`/contents/${encodeURIComponent(path).replaceAll('%2F','/')}?ref=main`);return data.sha||null}catch(e){if(String(e.message).includes('Not Found'))return null;return null}}
    async function saveCalibrationToGitHub(){const saveBtn=document.getElementById('saveBtn');const oldText=saveBtn.textContent;saveBtn.textContent='يحفظ...';saveBtn.disabled=true;hint.textContent='saving calibration...';try{const payload=getCalibrationPayload();const pretty=JSON.stringify(payload,null,2);const stamp=payload.saved_at.replace(/[:.]/g,'-');const latestPath='calibrations/latest.json';const historyPath=`calibrations/history/${stamp}.json`;const latestSha=await getGithubFileSha(latestPath);await putGithubFile(latestPath,pretty,'save latest calibration from web',latestSha);await putGithubFile(historyPath,pretty,'save calibration history from web');hint.textContent='saved to GitHub ✅';setTimeout(()=>hint.textContent=`Yakolak ${APP_VERSION}`,1800)}catch(e){hint.textContent='save failed';alert(`تعذر الحفظ: ${e.message}\n\nإذا التوكن غلط، امسح التوكن من إعدادات المتصفح أو اعد تحميل الصفحة.`)}finally{saveBtn.disabled=false;saveBtn.textContent=oldText}}

    document.getElementById('settingsBtn').onclick=showWizardStep1;shade.onclick=closeWizard;document.getElementById('changeBtn').onclick=showWizardStep1;document.getElementById('closeMiniBtn').onclick=()=>{miniCal.classList.remove('show');updateBaseGuideVisibility()};calRange.addEventListener('input',e=>setActiveValue(e.target.value));calNum.addEventListener('input',e=>setActiveValue(e.target.value));document.getElementById('minusBtn').onclick=()=>setActiveValue(getActiveState()[activeProp]-fields[activeProp].jump);document.getElementById('plusBtn').onclick=()=>setActiveValue(getActiveState()[activeProp]+fields[activeProp].jump);document.getElementById('resetBtn').onclick=()=>{if(activeModel==='LMS')Object.assign(lmsState,lmsDefault);else Object.assign(state[activeModel],defaultState[activeModel]);applyAll()};document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(out.value);hint.textContent='alignment copied';setTimeout(()=>hint.textContent=`Yakolak ${APP_VERSION}`,1200)};document.getElementById('saveBtn').onclick=saveCalibrationToGitHub;

    function centerGeometry(g){g.computeBoundingBox();const c=g.boundingBox.getCenter(new THREE.Vector3());g.translate(-c.x,-c.y,-c.z);g.computeVertexNormals()}
    function alignLmsGeometryBottom(g){g.computeBoundingBox();const box=g.boundingBox;const cx=(box.min.x+box.max.x)/2;const cy=(box.min.y+box.max.y)/2;g.translate(-cx,-cy,-box.min.z);g.computeVertexNormals()}
    function addLmsBaseGuide(){if(!centerGroup||lmsBaseGuide)return;const box=new THREE.Box3();let hasPiece=false;centerGroup.children.forEach(child=>{if(!child.userData.isLmsPiece||!child.geometry)return;child.geometry.computeBoundingBox();const b=child.geometry.boundingBox.clone();b.translate(child.position);box.union(b);hasPiece=true});if(!hasPiece)return;const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());const pad=10;const guide=new THREE.Group();const plate=new THREE.Mesh(new THREE.PlaneGeometry(Math.max(size.x+pad,12),Math.max(size.y+pad,12)),new THREE.MeshBasicMaterial({color:0x00ff99,transparent:true,opacity:0.28,side:THREE.DoubleSide,depthWrite:false}));plate.position.set(center.x,center.y,0.04);const outline=new THREE.LineSegments(new THREE.EdgesGeometry(plate.geometry),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.9}));outline.position.copy(plate.position);guide.add(plate,outline);guide.visible=false;lmsBaseGuide=guide;centerGroup.add(guide)}

    const loader=new STLLoader();
    function loadModel(id){const def=modelDefs[id];return new Promise(resolve=>{loader.load(`./${def.file}?v=${assetVersion}-${id}`,g=>{try{if(!g.attributes.position||g.attributes.position.count===0)throw new Error('empty STL');centerGeometry(g);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:def.color,roughness:0.55,metalness:0.05}));meshes[id]=mesh;scene.add(mesh);applyModel(id);loadStatus[id]='loaded'}catch(e){loadStatus[id]=`failed: ${e.message}`}refreshOutput();resolve()},undefined,e=>{loadStatus[id]=`failed: ${e?.message||'load error'}`;refreshOutput();resolve()})})}
    function loadCenterPiece(name,color){return new Promise(resolve=>{loader.load(`./${name}.stl?v=${assetVersion}-${name}`,g=>{try{if(!g.attributes.position||g.attributes.position.count===0)throw new Error('empty STL');alignLmsGeometryBottom(g);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:0.55,metalness:0.05}));mesh.userData.isLmsPiece=true;centerGroup.add(mesh);loadStatus[name]='loaded bottom-aligned'}catch(e){loadStatus[name]=`failed: ${e.message}`}refreshOutput();resolve()},undefined,e=>{loadStatus[name]=`failed: ${e?.message||'load error'}`;refreshOutput();resolve()})})}

    Promise.all(Object.keys(modelDefs).map(loadModel)).then(()=>{centerGroup=new THREE.Group();scene.add(centerGroup);applyLMS();return Promise.all([loadCenterPiece('l',0xf2c078),loadCenterPiece('m',0x8ecae6),loadCenterPiece('s',0xffafcc)])}).then(()=>{addLmsBaseGuide();const box=new THREE.Box3();Object.values(meshes).forEach(m=>box.expandByObject(m));if(centerGroup)box.expandByObject(centerGroup);if(Object.keys(meshes).length){const size=box.getSize(new THREE.Vector3());const maxAxis=Math.max(size.x,size.y,size.z)||1;const d=maxAxis*1.75;camera.position.set(d,d*0.82,d);camera.near=Math.max(d/1000,0.01);camera.far=d*30;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update()}hint.textContent=`Yakolak ${APP_VERSION}`;refreshOutput()});
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
    function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}
    animate();refreshOutput();
  </script>
</body>
</html>
