<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="yakolak-version" content="live-v043-safe-loader">
<title>Yakolak Live</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
:root{--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0b0b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity .55s ease}
#hint,#settingsBtn,#panel{display:none!important}
textarea{display:none}
#yakolakLoader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at center,#1b1b1b 0,#0b0b0b 58%,#050505 100%);transition:opacity .45s ease,visibility .45s ease}
#yakolakLoader.done{opacity:0;visibility:hidden;pointer-events:none}
#yakolakLoader.error .loaderRing{border-top-color:#b35a5a}
.loaderBox{display:flex;flex-direction:column;align-items:center;gap:18px;transform:translateY(-8px)}
.loaderMark{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#2b2b2b,#050505);box-shadow:0 18px 60px #000, inset 0 1px 0 rgba(255,255,255,.08);position:relative}
.loaderMark:after{content:"";position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(255,255,255,.7)}
.loaderRing{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;animation:spin .9s linear infinite}
.loaderText{font-size:13px;color:#d7d7d7;letter-spacing:.2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="yakolakLoader"><div class="loaderBox"><div class="loaderMark"></div><div class="loaderRing"></div><div class="loaderText" id="yakolakLoaderText">جاري تجهيز اللعبة...</div></div></div>
<div id="view"></div>
<div id="hint" aria-hidden="true"></div>
<button id="settingsBtn" aria-hidden="true">⚙</button>
<div id="panel" aria-hidden="true"></div>
<textarea id="out"></textarea>
<script type="module">
const KEY='yakolak_build_seen';
async function checkVersion(){
  try{
    const r=await fetch('./version.json?ts='+Date.now(),{cache:'no-store'});
    const v=await r.json();
    const next=String(v.build);
    const old=localStorage.getItem(KEY);
    if(old && old!==next){
      localStorage.setItem(KEY,next);
      console.info('[Yakolak] updating to',v.version);
      location.replace(location.pathname+'?auto='+v.build+'&t='+Date.now());
      return;
    }
    localStorage.setItem(KEY,next);
  }catch(e){console.warn('[Yakolak] version check skipped',e)}
}
await checkVersion();
setInterval(checkVersion,8000);
import('./app.js?boot='+Date.now());
</script>
</body>
</html>
