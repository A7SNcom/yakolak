<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b0d">
<meta name="color-scheme" content="dark">
<meta name="description" content="ياكلك — لعبة طاولة ثلاثية الأبعاد تعمل مباشرة من المتصفح على الجوال والكمبيوتر.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="yakolak-version" content="v079-online-foundation">
<title>ياكلك</title>
<link rel="manifest" href="./manifest.webmanifest?v=79">
<link rel="icon" href="./assets/icon.svg?v=79" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://i.ibb.co" crossorigin>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
@font-face{font-family:YakolakArabic;src:url('./makeen-regular.otf?v=79') format('opentype');font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0d;color:#fff;font-family:YakolakArabic,system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
button,input{font:inherit}
#view{position:fixed;inset:0;z-index:1;opacity:0;transition:opacity .35s ease;touch-action:none}
#hint,#settingsBtn,#panel,textarea{display:none!important}
#yakolakLoader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#20272c 0,#0d1012 34%,#090b0d 72%);transition:opacity .35s ease,visibility .35s ease}
#yakolakLoader.done{opacity:0;visibility:hidden;pointer-events:none}
#yakolakLoader.error .loaderRing{border-top-color:#ff7d7d}
.loaderBox{display:grid;justify-items:center;gap:16px;text-align:center;padding:24px}
.loaderRing{width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.13);border-top-color:#fff;animation:spin .85s linear infinite}
.loaderTitle{font-size:20px;font-weight:900;letter-spacing:.02em}
.loaderText{font:600 13px system-ui;opacity:.66}
#clearCacheBtn{display:none}
#bootError{display:none;max-width:360px;font:700 13px/1.7 system-ui;color:#ffd6d6}
#yakolakLoader.error #bootError{display:block}
#yakolakLoader.error .loaderText{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="yakolakLoader" role="status" aria-live="polite">
  <div class="loaderBox">
    <div class="loaderRing" aria-hidden="true"></div>
    <div class="loaderTitle">ياكلك</div>
    <div class="loaderText">نجهّز الطاولة والقطع…</div>
    <div id="bootError">تعذر تشغيل اللعبة. تحقق من الاتصال ثم استخدم «تنظيف الملفات» من قائمة المساعدة.</div>
  </div>
</div>
<div id="view" aria-label="مساحة لعبة ياكلك ثلاثية الأبعاد"></div>
<div id="hint" aria-hidden="true"></div>
<button id="settingsBtn" aria-hidden="true">SET</button>
<button id="clearCacheBtn" type="button" aria-label="تنظيف الملفات المؤقتة">تنظيف</button>
<div id="panel" aria-hidden="true"></div>
<textarea id="out"></textarea>
<script type="module">
const BUILD='79';
const KEY='yakolak_build_seen';
const params=new URLSearchParams(location.search);
const clearToken=params.get('clear');
const ASSET_VERSION=clearToken||BUILD;
const clearBtn=document.getElementById('clearCacheBtn');
const loader=document.getElementById('yakolakLoader');
function hardReload(){
  const url=new URL(location.href);
  url.searchParams.set('clear',Date.now().toString());
  location.replace(url.toString());
}
async function clearIndexedDB(){
  if(!('indexedDB' in window)||!indexedDB.databases)return;
  const dbs=await indexedDB.databases();
  await Promise.allSettled(dbs.filter(db=>db&&db.name).map(db=>new Promise(resolve=>{
    const req=indexedDB.deleteDatabase(db.name);
    req.onsuccess=req.onerror=req.onblocked=()=>resolve();
  })));
}
async function cleanReload(event){
  event?.preventDefault();
  if(clearBtn?.disabled)return;
  if(clearBtn)clearBtn.disabled=true;
  const jobs=[];
  try{localStorage.removeItem(KEY)}catch(error){}
  try{sessionStorage.clear()}catch(error){}
  try{if('caches' in window)jobs.push(caches.keys().then(names=>Promise.allSettled(names.map(name=>caches.delete(name)))))}catch(error){}
  try{if('serviceWorker' in navigator)jobs.push(navigator.serviceWorker.getRegistrations().then(regs=>Promise.allSettled(regs.map(reg=>reg.unregister()))))}catch(error){}
  jobs.push(clearIndexedDB().catch(()=>{}));
  await Promise.allSettled(jobs);
  hardReload();
}
clearBtn?.addEventListener('click',cleanReload);
window.YakolakMaintenance={cleanReload,build:BUILD};
async function checkVersion(){
  try{
    const response=await fetch('./version.json?v='+ASSET_VERSION,{cache:'no-store'});
    if(!response.ok)throw new Error('version '+response.status);
    const version=await response.json();
    const next=String(version.build||BUILD);
    const old=localStorage.getItem(KEY);
    if(old&&old!==next){localStorage.setItem(KEY,next);hardReload();return false}
    localStorage.setItem(KEY,next);
  }catch(error){console.warn('[Yakolak] version check skipped',error)}
  return true;
}
try{
  if(await checkVersion())await import('./app.js?v='+ASSET_VERSION);
  if(clearToken){
    const clean=new URL(location.href);
    clean.searchParams.delete('clear');
    history.replaceState(null,'',clean.toString());
  }
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v='+BUILD).catch(error=>console.warn('[Yakolak] service worker',error)),{once:true});
  }
}catch(error){
  console.error('[Yakolak] boot failed',error);
  loader?.classList.add('error');
}
</script>
</body>
</html>
