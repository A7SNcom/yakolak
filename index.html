<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="yakolak-version" content="v010-model-3-safe-load" />
  <title>Yakolak STL Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}#view{position:fixed;inset:0}#hint{position:fixed;top:14px;right:14px;z-index:10;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;direction:ltr}#settingsBtn{position:fixed;top:14px;left:14px;z-index:20;width:52px;height:52px;border:0;border-radius:16px;background:rgba(0,0,0,.78);color:#fff;font-size:25px;cursor:pointer}#panel{position:fixed;top:76px;left:14px;z-index:20;width:min(380px,calc(100vw - 28px));max-height:calc(100vh - 100px);overflow:auto;padding:14px;border-radius:18px;background:rgba(0,0,0,.84);color:#fff;backdrop-filter:blur(8px);display:none;direction:ltr}#panel.show{display:block}.row{margin:12px 0}.label{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}select,input[type=range]{width:100%}select{box-sizing:border-box;border:0;border-radius:12px;padding:10px;background:#181818;color:#fff}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:7px}button.small{border:0;border-radius:10px;padding:8px 0;background:#252525;color:#fff;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{border:0;border-radius:12px;padding:10px;background:#333;color:#fff;cursor:pointer}textarea{width:100%;height:120px;box-sizing:border-box;border:0;border-radius:12px;padding:10px;background:#151515;color:#fff;resize:none;direction:ltr;margin-top:10px}#status{font-size:12px;line-height:1.6;color:#ddd;background:#151515;border-radius:12px;padding:9px;white-space:pre-wrap;direction:ltr}.bad{color:#ff9b9b}.ok{color:#9cffb0}
  </style>
</head>
<body>
  <div id="view"></div><div id="hint">loading v010...</div><button id="settingsBtn">⚙</button>
  <div id="panel">
    <div class="row"><b>Transform Controls</b> <span style="font-size:12px;color:#aaa">v010</span></div>
    <div id="status" class="row">loading models...</div>
    <div class="row"><div class="label"><span>Model</span><span id="modelName">9</span></div><select id="modelSelect"><option value="9">9.stl</option><option value="3">3.stl</option></select></div>
    <div class="row"><div class="label"><span>Move X</span><span id="pxVal">0</span></div><input id="pxRange" type="range" min="-250" max="250" step="1" value="0"><div class="btns"><button class="small" data-prop="px" data-delta="-10">-10</button><button class="small" data-prop="px" data-delta="-1">-1</button><button class="small" data-prop="px" data-delta="1">+1</button><button class="small" data-prop="px" data-delta="10">+10</button></div></div>
    <div class="row"><div class="label"><span>Move Y</span><span id="pyVal">0</span></div><input id="pyRange" type="range" min="-250" max="250" step="1" value="0"><div class="btns"><button class="small" data-prop="py" data-delta="-10">-10</button><button class="small" data-prop="py" data-delta="-1">-1</button><button class="small" data-prop="py" data-delta="1">+1</button><button class="small" data-prop="py" data-delta="10">+10</button></div></div>
    <div class="row"><div class="label"><span>Move Z</span><span id="pzVal">0</span></div><input id="pzRange" type="range" min="-250" max="250" step="1" value="0"><div class="btns"><button class="small" data-prop="pz" data-delta="-10">-10</button><button class="small" data-prop="pz" data-delta="-1">-1</button><button class="small" data-prop="pz" data-delta="1">+1</button><button class="small" data-prop="pz" data-delta="10">+10</button></div></div>
    <div class="row"><div class="label"><span>Rotate X</span><span id="rxVal">0°</span></div><input id="rxRange" type="range" min="-180" max="180" step="1" value="0"><div class="btns"><button class="small" data-prop="rx" data-delta="-15">-15</button><button class="small" data-prop="rx" data-delta="-1">-1</button><button class="small" data-prop="rx" data-delta="1">+1</button><button class="small" data-prop="rx" data-delta="15">+15</button></div></div>
    <div class="row"><div class="label"><span>Rotate Y</span><span id="ryVal">0°</span></div><input id="ryRange" type="range" min="-180" max="180" step="1" value="0"><div class="btns"><button class="small" data-prop="ry" data-delta="-15">-15</button><button class="small" data-prop="ry" data-delta="-1">-1</button><button class="small" data-prop="ry" data-delta="1">+1</button><button class="small" data-prop="ry" data-delta="15">+15</button></div></div>
    <div class="row"><div class="label"><span>Rotate Z</span><span id="rzVal">0°</span></div><input id="rzRange" type="range" min="-180" max="180" step="1" value="0"><div class="btns"><button class="small" data-prop="rz" data-delta="-15">-15</button><button class="small" data-prop="rz" data-delta="-1">-1</button><button class="small" data-prop="rz" data-delta="1">+1</button><button class="small" data-prop="rz" data-delta="15">+15</button></div></div>
    <div class="actions"><button id="resetBtn">Reset Selected</button><button id="copyBtn">Copy All</button></div><textarea id="out" readonly></textarea>
  </div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLLoader}from'three/addons/loaders/STLLoader.js';
const APP_VERSION='v010-model-3-safe-load',assetVersion=`${APP_VERSION}-${Date.now()}`;if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});if('caches'in window)caches.keys().then(k=>k.forEach(x=>caches.delete(x))).catch(()=>{});setInterval(async()=>{try{const r=await fetch(`${location.pathname||'/'}?check=${Date.now()}`,{cache:'no-store'}),h=await r.text(),v=(h.match(/yakolak-version" content="([^"]+)/)||[])[1];if(v&&v!==APP_VERSION)location.reload()}catch(e){}},3e4);
const hint=document.getElementById('hint'),statusEl=document.getElementById('status'),root=document.getElementById('view'),panel=document.getElementById('panel'),out=document.getElementById('out'),modelSelect=document.getElementById('modelSelect');
const state={'9':{px:0,py:0,pz:0,rx:-90,ry:0,rz:0},'3':{px:0,py:0,pz:0,rx:0,ry:0,rz:0}},meshes={},loadStatus={'9':'loading','3':'loading'};let selected='9';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111111);const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.01,1e5);camera.position.set(180,140,220);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);root.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2.2));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(120,180,140);scene.add(light);scene.add(new THREE.GridHelper(300,30,0x444444,0x252525));
function deg(v){return THREE.MathUtils.degToRad(v)}function clamp(p,v){const n=Number(v)||0;return p[0]==='r'?Math.max(-180,Math.min(180,n)):Math.max(-250,Math.min(250,n))}function applyModel(id){const m=meshes[id];if(!m)return;const s=state[id];m.position.set(s.px,s.py,s.pz);m.rotation.set(deg(s.rx),deg(s.ry),deg(s.rz))}function refreshUI(){const s=state[selected];document.getElementById('modelName').textContent=selected;for(const p of['px','py','pz','rx','ry','rz']){document.getElementById(p+'Range').value=s[p];document.getElementById(p+'Val').textContent=p[0]==='r'?`${s[p]}°`:s[p]}out.value=`const MODEL_TRANSFORMS = ${JSON.stringify(state,null,2)};`;statusEl.innerHTML=`9.stl: ${loadStatus['9']}\n3.stl: ${loadStatus['3']}\nactive: ${selected}`}function applyAll(){Object.keys(state).forEach(applyModel);refreshUI()}document.getElementById('settingsBtn').onclick=()=>panel.classList.toggle('show');modelSelect.onchange=()=>{selected=modelSelect.value;refreshUI()};for(const p of['px','py','pz','rx','ry','rz'])document.getElementById(p+'Range').addEventListener('input',e=>{state[selected][p]=clamp(p,e.target.value);applyAll()});document.querySelectorAll('button.small').forEach(b=>b.onclick=()=>{const p=b.dataset.prop;state[selected][p]=clamp(p,state[selected][p]+Number(b.dataset.delta));applyAll()});document.getElementById('resetBtn').onclick=()=>{Object.assign(state[selected],selected==='9'?{px:0,py:0,pz:0,rx:-90,ry:0,rz:0}:{px:0,py:0,pz:0,rx:0,ry:0,rz:0});applyAll()};document.getElementById('copyBtn').onclick=async()=>{await navigator.clipboard.writeText(out.value);hint.textContent='transforms copied';setTimeout(()=>hint.textContent=`Yakolak ${APP_VERSION}`,1200)};
function centerGeometry(g){g.computeBoundingBox();const c=g.boundingBox.getCenter(new THREE.Vector3());g.translate(-c.x,-c.y,-c.z);g.computeVertexNormals()}const loader=new STLLoader();function loadModel(id,color){return new Promise(resolve=>{loader.load(`./${id}.stl?v=${assetVersion}`,g=>{try{if(!g.attributes.position||g.attributes.position.count===0)throw new Error('empty STL');centerGeometry(g);const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:.55,metalness:.05}));meshes[id]=m;scene.add(m);applyModel(id);loadStatus[id]='loaded';resolve(true)}catch(e){loadStatus[id]=`failed: ${e.message}`;resolve(false)}refreshUI()},undefined,e=>{loadStatus[id]=`failed: ${e?.message||'load error'}`;refreshUI();resolve(false)})})}
Promise.all([loadModel('9',0xd8d8d8),loadModel('3',0x89a790)]).then(()=>{const box=new THREE.Box3();Object.values(meshes).forEach(m=>box.expandByObject(m));if(Object.keys(meshes).length){const size=box.getSize(new THREE.Vector3()),maxAxis=Math.max(size.x,size.y,size.z)||1,d=maxAxis*2.1;camera.position.set(d,d*.75,d);camera.near=Math.max(d/1000,.01);camera.far=d*20;camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.update()}hint.textContent=`Yakolak ${APP_VERSION}`;refreshUI()});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();refreshUI();
</script></body></html>
