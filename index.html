<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="yakolak-version" content="v130-approved-room-continuity">
<title>Yakolak Live</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles/v114-online.css?v=130">
<link rel="stylesheet" href="./styles/v126-rooms.css?v=130">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<style>
:root{--yakolak-wall:#f7f7f4;--yakolak-ink:#3f3f3f;--loader-cycle:820ms}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--yakolak-wall);color:var(--yakolak-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0;z-index:1;opacity:0;background:var(--yakolak-wall);transition:opacity .2s ease}
#hint,#settingsBtn,#panel,textarea{display:none!important}
#yakolakLoader{position:fixed;inset:0;z-index:20000;display:grid;place-items:center;background:var(--yakolak-wall);overflow:hidden}
.loaderProjection{position:relative;width:96px;height:132px;transform-origin:50% 55%;will-change:transform}
.starBounce{position:absolute;top:0;left:4px;width:88px;height:88px;transform-origin:50% 100%;animation:bounce var(--loader-cycle) infinite;will-change:transform}
.loadingStar{display:block;width:100%;height:100%;overflow:visible;transform-box:fill-box;transform-origin:center;animation:turn var(--loader-cycle) linear infinite;will-change:transform}
.loadingStar path{fill:var(--yakolak-ink)}
.loadingShadow{position:absolute;top:123px;left:13px;width:70px;height:8px;border-radius:50%;background:#000;opacity:.075;filter:blur(.6px);transform-origin:center;animation:loaderShadow var(--loader-cycle) infinite;will-change:transform,opacity}
.loaderStatus{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#clearCacheBtn{position:fixed;left:16px;bottom:16px;z-index:10000;width:58px;height:58px;border-radius:50%;border:1px solid rgba(36,36,33,.18);background:rgba(247,247,244,.92);color:#242421;font-size:15px;font-weight:950;display:grid;place-items:center;cursor:pointer;line-height:1;box-shadow:0 10px 30px rgba(35,33,29,.12);user-select:none}
#clearCacheBtn[hidden]{display:none!important}
#clearCacheBtn[disabled]{opacity:.62;cursor:wait}
@keyframes bounce{
  0%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.55,.08,.68,.19)}
  43%{transform:translateY(33px) scale(1.01,.99);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  50%{transform:translateY(36px) scale(1.17,.72);animation-timing-function:cubic-bezier(.15,.75,.2,1)}
  58%{transform:translateY(30px) scale(.94,1.09);animation-timing-function:cubic-bezier(.22,.61,.36,1)}
  78%{transform:translateY(5px) scale(1.01,.99);animation-timing-function:cubic-bezier(.25,.1,.25,1)}
  100%{transform:translateY(0) scale(1)}
}
@keyframes turn{0%{transform:rotate(0)}43%{transform:rotate(10deg)}50%{transform:rotate(12deg)}58%{transform:rotate(14deg)}78%{transform:rotate(20deg)}100%{transform:rotate(24deg)}}
@keyframes loaderShadow{
  0%,100%{transform:scale(.66,.72);opacity:.055;animation-timing-function:cubic-bezier(.55,.08,.68,.19)}
  43%{transform:scale(1.02,.95);opacity:.105}
  50%{transform:scale(1.28,1);opacity:.14;animation-timing-function:cubic-bezier(.15,.75,.2,1)}
  58%{transform:scale(1.04,.94);opacity:.105}
  78%{transform:scale(.72,.76);opacity:.065}
}
@media(prefers-reduced-motion:reduce){:root{--loader-cycle:1100ms}}
</style>
</head>
<body data-phase="loading">
<div id="yakolakLoader" aria-busy="true" aria-describedby="yakolakLoaderStatus">
  <div class="loaderProjection" aria-hidden="true">
    <div class="starBounce">
      <svg class="loadingStar" viewBox="0 0 802 798" xmlns="http://www.w3.org/2000/svg">
        <g transform="matrix(4.166667,0,0,4.166667,484.7475,797.470417)">
          <path d="M0,-191.393L-20.116,-183.832L-40.232,-191.393L-55.534,-176.304L-76.986,-175.028L-84.828,-155.02L-103.907,-145.13L-102.932,-123.662L-116.339,-106.867L-106.717,-87.651L-112.134,-66.855L-95.528,-53.214L-92.018,-32.013L-71.299,-26.306L-59.469,-8.364L-38.22,-11.578L-20.116,0L-2.012,-11.578L19.237,-8.364L31.067,-26.306L51.786,-32.013L55.296,-53.214L71.902,-66.855L66.486,-87.651L76.108,-106.867L62.7,-123.662L63.675,-145.13L44.596,-155.02L36.754,-175.028L15.302,-176.304L0,-191.393Z"/>
        </g>
      </svg>
    </div>
    <div class="loadingShadow"></div>
  </div>
  <span id="yakolakLoaderStatus" class="loaderStatus">تحميل اللعبة</span>
</div>
<div id="view"></div>
<div id="hint" aria-hidden="true"></div>
<button id="settingsBtn" aria-hidden="true">SET</button>
<button id="clearCacheBtn" type="button" title="مسح كامل للكاش وإعادة تحميل نظيفة" aria-label="مسح كامل للكاش وإعادة تحميل نظيفة" hidden>مسح</button>
<div id="panel" aria-hidden="true"></div>
<textarea id="out"></textarea>
<script type="module">
const BUILD='130';
const params=new URLSearchParams(location.search);
const clearToken=params.get('clear');
const debugMode=params.get('debug')==='1';
const ASSET_VERSION=clearToken||BUILD;
const clearBtn=document.getElementById('clearCacheBtn');
const loaderEl=document.getElementById('yakolakLoader');
const progressStatus=document.getElementById('yakolakLoaderStatus');
window.__yakolakLoadingStarStartedAt=performance.now();
if(clearBtn)clearBtn.hidden=!debugMode;
window.__yakolakReleaseWallLoader=()=>{
  if(!loaderEl?.isConnected)return;
  loaderEl.setAttribute('aria-busy','false');
  requestAnimationFrame(()=>loaderEl.remove());
};
window.__yakolakLoading={set(_value,status){if(status&&progressStatus)progressStatus.textContent=status}};
function hardReload(){const url=new URL(location.href);url.searchParams.set('clear',Date.now().toString());location.replace(url.toString())}
async function clearIndexedDB(){
  if(!('indexedDB' in window)||!indexedDB.databases)return;
  const dbs=await indexedDB.databases();
  await Promise.allSettled(dbs.filter(db=>db&&db.name).map(db=>new Promise(resolve=>{
    const req=indexedDB.deleteDatabase(db.name);req.onsuccess=req.onerror=req.onblocked=()=>resolve();
  })));
}
async function cleanReload(e){
  if(e)e.preventDefault();
  if(!debugMode||!clearBtn||clearBtn.disabled)return;
  clearBtn.disabled=true;clearBtn.textContent='ينظف';
  const jobs=[];
  try{if('caches' in window)jobs.push(caches.keys().then(names=>Promise.allSettled(names.map(name=>caches.delete(name)))))}catch(err){}
  try{if('serviceWorker' in navigator)jobs.push(navigator.serviceWorker.getRegistrations().then(regs=>Promise.allSettled(regs.map(reg=>reg.unregister()))))}catch(err){}
  jobs.push(clearIndexedDB().catch(()=>{}));
  await Promise.allSettled(jobs);clearBtn.textContent='تم';hardReload();
}
if(clearBtn)clearBtn.addEventListener('click',cleanReload);
async function checkVersion(){
  try{const r=await fetch('./version.json?v='+ASSET_VERSION,{cache:'no-store'});const v=await r.json();const next=String(v.build||BUILD);if(next!==String(BUILD)){hardReload();return false}}catch(e){}
  return true;
}
if(await checkVersion()){
  await import('./app.js?v='+ASSET_VERSION);
  if(clearToken){const clean=new URL(location.href);clean.searchParams.delete('clear');history.replaceState(null,'',clean.toString())}
}
</script>
</body>
</html>
