<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>عرض ملف 9 STL</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    #hint { position: fixed; top: 14px; right: 14px; z-index: 10; padding: 8px 12px; border-radius: 12px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; direction: ltr; }
    #settingsBtn { position: fixed; top: 14px; left: 14px; z-index: 20; width: 48px; height: 48px; border: 0; border-radius: 16px; background: rgba(0,0,0,.72); color: #fff; font-size: 24px; cursor: pointer; }
    #panel { position: fixed; top: 72px; left: 14px; z-index: 20; width: min(340px, calc(100vw - 28px)); padding: 14px; border-radius: 18px; background: rgba(0,0,0,.78); color: #fff; backdrop-filter: blur(8px); display: none; direction: ltr; }
    #panel.show { display: block; }
    .row { margin: 12px 0; }
    .label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    input[type="range"] { width: 100%; }
    .btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 7px; }
    button.small { border: 0; border-radius: 10px; padding: 8px 0; background: #252525; color: #fff; cursor: pointer; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .actions button { border: 0; border-radius: 12px; padding: 10px; background: #333; color: #fff; cursor: pointer; }
    textarea { width: 100%; height: 72px; box-sizing: border-box; border: 0; border-radius: 12px; padding: 10px; background: #151515; color: #fff; resize: none; direction: ltr; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="hint">loading 9.stl...</div>
  <button id="settingsBtn" title="settings">⚙</button>
  <div id="panel">
    <div class="row"><b>Rotation</b></div>
    <div class="row" data-axis="x"><div class="label"><span>Rotate X</span><span id="xVal">0°</span></div><input id="xRange" type="range" min="-180" max="180" step="1" value="0"><div class="btns"><button class="small" data-axis="x" data-delta="-15">-15</button><button class="small" data-axis="x" data-delta="-1">-1</button><button class="small" data-axis="x" data-delta="1">+1</button><button class="small" data-axis="x" data-delta="15">+15</button></div></div>
    <div class="row" data-axis="y"><div class="label"><span>Rotate Y</span><span id="yVal">0°</span></div><input id="yRange" type="range" min="-180" max="180" step="1" value="0"><div class="btns"><button class="small" data-axis="y" data-delta="-15">-15</button><button class="small" data-axis="y" data-delta="-1">-1</button><button class="small" data-axis="y" data-delta="1">+1</button><button class="small" data-axis="y" data-delta="15">+15</button></div></div>
    <div class="row" data-axis="z"><div class="label"><span>Rotate Z</span><span id="zVal">0°</span></div><input id="zRange" type="range" min="-180" max="180" step="1" value="0"><div class="btns"><button class="small" data-axis="z" data-delta="-15">-15</button><button class="small" data-axis="z" data-delta="-1">-1</button><button class="small" data-axis="z" data-delta="1">+1</button><button class="small" data-axis="z" data-delta="15">+15</button></div></div>
    <div class="actions"><button id="resetBtn">Reset</button><button id="copyBtn">Copy</button></div>
    <textarea id="out" readonly></textarea>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const hint = document.getElementById('hint');
    const root = document.getElementById('view');
    const panel = document.getElementById('panel');
    const out = document.getElementById('out');
    const rot = { x: 0, y: 0, z: 0 };
    let mesh = null;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100000);
    camera.position.set(160, 130, 180);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    root.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.2));
    const light = new THREE.DirectionalLight(0xffffff, 2.4);
    light.position.set(120, 180, 140);
    scene.add(light);
    scene.add(new THREE.GridHelper(260, 26, 0x444444, 0x252525));

    function degToRad(v) { return THREE.MathUtils.degToRad(v); }
    function clampDeg(v) { return Math.max(-180, Math.min(180, Number(v) || 0)); }
    function applyRotation() {
      if (mesh) mesh.rotation.set(degToRad(rot.x), degToRad(rot.y), degToRad(rot.z));
      for (const axis of ['x','y','z']) {
        document.getElementById(axis + 'Range').value = rot[axis];
        document.getElementById(axis + 'Val').textContent = rot[axis] + '°';
      }
      out.value = `const MODEL_9_ROTATION = { x: ${rot.x}, y: ${rot.y}, z: ${rot.z} };`;
    }

    document.getElementById('settingsBtn').onclick = () => panel.classList.toggle('show');
    for (const axis of ['x','y','z']) {
      document.getElementById(axis + 'Range').addEventListener('input', e => { rot[axis] = clampDeg(e.target.value); applyRotation(); });
    }
    document.querySelectorAll('button.small').forEach(btn => btn.onclick = () => {
      const axis = btn.dataset.axis;
      rot[axis] = clampDeg(rot[axis] + Number(btn.dataset.delta));
      applyRotation();
    });
    document.getElementById('resetBtn').onclick = () => { rot.x = 0; rot.y = 0; rot.z = 0; applyRotation(); };
    document.getElementById('copyBtn').onclick = async () => {
      await navigator.clipboard.writeText(out.value);
      hint.textContent = 'rotation copied';
      setTimeout(() => hint.textContent = '9.stl', 1200);
    };

    const loader = new STLLoader();
    loader.load('./9.stl?v=007', (geometry) => {
      if (!geometry.attributes.position || geometry.attributes.position.count === 0) { hint.textContent = '9.stl is empty'; return; }
      geometry.computeBoundingBox();
      geometry.computeVertexNormals();

      mesh = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xd8d8d8, roughness: 0.55, metalness: 0.05 }));
      scene.add(mesh);

      const box = new THREE.Box3().setFromObject(mesh);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      mesh.position.sub(center);

      const maxAxis = Math.max(size.x, size.y, size.z) || 1;
      const distance = maxAxis * 1.8;
      camera.position.set(distance, distance * 0.75, distance);
      camera.near = Math.max(distance / 1000, 0.01);
      camera.far = distance * 20;
      camera.updateProjectionMatrix();
      controls.target.set(0, 0, 0);
      controls.update();
      hint.textContent = '9.stl';
      applyRotation();
    }, undefined, (error) => { hint.textContent = 'failed loading 9.stl'; console.error(error); });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
  </script>
</body>
</html>
