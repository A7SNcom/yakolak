<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ياكلك - نسخة المطور</title>
  <meta name="description" content="Yakolak 3D developer build with one-point calibration." />
  <link rel="stylesheet" href="./src/styles.css?v=2026.06.20.1" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="app" data-build="yakolak-dev-one-point-v1">
    <canvas id="gameCanvas" aria-label="Yakolak 3D board"></canvas>

    <button id="settingsBtn" class="icon-btn" type="button" aria-label="الإعدادات" title="الإعدادات">⚙️</button>

    <section id="devPanel" class="dev-panel" aria-label="لوحة المعايرة">
      <header>
        <strong>معايرة نقطة واحدة</strong>
        <button id="closePanelBtn" class="mini-btn" type="button">×</button>
      </header>

      <p class="hint">عدّل مركز اللوحة فقط، وكل الخانات والارتفاع تتبعه تلقائيًا.</p>

      <div class="grid-controls">
        <label> X <input id="originX" type="number" step="0.05" /></label>
        <label> Y <input id="originY" type="number" step="0.05" /></label>
        <label> Z <input id="originZ" type="number" step="0.05" /></label>
        <label> المسافة <input id="gridStep" type="number" step="0.05" min="0.5" /></label>
        <label> ارتفاع الحجر <input id="dropHeight" type="number" step="0.02" /></label>
        <label> حجم الحجر <input id="pieceScale" type="number" step="0.05" min="0.2" /></label>
        <label> بعد المخزن <input id="trayRadius" type="number" step="0.1" min="2" /></label>
      </div>

      <div class="actions">
        <button id="copyCodeBtn" type="button">نسخ الكود</button>
        <button id="resetCalibrationBtn" type="button">تصفير المعايرة</button>
        <button id="resetGameBtn" type="button">إعادة اللعب</button>
      </div>

      <textarea id="calibrationOutput" spellcheck="false" readonly></textarea>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>


  
  <script type="module" src="./src/main.js?v=2026.06.20.1"></script>
</body>
</html>
