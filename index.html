<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="yakolak-version" content="v019-mobile-calibration-ui" />
  <title>Yakolak STL Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root{--panel:#090909e8;--card:#151515;--btn:#242424;--text:#fff;--muted:#bdbdbd;--accent:#89a790;--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);touch-action:none}
    #view{position:fixed;inset:0}
    #hint{position:fixed;top:14px;right:14px;z-index:10;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;direction:ltr;backdrop-filter:blur(10px)}
    #settingsBtn{position:fixed;top:14px;left:14px;z-index:20;width:56px;height:56px;border:0;border-radius:18px;background:rgba(0,0,0,.78);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.35);backdrop-filter:blur(10px);touch-action:manipulation}
    #panel{position:fixed;top:76px;left:14px;z-index:20;width:min(430px,calc(100vw - 28px));max-height:calc(100vh - 100px);overflow:auto;padding:14px;border-radius:20px;background:var(--panel);color:#fff;display:none;direction:ltr;box-shadow:0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(16px);overscroll-behavior:contain;touch-action:auto}
    #panel.show{display:block}.row{margin:14px 0}.label{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px;gap:10px}.num{width:96px;min-height:44px;border:1px solid #2b2b2b;border-radius:14px;padding:8px 10px;background:#101010;color:#fff;text-align:center;direction:ltr;font-size:16px}select,input[type=range]{width:100%}select{min-height:50px;box-sizing:border-box;border:1px solid #2b2b2b;border-radius:16px;padding:12px;background:#101010;color:#fff;font-size:16px}.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}button.small{border:0;border-radius:14px;min-height:44px;padding:8px 0;background:var(--btn);color:#fff;cursor:pointer;font-size:15px;touch-action:manipulation}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button{border:0;border-radius:16px;min-height:48px;padding:11px;background:#303030;color:#fff;cursor:pointer;font-size:15px;touch-action:manipulation}textarea{width:100%;height:185px;box-sizing:border-box;border:1px solid #252525;border-radius:16px;padding:12px;background:#101010;color:#fff;resize:none;direction:ltr;margin-top:10px;font-size:12px}#status{font-size:12px;line-height:1.7;color:#ddd;background:#101010;border:1px solid #252525;border-radius:16px;padding:10px;white-space:pre-wrap;direction:ltr}.note{font-size:12px;color:var(--muted);line-height:1.6;background:#101010;border:1px solid #222;border-radius:16px;padding:10px}
    input[type=range]{height:42px;accent-color:var(--accent);touch-action:pan-x}input[type=range]::-webkit-slider-thumb{width:28px;height:28px}b{font-size:16px}
    @media (max-width: 640px){
      #hint{top:calc(10px + env(safe-area-inset-top,0px));right:10px;font-size:12px;padding:7px 10px;max-width:calc(100vw - 88px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      #settingsBtn{top:calc(10px + env(safe-area-inset-top,0px));left:10px;width:58px;height:58px;border-radius:20px}
      #panel{top:auto;left:0;right:0;bottom:0;width:100vw;max-height:min(78vh,720px);padding:14px 14px calc(14px + var(--safe-bottom));border-radius:24px 24px 0 0;background:#080808f2;border-top:1px solid #2a2a2a}
      #panel:before{content:"";display:block;width:46px;height:5px;border-radius:999px;background:#444;margin:0 auto 12px}
      .row{margin:12px 0}.label{font-size:15px}.num{width:104px;min-height:48px;font-size:17px}select{min-height:54px;font-size:17px}button.small{min-height:48px;font-size:16px}.actions button{min-height:52px;font-size:16px}textarea{height:135px;font-size:11px}#status{max-height:116px;overflow:auto}.note{font-size:12px}
    }
  </style>
</head>
<body>
  <div id="view"></div><div id="hint">loading v019...</div><button id="settingsBtn">⚙</button>
  <div id="panel">
    <div class="row"><b>Transform Controls</b> <span style="font-size:12px;color:#aaa">v019</span></div>
    <div class="note">ثوابت 9 و 3 محفوظة. اختر LMS من قائمة الموديل لضبط الارتفاع فقط.</div>
    <div id="status" class="row">loading models...</div>
    <div class="row"><div class="label"><span>Model</span><span id="modelName">9</span></div><select id="modelSelect"></select></div>
    <div id="controlsBox"></div>
    <div class="actions"><button id="resetBtn">Reset Selected</button><button id="copyBtn">Copy All</button></div>
    <textarea id="out" readonly></textarea>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';

    const APP_VERSION = 'v019-mobile-calibration-ui';
    const assetVersion = `${APP_VERSION}-${Date.now()}`;
    setInterval(async () => {
      try {
        const res = await fetch(`${location.pathname || '/'}?check=${Date.now()}`, { cache: 'no-store' });
        const html = await res.text();
        const latest = (html.match(/yakolak-version" content="([^"]+)/) || [])[1];
        if (latest && latest !== APP_VERSION) location.reload();
      } catch (e) {}
    }, 30000);

    const hint = document.getElementById('hint');
    const statusEl = document.getElementById('status');
    const root = document.getElementById('view');
    const panel = document.getElementById('panel');
    const out = document.getElementById('out');
    const modelSelect = document.getElementById('modelSelect');
    const controlsBox = document.getElementById('controlsBox');

    const modelDefs = {
      '9': { file: '9.stl', color: 0xd8d8d8, label: '9 board' },
      '3-right': { file: '3.stl', color: 0x89a790, label: '3 right' },
      '3-left': { file: '3.stl', color: 0x89a790, label: '3 left' },
      '3-front': { file: '3.stl', color: 0x89a790, label: '3 front' },
      '3-back': { file: '3.stl', color: 0x89a790, label: '3 back' }
    };

    const defaultState = {
      '9': { px: 0, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 },
      '3-right': { px: 135, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 },
      '3-left': { px: -135, py: 6, pz: 0, rx: -90, ry: 0, rz: 180 },
      '3-front': { px: 0, py: 6, pz: 135, rx: -90, ry: 0, rz: 90 },
      '3-back': { px: 0, py: 6, pz: -135, rx: -90, ry: 0, rz: -90 }
    };

    const lmsDefault = { px: 0, py: 6, pz: 0, rx: -90, ry: 0, rz: 0 };
    const state = JSON.parse(JSON.stringify(defaultState));
    const lmsState = { ...lmsDefault };
    const meshes = {};
    const loadStatus = {};
    Object.keys(modelDefs).forEach(id => loadStatus[id] = 'loading');
    ['l','m','s'].forEach(id => loadStatus[id] = 'loading');
    let selected = '9';
    let centerGroup = null;

    const selectOptions = [...Object.entries(modelDefs).map(([id, def]) => [id, def.label]), ['LMS', 'LMS']];
    modelSelect.innerHTML = selectOptions.map(([id, label]) => `<option value="${id}">${label}</option>`).join('');

    const modelProps = [
      ['px', 'Move X', -300, 300, 1, 10],
      ['py', 'Move Y', -100, 150, 1, 10],
      ['pz', 'Move Z', -300, 300, 1, 10],
      ['rx', 'Rotate X', -180, 180, 1, 15],
      ['ry', 'Rotate Y', -180, 180, 1, 15],
      ['rz', 'Rotate Z', -180, 180, 1, 15]
    ];
    const lmsProps = [
      ['py', 'الارتفاع', -120, 120, 1, 10]
    ];

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100000);
    camera.position.set(260, 210, 260);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    root.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2.2));
    const light = new THREE.DirectionalLight(0xffffff, 2.4);
    light.position.set(150, 220, 160);
    scene.add(light);
    scene.add(new THREE.GridHelper(360, 36, 0x444444, 0x252525));

    function deg(v) { return THREE.MathUtils.degToRad(v); }
    function clamp(prop, v) {
      const n = Number(v) || 0;
      return prop[0] === 'r' ? Math.max(-180, Math.min(180, n)) : Math.max(-300, Math.min(300, n));
    }
    function applyModel(id) {
      const mesh = meshes[id];
      if (!mesh) return;
      const s = state[id];
      mesh.position.set(s.px, s.py, s.pz);
      mesh.rotation.set(deg(s.rx), deg(s.ry), deg(s.rz));
    }
    function applyLMS() {
      if (!centerGroup) return;
      centerGroup.position.set(lmsState.px, lmsState.py, lmsState.pz);
      centerGroup.rotation.set(deg(lmsState.rx), deg(lmsState.ry), deg(lmsState.rz));
    }
    function getActiveState() { return selected === 'LMS' ? lmsState : state[selected]; }
    function getActiveProps() { return selected === 'LMS' ? lmsProps : modelProps; }
    function outputAll() {
      return {
        approved_9_and_3: state,
        LMS: { الارتفاع: lmsState.py, px: lmsState.px, py: lmsState.py, pz: lmsState.pz, rx: lmsState.rx, ry: lmsState.ry, rz: lmsState.rz },
        LMS_rule: 'l/m/s local bottoms are equalized; LMS exposes height only in settings'
      };
    }
    function renderControls() {
      const props = getActiveProps();
      const s = getActiveState();
      controlsBox.innerHTML = props.map(([p, label, min, max, step, jump]) => `
        <div class="row">
          <div class="label"><span>${label}</span><input class="num" id="${p}Num" type="number" min="${min}" max="${max}" step="${step}" value="${s[p]}"></div>
          <input id="${p}Range" type="range" min="${min}" max="${max}" step="${step}" value="${s[p]}">
          <div class="btns"><button class="small" data-prop="${p}" data-delta="-${jump}">-${jump}</button><button class="small" data-prop="${p}" data-delta="-1">-1</button><button class="small" data-prop="${p}" data-delta="1">+1</button><button class="small" data-prop="${p}" data-delta="${jump}">+${jump}</button></div>
        </div>`).join('');
      for (const [p] of props) {
        document.getElementById(p + 'Range').addEventListener('input', e => { s[p] = clamp(p, e.target.value); applyAll(); });
        document.getElementById(p + 'Num').addEventListener('input', e => { s[p] = clamp(p, e.target.value); applyAll(); });
      }
      document.querySelectorAll('button.small').forEach(btn => btn.onclick = () => {
        const p = btn.dataset.prop;
        s[p] = clamp(p, s[p] + Number(btn.dataset.delta));
        applyAll();
      });
    }
    function refreshUI() {
      document.getElementById('modelName').textContent = selected;
      modelSelect.value = selected;
      out.value = `const YAKOLAK_ALIGNMENT = ${JSON.stringify(outputAll(), null, 2)};`;
      statusEl.textContent = Object.entries(loadStatus).map(([id, st]) => `${id}: ${st}`).join('\n') + `\nLMS الارتفاع: ${lmsState.py}\nactive: ${selected}`;
    }
    function applyAll() { Object.keys(state).forEach(applyModel); applyLMS(); refreshUI(); }
    function rebuildUI() { renderControls(); applyAll(); }

    document.getElementById('settingsBtn').onclick = () => panel.classList.toggle('show');
    modelSelect.onchange = () => { selected = modelSelect.value; rebuildUI(); };
    document.getElementById('resetBtn').onclick = () => {
      if (selected === 'LMS') Object.assign(lmsState, lmsDefault);
      else Object.assign(state[selected], defaultState[selected]);
      rebuildUI();
    };
    document.getElementById('copyBtn').onclick = async () => {
      await navigator.clipboard.writeText(out.value);
      hint.textContent = 'alignment copied';
      setTimeout(() => hint.textContent = `Yakolak ${APP_VERSION}`, 1200);
    };

    function centerGeometry(g) {
      g.computeBoundingBox();
      const c = g.boundingBox.getCenter(new THREE.Vector3());
      g.translate(-c.x, -c.y, -c.z);
      g.computeVertexNormals();
    }

    function alignLmsGeometryBottom(g) {
      g.computeBoundingBox();
      const box = g.boundingBox;
      const cx = (box.min.x + box.max.x) / 2;
      const cy = (box.min.y + box.max.y) / 2;
      g.translate(-cx, -cy, -box.min.z);
      g.computeVertexNormals();
    }

    const loader = new STLLoader();
    function loadModel(id) {
      const def = modelDefs[id];
      return new Promise(resolve => {
        loader.load(`./${def.file}?v=${assetVersion}-${id}`, g => {
          try {
            if (!g.attributes.position || g.attributes.position.count === 0) throw new Error('empty STL');
            centerGeometry(g);
            const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.55, metalness: 0.05 }));
            meshes[id] = mesh;
            scene.add(mesh);
            applyModel(id);
            loadStatus[id] = 'loaded';
          } catch (e) { loadStatus[id] = `failed: ${e.message}`; }
          refreshUI(); resolve();
        }, undefined, e => { loadStatus[id] = `failed: ${e?.message || 'load error'}`; refreshUI(); resolve(); });
      });
    }

    function loadCenterPiece(name, color) {
      return new Promise(resolve => {
        loader.load(`./${name}.stl?v=${assetVersion}-${name}`, g => {
          try {
            if (!g.attributes.position || g.attributes.position.count === 0) throw new Error('empty STL');
            alignLmsGeometryBottom(g);
            const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05 }));
            centerGroup.add(mesh);
            loadStatus[name] = 'loaded bottom-aligned';
          } catch (e) { loadStatus[name] = `failed: ${e.message}`; }
          refreshUI(); resolve();
        }, undefined, e => { loadStatus[name] = `failed: ${e?.message || 'load error'}`; refreshUI(); resolve(); });
      });
    }

    Promise.all(Object.keys(modelDefs).map(loadModel)).then(() => {
      centerGroup = new THREE.Group();
      scene.add(centerGroup);
      applyLMS();
      return Promise.all([
        loadCenterPiece('l', 0xf2c078),
        loadCenterPiece('m', 0x8ecae6),
        loadCenterPiece('s', 0xffafcc)
      ]);
    }).then(() => {
      const box = new THREE.Box3();
      Object.values(meshes).forEach(m => box.expandByObject(m));
      if (centerGroup) box.expandByObject(centerGroup);
      if (Object.keys(meshes).length) {
        const size = box.getSize(new THREE.Vector3());
        const maxAxis = Math.max(size.x, size.y, size.z) || 1;
        const d = maxAxis * 1.75;
        camera.position.set(d, d * 0.82, d);
        camera.near = Math.max(d / 1000, 0.01);
        camera.far = d * 30;
        camera.updateProjectionMatrix();
        controls.target.set(0, 0, 0);
        controls.update();
      }
      hint.textContent = `Yakolak ${APP_VERSION}`;
      rebuildUI();
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
    animate();
    rebuildUI();
  </script>
</body>
</html>
