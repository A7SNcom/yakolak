<html lang="ar" dir="rtl">
<head>

<style>
:root{--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}
#view{position:fixed;inset:0;z-index:1}
#hint{position:fixed;top:calc(12px + var(--safe-top));right:12px;z-index:5;background:rgba(0,0,0,.68);padding:8px 12px;border-radius:999px;font-size:12px;direction:ltr;backdrop-filter:blur(12px)}
#settingsBtn{position:fixed;top:calc(10px + var(--safe-top));left:10px;z-index:20;width:58px;height:58px;border:0;border-radius:20px;background:rgba(0,0,0,.78);color:white;font-size:26px;box-shadow:0 10px 26px rgba(0,0,0,.4);touch-action:manipulation}
#panel{position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));z-index:30;background:rgba(7,7,7,.94);border:1px solid #292929;border-radius:24px;padding:12px;display:none;direction:rtl;box-shadow:0 14px 42px rgba(0,0,0,.42);backdrop-filter:blur(16px);touch-action:auto}
#panel.show{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.title{font-weight:800;font-size:14px}.meta{font-size:12px;color:#bbb}.btn{height:46px;border:0;border-radius:15px;background:#252525;color:white;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:72px;border:1px solid #333;border-radius:18px;background:#151515;color:white;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}textarea{display:none}
</style>
</head>
<body>
<div id="view"></div>
<div id="hint">loading color v039...</div>
<button id="settingsBtn">⚙</button>
<div id="panel"></div>
<textarea id="out"></textarea>
<script type="module" src="./app.js?v=039"></script>
</body>
</html>
